name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      MOGOV_DB: ${{ github.workspace }}/ci.duckdb
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.6.17"
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      # for the plantuml-render hook; it only runs java when an SVG's source stamp is stale, and it lays
      # out with PlantUML's built-in Smetana engine, so no Graphviz is needed
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # frontend hooks (prettier, eslint, astro check); pnpm version comes from packageManager in package.json
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Frontend tests (node:test)
        run: pnpm --dir frontend test

      - name: dbt packages (sqlfluff's dbt templater needs them)
        run: uv run --frozen dbt deps --project-dir dbt --profiles-dir dbt

      - name: Lint, format, diagrams (pre-commit hooks; fails on stale SVGs)
        run: uv run --frozen pre-commit run --all-files --show-diff-on-failure

      - name: Tests
        run: uv run --frozen pytest -q

      - name: dbt parse
        run: uv run --frozen dbt parse --project-dir dbt --profiles-dir dbt
