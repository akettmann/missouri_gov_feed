name: mogov
version: "0.1.0"
config-version: 2
profile: mogov

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# A test that reads a model outside the selection would run against that model's stale table (#198: `-s +rpt_awards`
# ran assert_official_ids_one_per_person against an old int_officeholders__years and failed on rows a full build
# does not produce). `buildable` runs a test only when every model it reads is selected or upstream of the selection.
# That is a complete guard only for `+model` selections: with `model+` a downstream test can still read a stale table
# (after changing dim_official, build `dim_official+`; docs/dbt_best_practices.md).
flags:
  indirect_selection: buildable

# Fails a bare `dbt build` that would silently disable models whose raw data exists (macros/optional_inputs.sql).
on-run-start:
  - "{{ mogov.check_optional_inputs() }}"

models:
  mogov:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      +schema: marts
      +materialized: table
      # The marts are the interface for consumers (the frontend): their column names and types are a
      # contract (data_type per column in marts/_marts.yml), and a build that changes them fails.
      # Types are DuckDB's; a new backend means re-declaring them.
      +contract:
        enforced: true
      # descriptions become table/column comments in the warehouse, so consumers see them without dbt
      +persist_docs:
        relation: true
        columns: true
    # Shaped for the frontend's pages (one model per view), built only from marts and intermediate models.
    # Same contract rules as the marts.
    reporting:
      +schema: reporting
      +materialized: table
      +contract:
        enforced: true
      +persist_docs:
        relation: true
        columns: true

seeds:
  mogov:
    +schema: reference

# One source per system (models/staging/<system>/_<system>__sources.yml). Every table is a directory of
# Parquet parts written by the loaders under MOGOV_RAW_DIR; `identifier` is that directory's name.
# JSON payloads are text, read only through the mogov.json_* macros (portable SQL). Opt-in / key-gated
# tables may be absent: their models are gated by vars, or `mogov build` creates empty placeholders.
sources:
  mogov:
    +meta:
      external_location: "read_parquet('{{ env_var('MOGOV_RAW_DIR', 'data/raw') }}/{identifier}/*.parquet', union_by_name = true)"

vars:
  # rpt_awards: an official qualifies for an award when award_rank <= its threshold (`default` covers every
  # award not listed; keys are award names, e.g. lowest_attendance: 3). A field smaller than
  # awards_min_field_size is not ranked at all (it guards against thin rankings; it is not a threshold).
  awards_threshold:
    default: 5
  awards_min_field_size: 5
  # party-unity awards (rpt_awards): fewest party-line votes cast in a calendar year for that year to be ranked.
  # Attendance uses 100 recorded votes, but the Missouri Senate casts only 16-50 party-line votes a year.
  awards_min_party_line_votes: 20

# Let this project override dbt's cross-database macros per adapter (see macros/compat/casts.sql).
dispatch:
  - macro_namespace: dbt
    search_order: ["mogov", "dbt"]
