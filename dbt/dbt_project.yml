name: mogov
version: "0.1.0"
config-version: 2
profile: mogov

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# A test that reads a node outside the selection would run against that node's stale table (#198: `-s +rpt_awards`
# ran assert_official_ids_one_per_person against an old int_officeholders__years and failed on rows a full build
# does not produce). `buildable` runs a test only when every node it depends on (models and seeds; sources always
# pass) is selected or an ancestor of a selected node. An ancestor is not rebuilt unless selected, so a test can still
# read a stale one. The selection is safe (never reads an un-rebuilt model) only when it includes every ancestor of
# every selected node: `+model`, `@model` or `+test`. `+model` still skips tests that also read models outside the
# model's ancestors. `model+` and `+model+` are NOT safe: `dbt ls -s int_officeholders__years+` (and `+...+`)
# includes assert_official_ids_one_per_person but not int_officials__current, which it also reads. After changing a
# model other tests read, build `@model`; for one test, `+test_name`.
flags:
  indirect_selection: buildable

# Fails a bare `dbt build` that would silently disable models whose raw data exists (macros/optional_inputs.sql).
on-run-start:
  - "{{ mogov.check_optional_inputs() }}"

models:
  mogov:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      +schema: marts
      +materialized: table
      # The marts are the interface for consumers (the frontend): their column names and types are a
      # contract (data_type per column in marts/_marts.yml), and a build that changes them fails.
      # Types are DuckDB's; a new backend means re-declaring them.
      +contract:
        enforced: true
      # descriptions become table/column comments in the warehouse, so consumers see them without dbt
      +persist_docs:
        relation: true
        columns: true
    # Shaped for the frontend's pages (one model per view), built only from marts and intermediate models.
    # Same contract rules as the marts.
    reporting:
      +schema: reporting
      +materialized: table
      +contract:
        enforced: true
      +persist_docs:
        relation: true
        columns: true

seeds:
  mogov:
    +schema: reference

# One source per system (models/staging/<system>/_<system>__sources.yml). Every table is a directory of
# Parquet parts written by the loaders under MOGOV_RAW_DIR; `identifier` is that directory's name.
# JSON payloads are text, read only through the mogov.json_* macros (portable SQL). Opt-in / key-gated
# tables may be absent: their models are gated by vars, or `mogov build` creates empty placeholders.
sources:
  mogov:
    +meta:
      external_location: "read_parquet('{{ env_var('MOGOV_RAW_DIR', 'data/raw') }}/{identifier}/*.parquet', union_by_name = true)"

vars:
  # stg_mo_house__rollcalls (#449): a House roll call on which fewer than this share of the listed members cast a
  # vote is a voting-board test record and is dropped. The fewest voters on a real roll call is 84 of 162 (a quorum
  # call, 52%; 83 voters occurred once, with 158 listed); the test records have 1 to 28 voters (under 18%).
  house_rollcall_min_participation: 0.25
  # assert_house_rollcalls_quorum_participation: roll call URLs allowed to fall under half the members voting
  # (genuine calls that failed to produce a quorum). None so far.
  house_rollcall_small_quorum_allowlist: []
  # rpt_awards: an official qualifies for an award when award_rank <= its threshold (`default` covers every
  # award not listed; keys are award names, e.g. lowest_attendance: 3). A field smaller than
  # awards_min_field_size is not ranked at all (it guards against thin rankings; it is not a threshold).
  awards_threshold:
    default: 5
  awards_min_field_size: 5
  # party-unity awards (rpt_awards): fewest party-line votes cast in a calendar year for that year to be ranked.
  # Attendance uses 100 recorded votes, but the Missouri Senate casts only 16-50 party-line votes a year.
  awards_min_party_line_votes: 20
  # most_bills_passed_house (rpt_awards): fewest decided House bills (HB/HJR the member was primary sponsor of, whose
  # outcome is known) for a period to be ranked. Decided bills per member and year run 1 to 44 (median 9); at 5, one
  # bill moves the share 20 points and early years end in ties at 100%, at 10 the field is 7 to 97 members a year (#603).
  awards_min_bills_decided: 10

# Let this project override dbt's cross-database macros per adapter (see macros/compat/casts.sql).
dispatch:
  - macro_namespace: dbt
    search_order: ["mogov", "dbt"]
