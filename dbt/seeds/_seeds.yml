version: 2
seeds:
  - name: statewide_officials
    description: >
      Missouri's six statewide elected executive officers. Curated by hand because the Open States
      executive folder is incomplete. Matched to Open States people by name to pick up prior
      legislative careers. Review after each election / appointment.
    config:
      column_types: {term_start: date, term_end: date}
    columns:
      - name: office
        data_tests: [unique, not_null]
  - name: house_speakers
    description: Speaker of the Missouri House per year; roll-call PDFs list the Speaker as "MR SPEAKER".
  - name: legislator_seat_corrections
    description: >
      Legislative seat-terms Open States lacks or cuts short, added to int_mo_legislators__seats so journal votes
      and other records match. Found through Senate journal tokens that matched nobody (October 2026): Wallingford's
      whole Senate term was missing; Kehoe's and Parson's ended on 2016-12-31 although both served until they became
      lieutenant governor. Every row cites its source.
    config:
      column_types: {openstates_id: varchar, chamber: varchar, district: integer, start_date: date, end_date: date, source: varchar}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [openstates_id, chamber, start_date]
    columns:
      - name: chamber
        data_tests:
          - accepted_values:
              arguments:
                values: ['upper', 'lower']
      - name: source
        data_tests:
          - not_null
  - name: voluntary_disclosures
    description: Hand-curated voluntary disclosures (no machine-readable source exists). Add rows with a source_url.
    config:
      column_types: {disclosure_date: date, official_name: varchar, office: varchar, kind: varchar, description: varchar, source_url: varchar}
  - name: fec_committee_types
    description: >
      FEC committee type codes (CMTE_TP in the committee master) and their names, verbatim from
      https://www.fec.gov/campaign-finance-data/committee-type-code-descriptions/. Decodes
      fct_campaign_finance.counterparty_type; tests/assert_fec_committee_types_known.sql warns on new codes.
    columns:
      - name: code
        data_tests: [unique, not_null]
  - name: mo_courts
    description: >
      CourtListener ids of the courts whose judges we track, with the dim_official office that sits on
      each: Missouri Supreme Court, the three Court of Appeals districts, E.D./W.D. Mo., and the Eighth
      Circuit. Shared by the CourtListener matching models. The Python loaders keep the same list
      (courtlistener_case_bulk.MO_COURTS, courtlistener_cases.JUDGE_COURTS); change them together.
    columns:
      - name: court_id
        data_tests: [unique, not_null]
      - name: office
        data_tests: [not_null]
  - name: mo_county_courts
    description: >
      Each Missouri county (and the city of St. Louis) with its Court of Appeals district (RSMo 477.050 eastern,
      477.060 southern, 477.070 western: every other county) and its federal judicial district and division
      (28 U.S.C. 105). Built from the statute text in October 2026; review if either statute is amended.
    config:
      column_types: {county_geoid: varchar, county_name: varchar, appeals_district: varchar, federal_district: varchar, federal_division: varchar}
    columns:
      - name: county_geoid
        data_tests: [unique, not_null]
      - name: appeals_district
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['eastern', 'southern', 'western']
      - name: federal_district
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['moed', 'mowd']
  - name: federal_salaries
    description: >
      Statutory annual salary per calendar year for the federal offices we track: Members of Congress (Senate
      historical table; rank-and-file rate, the same in both chambers; leadership is paid more, and no Missouri
      member held a paid leadership post in 2026) and U.S. district and circuit judges (uscourts.gov judicial
      compensation). Copied October 2026 for 2017-2026, matching the state payroll's coverage. Add a row per
      office each January.
    columns:
      - name: office
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [calendar_year, office]
  - name: interest_keywords
    description: >
      Whole-word keywords that put a donor organization or lobbyist principal in an industry or interest, in
      name_key form (lowercase, punctuation as spaces: "at t" for AT&T). Only words that name the industry
      outright ("hospital", "realtors", "credit union") or well-known companies ("ameren", "centene"). PAC acronyms
      are added only once their sponsor is confirmed (October 2026: agc = AGC of Missouri, amec/amecpac =
      Association of Missouri Electric Cooperatives, meda = Missouri Energy Development Association,
      healthpac = Missouri Hospital Association, mosfa = Missouri State Farm Agents, chipp = Carpenters'
      council, "cheyenne international" = the Decade cigarette maker; mba = the Missouri Bankers Association's
      regional PACs, from its treasurer's phone on MEC; mbwa = MEC committee C000684, MO Beer Wholesalers
      Association; "dealers interested in government" = MEC C000708, MADA (auto dealers); mha = Missouri
      Hospital Association, sharing its PO Box 60 with HEALTHPAC; acec = ACEC Missouri, MEC's connected
      organization for C222134; "pt pac" = PT-PAC of Missouri, the physical therapists' PAC); the rest are left
      unclassified rather than guessed. Confirmed to have no single industry, so deliberately unclassified:
      lobbying-firm PACs (ATGS PAC = Armstrong Teasdale's AT Government Strategies; HBS MO State PAC = Husch
      Blackwell Strategies; A Better Missouri, Living Well PAC and Missouri First at Bardgett & Associates) and
      one-treasurer families of PACs (Missouri AG, C, Senior, Growth PAC and MO Majority PAC in Perryville; MO
      DSV and RQC PAC in New Bloomfield). A keyword may sit in several industries (a health
      insurer is health_care and insurance). Checked against the October 2026 names: generic words that
      misfired were dropped ("farm" hit State Farm, "title" hit Title Max, "sports" hit sports bars). The
      classified names cover 49% of organization contributions and lobbyist gifts by amount (October 2026).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [keyword, industry]
    columns:
      - name: industry
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('industry_subjects')
                field: industry
  - name: industry_subjects
    description: >
      The legislature's bill subject index terms (fct_bill_subjects.subject_name, verbatim) that each interest_keywords
      industry has a stake in. Feeds rpt_interest_vote_overlap. tests/assert_industry_subjects_known.sql warns if
      a term stops appearing in the bill data.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [industry, subject_name]
  - name: mo_payroll_office_titles
    description: >
      The position titles on Missouri's state payroll (mo_employee_pay) that are elected or judicial offices,
      not staff, with the group of offices they belong to (legislature, statewide, judiciary). fct_salaries
      only reads these rows. Titles found 2017-2025; add new ones if the payroll renames a position.
    columns:
      - name: position_title
        data_tests: [unique, not_null]
