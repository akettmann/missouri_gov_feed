version: 2
seeds:
  - name: donor_employer_placeholders
    description: >
      Answers individual contributors give in the employer field that name no employer (retired, none,
      "information requested", self-employed) or only an occupation (attorney, owner). Lower-case, compared
      against lower(trim(employer)); rpt_donor_employers leaves these out. Add values as they show up.
    columns:
      - name: placeholder
        data_tests: [unique, not_null]
  - name: statewide_officials
    description: >
      Missouri's six statewide elected executive officers. Curated by hand because the Open States
      executive folder is incomplete. Matched to Open States people by name to pick up prior
      legislative careers. Review after each election / appointment.
    config:
      column_types: {term_start: date, term_end: date}
    columns:
      - name: office
        data_tests: [unique, not_null]
  - name: house_speakers
    description: Speaker of the Missouri House per year; roll-call PDFs list the Speaker as "MR SPEAKER".
  - name: legislator_seat_corrections
    description: >
      Legislative seat-terms Open States lacks or cuts short, added to int_mo_legislators__seats so journal votes
      and other records match. Found through Senate journal tokens that matched nobody (October 2026): Wallingford's
      whole Senate term was missing; Kehoe's and Parson's ended on 2016-12-31 although both served until they became
      lieutenant governor. Every row cites its source.
    config:
      column_types: {openstates_id: varchar, chamber: varchar, district: integer, start_date: date, end_date: date, source: varchar}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [openstates_id, chamber, start_date]
    columns:
      - name: chamber
        data_tests:
          - accepted_values:
              arguments:
                values: ['upper', 'lower']
      - name: source
        data_tests:
          - not_null
  - name: voluntary_disclosures
    description: Hand-curated voluntary disclosures (no machine-readable source exists). Add rows with a source_url.
    config:
      column_types: {disclosure_date: date, official_name: varchar, office: varchar, kind: varchar, description: varchar, source_url: varchar}
  - name: fec_committee_types
    description: >
      FEC committee type codes (CMTE_TP in the committee master) and their names, verbatim from
      https://www.fec.gov/campaign-finance-data/committee-type-code-descriptions/. Decodes
      fct_campaign_finance.counterparty_type; tests/assert_fec_committee_types_known.sql warns on new codes.
    columns:
      - name: code
        data_tests: [unique, not_null]
  - name: mo_courts
    description: >
      CourtListener ids of the courts whose judges we track, with the dim_official office that sits on
      each: Missouri Supreme Court, the three Court of Appeals districts, E.D./W.D. Mo., and the Eighth
      Circuit. Shared by the CourtListener matching models. The Python loaders keep the same list
      (courtlistener_case_bulk.MO_COURTS, courtlistener_cases.JUDGE_COURTS); change them together.
    columns:
      - name: court_id
        data_tests: [unique, not_null]
      - name: office
        data_tests: [not_null]
  - name: mo_county_courts
    description: >
      Each Missouri county (and the city of St. Louis) with its Court of Appeals district (RSMo 477.050 eastern,
      477.060 southern, 477.070 western: every other county) and its federal judicial district and division
      (28 U.S.C. 105). Built from the statute text in October 2026; review if either statute is amended.
    config:
      column_types: {county_geoid: varchar, county_name: varchar, appeals_district: varchar, federal_district: varchar, federal_division: varchar}
    columns:
      - name: county_geoid
        data_tests: [unique, not_null]
      - name: appeals_district
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['eastern', 'southern', 'western']
      - name: federal_district
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['moed', 'mowd']
  - name: federal_salaries
    description: >
      Statutory annual salary per calendar year for the federal offices we track: Members of Congress (Senate
      historical table; rank-and-file rate, the same in both chambers; leadership is paid more, and no Missouri
      member held a paid leadership post in 2026) and U.S. district and circuit judges (uscourts.gov judicial
      compensation). Copied October 2026 for 2017-2026, matching the state payroll's coverage. Add a row per
      office each January.
    columns:
      - name: office
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [calendar_year, office]
  - name: interest_keywords
    description: >
      Whole-word keywords that put a donor organization or lobbyist principal in an industry or interest, in
      name_key form (lowercase, punctuation as spaces: "at t" for AT&T). Only words that name the industry
      outright ("hospital", "realtors", "credit union") or well-known companies ("ameren", "centene"). PAC acronyms
      are added only once their sponsor is confirmed; the rest are left unclassified rather than guessed.
      docs/interest_keywords.md records the evidence and source for each confirmed sponsor, the PACs found to
      have no single industry (lobbying-firm and one-treasurer PACs), and the ones still unknown. A keyword may
      sit in several industries (a health
      insurer is health_care and insurance). Checked against the October 2026 names: generic words that
      misfired were dropped ("farm" hit State Farm, "title" hit Title Max, "sports" hit sports bars). The
      classified names cover 49% of organization contributions and lobbyist gifts by amount (October 2026).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [keyword, industry]
    columns:
      - name: industry
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('industry_subjects')
                field: industry
  - name: company_brands
    description: >
      Whole-word keywords (name_key form, "at t" for AT&T) that tie a company's PACs, subsidiaries and
      legal names to one brand, so fct_jurisdiction_businesses can match "Ameren Missouri PAC" to a "UNION
      ELECTRIC CO" substation or "Spire PAC" to "LACLEDE GAS CO". For the largest corporate donors that have
      Missouri EPA FRS sites (October 2026). Every name each keyword hits, on the donor side and the facility side,
      was checked. Left out because they hit independently owned stations under the brand: "phillips 66",
      "valero"; "tyson" alone hit a place name, so Tyson's divisions are listed instead. Known strays: the
      Anheuser-Busch employees' credit union and Murphy USA fuel stations at Walmart stores.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [keyword, brand]
    columns:
      - name: keyword
        data_tests: [not_null, unique]
      - name: brand
        data_tests: [not_null]
  - name: naics_sectors
    description: >
      The 20 NAICS 2022 sectors (census.gov/naics), keyed by the first two digits of a NAICS code. Three sectors
      span several prefixes (31-33 Manufacturing, 44-45 Retail Trade, 48-49 Transportation and Warehousing), so
      a prefix maps to its sector_code. rpt_district_business_industries counts EPA FRS sites per sector.
    config:
      column_types: {naics_prefix: varchar, sector_code: varchar, sector_name: varchar}
    columns:
      - name: naics_prefix
        data_tests: [unique, not_null]
      - name: sector_code
        data_tests: [not_null]
      - name: sector_name
        data_tests: [not_null]
  - name: industry_subjects
    description: >
      The legislature's bill subject index terms (fct_bill_subjects.subject_name, verbatim) that each interest_keywords
      industry has a stake in. Feeds rpt_interest_vote_overlap. tests/assert_industry_subjects_known.sql warns if
      a term stops appearing in the bill data.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [industry, subject_name]
  - name: mo_payroll_office_titles
    description: >
      The position titles on Missouri's state payroll (mo_employee_pay) that are elected or judicial offices,
      not staff, with the group of offices they belong to (legislature, statewide, judiciary). fct_salaries
      only reads these rows. Titles found 2017-2025; add new ones if the payroll renames a position.
    columns:
      - name: position_title
        data_tests: [unique, not_null]
  - name: sic_naics_sectors
    description: >
      Maps a SIC code prefix (1987 Standard Industrial Classification; two digits, the major group, or a longer
      prefix where one group splits across sectors) to the first two digits of the NAICS sector it falls in, a
      naics_sectors.naics_prefix. The longest matching prefix wins, so a 3- or 4-digit row overrides its major
      group: 4953/4955/4959 (refuse, hazardous waste and other sanitary services) are 56 while the rest of 49 stays
      utilities (22), including 4952 sewerage systems (NAICS 221320); 737 computer services is 54 with 7372, 7374 and
      7375 (software, data processing, information retrieval) in 51; the 07 vet, animal and lawn/garden services, 27
      publishing, 67 holding companies and patent lessors, 731 advertising and 735 equipment rental likewise. Rows
      follow the Census Bureau's 1987 SIC to 2017 NAICS concordance. Major groups are coarser than NAICS industries,
      so this gives a sector, never a NAICS code; groups that still straddle sectors (73 business services is
      mostly 56 but also 51, 54 and 81 in places; 79 amusement, 80 health, 87 and 89 services) take the majority one. int_epa_frs__facilities uses it for sites whose FRS records carry a SIC code but no NAICS code.
    config:
      column_types: {sic_prefix: varchar, naics_prefix: varchar}
    columns:
      - name: sic_prefix
        data_tests: [unique, not_null]
      - name: naics_prefix
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('naics_sectors')
                field: naics_prefix
  - name: official_id_links
    description: >
      Hand-kept links between the ids one legislator is known by (#97), applied by int_officials__person_ids on top of
      its same-exact-name rule. relation same_person: alias_id is another id of the person whose current id is
      person_id (a former legislator now a statewide officer or judge, whom the name rule leaves alone because they
      hold no legislative seat today). relation different_people: alias_id and person_id are two people who share a
      name; the name rule never merges that name, and the no-shared-name test accepts the pair. Every row records
      its evidence. The links were made by an automated check and take effect only once a maintainer signs the
      row off by filling checked_by and checked_on; unsigned rows are ignored by int_officials__person_ids.
    config:
      column_types:
        {alias_id: varchar, person_id: varchar, relation: varchar, basis: varchar, evidence: varchar,
         checked_by: varchar, checked_on: date}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [alias_id, person_id, relation]
    columns:
      - name: alias_id
        data_tests: [not_null]
      - name: person_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_officials__current')
                field: official_id
              config:
                where: "relation = 'same_person'"
      - name: relation
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [same_person, different_people]
      - name: evidence
        data_tests: [not_null]
      - name: checked_by
        description: Maintainer who reviewed the row; empty until reviewed.
      - name: checked_on
        description: Date the maintainer reviewed the row; empty until reviewed.
