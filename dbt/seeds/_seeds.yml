version: 2
seeds:
  - name: statewide_officials
    description: >
      Missouri's six statewide elected executive officers. Curated by hand because the Open States
      executive folder is incomplete. Matched to Open States people by name to pick up prior
      legislative careers. Review after each election / appointment.
    config:
      column_types: {term_start: date, term_end: date}
    columns:
      - name: office
        data_tests: [unique, not_null]
  - name: house_speakers
    description: Speaker of the Missouri House per year; roll-call PDFs list the Speaker as "MR SPEAKER".
  - name: voluntary_disclosures
    description: Hand-curated voluntary disclosures (no machine-readable source exists). Add rows with a source_url.
    config:
      column_types: {disclosure_date: date, official_name: varchar, office: varchar, kind: varchar, description: varchar, source_url: varchar}
  - name: fec_committee_types
    description: >
      FEC committee type codes (CMTE_TP in the committee master) and their names, verbatim from
      https://www.fec.gov/campaign-finance-data/committee-type-code-descriptions/. Decodes
      fct_campaign_finance.counterparty_type; tests/assert_fec_committee_types_known.sql warns on new codes.
    columns:
      - name: code
        data_tests: [unique, not_null]
  - name: mo_courts
    description: >
      CourtListener ids of the courts whose judges we track, with the dim_official office that sits on
      each: Missouri Supreme Court, the three Court of Appeals districts, E.D./W.D. Mo., and the Eighth
      Circuit. Shared by the CourtListener matching models. The Python loaders keep the same list
      (courtlistener_case_bulk.MO_COURTS, courtlistener_cases.JUDGE_COURTS); change them together.
    columns:
      - name: court_id
        data_tests: [unique, not_null]
      - name: office
        data_tests: [not_null]
  - name: mo_payroll_office_titles
    description: >
      The position titles on Missouri's state payroll (mo_employee_pay) that are elected or judicial offices,
      not staff, with the group of offices they belong to (legislature, statewide, judiciary). fct_salaries
      only reads these rows. Titles found 2017-2025; add new ones if the payroll renames a position.
    columns:
      - name: position_title
        data_tests: [unique, not_null]
