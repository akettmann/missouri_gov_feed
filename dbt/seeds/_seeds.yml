version: 2
seeds:
  - name: committee_donor_aliases
    description: >
      Curated donor names for the committee-to-committee crosswalk (int_mec__donor_committees, #33): names
      donors type for a Missouri committee that no normalization rule can expand ("HRCC", "AMECPAC", "MHA PAC").
      Each alias maps to one MECID. Each alias group was checked against the committee's filings (gifts reported
      under the name matched on recipient, amount, date), or against the committee's own filed name; the
      evidence column records which, and some spellings rest on their group alone. Matching ignores case and turns punctuation into spaces, so
      list a spelling once. Matches are labeled "curated alias", high confidence, and count only in years the
      committee was active. An alias naming a MECID the committees don't have matches nothing. Add an alias only
      after checking it against the committee's filings or its own filed name; leave out ones that could be two committees.
      The matching was done by an automated check; checked_by and checked_on stay empty until a maintainer
      signs the row off; until then assert_committee_donor_aliases_signed_off warns on every build (the aliases still
      match at high confidence).
    config:
      column_types:
        {alias: varchar, mec_committee_id: varchar, committee_name: varchar, evidence: varchar,
         checked_by: varchar, checked_on: date}
    columns:
      - name: alias
        data_tests: [unique, not_null]
      - name: mec_committee_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_mec__committee_names')
                field: mec_committee_id
      - name: evidence
        data_tests: [not_null]
      - name: checked_by
        description: Maintainer who reviewed the row; empty until reviewed.
      - name: checked_on
        description: Date the maintainer reviewed the row; empty until reviewed.
  - name: donor_employer_placeholders
    description: >
      Answers individual contributors give in the employer field that name no employer (retired, none,
      "information requested", self-employed) or only an occupation (attorney, owner). Lower-case, compared
      against lower(trim(employer)); rpt_donor_employers leaves these out. Add values as they show up.
    columns:
      - name: placeholder
        data_tests: [unique, not_null]
  - name: statewide_officials
    description: >
      Missouri's six statewide elected executive officers. Curated by hand because the Open States
      executive folder is incomplete. Matched to Open States people by name to pick up prior
      legislative careers. Review after each election / appointment.
    config:
      column_types: {term_start: date, term_end: date}
    columns:
      - name: office
        data_tests: [unique, not_null]
  - name: house_speakers
    description: >
      Speaker of the Missouri House per year (the district number is the Speaker's seat); roll-call PDFs list the
      Speaker as "MR SPEAKER". The Speaker is on every roll call, so these rows also keep int_officeholders__years
      from reading a Speaker with no named votes as a member who stopped voting (#491). 2017-2022 are Todd
      Richardson (HD152, Speaker to January 2019), Elijah Haahr (HD134, 2019-2020) and Rob Vescovo (HD112,
      2021-2022); each matches the member of that district in the session's House roster.
  - name: legislator_seat_corrections
    description: >
      Legislative seat-terms Open States lacks or cuts short, added to int_mo_legislators__seats so journal votes
      and other records match. Found through Senate journal tokens that matched nobody (October 2026): Wallingford's
      whole Senate term was missing; Kehoe's and Parson's ended on 2016-12-31 although both served until they became
      lieutenant governor. Every row cites its source.
    config:
      column_types: {openstates_id: varchar, chamber: varchar, district: integer, start_date: date, end_date: date, source: varchar}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [openstates_id, chamber, start_date]
    columns:
      - name: chamber
        data_tests:
          - accepted_values:
              arguments:
                values: ['upper', 'lower']
      - name: source
        data_tests:
          - not_null
  - name: voluntary_disclosures
    description: Hand-curated voluntary disclosures (no machine-readable source exists). Add rows with a source_url.
    config:
      column_types: {disclosure_date: date, official_name: varchar, office: varchar, kind: varchar, description: varchar, source_url: varchar}
  - name: fec_committee_types
    description: >
      FEC committee type codes (CMTE_TP in the committee master) and their names, verbatim from
      https://www.fec.gov/campaign-finance-data/committee-type-code-descriptions/. Decodes
      fct_campaign_finance.counterparty_type; tests/assert_fec_committee_types_known.sql warns on new codes.
    columns:
      - name: code
        data_tests: [unique, not_null]
  - name: mo_courts
    description: >
      CourtListener ids of the courts whose judges we track, with the dim_official office that sits on
      each: Missouri Supreme Court, the three Court of Appeals districts, E.D./W.D. Mo., and the Eighth
      Circuit. Shared by the CourtListener matching models. The Python loaders keep the same list
      (courtlistener_case_bulk.MO_COURTS, courtlistener_cases.JUDGE_COURTS); change them together.
    columns:
      - name: court_id
        data_tests: [unique, not_null]
      - name: office
        data_tests: [not_null]
  - name: mo_county_courts
    description: >
      Each Missouri county (and the city of St. Louis) with its Court of Appeals district (RSMo 477.050 eastern,
      477.060 southern, 477.070 western: every other county) and its federal judicial district and division
      (28 U.S.C. 105). Built from the statute text in October 2026; review if either statute is amended.
    config:
      column_types: {county_geoid: varchar, county_name: varchar, appeals_district: varchar, federal_district: varchar, federal_division: varchar}
    columns:
      - name: county_geoid
        data_tests: [unique, not_null]
      - name: appeals_district
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['eastern', 'southern', 'western']
      - name: federal_district
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['moed', 'mowd']
  - name: federal_salaries
    description: >
      Statutory annual salary per calendar year for the federal offices we track: Members of Congress (Senate
      historical table; rank-and-file rate, the same in both chambers; leadership is paid more, and no Missouri
      member held a paid leadership post in 2026) and U.S. district and circuit judges (uscourts.gov judicial
      compensation). Copied October 2026 for 2017-2026, matching the state payroll's coverage. Add a row per
      office each January.
    columns:
      - name: office
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [calendar_year, office]
  - name: interest_keywords
    description: >
      Whole-word keywords that put a donor organization or lobbyist principal in an industry or interest, in
      name_key form (lowercase, punctuation as spaces: "at t" for AT&T). Only words that name the industry
      outright ("hospital", "realtors", "credit union") or well-known companies ("ameren", "centene"). PAC acronyms
      are added only once their sponsor is confirmed; the rest are left unclassified rather than guessed.
      docs/interest_keywords.md records the evidence and source for each confirmed sponsor, the PACs found to
      have no single industry (lobbying-firm and one-treasurer PACs), and the ones still unknown. A keyword may
      sit in several industries (a health
      insurer is health_care and insurance). Checked against the October 2026 names: generic words that
      misfired were dropped ("farm" hit State Farm, "title" hit Title Max, "sports" hit sports bars). The
      classified names cover 49% of organization contributions and lobbyist gifts by amount (October 2026).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [keyword, industry]
    columns:
      - name: industry
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('industry_subjects')
                field: industry
  - name: company_brands
    description: >
      Whole-word keywords (name_key form, "at t" for AT&T) that tie a company's PACs, subsidiaries and
      legal names to one brand, so fct_jurisdiction_businesses can match "Ameren Missouri PAC" to a "UNION
      ELECTRIC CO" substation or "Spire PAC" to "LACLEDE GAS CO". For the largest corporate donors that have
      Missouri EPA FRS sites (October 2026). Every name each keyword hits, on the donor side and the facility side,
      was checked. Left out because they hit independently owned stations under the brand: "phillips 66",
      "valero"; "tyson" alone hit a place name, so Tyson's divisions are listed instead. Known strays: the
      Anheuser-Busch employees' credit union and Murphy USA fuel stations at Walmart stores.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [keyword, brand]
    columns:
      - name: keyword
        data_tests: [not_null, unique]
      - name: brand
        data_tests: [not_null]
  - name: naics_sectors
    description: >
      The 20 NAICS 2022 sectors (census.gov/naics), keyed by the first two digits of a NAICS code. Three sectors
      span several prefixes (31-33 Manufacturing, 44-45 Retail Trade, 48-49 Transportation and Warehousing), so
      a prefix maps to its sector_code. rpt_district_business_industries counts EPA FRS sites per sector.
    config:
      column_types: {naics_prefix: varchar, sector_code: varchar, sector_name: varchar}
    columns:
      - name: naics_prefix
        data_tests: [unique, not_null]
      - name: sector_code
        data_tests: [not_null]
      - name: sector_name
        data_tests: [not_null]
  - name: industry_subjects
    description: >
      The legislature's bill subject index terms (fct_bill_subjects.subject_name, verbatim) that each interest_keywords
      industry has a stake in. Feeds rpt_interest_vote_overlap. tests/assert_industry_subjects_known.sql warns if
      a term stops appearing in the bill data.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [industry, subject_name]
  - name: election_office_keys
    description: >
      Maps an office as titled in the Secretary of State's election returns (the part of a contest title before
      " - ", as fct_election_races.office) to the dim_official office of the same elected position, so a winner
      can be linked to the current official. Judges are linked only for the Supreme Court and Court of Appeals.
      Add a title if the returns rename one (the 2012-2018 files print "Lt. Governor" and "Treasurer").
    columns:
      - name: office
        data_tests: [unique, not_null]
      - name: official_office
        data_tests: [not_null]
  - name: mo_payroll_office_titles
    description: >
      The position titles on Missouri's state payroll (mo_employee_pay) that are elected or judicial offices,
      not staff, with the group of offices they belong to (legislature, statewide, judiciary). fct_salaries
      only reads these rows. Titles found 2017-2025; add new ones if the payroll renames a position.
    columns:
      - name: position_title
        data_tests: [unique, not_null]
  - name: sic_naics_sectors
    description: >
      Maps a SIC code prefix (1987 Standard Industrial Classification; two digits, the major group, or a longer
      prefix where one group splits across sectors) to the first two digits of the NAICS sector it falls in, a
      naics_sectors.naics_prefix. The longest matching prefix wins, so a 3- or 4-digit row overrides its major
      group: 4953/4959 (refuse systems and other sanitary services) are 56 while the rest of 49 stays
      utilities (22), including 4952 sewerage systems (NAICS 221320) while 4922 and 4923 gas transmission are pipeline transportation (48); 737 computer services is 54 with 7372, 7374 and
      7375 (software, data processing, information retrieval) in 51; the 07 vet, animal and lawn/garden services, 27
      publishing, 67 holding companies and patent lessors (6798 REITs are 53), 731 advertising and 735 equipment
      rental likewise; 73 business services is 56 but 7331, 7335, 7336 are 54, 7383 is 51 and 7384 is 81, and a
      few other 4-digit codes the concordance puts in one sector other than their group's (4493 marinas, 6552 land
      subdividers 23, 7514 car rental 53, 8399 81 ...) have rows. Every row was checked in October 2026 against
      the Census Bureau's 1987 SIC to 2002 NAICS concordance carried forward through its 2002-2007, 2007-2012,
      2012-2017 and 2017-2022 NAICS concordances (census.gov/naics). SIC 4955 is not in that concordance and has no row. Major groups are coarser than NAICS industries,
      so this gives a sector, never a NAICS code; groups that still straddle sectors (73 business services is
      mostly 56 but also 51, 54 and 81 in places; 79 amusement, 80 health, 87 and 89 services) take the majority one.
      Ties between two sectors: 0752 animal specialty services (11 or 81; kept 81, pet care), 4923 gas transmission
      and distribution (22 or 48; set 48 with 4922), 7331 (51 or 54), 7335 (48 or 54), 7383 (51 or 71) and 7378 (44
      or 81; kept 81), and 89 services not elsewhere classified (51 or 54; kept 54). Also left in their group
      although the concordance splits them: 1389, 2771 greeting cards (31 or 51), 3295, 5099, 5171, 5441, 5699, 5712, 7353. Majorities and ties are judged by concordance row count, with judgement overrides where rows are slices of one niche activity: 8741 management services has 10 construction-management rows (one per construction industry, sector 23) but is set 56 for the one general row (561110), which is the bulk of the code. int_epa_frs__facilities uses it for sites whose FRS records carry a SIC code but no NAICS code.
    config:
      column_types: {sic_prefix: varchar, naics_prefix: varchar}
    columns:
      - name: sic_prefix
        data_tests: [unique, not_null]
      - name: naics_prefix
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('naics_sectors')
                field: naics_prefix
  - name: official_id_links
    description: >
      Hand-kept links between the ids one legislator is known by (#97), applied by int_officials__person_ids on top of
      its same-exact-name rule. relation same_person: alias_id is another id of the person whose current id is
      person_id (a former legislator now a statewide officer or judge, whom the name rule leaves alone because they
      hold no legislative seat today). relation different_people: alias_id and person_id are two people who share a
      name; the name rule never merges that name, and the no-shared-name test accepts the pair. Every row records
      its evidence. The links were made by an automated check and take effect only once a maintainer signs the
      row off by filling checked_by and checked_on; unsigned rows are ignored by int_officials__person_ids.
    config:
      column_types:
        {alias_id: varchar, person_id: varchar, relation: varchar, basis: varchar, evidence: varchar,
         checked_by: varchar, checked_on: date}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [alias_id, person_id, relation]
    columns:
      - name: alias_id
        data_tests: [not_null]
      - name: person_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_officials__current')
                field: official_id
              config:
                where: "relation = 'same_person'"
      - name: relation
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [same_person, different_people]
      - name: evidence
        data_tests: [not_null]
      - name: checked_by
        description: Maintainer who reviewed the row; empty until reviewed.
      - name: checked_on
        description: Date the maintainer reviewed the row; empty until reviewed.
  - name: epa_frs_name_corrections
    description: >
      Maintainer overrides for EPA FRS names whose raw text contains U+FFFD (EPA's file lost a non-ASCII letter).
      Staging repairs these by itself from the MO_ALTERNATIVE_NAME_FILE (stg_epa_frs__alt_names: the one alternative
      name that equals the damaged name with each run of U+FFFD standing for one character), which covers the three
      names seen so far (DECOR PLUS twice, MARBLE DECOR INC). The seed still holds those three cases so a raw
      directory landed before the alternative-name table existed (mogov build gives it an empty placeholder) repairs
      them too; once alternative names are loaded the rows are redundant (they agree with the alternative names) and
      can be retired. Add a row only when the alternative names cannot repair a name (none, or two different
      matches); a row wins over the alternative name.
      Every row cites the EPA record that attests the value, never a guess. Applied in stg_epa_frs__facilities
      (record_key = registry_id) and stg_epa_frs__organizations (record_key = registry_id|program_system|program_id)
      only while the raw text still contains U+FFFD, and to every organization row on that key, so a row must not be
      used where two affiliations on one program record have different names. Any other U+FFFD is dropped.
    config:
      column_types: {record_key: varchar, field: varchar, corrected_value: varchar, source: varchar}
    columns:
      - name: record_key
        data_tests: [unique, not_null]
      - name: field
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [facility_name, org_name]
      - name: corrected_value
        data_tests: [not_null]
      - name: source
        data_tests: [not_null]
  - name: mo_auditor_statewide_entities
    description: >
      Audit report titles that audit a statewide elected office, matched as a case-insensitive prefix of the
      Auditor's report title (titles vary by year: "Office of State Treasurer", "Office of the State Treasurer/
      Year Ended June 30, 2011", "State Treasurer's Office"). `office` is the key in statewide_officials. Only
      these audits are linked to officeholders (fct_audit_report_officeholders); a county audit never is, because the
      Auditor's summary says the rating "does not indicate the performance of any one elected official".
      Add a prefix when a new title form appears (assert_audit_statewide_titles_map_to_one_office checks that
      none matches two offices).
    config:
      column_types: {title_prefix: varchar, office: varchar}
    columns:
      - name: title_prefix
        data_tests: [unique, not_null]
      - name: office
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('statewide_officials')
                field: office
  - name: mo_senate_session_codes
    description: >
      The House's session code for each Senate bill-list session (#586): senate.mo.gov names a session by year and
      type (R = regular; E1, E2 = the first and second extraordinary sessions), the House by a three-digit code. The
      regular session is the two-digit year + 1 (251), but the extraordinary sessions are not year + 2: the House
      has no 252, 2025's June special session is 253 and its September one 254. A row is added only with evidence
      (the evidence column), such as the same bills and titles in the House XML for that code; a Senate session
      with no row has a null session_code in the staging models and fails assert_senate_sessions_have_house_codes
      (its header says how to add the row). 2017 E1 has no row: the Senate site returns an empty list for it (the House
      has 173 and 174), so those special-session Senate bills are not landed.
    config:
      column_types: {session_year: integer, session_type: varchar, house_session_code: varchar, evidence: varchar}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [session_year, session_type]
    columns:
      - name: session_year
        data_tests: [not_null]
      - name: session_type
        data_tests: [not_null]
      - name: house_session_code
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_mo_house__bills')
                field: session_code
      - name: evidence
        data_tests: [not_null]
