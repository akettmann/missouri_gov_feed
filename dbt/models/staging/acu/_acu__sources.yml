# Raw landings of this system (identifier = directory under MOGOV_RAW_DIR); external_location and the
# default (no) freshness come from dbt_project.yml. Freshness is set on always-on JSON landings only.
version: 2
sources:
- name: acu
  description: American Conservative Union legislative ratings (GraphQL API).
  tables:
  - name: ratings
    identifier: acu_ratings
    description: American Conservative Union ratings of MO legislators, one JSON row per person with yearly ratings.
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
          count: 8
          period: day
        error_after:
          count: 32
          period: day
