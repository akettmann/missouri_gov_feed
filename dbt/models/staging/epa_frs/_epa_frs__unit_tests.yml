# Unit tests for the U+FFFD name repair in the EPA FRS staging models (#260): fixed input rows -> exact rows.
# Kept apart from the generated _epa_frs__models.yml so regenerating docs never touches them.
version: 2

unit_tests:
  - name: epa_frs_facility_name_repaired_from_the_matching_alt_name
    model: stg_epa_frs__facilities
    description: >
      A facility name with U+FFFD takes the one alternative name of the same registry id that equals it with each
      run of U+FFFD standing for one character (a run of two replacement characters is still one letter). A name
      with no U+FFFD is left alone even when its alternative names differ. Alternative names that do not fit the
      damaged pattern (a longer name, another registry id) are not used: the U+FFFD is dropped instead. Two
      different matching alternatives are ambiguous and repair nothing. The seed wins over an alternative name.
      LIKE wildcards in a name match literally (a damaged "50% FF" does not match the alternative "50X EFF").
      An alternative name that itself has U+FFFD is never used. The damaged name is trimmed before matching.
    given:
      - input: source('epa_frs', 'facilities')
        format: sql
        rows: |
            select cast('{"REGISTRY_ID": "1", "PRIMARY_NAME": "D�COR PLUS"}' as varchar) as payload, 'u' as source_url union all
            select cast('{"REGISTRY_ID": "2", "PRIMARY_NAME": "MARBLE D��COR INC"}' as varchar) as payload, 'u' as source_url union all
            select cast('{"REGISTRY_ID": "3", "PRIMARY_NAME": "PLAIN NAME"}' as varchar) as payload, 'u' as source_url union all
            select cast('{"REGISTRY_ID": "4", "PRIMARY_NAME": "D�COR SHOP"}' as varchar) as payload, 'u' as source_url union all
            select cast('{"REGISTRY_ID": "5", "PRIMARY_NAME": "C�FE ONE"}' as varchar) as payload, 'u' as source_url union all
            select cast('{"REGISTRY_ID": "6", "PRIMARY_NAME": "100% �LL"}' as varchar) as payload, 'u' as source_url union all
            select cast('{"REGISTRY_ID": "7", "PRIMARY_NAME": "ZO� INC"}' as varchar) as payload, 'u' as source_url union all
            select cast('{"REGISTRY_ID": "8", "PRIMARY_NAME": "A_B �"}' as varchar) as payload, 'u' as source_url union all
            select cast('{"REGISTRY_ID": "10", "PRIMARY_NAME": "50% �FF"}' as varchar) as payload, 'u' as source_url union all
            select cast('{"REGISTRY_ID": "11", "PRIMARY_NAME": "CAF� TWO"}' as varchar) as payload, 'u' as source_url union all
            select cast('{"REGISTRY_ID": "12", "PRIMARY_NAME": "TRIM �X  "}' as varchar) as payload, 'u' as source_url
      - input: ref('stg_epa_frs__alt_names')
        rows:
          - {registry_id: '1', program_system: RCRAINFO, program_id: P1, alt_name: DECOR PLUS}
          - {registry_id: '2', program_system: RCRAINFO, program_id: P2, alt_name: MARBLE DECOR INC}
          - {registry_id: '3', program_system: RCRAINFO, program_id: P3, alt_name: OTHER NAME}
          - {registry_id: '4', program_system: RCRAINFO, program_id: P4, alt_name: DECORATING SHOP}
          - {registry_id: '4', program_system: RCRAINFO, program_id: P5, alt_name: ANOTHER SHOP}
          - {registry_id: '5', program_system: RCRAINFO, program_id: P6, alt_name: CAFE ONE}
          - {registry_id: '5', program_system: MO-DNR, program_id: P7, alt_name: CAFE ONE}
          - {registry_id: '6', program_system: MO-DNR, program_id: P9, alt_name: 100% ALL}
          - {registry_id: '7', program_system: MO-DNR, program_id: P10, alt_name: ZOE INC}
          - {registry_id: '7', program_system: MO-DNR, program_id: P11, alt_name: ZOA INC}
          - {registry_id: '8', program_system: MO-DNR, program_id: P12, alt_name: AXB C}
          - {registry_id: '9', program_system: MO-DNR, program_id: P13, alt_name: DECOR SHOP}
          - {registry_id: '10', program_system: MO-DNR, program_id: P14, alt_name: 50X EFF}
          - {registry_id: '11', program_system: MO-DNR, program_id: P15, alt_name: CAF� TWO}
          - {registry_id: '12', program_system: MO-DNR, program_id: P16, alt_name: TRIM EX}
      - input: ref('epa_frs_name_corrections')
        rows:
          - {record_key: '5', field: facility_name, corrected_value: CAFE OVERRIDE, source: s}
    expect:
      rows:
        - {registry_id: '1', facility_name: DECOR PLUS}
        - {registry_id: '2', facility_name: MARBLE DECOR INC}
        - {registry_id: '3', facility_name: PLAIN NAME}
        - {registry_id: '4', facility_name: DCOR SHOP}
        - {registry_id: '5', facility_name: CAFE OVERRIDE}
        - {registry_id: '6', facility_name: 100% ALL}
        - {registry_id: '7', facility_name: ZO INC}
        - {registry_id: '8', facility_name: A_B}
        - {registry_id: '10', facility_name: 50% FF}
        - {registry_id: '11', facility_name: CAF TWO}
        - {registry_id: '12', facility_name: TRIM EX}

  - name: epa_frs_org_name_repaired_from_the_alt_name_of_the_same_program_record
    model: stg_epa_frs__organizations
    description: >
      An organization name with U+FFFD takes the alternative name on the same registry id, program system and
      program id that fits the damaged pattern. The same text under another program record, or an alternative
      name that does not fit the pattern, is not used: the U+FFFD is dropped instead.
    given:
      - input: source('epa_frs', 'organizations')
        format: sql
        rows: |
            select cast('{"REGISTRY_ID": "1", "PGM_SYS_ACRNM": "RCRAINFO", "PGM_SYS_ID": "P1", "AFFILIATION_TYPE": "OWNER", "ORG_NAME": "D�COR PLUS"}' as varchar) as payload, 'u' as source_url union all
            select cast('{"REGISTRY_ID": "1", "PGM_SYS_ACRNM": "RCRAINFO", "PGM_SYS_ID": "P1", "AFFILIATION_TYPE": "OPERATOR", "ORG_NAME": "D�COR PLUS"}' as varchar) as payload, 'u' as source_url union all
            select cast('{"REGISTRY_ID": "2", "PGM_SYS_ACRNM": "RCRAINFO", "PGM_SYS_ID": "P2", "AFFILIATION_TYPE": "OWNER", "ORG_NAME": "D�COR PLUS"}' as varchar) as payload, 'u' as source_url union all
            select cast('{"REGISTRY_ID": "3", "PGM_SYS_ACRNM": "RCRAINFO", "PGM_SYS_ID": "P3", "AFFILIATION_TYPE": "OWNER", "ORG_NAME": "D�COR PLUS"}' as varchar) as payload, 'u' as source_url union all
            select cast('{"REGISTRY_ID": "4", "PGM_SYS_ACRNM": "RCRAINFO", "PGM_SYS_ID": "P4", "AFFILIATION_TYPE": "OWNER", "ORG_NAME": "ACME INC"}' as varchar) as payload, 'u' as source_url
      - input: ref('stg_epa_frs__alt_names')
        rows:
          - {registry_id: '1', program_system: RCRAINFO, program_id: P1, alt_name: DECOR PLUS}
          - {registry_id: '1', program_system: MO-DNR, program_id: P1, alt_name: DECOR PLUS WRONG}
          - {registry_id: '2', program_system: MO-DNR, program_id: P2, alt_name: DECOR PLUS}
          - {registry_id: '3', program_system: RCRAINFO, program_id: P3, alt_name: DECOR PLUS LLC}
          - {registry_id: '4', program_system: RCRAINFO, program_id: P4, alt_name: ACME INCORPORATED}
      - input: ref('epa_frs_name_corrections')
        format: sql
        rows: |
            select cast(null as varchar) as record_key, cast(null as varchar) as field,
                cast(null as varchar) as corrected_value, cast(null as varchar) as source
            where false
    expect:
      rows:
        - {registry_id: '1', program_system: RCRAINFO, program_id: P1, affiliation_type: OWNER, org_name: DECOR PLUS}
        - {registry_id: '1', program_system: RCRAINFO, program_id: P1, affiliation_type: OPERATOR, org_name: DECOR PLUS}
        - {registry_id: '2', program_system: RCRAINFO, program_id: P2, affiliation_type: OWNER, org_name: DCOR PLUS}
        - {registry_id: '3', program_system: RCRAINFO, program_id: P3, affiliation_type: OWNER, org_name: DCOR PLUS}
        - {registry_id: '4', program_system: RCRAINFO, program_id: P4, affiliation_type: OWNER, org_name: ACME INC}

  - name: epa_frs_text_loses_stray_commas_and_whitespace
    model: stg_epa_frs__facilities
    description: >
      EPA writes names and addresses with trailing commas ("BUTTERBALL,", "900 WATSON DR,") and tabs. Name, address
      and city lose leading and trailing commas, semicolons and whitespace and have inner runs of whitespace
      collapsed to one space, while punctuation that belongs to the text stays ("INC.", "ST. LOUIS", an inner comma
      before "SUITE 1"). Text that is nothing but separators becomes null (#319). A doubled or tripled inner comma
      becomes one and a single space before a comma goes too ("NEMO FEEDS , LLC", "39.1 , -91.8", #381, #399); a doubled semicolon is left alone ("K-BAR-L ;;C" is probably a
      shifted "LLC").
    given:
      - input: source('epa_frs', 'facilities')
        format: sql
        rows: |
            select cast('{"REGISTRY_ID": "1", "PRIMARY_NAME": "BUTTERBALL,", "LOCATION_ADDRESS": "900 WATSON DR,", "CITY_NAME": "BRONAUGH"}' as varchar) as payload, 'u' as source_url union all
            select cast('{"REGISTRY_ID": "2", "PRIMARY_NAME": "ACME, INC.,", "LOCATION_ADDRESS": "100 MAIN ST, SUITE 1,", "CITY_NAME": "ST. LOUIS,"}' as varchar) as payload, 'u' as source_url union all
            select cast('{"REGISTRY_ID": "3", "PRIMARY_NAME": " , P P G  INDUSTRIES INC\t\t;", "LOCATION_ADDRESS": "HIGHWAY N\t\t\t", "CITY_NAME": "MILAN"}' as varchar) as payload, 'u' as source_url union all
            select cast('{"REGISTRY_ID": "4", "PRIMARY_NAME": "#1 STEP PALLETS", "LOCATION_ADDRESS": " , ;", "CITY_NAME": ""}' as varchar) as payload, 'u' as source_url union all
            select cast('{"REGISTRY_ID": "5", "PRIMARY_NAME": "LIPPERT FAMILY FARM,, LLC", "LOCATION_ADDRESS": "K-BAR-L ;;C", "CITY_NAME": "ACME ,, INC,,,"}' as varchar) as payload, 'u' as source_url union all
            select cast('{"REGISTRY_ID": "6", "PRIMARY_NAME": "A,,, B", "LOCATION_ADDRESS": "1 MAIN ST,,, APT 2", "CITY_NAME": "X"}' as varchar) as payload, 'u' as source_url union all
            select cast('{"REGISTRY_ID": "7", "PRIMARY_NAME": "NEMO FEEDS , LLC", "LOCATION_ADDRESS": "T 33N ,R 04W", "CITY_NAME": "39.15506111 , -91.84653333"}' as varchar) as payload, 'u' as source_url union all
            select cast('{"REGISTRY_ID": "8", "PRIMARY_NAME": "ROYAL OAK ENTERPRISES ,LLC", "LOCATION_ADDRESS": "HC 3  ,  BOX 3180", "CITY_NAME": "A, B"}' as varchar) as payload, 'u' as source_url
      - input: ref('stg_epa_frs__alt_names')
        format: sql
        rows: |
            select cast(null as varchar) as registry_id, cast(null as varchar) as program_system,
                cast(null as varchar) as program_id, cast(null as varchar) as alt_name
            where false
      - input: ref('epa_frs_name_corrections')
        format: sql
        rows: |
            select cast(null as varchar) as record_key, cast(null as varchar) as field,
                cast(null as varchar) as corrected_value, cast(null as varchar) as source
            where false
    expect:
      rows:
        - {registry_id: '1', facility_name: BUTTERBALL, address: 900 WATSON DR, city: BRONAUGH}
        - {registry_id: '2', facility_name: 'ACME, INC.', address: '100 MAIN ST, SUITE 1', city: ST. LOUIS}
        - {registry_id: '3', facility_name: P P G INDUSTRIES INC, address: HIGHWAY N, city: MILAN}
        - {registry_id: '4', facility_name: '#1 STEP PALLETS', address: null, city: null}
        - {registry_id: '5', facility_name: 'LIPPERT FAMILY FARM, LLC', address: 'K-BAR-L ;;C', city: 'ACME, INC'}
        - {registry_id: '6', facility_name: 'A, B', address: '1 MAIN ST, APT 2', city: X}
        - {registry_id: '7', facility_name: 'NEMO FEEDS, LLC', address: 'T 33N,R 04W', city: '39.15506111, -91.84653333'}
        - {registry_id: '8', facility_name: 'ROYAL OAK ENTERPRISES,LLC', address: 'HC 3, BOX 3180', city: 'A, B'}

  - name: epa_frs_org_name_loses_stray_commas_and_whitespace
    model: stg_epa_frs__organizations
    description: The same cleanup for an organization (owner) name; "INC." keeps its period (#319).
    given:
      - input: source('epa_frs', 'organizations')
        format: sql
        rows: |
            select cast('{"REGISTRY_ID": "1", "PGM_SYS_ACRNM": "X", "PGM_SYS_ID": "P1", "AFFILIATION_TYPE": "OWNER", "ORG_NAME": "ACME INC.,"}' as varchar) as payload, 'u' as source_url union all
            select cast('{"REGISTRY_ID": "2", "PGM_SYS_ACRNM": "X", "PGM_SYS_ID": "P2", "AFFILIATION_TYPE": "OWNER", "ORG_NAME": "DOE\t CO  "}' as varchar) as payload, 'u' as source_url union all
            select cast('{"REGISTRY_ID": "3", "PGM_SYS_ACRNM": "X", "PGM_SYS_ID": "P3", "AFFILIATION_TYPE": "OWNER", "ORG_NAME": "RYAN COMPANIES , INC."}' as varchar) as payload, 'u' as source_url
      - input: ref('stg_epa_frs__alt_names')
        format: sql
        rows: |
            select cast(null as varchar) as registry_id, cast(null as varchar) as program_system,
                cast(null as varchar) as program_id, cast(null as varchar) as alt_name
            where false
      - input: ref('epa_frs_name_corrections')
        format: sql
        rows: |
            select cast(null as varchar) as record_key, cast(null as varchar) as field,
                cast(null as varchar) as corrected_value, cast(null as varchar) as source
            where false
    expect:
      rows:
        - {registry_id: '1', org_name: ACME INC.}
        - {registry_id: '2', org_name: DOE CO}
        - {registry_id: '3', org_name: 'RYAN COMPANIES, INC.'}

  - name: epa_frs_facility_text_html_entities_decoded
    model: stg_epa_frs__facilities
    description: >
      The HTML entities EPA writes into facility names, addresses and cities are decoded (#398): &AMP; and &amp; to
      "&", &#39; to an apostrophe, &#40; and &#41; to parentheses. A bare "&" ("AT&T", "A & B") and a "&AMP" with no
      semicolon are left as they are, an unknown entity (&copy;) is not touched, and a double-encoded &amp;#39; is
      decoded once only.
    given:
      - input: source('epa_frs', 'facilities')
        format: sql
        rows: |
            select cast('{"REGISTRY_ID": "1", "PRIMARY_NAME": "D&AMP;A BARRACKS", "LOCATION_ADDRESS": "31ST &AMP; JARBOE", "CITY_NAME": "TOWN &amp; COUNTRY"}' as varchar) as payload, 'u' as source_url union all
            select cast('{"REGISTRY_ID": "2", "PRIMARY_NAME": "HOLCIM &#40;US&#41; INC"}' as varchar) as payload, 'u' as source_url union all
            select cast('{"REGISTRY_ID": "3", "PRIMARY_NAME": "LEE&#39;S SUMMIT"}' as varchar) as payload, 'u' as source_url union all
            select cast('{"REGISTRY_ID": "4", "PRIMARY_NAME": "AT&T & A&B &AMP SHOP"}' as varchar) as payload, 'u' as source_url union all
            select cast('{"REGISTRY_ID": "5", "PRIMARY_NAME": "X&copy;Y &amp;#39; Z"}' as varchar) as payload, 'u' as source_url
      - input: ref('stg_epa_frs__alt_names')
        rows: []
      - input: ref('epa_frs_name_corrections')
        rows: []
    expect:
      rows:
        - {registry_id: '1', facility_name: D&A BARRACKS, address: 31ST & JARBOE, city: TOWN & COUNTRY}
        - {registry_id: '2', facility_name: HOLCIM (US) INC, address: null, city: null}
        - {registry_id: '3', facility_name: LEE'S SUMMIT, address: null, city: null}
        - {registry_id: '4', facility_name: AT&T & A&B &AMP SHOP, address: null, city: null}
        - {registry_id: '5', facility_name: X&copy;Y &#39; Z, address: null, city: null}

  - name: epa_frs_org_name_html_entities_decoded
    model: stg_epa_frs__organizations
    description: >
      An organization name has its HTML entities decoded (#398), while a bare "&" ("AT&T") stays.
    given:
      - input: source('epa_frs', 'organizations')
        format: sql
        rows: |
            select cast('{"REGISTRY_ID": "1", "PGM_SYS_ACRNM": "RCRAINFO", "PGM_SYS_ID": "P1", "ORG_NAME": "PROCESS &AMP; SAFETY SOLUTIONS LLC"}' as varchar) as payload, 'u' as source_url union all
            select cast('{"REGISTRY_ID": "2", "PGM_SYS_ACRNM": "RCRAINFO", "PGM_SYS_ID": "P2", "ORG_NAME": "AT&T"}' as varchar) as payload, 'u' as source_url
      - input: ref('stg_epa_frs__alt_names')
        rows: []
      - input: ref('epa_frs_name_corrections')
        rows: []
    expect:
      rows:
        - {registry_id: '1', org_name: PROCESS & SAFETY SOLUTIONS LLC}
        - {registry_id: '2', org_name: AT&T}
