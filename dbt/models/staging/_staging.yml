# Generated from each model's header comment (+ grain for intermediate models); edit the SQL header,
# not this file, then regenerate.
version: 2
models:
- name: stg_courtlistener__mo_cases
  description: One row per opinion cluster in a Missouri state or federal court (CourtListener bulk export), with
    its docket. judges / attorneys are CourtListener's free-text fields as printed in the opinion.
- name: stg_mec_direct__candidate_committees
  description: 'MEC''s own candidate <-> committee crosswalk (CF12 election search export), one row per candidacy.
    cells: [MECID, committee name, candidate name, party, office sought, status]'
- name: stg_mec_direct__contributions
  description: MEC itemized contributions received (direct export, recent report years). Dates "M/D/YYYY 12:00:00
    AM".
- name: stg_mec_direct__contributions_made
  description: 'MEC contributions made: the reporting committee (mecid) gave to `committee` (a candidate or committee).'
- name: stg_mec_direct__expenditures
  description: 'MEC itemized expenditures over $100 (CD3 Part B, direct export, recent report years): what each
    committee paid, to whom, for what. Contributions to other committees are reported separately (CD3 Part C).'
- name: stg_mec_direct__lobbyist_gifts
  description: MEC lobbyist expenditures on officials, 2019+ (direct export). recipient is "Last,  First  - Role".
- name: stg_mec_direct__report_summaries
  description: 'MEC campaign finance report cover pages (direct export): one row per filed report with its totals.
    "This election" totals accumulate across an election''s reports; "this period" amounts cover the report alone.
    Amended reports are separate rows with their own report_id.'
- name: stg_acu__ratings
  description: American Conservative Union (CPAC) yearly ratings of Missouri legislators (0-100; higher = votes
    more often with ACU's positions), with the chamber/district they held that year.
- name: stg_bluebook__lines
  description: Missouri Official Manual text, one row per extracted line, in reading order per chapter.
- name: stg_congress__fec_ids
  description: Every FEC candidate ID a Missouri member of Congress has used (House and Senate runs get separate
    IDs).
- name: stg_congress__legislators
  description: Members of Congress who ever represented Missouri, with cross-system IDs.
- name: stg_congress__terms
  description: One row per congressional term served (any state), for MO members' past-office history.
- name: stg_courtlistener__judge_disclosures
  description: Federal judges' financial disclosure reports (AO-10) as indexed by CourtListener, linked to FJC ids.
- name: stg_fec__candidate_committees
  description: 'Candidate -> committee links: authorized committees from the FEC linkage file, plus sponsored committees
    (leadership PACs) from the FEC API.'
- name: stg_fec__candidate_summary
  description: 'FEC all-candidates summary: per candidate per cycle totals.'
- name: stg_fec__committee_contributions
  description: 'FEC pas2: contributions from committees (PACs, party committees, leadership PACs) to candidates,
    plus independent expenditures for/against candidates. Amounts in USD; dates MMDDYYYY in the file.'
- name: stg_fec__committees
  description: 'FEC committee master, latest cycle''s record per committee. CMTE_DSGN: P principal campaign, A authorized,
    D leadership PAC, J joint fundraiser, U unauthorized, B lobbyist PAC.'
- name: stg_fec__receipt_aggregates
  description: 'FEC API: itemized individual receipts per principal committee, aggregated by employer / size / state.
    Empty when FEC_API_KEY isn''t configured.'
- name: stg_fjc__appointments
  description: 'Federal Judicial Center: one row per (judge, appointment). The CSV is wide with up to six appointment
    groups "(1)".."(6)"; unpivot them with a union.'
- name: stg_house_fd__filings
  description: 'U.S. House Clerk financial disclosure index (all members/candidates nationally). FilingType: O annual,
    A amendment, P periodic transaction report, C candidate, T termination, X extension.'
- name: stg_mec__contributions
  description: MEC itemized contributions received by Missouri committees (TAP mirror, 2011-2022). The mirror combines
    two MEC export layouts; coalesce the overlapping columns. dupe_flag marks rows TAP identified as duplicates
    (amended reports) and they're dropped.
- name: stg_mec__expenditures
  description: 'MEC itemized expenditures by Missouri committees (TAP mirror, 2011-2022): includes contributions
    the committee made to other candidates and committees.'
- name: stg_mec__lobbyist_gifts
  description: MEC lobbyist expenditures on public officials (meals, gifts, travel...), TAP mirror 2004-2022. recipient_name
    is "LAST, FIRST"; group expenditures (e.g. "ENTIRE SENATE") have no individual name.
- name: stg_mo_house__members
  description: MO House members per session (end-of-session snapshot from the House XML export).
- name: stg_mo_house__rollcall_votes
  description: 'One row per (MO House roll call, member token). Tokens: "SMITH 46" (district when surnames collide),
    "FOUNTAIN HENDERS" (truncated to ~16 chars), "MR SPEAKER".'
- name: stg_mo_house__rollcalls
  description: 'One row per MO House roll call (parsed PDF header). The line after "Roll Call : N" names the measure
    (e.g. "HCS HB 10"); the next lines carry the sponsor and a description.'
- name: stg_mo_senate__votes
  description: 'One row per (MO Senate journal vote, senator token). Tokens: surname, or "Brown (16)" when two senators
    share one. The context is the journal sentence introducing the vote.'
- name: stg_openstates__current_roster
  description: 'Open States flat current roster: adds Wikidata QIDs, which the YAML usually lacks.'
- name: stg_openstates__other_names
  description: Alternate spellings Open States has seen for each person; used to match people in other sources.
- name: stg_openstates__people
  description: One row per Missouri person in Open States (excludes the committees folder).
- name: stg_openstates__roles
  description: 'Every role (office) each Open States person has held: the state-level past-offices history.'
- name: stg_senate_efd__items
  description: U.S. Senate eFD report rows (web-filed annual reports and PTRs), one row per table row, with the
    cells re-keyed by their column header. Paper filings aren't parsed (see stg_senate_efd__filings).
- name: stg_shor_mccarty
  description: 'Shor-McCarty state legislator ideology (Missouri only). np_score: one career ideal point, negative
    = liberal, positive = conservative, comparable across states and chambers. The wide per-year chamber/district
    columns are unpivoted to find each legislator''s last seat.'
- name: stg_voteview__members
  description: 'Voteview member-congress rows, with DW-NOMINATE ideal points (dim1: economic left(-)/right(+)).'
- name: stg_voteview__rollcalls
  description: 'Voteview roll calls (both chambers, loaded congresses): date, bill, question, result and vote totals.'
- name: stg_voteview__votes
  description: 'cast_code per Voteview: 1-3 yea, 4-6 nay, 7-8 present, 9 not voting, 0 not a member.'
- name: stg_wikidata__facts
  description: Wikidata facts about Missouri officials, normalized to (qid, fact_kind, value, value_qid, dates).
- name: stg_wikidata__officeholders
  description: Living people Wikidata records as holding a Missouri office; used to find QIDs for officials by name.
- name: stg_wikidata__relatives
  description: Officials' relatives on Wikidata, with any organization the relative leads and offices they hold.
