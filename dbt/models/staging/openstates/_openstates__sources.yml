# Raw landings of this system (identifier = directory under MOGOV_RAW_DIR); external_location and the
# default (no) freshness come from dbt_project.yml. Freshness is set on always-on JSON landings only.
version: 2
sources:
- name: openstates
  description: 'Open States people repo: Missouri legislators, statewide officers, mayors (YAML) and the flat current
    roster.'
  tables:
  - name: people
    identifier: openstates_people
    description: One row per Open States YAML file under data/mo (legislature, retired, executive, municipalities,
      committees).
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
          count: 8
          period: day
        error_after:
          count: 32
          period: day
  - name: current_csv
    identifier: openstates_current_csv
    description: Open States flat current roster (has Wikidata QIDs).
