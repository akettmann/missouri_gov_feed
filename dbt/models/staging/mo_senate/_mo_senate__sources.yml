# Raw landings of this system (identifier = directory under MOGOV_RAW_DIR); external_location and the
# default (no) freshness come from dbt_project.yml. Freshness is set on always-on JSON landings only.
version: 2
sources:
- name: mo_senate
  description: Missouri Senate daily journal PDFs, parsed into per-senator vote rows, the Senate topical index (subject keywords per bill), and the Senate's own bill list with each bill's action history.
  tables:
  - name: journals
    identifier: mo_senate_journals
    description: 'One row per MO Senate journal PDF read: URL, year, number of vote rows parsed (or the fetch error).'
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
          count: 8
          period: day
        error_after:
          count: 32
          period: day
  - name: votes
    identifier: mo_senate_votes
    description: One row per (Senate journal vote block, category, senator token).
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
          count: 8
          period: day
        error_after:
          count: 32
          period: day
  - name: bill_topics
    identifier: mo_senate_bill_topics
    description: One row per (regular session, topical index keyword, bill card) from the Senate's topical index.
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
          count: 8
          period: day
        error_after:
          count: 32
          period: day
  # Optional: filled by `mogov load mo_senate_bills` (slow, ~1 request/s); `mogov build` creates empty placeholders
  # until then (db.OPTIONAL_JSON_TABLES), so no freshness check.
  - name: bill_list
    identifier: mo_senate_bill_list
    description: One row per Senate bill or resolution of a session (regular or extraordinary) in senate.mo.gov's bill list; the page's JSON object as printed, plus year and session_type.
  - name: bill_actions
    identifier: mo_senate_bill_actions
    description: One row per action in a Senate bill's history on senate.mo.gov (newest first), with the journal page that records it.
  # The bill page's other tabs, landed by the same loader (MOGOV_SENATE_BILL_DOCS=0 skips them): the links to the
  # bill text, fiscal note and amendment PDFs, and the summaries' text. Optional like bill_list.
  - name: bill_texts
    identifier: mo_senate_bill_texts
    description: One row per bill text version (PDF link) on a Senate bill's page, with the LR number and version name as printed.
  - name: bill_fiscal_notes
    identifier: mo_senate_bill_fiscal_notes
    description: One row per fiscal-note PDF link on a Senate bill's page.
  - name: bill_amendments
    identifier: mo_senate_bill_amendments
    description: One row per amendment PDF link on a Senate bill's page, with the status chip beside it.
  - name: bill_summaries
    identifier: mo_senate_bill_summaries
    description: One row per bill summary on a Senate bill's page; the summary's text is on the page, not in a PDF.
