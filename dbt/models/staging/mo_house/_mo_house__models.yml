# Generated from each model's header comment (+ grain for intermediate models); edit the SQL header,
# not this file, then regenerate.
version: 2
models:
- name: stg_mo_house__bill_actions
  description: 'One row per action on a bill in the House XML export: House bills (BillList) and the Senate bills
    that reached the House (SenateActList, which lists only their House-side and governor actions, not their Senate
    history). description is as printed, e.g. "Perfected (H)", "Truly Agreed To and Finally Passed", "Approved by
    Governor (G)"; action_seq orders a bill''s actions (the XML''s ActivitySequence; missing before 2024). The XML
    repeats some actions word for word under one Guid (about 1,000 of 138,000, mostly 2017-2018); they are kept
    once.'
- name: stg_mo_house__bill_rollcalls
  description: 'The House roll calls taken on each bill: the XML nests them under the bill text version voted on
    (amendment roll calls are left out). rollcall_url is the roll-call PDF, which is the House vote_id.'
- name: stg_mo_house__bill_sponsors
  description: 'Sponsors of each House bill as the XML lists them: sponsor, co-sponsors, handlers and House/Senate
    conferees. District numbers are the House''s: senators appear as 200 + their senate district.'
- name: stg_mo_house__bill_subjects
  description: The House's subject index terms for each bill ("APPROPRIATIONS", "EDUCATION, ELEMENTARY AND SECONDARY").
    The XML export has them from the 2024 sessions on; earlier sessions have none.
- name: stg_mo_house__bills
  description: 'One row per MO House bill per session (House XML export): number, current version, titles, last
    action. source_url is the link on the bill''s first listed action (the bill''s page on house.mo.gov).'
- name: stg_mo_house__committee_list_members
  description: 'Members of each House committee per session from the House COMMITTEELIST export: one row per (session,
    committee, member). Held only for sessions 231, 241, 251, 253 and 254 (2023 onward). The member is identified
    by the House district number, which is unique within a session. source_url is the House file the COMMITTEELIST
    export was fetched from (the session zip for a closed session).'
- name: stg_mo_house__member_committees
  description: 'Committee and subcommittee posts of each MO House member per session, as the member''s own XML page
    lists them (end-of-session snapshot): committee name and position (Chair, Vice-Chair, Co-Chair, Ranking Minority
    Member, Member). Subcommittees carry "Subcommittee" in the name. The export has none for session 253.'
- name: stg_mo_house__members
  description: MO House members per session (end-of-session snapshot from the House XML export).
- name: stg_mo_house__rollcall_votes
  description: 'One row per (MO House roll call, member token). Tokens: "SMITH 46" (district when surnames collide),
    "FOUNTAIN HENDERS" (truncated to ~16 chars), "MR SPEAKER".'
- name: stg_mo_house__rollcalls
  description: 'One row per MO House roll call (parsed PDF header). The line after "Roll Call : N" names the measure
    (e.g. "HCS HB 10"); the next lines carry the sponsor and a description. The House''s rollcalls directory for
    a session holds PDFs that belong to other sessions; three rules drop them. 1. Dated outside the session''s year
    (#430): bills171 holds the 2016 session''s PDFs (415 votes dated 2016, none linked from the bill XML; they belong
    to session 161, which is not loaded). 2. Header names another session (#435): the PDF header carries the General
    Assembly ("99th") and a session label ("FIRST REGULAR SESSION", "SPECIAL SESSION", "SECOND EXTRAORDINARY SESSION").
    A regular session (code ending in 1) must show its General Assembly and the label FIRST in odd years, SECOND
    in even years; an extraordinary or special session (any other last digit) must show its General Assembly and
    an EXTRAORDINARY or SPECIAL label. The House numbers extraordinary sessions irregularly (173 prints SPECIAL,
    184 prints FIRST EXTRAORDINARY, 174 prints SECOND), so those labels are not checked against the code''s ordinal.
    Drops 5 PDFs: 171 002.001/002.002 (SPECIAL SESSION, the 173 session of 2017-05-23), 201 012.001 (FIRST EXTRAORDINARY,
    a copy of 203''s 012.001) and 204 003.002/003.003 (dated 2020-11-19, SECOND REGULAR SESSION: technical-session
    votes on HB 2315 of the 2020 regular session; 204''s House journal pages run unbroken from 2020-11-10 to 2020-11-20,
    so there was no 204 sitting on the 19th, and the header is right, not a typo). A header that does not parse
    (no PDF text) is kept. 3. The same (session, day, roll-call number) published under two file names (#435): 261
    has 003.001 = 003.002, 004.002 = 004.004 and 004.003 = 004.005, byte-identical headers and totals. The roll-call
    number printed in the PDF is the key; the file whose name carries that number (else the first by URL) is kept.
    Raw keeps everything.'
  columns:
  - name: session_day
    description: Legislative day of the session (highest seen through 2026 is 79).
    data_tests:
    - dbt_utils.accepted_range:
        arguments:
          min_value: 1
          max_value: 120
- name: stg_mo_house__sessions
  description: 'The House''s own names for its legislative sessions (SESSIONLIST: "2025 1st Extraordinary Session",
    "2018 Special Session"). Every session''s SESSIONLIST repeats the full history, so the copy from the newest
    session wins; the House numbers extraordinary sessions irregularly, so the code''s last digit cannot be turned
    into a name.'
