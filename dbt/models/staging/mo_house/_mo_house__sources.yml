# Raw landings of this system (identifier = directory under MOGOV_RAW_DIR); external_location and the
# default (no) freshness come from dbt_project.yml. Freshness is set on always-on JSON landings only.
# The mo_house_xml_* tables are written by mogov.parsers.mo_house from the gzipped XML files that the
# loader lands unchanged (listed in mo_house_xml_files). Other parsed tables (mo_house_xml_bill_amendments,
# _bill_texts, _bill_hearings, _bill_summaries, _bill_fiscal_notes, _bill_witnesses, _member_counties,
# _bill_list, _member_list, _upcoming_hearings, _calendar_bills, _list_notices and the SenateActList's
# mo_house_xml_senate_act_*) are landed too but not read by any model yet.
version: 2
sources:
- name: mo_house
  description: Missouri House XML exports (landed as gzip, parsed into typed tables) and roll-call PDFs.
  tables:
  - name: xml_files
    identifier: mo_house_xml_files
    description: "One row per landed House XML file: session, file name, kind, source URL, gzip path under MOGOV_RAW_DIR, size, sha256 and fetch time. The XML itself is the gzip file, unchanged."
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
          count: 8
          period: day
        error_after:
          count: 32
          period: day
  - name: xml_members
    identifier: mo_house_xml_members
    description: "One row per MO House member XML file (roster fields; contact details stay in the raw file)."
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
          count: 8
          period: day
        error_after:
          count: 32
          period: day
  - name: xml_member_committees
    identifier: mo_house_xml_member_committees
    description: "One row per committee post on a member page."
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
          count: 8
          period: day
        error_after:
          count: 32
          period: day
  - name: xml_bills
    identifier: mo_house_xml_bills
    description: "One row per MO House bill XML file (number, titles, last action, governor action)."
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
          count: 8
          period: day
        error_after:
          count: 32
          period: day
  - name: xml_bill_actions
    identifier: mo_house_xml_bill_actions
    description: "One row per action on a bill, in document order (action_index), with the printed roll-call totals when the action is a vote."
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
          count: 8
          period: day
        error_after:
          count: 32
          period: day
  - name: xml_senate_act_actions
    identifier: mo_house_xml_senate_act_actions
    description: "One row per House-side or governor action on a Senate bill (SenateActList), in document order (action_index); bill names the Senate bill, e.g. SB727. Same columns as xml_bill_actions plus bill."
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
          count: 8
          period: day
        error_after:
          count: 32
          period: day
  - name: xml_bill_sponsors
    identifier: mo_house_xml_bill_sponsors
    description: "One row per sponsor, co-sponsor, handler or conferee on a bill."
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
          count: 8
          period: day
        error_after:
          count: 32
          period: day
  - name: xml_bill_rollcalls
    identifier: mo_house_xml_bill_rollcalls
    description: "One row per roll call listed under a bill text version (parent_kind text) or amendment (amendment), with its PDF link and printed totals."
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
          count: 8
          period: day
        error_after:
          count: 32
          period: day
  - name: xml_bill_subjects
    identifier: mo_house_xml_bill_subjects
    description: "One row per subject index term on a bill (2024 sessions on)."
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
          count: 8
          period: day
        error_after:
          count: 32
          period: day
  - name: xml_sessions
    identifier: mo_house_xml_sessions
    description: "One row per session in each sessions SESSIONLIST file (every list repeats the history)."
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
          count: 8
          period: day
        error_after:
          count: 32
          period: day
  - name: xml_committees
    identifier: mo_house_xml_committees
    description: "One row per committee in each sessions COMMITTEELIST file."
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
          count: 8
          period: day
        error_after:
          count: 32
          period: day
  - name: xml_committee_members
    identifier: mo_house_xml_committee_members
    description: "One row per committee member in COMMITTEELIST files."
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
          count: 8
          period: day
        error_after:
          count: 32
          period: day
  - name: rollcalls
    identifier: mo_house_rollcalls
    description: "One row per House roll-call PDF (header fields, printed totals)."
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
          count: 8
          period: day
        error_after:
          count: 32
          period: day
  - name: rollcall_votes
    identifier: mo_house_rollcall_votes
    description: "One row per (House roll call, member token) parsed from the PDF grid."
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
          count: 8
          period: day
        error_after:
          count: 32
          period: day
