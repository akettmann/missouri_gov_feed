  - name: pdf_files
    identifier: mo_house_pdf_files
    description: "One row per House document URL the mo_house_pdf loader tried: session, kind, path of the unchanged PDF under MOGOV_RAW_DIR, size, sha256, HTTP status, error, last write, when the site was last asked (checked_at) and the ETag / Last-Modified it sent. Optional: empty until `mogov load mo_house_pdf` has run (slow, stage 2)."
  - name: pdf_texts
    identifier: mo_house_pdf_texts
    description: "One row per House document URL: kind, session, the link row's file name, LR number and version code, link count, page count, pdfplumber text as extracted (joined and per page, small-caps NULs included) and the error if the fetch or extraction failed. Optional: empty until `mogov load mo_house_pdf` has run."
  - name: pdf_statute_refs
    identifier: mo_house_pdf_statute_refs
    description: "One row per RSMo section (or range, as written) a bill text version repeals, amends or enacts, read by the mo_house_pdf loader from the enacting title and Section A (#594): document URL, session, link row's file name, LR number and version code, ordinal within the action, action (repeal, amend, enact), section_start, section_end, RSMo Supp. year and the matched clause. Optional: empty until `mogov load mo_house_pdf` has run."
