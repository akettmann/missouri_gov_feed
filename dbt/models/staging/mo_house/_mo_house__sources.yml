# Raw landings of this system (identifier = directory under MOGOV_RAW_DIR); external_location and the
# default (no) freshness come from dbt_project.yml. Freshness is set on always-on JSON landings only.
# The mo_house_xml_* tables are written by mogov.parsers.mo_house from the gzipped XML files that the
# loader lands unchanged (listed in mo_house_xml_files). Other parsed tables (
# _member_counties, _bill_list, _member_list, _upcoming_hearings, _calendar_bills, _list_notices and the
# SenateActList's _rollcalls) are landed too but not read by any model yet (#384).
# (The SenateActList carries no sponsors or subjects: its bill row names the sponsor.)
version: 2
sources:
- name: mo_house
  description: Missouri House XML exports (landed as gzip, parsed into typed tables) and roll-call PDFs.
  tables:
  - name: xml_files
    identifier: mo_house_xml_files
    description: "One row per landed House XML file: session, file name, kind, source URL, gzip path under MOGOV_RAW_DIR, size, sha256 and landed_at (when the run wrote the file, not when the House published it). The XML itself is the gzip file, unchanged."
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
          count: 8
          period: day
        error_after:
          count: 32
          period: day
  - name: xml_members
    identifier: mo_house_xml_members
    description: "One row per MO House member XML file (roster fields; contact details stay in the raw file)."
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
          count: 8
          period: day
        error_after:
          count: 32
          period: day
  - name: xml_member_committees
    identifier: mo_house_xml_member_committees
    description: "One row per committee post on a member page."
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
          count: 8
          period: day
        error_after:
          count: 32
          period: day
  - name: xml_bills
    identifier: mo_house_xml_bills
    description: "One row per MO House bill XML file (number, titles, last action, governor action)."
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
          count: 8
          period: day
        error_after:
          count: 32
          period: day
  - name: xml_bill_actions
    identifier: mo_house_xml_bill_actions
    description: "One row per action on a bill, in document order (action_index), with the printed roll-call totals when the action is a vote."
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
          count: 8
          period: day
        error_after:
          count: 32
          period: day
  - name: xml_senate_act_bills
    identifier: mo_house_xml_senate_act_bills
    description: "One row per Senate bill the SenateActList lists as reaching the House (2024 on): number, current version, titles, last action, proposed effective date, governor action, sponsor."
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
          count: 8
          period: day
        error_after:
          count: 32
          period: day
  - name: xml_senate_act_actions
    identifier: mo_house_xml_senate_act_actions
    description: "One row per House-side or governor action on a Senate bill (SenateActList), in document order (action_index); bill names the Senate bill, e.g. SB727. Same columns as xml_bill_actions plus bill."
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
          count: 8
          period: day
        error_after:
          count: 32
          period: day
  - name: xml_bill_sponsors
    identifier: mo_house_xml_bill_sponsors
    description: "One row per sponsor, co-sponsor, handler or conferee on a bill."
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
          count: 8
          period: day
        error_after:
          count: 32
          period: day
  - name: xml_bill_rollcalls
    identifier: mo_house_xml_bill_rollcalls
    description: "One row per roll call listed under a bill text version (parent_kind text) or amendment (amendment), with its PDF link and printed totals."
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
          count: 8
          period: day
        error_after:
          count: 32
          period: day
  - name: xml_bill_subjects
    identifier: mo_house_xml_bill_subjects
    description: "One row per subject index term on a bill (2024 sessions on)."
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
          count: 8
          period: day
        error_after:
          count: 32
          period: day
  - name: xml_bill_summaries
    identifier: mo_house_xml_bill_summaries
    description: "One row per summary PDF link on a bill version (introduced, committee substitute, ...)."
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
          count: 8
          period: day
        error_after:
          count: 32
          period: day
  - name: xml_bill_fiscal_notes
    identifier: mo_house_xml_bill_fiscal_notes
    description: "One row per fiscal note PDF link on a bill (the element is FiscalNote or FiscalNotes)."
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
          count: 8
          period: day
        error_after:
          count: 32
          period: day
  - name: xml_bill_witnesses
    identifier: mo_house_xml_bill_witnesses
    description: "One row per witness-form link on a bill. Links only: the forms name citizens and are not fetched. Empty Witness elements are not landed."
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
          count: 8
          period: day
        error_after:
          count: 32
          period: day
  - name: xml_bill_hearings
    identifier: mo_house_xml_bill_hearings
    description: "One row per committee hearing noticed for a bill (the Hearings element of the bill XML): committee, notice date, notice time (00:00 when only the free-text alt_time is given), location and the committee's comments."
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
          count: 8
          period: day
        error_after:
          count: 32
          period: day
  - name: xml_senate_act_hearings
    identifier: mo_house_xml_senate_act_hearings
    description: "SenateActList twin of xml_bill_hearings (bill names the Senate bill)."
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
          count: 8
          period: day
        error_after:
          count: 32
          period: day
  - name: xml_bill_texts
    identifier: mo_house_xml_bill_texts
    description: "One row per text version of a bill: text PDF link and the House's change map link (map_link)."
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
          count: 8
          period: day
        error_after:
          count: 32
          period: day
  - name: xml_bill_amendments
    identifier: mo_house_xml_bill_amendments
    description: "One row per amendment on a bill, with its change map link (map_link)."
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
          count: 8
          period: day
        error_after:
          count: 32
          period: day
  - name: xml_senate_act_summaries
    identifier: mo_house_xml_senate_act_summaries
    description: "SenateActList twin of xml_bill_summaries (bill names the Senate bill)."
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
          count: 8
          period: day
        error_after:
          count: 32
          period: day
  - name: xml_senate_act_fiscal_notes
    identifier: mo_house_xml_senate_act_fiscal_notes
    description: "SenateActList twin of xml_bill_fiscal_notes (bill names the Senate bill)."
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
