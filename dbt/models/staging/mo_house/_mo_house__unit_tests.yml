# Unit tests for the MO House staging models: fixed source rows -> exact expected rows.
version: 2

unit_tests:
  - name: house_sessions_use_the_houses_names_and_newest_list_wins
    model: stg_mo_house__sessions
    description: >
      Names come from the House's SESSIONLIST, not from the code: 253 is the 2025 1st Extraordinary Session, 183
      the 2018 Special Session and 184 the 2018 1st Extraordinary Session (the last digit follows no rule).
      Every session's list repeats the history, so the same session appears in two lists; one row per session,
      taken from the newest list (254 renames 2025 "extraordinary" in the old list), with the name trimmed.
      Deriving the name from the code, or keeping both copies, fails this test.
    given:
      - input: source('mo_house', 'xml_sessions')
        format: sql
        rows: |
            select cast('253' as varchar) as session_code, cast('253' as varchar) as session_id, cast('2025 Extraordinary Session' as varchar) as name, cast(2025 as bigint) as session_year, cast('S1' as varchar) as session_type, cast('103rd General Assembly' as varchar) as general_assembly, cast('1st Extraordinary Session' as varchar) as session_of_general_assembly union all
            select '253', '184', '2018 1st Extraordinary Session', 2018, 'S2', '99th General Assembly', '1st Extraordinary Session' union all
            select '254', '253', '2025 1st Extraordinary Session', 2025, 'S1', '103rd General Assembly', '1st Extraordinary Session' union all
            select '254', '183', ' 2018 Special Session ', 2018, 'S1', '99th General Assembly', '1st Special Session'
    expect:
      rows:
        - {session_code: '253', session_name: 2025 1st Extraordinary Session, session_year: 2025, session_type: S1, general_assembly: 103rd General Assembly, session_of_general_assembly: 1st Extraordinary Session}
        - {session_code: '184', session_name: 2018 1st Extraordinary Session, session_year: 2018, session_type: S2, general_assembly: 99th General Assembly, session_of_general_assembly: 1st Extraordinary Session}
        - {session_code: '183', session_name: 2018 Special Session, session_year: 2018, session_type: S1, general_assembly: 99th General Assembly, session_of_general_assembly: 1st Special Session}

  - name: house_bills_take_their_source_url_from_the_first_action
    model: stg_mo_house__bills
    description: >
      A bill's source_url is the link on its first action in document order (action_index 1), not the last or
      any other, and only from its own session's file. A bill with no actions still gets a row, with no
      source_url. Picking another action or dropping bills without actions fails this test.
    given:
      - input: source('mo_house', 'xml_bills')
        format: sql
        rows: |
            select cast('251' as varchar) as session_code, cast('251-HB1.XML' as varchar) as file_name, cast('HB1' as varchar) as bill, cast('HB 1' as varchar) as current_bill_string, cast('Short' as varchar) as short_title, cast('Long' as varchar) as long_title, cast('02/19/2025 - Introduced' as varchar) as last_action, cast('2025-08-28' as date) as proposed_effective_date union all
            select '251', '251-HB2.XML', 'HB2', 'HB 2', null, null, null, null
      - input: source('mo_house', 'xml_bill_actions')
        format: sql
        rows: |
            select cast('251' as varchar) as session_code, cast('251-HB1.XML' as varchar) as file_name, cast(2 as bigint) as action_index, cast('http://x/second' as varchar) as link union all
            select '251', '251-HB1.XML', 1, 'http://x/first' union all
            select '241', '251-HB1.XML', 1, 'http://x/other-session'
    expect:
      rows:
        - {session_code: '251', session_year: 2025, bill: HB1, current_bill_string: HB 1, short_title: Short, long_title: Long, last_action: 02/19/2025 - Introduced, proposed_effective_date: 2025-08-28, source_url: http://x/first}
        - {session_code: '251', session_year: 2025, bill: HB2, current_bill_string: HB 2, short_title: null, long_title: null, last_action: null, proposed_effective_date: null, source_url: null}

  - name: house_bill_rollcalls_are_the_text_version_votes_only
    model: stg_mo_house__bill_rollcalls
    description: >
      Roll calls listed under a bill text version (parent_kind text) become bill roll calls, named for the text
      version voted on; roll calls under an amendment are not bill roll calls. A roll call is matched to its bill
      by session and file, so the same file name in another session does not bleed in. Dropping the parent_kind
      filter or joining on file name alone fails this test.
    given:
      - input: source('mo_house', 'xml_bills')
        format: sql
        rows: |
            select cast('251' as varchar) as session_code, cast('251-HB1.XML' as varchar) as file_name, cast('HB1' as varchar) as bill
      - input: source('mo_house', 'xml_bill_rollcalls')
        format: sql
        rows: |
            select cast('251' as varchar) as session_code, cast('251-HB1.XML' as varchar) as file_name, cast('text' as varchar) as parent_kind, cast('Perfected' as varchar) as parent_name, cast('http://x/048.007.pdf' as varchar) as rollcall_pdf union all
            select '251', '251-HB1.XML', 'amendment', 'HA 1', 'http://x/050.001.pdf' union all
            select '241', '251-HB1.XML', 'text', 'Perfected', 'http://x/other-session.pdf'
    expect:
      rows:
        - {session_code: '251', bill: HB1, bill_version: Perfected, rollcall_url: http://x/048.007.pdf}

  - name: house_committee_members_join_their_committee_within_the_session_file
    model: stg_mo_house__committee_list_members
    description: >
      Each committee member row takes the committee's name from its own session's COMMITTEELIST (the same
      committee ID is reused across sessions), trims the name and position, and a committee with no members
      yields no rows. Joining on committee ID alone, which duplicates members across sessions, fails this test.
    given:
      - input: source('mo_house', 'xml_committees')
        format: sql
        rows: |
            select cast('251' as varchar) as session_code, cast('251-COMMITTEELIST.XML' as varchar) as file_name, cast('3029' as varchar) as committee_id, cast(' Accounts ' as varchar) as name union all
            select '251', '251-COMMITTEELIST.XML', '9', 'Empty' union all
            select '241', '241-COMMITTEELIST.XML', '3029', 'Old name'
      - input: source('mo_house', 'xml_committee_members')
        format: sql
        rows: |
            select cast('251' as varchar) as session_code, cast('251-COMMITTEELIST.XML' as varchar) as file_name, cast('3029' as varchar) as committee_id, cast('Peggy McGaugh' as varchar) as member_name, cast(7 as bigint) as member_district, cast(' Chair ' as varchar) as position_name, cast('H' as varchar) as chamber
      - input: source('mo_house', 'xml_files')
        format: sql
        rows: |
            select cast('251' as varchar) as session_code, cast('251-COMMITTEELIST.XML' as varchar) as file_name, cast('https://documents.house.mo.gov/xml/251.zip#251-CommitteeList.xml' as varchar) as source_url union all
            select '241', '241-COMMITTEELIST.XML', 'https://documents.house.mo.gov/xml/241.zip#241-CommitteeList.xml'
    expect:
      rows:
        - {session_code: '251', session_year: 2025, committee_id: '3029', committee_name: Accounts, member_name: Peggy McGaugh, district_number: 7, position_name: Chair, chamber: H, source_url: 'https://documents.house.mo.gov/xml/251.zip'}

  - name: house_member_committees_carry_the_file_they_came_from
    model: stg_mo_house__member_committees
    description: >
      A member page's committee rows take the source URL of that member's own file, joined on session and file
      name (the same file name in another session does not bleed in), with the zip's "#member file" fragment
      dropped and an open session's own file URL left as is. Joining on file name alone, or keeping the fragment,
      fails this test.
    given:
      - input: source('mo_house', 'xml_members')
        format: sql
        rows: |
            select cast('201' as varchar) as session_code, cast('201-001.XML' as varchar) as file_name, cast('https://images.house.mo.gov/MemberPhoto.aspx?id=11' as varchar) as photo_link union all
            select '261', '261-001.XML', 'https://images.house.mo.gov/MemberPhoto.aspx?id=22'
      - input: source('mo_house', 'xml_member_committees')
        format: sql
        rows: |
            select cast('201' as varchar) as session_code, cast('201-001.XML' as varchar) as file_name, cast(' Budget ' as varchar) as committee_name, cast(' Chair ' as varchar) as committee_position union all
            select '261', '261-001.XML', 'Rules', 'Member'
      - input: source('mo_house', 'xml_files')
        format: sql
        rows: |
            select cast('201' as varchar) as session_code, cast('201-001.XML' as varchar) as file_name, cast('https://documents.house.mo.gov/xml/201.zip#201/201-001.xml' as varchar) as source_url union all
            select '261', '261-001.XML', 'https://documents.house.mo.gov/xml/261-001.xml' union all
            select '261', '201-001.XML', 'https://wrong.example/bleed'
    expect:
      rows:
        - {session_code: '201', session_year: 2020, house_member_id: '11', committee_name: Budget, position_name: Chair, source_url: 'https://documents.house.mo.gov/xml/201.zip'}
        - {session_code: '261', session_year: 2026, house_member_id: '22', committee_name: Rules, position_name: Member, source_url: 'https://documents.house.mo.gov/xml/261-001.xml'}

  - name: senate_act_list_stages_every_senate_bill
    model: stg_mo_house__bill_actions
    description: >
      House bill actions come from the bill's own file (joined by session and file name, so the same file name in
      another session does not bleed in); Senate bills that reached the House come from the SenateActList actions,
      one row per bill and action. Every Senate bill must be staged, not just the first, and an action repeated
      word for word under one Guid is kept once, on the House side (HB1) and the Senate side (SB834). Dropping
      the Senate union, joining on file name alone, or removing distinct from either branch fails this test.
    given:
      - input: source('mo_house', 'xml_bills')
        format: sql
        rows: |
            select cast('261' as varchar) as session_code, cast('261-HB1.XML' as varchar) as file_name, cast('HB1' as varchar) as bill union all
            select '261', '261-HB2.XML', 'HB2'
      - input: source('mo_house', 'xml_bill_actions')
        format: sql
        rows: |
            select cast('261' as varchar) as session_code, cast('261-HB1.XML' as varchar) as file_name, cast('1' as varchar) as guid, cast('Referred: General Laws(H)' as varchar) as description, cast(1 as bigint) as activity_sequence, cast('2026-01-10' as date) as pub_date union all
            select '261', '261-HB1.XML', '1', 'Referred: General Laws(H)', 1, cast('2026-01-10' as date) union all
            select '261', '261-HB2.XML', '4', 'Reported Do Pass (H)', 1, cast('2026-02-01' as date) union all
            select '251', '261-HB1.XML', '9', 'Other session', 1, cast('2025-01-10' as date)
      - input: source('mo_house', 'xml_senate_act_actions')
        format: sql
        rows: |
            select cast('261' as varchar) as session_code, cast('SB834' as varchar) as bill, cast('2' as varchar) as guid, cast('Reported to the House and First Read (H)' as varchar) as description, cast(1 as bigint) as activity_sequence, cast('2026-03-25' as date) as pub_date union all
            select '261', 'SB834', '2', 'Reported to the House and First Read (H)', 1, cast('2026-03-25' as date) union all
            select '261', 'SB999', '3', 'Truly Agreed To and Finally Passed', 2, cast('2026-05-14' as date)
    expect:
      rows:
        - {session_code: '261', bill: HB1, listed_in: house_bill_list, action_seq: 1, action_date: 2026-01-10, description: 'Referred: General Laws(H)', action_guid: '1'}
        - {session_code: '261', bill: HB2, listed_in: house_bill_list, action_seq: 1, action_date: 2026-02-01, description: 'Reported Do Pass (H)', action_guid: '4'}
        - {session_code: '261', bill: SB834, listed_in: senate_act_list, action_seq: 1, action_date: 2026-03-25, description: 'Reported to the House and First Read (H)', action_guid: '2'}
        - {session_code: '261', bill: SB999, listed_in: senate_act_list, action_seq: 2, action_date: 2026-05-14, description: 'Truly Agreed To and Finally Passed', action_guid: '3'}

  - name: senate_act_bills_take_their_link_from_the_first_listed_action
    model: stg_mo_house__senate_act_bills
    description: >
      The SenateActList has no bill-page link of its own; the first action of each Senate bill (action_index 1)
      carries it, as for House bills. SB1 has two actions and takes the first's link, not the second's; SB2 has
      the same bill name in another session and does not take that session's link; SB3 has no action and gets a
      null link instead of dropping out. Taking the last action, joining on bill alone or an inner join fails this
      test.
    given:
      - input: source('mo_house', 'xml_senate_act_bills')
        format: sql
        rows: |
            select cast('253' as varchar) as session_code, cast('SB1' as varchar) as bill, cast('SS SB 1' as varchar) as current_bill_string, cast('T1' as varchar) as short_title, cast(null as varchar) as long_title, cast(null as varchar) as last_action, cast(null as date) as proposed_effective_date, cast('Hough' as varchar) as sponsor_name union all
            select '251', 'SB2', 'SB 2', 'T2', null, null, null, 'Y' union all
            select '253', 'SB3', 'SB 3', 'T3', null, null, null, 'Z'
      - input: source('mo_house', 'xml_senate_act_actions')
        format: sql
        rows: |
            select cast('253' as varchar) as session_code, cast('SB1' as varchar) as bill, cast(2 as bigint) as action_index, cast('http://house/sb1-second' as varchar) as link union all
            select '253', 'SB1', 1, 'http://house/sb1-first' union all
            select '251', 'SB2', 1, 'http://house/251-sb2' union all
            select '253', 'SB2', 1, 'http://house/253-sb2-other-session'
    expect:
      rows:
        - {session_code: '253', session_year: 2025, bill: SB1, current_bill_string: SS SB 1, short_title: T1, long_title: null, last_action: null, proposed_effective_date: null, sponsor_name: Hough, source_url: 'http://house/sb1-first'}
        - {session_code: '251', session_year: 2025, bill: SB2, current_bill_string: SB 2, short_title: T2, long_title: null, last_action: null, proposed_effective_date: null, sponsor_name: Y, source_url: 'http://house/251-sb2'}
        - {session_code: '253', session_year: 2025, bill: SB3, current_bill_string: SB 3, short_title: T3, long_title: null, last_action: null, proposed_effective_date: null, sponsor_name: Z, source_url: null}

  - name: house_rollcalls_dated_outside_their_sessions_year_are_dropped
    model: stg_mo_house__rollcalls
    description: >
      The House leaves the previous session's roll-call PDFs in a session's rollcalls directory (bills171 holds
      2016 PDFs numbered by 2016 session day, #430). A roll call whose date year differs from the year in its
      session code (171 = 2017) is dropped; one in its own year stays, as does one whose date didn't parse, and
      so does a special session (173) dated in its year. Keeping the 2016 PDF, or comparing against the wrong
      year (a 181 roll call dated 2017), fails this test.
    given:
      - input: source('mo_house', 'rollcalls')
        format: sql
        rows: |
            select cast('{"url": "u1", "session_code": "171", "session_day": "35", "rollcall_number": "8", "vote_date": "3/2/2017"}' as varchar) as payload union all
            select '{"url": "u2", "session_code": "171", "session_day": "35", "rollcall_number": "9", "vote_date": "3/8/2016"}' union all
            select '{"url": "u3", "session_code": "171", "session_day": "35", "rollcall_number": "10"}' union all
            select '{"url": "u4", "session_code": "173", "session_day": "1", "rollcall_number": "1", "vote_date": "9/12/2017"}' union all
            select '{"url": "u5", "session_code": "181", "session_day": "1", "rollcall_number": "1", "vote_date": "1/4/2017"}' union all
            select '{"url": "u6", "session_code": "171", "session_day": "2", "rollcall_number": "1", "vote_date": "1/5/2017", "error": "not a pdf"}'
      - input: source('mo_house', 'rollcall_votes')
        format: sql
        rows: |
            select cast(null as varchar) as payload where 1 = 0
    expect:
      rows:
        - {rollcall_url: u1, session_code: '171', session_day: 35, rollcall_number: 8, vote_date: '2017-03-02'}
        - {rollcall_url: u3, session_code: '171', session_day: 35, rollcall_number: 10, vote_date: null}
        - {rollcall_url: u4, session_code: '173', session_day: 1, rollcall_number: 1, vote_date: '2017-09-12'}

  - name: house_witness_forms_keep_links_only_for_house_and_senate_act_bills
    model: stg_mo_house__bill_witness_forms
    description: >
      Only witness rows that carry a link become witness forms: an empty Witness element (both columns null, as
      the parser used to land them) is dropped. A House bill's rows are matched to the bill by session and file,
      so the same file name in another session does not bleed in; a Senate bill the House acted on comes in
      through the SenateActList table under its own bill name. Keeping the empty rows, or reading only one of
      the two tables, fails this test.
    given:
      - input: source('mo_house', 'xml_bills')
        format: sql
        rows: |
            select cast('251' as varchar) as session_code, cast('251-HB1.XML' as varchar) as file_name, cast('HB1' as varchar) as bill
      - input: source('mo_house', 'xml_bill_witnesses')
        format: sql
        rows: |
            select cast('251' as varchar) as session_code, cast('251-HB1.XML' as varchar) as file_name, cast(1 as bigint) as witness_index, cast('https://documents.house.mo.gov/w/HB1Testimony.pdf' as varchar) as witness_forms_link, cast('Testimony' as varchar) as witness_form_link_description union all
            select '251', '251-HB1.XML', 2, null, null union all
            select '241', '251-HB1.XML', 1, 'https://x/other-session', null
      - input: source('mo_house', 'xml_senate_act_witnesses')
        format: sql
        rows: |
            select cast('251' as varchar) as session_code, cast('SB7' as varchar) as bill, cast(1 as bigint) as witness_index, cast('https://documents.house.mo.gov/w/SB7.pdf' as varchar) as witness_forms_link, cast(null as varchar) as witness_form_link_description
    expect:
      rows:
        - {session_code: '251', bill: HB1, witness_index: 1, witness_forms_url: 'https://documents.house.mo.gov/w/HB1Testimony.pdf', description: Testimony}
        - {session_code: '251', bill: SB7, witness_index: 1, witness_forms_url: 'https://documents.house.mo.gov/w/SB7.pdf', description: null}

  - name: house_bill_hearings_join_bills_split_time_and_redact_contact_strings
    model: stg_mo_house__bill_hearings
    description: >
      A House bill's hearing rows are matched to the bill by session and file (the same file name in another session
      does not bleed in) and a Senate bill comes in through the SenateActList table under its own bill name. A bill
      heard twice keeps both rows. notice_time is stored as 1900-01-01THH:MM:SS: the clock time becomes HH:MM, and
      midnight with the free-text alt_time given becomes null; midnight with no alt_time stays 00:00. An email
      address or phone number in a comment or location is replaced by a marker and the rest of the text is kept
      (a sentence-ending dot after an address stays); phones may be 3-3-4 digits with or without separators and
      parentheses, a leading +1, a trailing extension, or the 7-digit Capitol form 751-6662; year ranges, dates, RSMo
      section numbers, amounts and times are not phones; text with neither is unchanged. Reading only one table,
      taking midnight as a time, dropping the whole comment, or keeping a contact string fails this test.
    given:
      - input: source('mo_house', 'xml_bills')
        format: sql
        rows: |
            select cast('251' as varchar) as session_code, cast('251-HB1.XML' as varchar) as file_name, cast('HB1' as varchar) as bill
      - input: source('mo_house', 'xml_bill_hearings')
        format: sql
        rows: |
            select cast('251' as varchar) as session_code, cast('251-HB1.XML' as varchar) as file_name, cast(1 as bigint) as hearing_index, cast('Judiciary' as varchar) as committee_name, cast('2025-02-04' as date) as notice_date, cast('1900-01-01T08:15:00' as varchar) as notice_time, cast(null as varchar) as alt_time, cast('House Hearing Room 1' as varchar) as location, cast('Time change.' as varchar) as comments union all
            select '251', '251-HB1.XML', 2, 'Fiscal Review', '2025-02-11', '1900-01-01T00:00:00', '4:30 PM or upon adjournment', 'House Hearing Room 5', 'Ask bob.smith@house.mo.gov. Call (573) 751-1167 or 573-751-1168 or 573.751.1169 for the substitute' union all
            select '251', '251-HB1.XML', 3, 'Rules', '2025-02-12', '1900-01-01T00:00:00', null, 'Room 5 (573) 751-1170', 'Dated 2025-02-12 and 1234 Main St' union all
            select '251', '251-HB1.XML', 4, 'Ways and Means', '2025-02-13', '1900-01-01T10:00:00', null, 'Room 5 call 5737511167', 'Notify my office at 751-6662 or (573)751-1167 or +1 573-751-1168 ext. 12 or 573.751.1169 x4. Sessions 2001-2013 and 3001-3013 met 2/13/19 and 1-23-17 per RSMo 135.1150 and 610.021(10) for $1,000 in room 110 at 10:30' union all
            select '241', '251-HB1.XML', 1, 'Other session', '2024-02-04', '1900-01-01T09:00:00', null, null, null
      - input: source('mo_house', 'xml_senate_act_hearings')
        format: sql
        rows: |
            select cast('251' as varchar) as session_code, cast('251-SENATEACTLIST.XML' as varchar) as file_name, cast(1 as bigint) as hearing_index, cast('Rules - Regulatory Oversight' as varchar) as committee_name, cast('2025-03-05' as date) as notice_date, cast('1900-01-01T14:00:00' as varchar) as notice_time, cast(null as varchar) as alt_time, cast('House Hearing Room 5' as varchar) as location, cast(null as varchar) as comments, cast('SB7' as varchar) as bill
    expect:
      rows:
        - {session_code: '251', session_year: 2025, bill: HB1, hearing_index: 1, committee_name: Judiciary, hearing_date: '2025-02-04', hearing_time: '08:15', hearing_time_note: null, location: House Hearing Room 1, comments: Time change.}
        - {session_code: '251', session_year: 2025, bill: HB1, hearing_index: 2, committee_name: Fiscal Review, hearing_date: '2025-02-11', hearing_time: null, hearing_time_note: 4:30 PM or upon adjournment, location: House Hearing Room 5, comments: 'Ask [email removed]. Call [phone removed] or [phone removed] or [phone removed] for the substitute'}
        - {session_code: '251', session_year: 2025, bill: HB1, hearing_index: 3, committee_name: Rules, hearing_date: '2025-02-12', hearing_time: '00:00', hearing_time_note: null, location: 'Room 5 [phone removed]', comments: Dated 2025-02-12 and 1234 Main St}
        - {session_code: '251', session_year: 2025, bill: HB1, hearing_index: 4, committee_name: Ways and Means, hearing_date: '2025-02-13', hearing_time: '10:00', hearing_time_note: null, location: 'Room 5 call [phone removed]', comments: 'Notify my office at [phone removed] or [phone removed] or [phone removed] or [phone removed]. Sessions 2001-2013 and 3001-3013 met 2/13/19 and 1-23-17 per RSMo 135.1150 and 610.021(10) for $1,000 in room 110 at 10:30'}
        - {session_code: '251', session_year: 2025, bill: SB7, hearing_index: 1, committee_name: Rules - Regulatory Oversight, hearing_date: '2025-03-05', hearing_time: '14:00', hearing_time_note: null, location: House Hearing Room 5, comments: null}

  - name: house_rollcalls_whose_header_names_another_session_are_dropped
    model: stg_mo_house__rollcalls
    description: >
      The PDF header prints the General Assembly and a session label (#435). A regular session (code ending 1)
      must print its own General Assembly and FIRST (odd year) or SECOND (even year) REGULAR SESSION; any other
      session must print its General Assembly and an EXTRAORDINARY or SPECIAL label, whose ordinal is not
      compared (173 prints SPECIAL, 184 prints FIRST EXTRAORDINARY). The five misfiled PDFs of the issue are
      the "drop" rows (171 SPECIAL, 201 FIRST EXTRAORDINARY, 204 SECOND REGULAR); the wrong General Assembly
      and the wrong regular ordinal are dropped too. A row with no header text is kept. A label that is not recognised ("VETO SESSION") is kept too, under a regular (201) or a non-regular (204) session code, so the
      accepted_values test on header_session_label fails loudly instead of rows vanishing. Ignoring the
      General Assembly, ignoring the label, or comparing the extraordinary ordinal fails this test.
    given:
      - input: source('mo_house', 'rollcalls')
        format: sql
        rows: |
            select cast('{"url": "keep_171", "session_code": "171", "session_day": "1", "rollcall_number": "1", "vote_date": "1/4/2017", "text": "UNOFFICIAL COPY 99th General Assembly\n   FIRST REGULAR SESSION\n State of Missouri"}' as varchar) as payload union all
