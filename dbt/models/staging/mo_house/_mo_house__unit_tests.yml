  - name: house_rollcalls_published_twice_under_one_key_keep_one_pdf
    model: stg_mo_house__rollcalls
    description: >
      The House published some roll calls twice under different file names (261: 003.001 = 003.002, 004.002 =
      004.004, #435), so (session, day, roll-call number) repeats. One PDF per key stays: the one whose file name
      carries the roll-call number, else the first by URL. A roll call with no roll-call number is never merged
      with another. Keeping both copies (double-counted votes), or keeping the later file name, fails this test.
    given:
      - input: source('mo_house', 'rollcalls')
        format: sql
        rows: |
            select cast('{"url": "https://x/bills261/rollcalls/003.002.pdf", "session_code": "261", "session_day": "3", "rollcall_number": "1", "vote_date": "1/12/2026"}' as varchar) as payload union all
            select '{"url": "https://x/bills261/rollcalls/003.001.pdf", "session_code": "261", "session_day": "3", "rollcall_number": "1", "vote_date": "1/12/2026"}' union all
            select '{"url": "https://x/bills261/rollcalls/004.004.pdf", "session_code": "261", "session_day": "4", "rollcall_number": "2", "vote_date": "1/13/2026"}' union all
            select '{"url": "https://x/bills261/rollcalls/004.002.pdf", "session_code": "261", "session_day": "4", "rollcall_number": "2", "vote_date": "1/13/2026"}' union all
            select '{"url": "https://x/bills261/rollcalls/005.009.pdf", "session_code": "261", "session_day": "5", "rollcall_number": "7", "vote_date": "1/14/2026"}' union all
            select '{"url": "https://x/bills261/rollcalls/005.008.pdf", "session_code": "261", "session_day": "5", "rollcall_number": "7", "vote_date": "1/14/2026"}' union all
            select '{"url": "https://x/bills261/rollcalls/006.001.pdf", "session_code": "261", "session_day": "6", "vote_date": "1/15/2026"}' union all
            select '{"url": "https://x/bills261/rollcalls/006.002.pdf", "session_code": "261", "session_day": "6", "vote_date": "1/15/2026"}' union all
            select '{"url": "https://x/bills261/rollcalls/007.001.pdf", "session_code": "261", "session_day": "7", "rollcall_number": "1", "vote_date": "1/16/2026"}' union all
            select '{"url": "https://x/bills251/rollcalls/007.001.pdf", "session_code": "251", "session_day": "7", "rollcall_number": "1", "vote_date": "1/16/2025"}'
      - input: source('mo_house', 'rollcall_votes')
        format: sql
        rows: |
            select cast(null as varchar) as payload where 1 = 0
    expect:
      rows:
        - {rollcall_url: https://x/bills261/rollcalls/003.001.pdf, session_code: '261', session_day: 3, rollcall_number: 1}
        - {rollcall_url: https://x/bills261/rollcalls/004.002.pdf, session_code: '261', session_day: 4, rollcall_number: 2}
        - {rollcall_url: https://x/bills261/rollcalls/005.008.pdf, session_code: '261', session_day: 5, rollcall_number: 7}
        - {rollcall_url: https://x/bills261/rollcalls/006.001.pdf, session_code: '261', session_day: 6, rollcall_number: null}
        - {rollcall_url: https://x/bills261/rollcalls/006.002.pdf, session_code: '261', session_day: 6, rollcall_number: null}
        - {rollcall_url: https://x/bills261/rollcalls/007.001.pdf, session_code: '261', session_day: 7, rollcall_number: 1}
        - {rollcall_url: https://x/bills251/rollcalls/007.001.pdf, session_code: '251', session_day: 7, rollcall_number: 1}

  - name: house_rollcalls_where_hardly_anyone_voted_are_voting_board_tests
    model: stg_mo_house__rollcalls
    description: >
      A roll call on which fewer than a quarter of the listed members cast a vote (house_rollcall_min_participation,
      #449) is a voting-board test record and is dropped (231 026.003 had 7 voters of 163, 173 002.001 had 1). Exactly a quarter
      (1 of 4) stays, a roll call where nobody voted goes, and a roll call with no parsed vote rows at all stays
      (its votes were not loaded, which says nothing about turnout). Counting absent ('@') members as voters,
      using a strict instead of an inclusive threshold, or dropping rows with no votes fails this test.
    given:
      - input: source('mo_house', 'rollcalls')
        format: sql
        rows: |
            select cast('{"url": "keep_all", "session_code": "231", "session_day": "1", "rollcall_number": "1", "vote_date": "2/21/2023"}' as varchar) as payload union all
            select '{"url": "keep_exact_quarter", "session_code": "231", "session_day": "2", "rollcall_number": "1", "vote_date": "2/21/2023"}' union all
            select '{"url": "drop_under_quarter", "session_code": "231", "session_day": "3", "rollcall_number": "1", "vote_date": "2/21/2023"}' union all
            select '{"url": "drop_nobody", "session_code": "231", "session_day": "4", "rollcall_number": "1", "vote_date": "2/21/2023"}' union all
            select '{"url": "keep_no_votes_rows", "session_code": "231", "session_day": "5", "rollcall_number": "1", "vote_date": "2/21/2023"}'
      - input: source('mo_house', 'rollcall_votes')
        format: sql
        rows: |
            select cast('{"url": "keep_all", "vote_code": "Y"}' as varchar) as payload union all
            select '{"url": "keep_all", "vote_code": "Y"}' union all
            select '{"url": "keep_all", "vote_code": "N"}' union all
            select '{"url": "keep_all", "vote_code": "P"}' union all
            select '{"url": "keep_exact_quarter", "vote_code": "Y"}' union all
            select '{"url": "keep_exact_quarter", "vote_code": "@"}' union all
            select '{"url": "keep_exact_quarter", "vote_code": "@"}' union all
            select '{"url": "keep_exact_quarter", "vote_code": "@"}' union all
            select '{"url": "drop_under_quarter", "vote_code": "Y"}' union all
            select '{"url": "drop_under_quarter", "vote_code": "@"}' union all
            select '{"url": "drop_under_quarter", "vote_code": "@"}' union all
            select '{"url": "drop_under_quarter", "vote_code": "@"}' union all
            select '{"url": "drop_under_quarter", "vote_code": "@"}' union all
            select '{"url": "drop_nobody", "vote_code": "@"}' union all
            select '{"url": "drop_nobody", "vote_code": "@"}' union all
            select '{"url": "drop_nobody", "vote_code": "@"}' union all
            select '{"url": "drop_nobody", "vote_code": "@"}'
    expect:
      rows:
        - {rollcall_url: keep_all, members_listed: 4, members_voting: 4}
        - {rollcall_url: keep_exact_quarter, members_listed: 4, members_voting: 1}
        - {rollcall_url: keep_no_votes_rows, members_listed: null, members_voting: null}

  - name: house_document_texts_drop_control_characters_and_flag_blank_or_failed_documents
    model: stg_mo_house__document_texts
    description: >
      A small-caps heading extracts with NUL characters ("B" NUL "ILL"): the NULs and other control characters are
      removed while tabs and line feeds stay, and text_length counts the cleaned text. A PDF of scanned images has
      pages but only whitespace: has_text false. A failed fetch keeps its row with the error, no text and a zero
      length. The URL is trimmed to join the links, the bill comes from the House XML row of the first link (null
      when that is a Senate act list file), and the state row adds the HTTP status. Leaving the NULs in, treating
      whitespace as text, or dropping failed rows fails this test.
    given:
      - input: source('mo_house', 'pdf_texts')
        format: sql
        rows: |
            select cast(' https://documents.house.mo.gov/t/1.pdf ' as varchar) as url, cast('bill_text' as varchar) as kind, cast('251' as varchar) as session_code, cast('251-HB1.XML' as varchar) as file_name, cast('1234H.01I' as varchar) as lr_number, cast('I' as varchar) as version_code, cast(1 as bigint) as n_links, cast(2 as bigint) as page_count, cast('B' || chr(0) || 'ILL' || chr(1) || chr(10) || 'AN ACT' || chr(9) || 'to repeal' as varchar) as text, cast(null as varchar) as error union all
            select 'https://documents.house.mo.gov/s/scan.pdf', 'summary', '251', '251-HB1.XML', null, null, 2, 3, ' ' || chr(10) || ' ' || chr(10), null union all
            select 'https://documents.house.mo.gov/a/bad.pdf', 'amendment', '251', '251-SENATEACTLIST.XML', null, null, 1, null, null, 'not a PDF'
      - input: source('mo_house', 'pdf_files')
        format: sql
        rows: |
            select cast('https://documents.house.mo.gov/t/1.pdf' as varchar) as url, cast(200 as bigint) as http_status, cast(5000 as bigint) as size_bytes union all
            select 'https://documents.house.mo.gov/s/scan.pdf', 200, 800 union all
            select 'https://documents.house.mo.gov/a/bad.pdf', 200, null
      - input: source('mo_house', 'xml_bills')
        format: sql
        rows: |
            select cast('251' as varchar) as session_code, cast('251-HB1.XML' as varchar) as file_name, cast('HB1' as varchar) as bill
    expect:
      format: sql
      rows: |
          select cast('https://documents.house.mo.gov/t/1.pdf' as varchar) as document_url, cast('bill_text' as varchar) as document_kind, cast('251' as varchar) as session_code, cast('HB1' as varchar) as bill, cast('1234H.01I' as varchar) as lr_number, cast('I' as varchar) as version_code, cast(1 as bigint) as n_links, cast(2 as bigint) as page_count, cast('BILL' || chr(10) || 'AN ACT' || chr(9) || 'to repeal' as varchar) as document_text, cast(21 as bigint) as text_length, cast(true as boolean) as has_text, cast(null as varchar) as fetch_error, cast(200 as bigint) as http_status, cast(5000 as bigint) as size_bytes union all
          select 'https://documents.house.mo.gov/s/scan.pdf', 'summary', '251', 'HB1', null, null, 2, 3, ' ' || chr(10) || ' ' || chr(10), 4, false, null, 200, 800 union all
          select 'https://documents.house.mo.gov/a/bad.pdf', 'amendment', '251', null, null, null, 1, null, null, 0, false, 'not a PDF', 200, null
