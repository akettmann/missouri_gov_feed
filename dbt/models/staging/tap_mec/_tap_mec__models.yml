# Generated from each model's header comment (+ grain for intermediate models); edit the SQL header,
# not this file, then regenerate.
version: 2
models:
- name: stg_tap_mec__contributions
  description: 'MEC itemized contributions received by Missouri committees (TAP mirror, 2011-2022). The mirror combines
    two MEC export layouts; coalesce the overlapping columns. dupe_flag marks rows TAP identified as duplicates
    (amended reports) and they''re dropped. The second layout (2020-2022) has no ctrb_name / ctrb_type: a committee
    donor is named in `committee`, an organization in `company`, a person in first/last name (blank strings, not
    nulls, when absent). Placeholder donor names (#31): ~10k rows carry a one-character ctrb_name / committee (''C'',
    ''~'', ''0'', ''-'', ''x'', ''_''), almost all with a person''s first/last name (federal-committee filings transferred
    to MEC). A name shorter than 2 characters is treated as missing, so the name falls back to the person''s name
    and the row is typed Individual. With no person''s name either, the name stays null and the reported type is
    kept. The first/last name columns carry the same fillers (''~'' / ''~'', ''-'' / ''-'', ''?'', ''.''): a part
    with no letter or number is dropped before the person''s name is built (not "shorter than 2": real initials
    like ''R'' or ''J'' stay). Rows whose ctrb_name and both name parts are all ''~'' / ''-'' hold the real donor
    in `company`, so they fall through to it and keep the reported type (Committee) instead of becoming an Individual
    named ''~ ~''.'
- name: stg_tap_mec__expenditures
  description: 'MEC itemized expenditures by Missouri committees (TAP mirror, 2011-2022): includes contributions
    the committee made to other candidates and committees.'
- name: stg_tap_mec__lobbyist_gifts
  description: MEC lobbyist expenditures on public officials (meals, gifts, travel...), TAP mirror 2004-2022. recipient_name
    is "LAST, FIRST"; group expenditures (e.g. "ENTIRE SENATE") have no individual name.
