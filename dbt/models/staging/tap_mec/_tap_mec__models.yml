# Generated from each model's header comment (+ grain for intermediate models); edit the SQL header,
# not this file, then regenerate.
version: 2
models:
- name: stg_tap_mec__contributions
  description: 'MEC itemized contributions received by Missouri committees (TAP mirror, 2011-2022). The mirror combines
    two MEC export layouts; coalesce the overlapping columns. dupe_flag marks rows TAP identified as duplicates
    (amended reports) and they''re dropped. The second layout (2020-2022) has no ctrb_name / ctrb_type: a committee
    donor is named in `committee`, an organization in `company`, a person in first/last name (blank strings, not
    nulls, when absent). Placeholder donor names (#31): ~10k rows carry a one-character ctrb_name / committee (''C'',
    ''~'', ''0'', ''-'', ''x'', ''_''), almost all with a person''s first/last name (federal-committee filings transferred
    to MEC). A name shorter than 2 characters is treated as missing, so the name falls back to the person''s name
    and the row is typed Individual. With no person''s name either, the name stays null and the reported type is
    kept. The first/last name columns carry the same fillers (''~'' / ''~'', ''-'' / ''-'', ''?'', ''.''): a part
    with no letter or number is dropped before the person''s name is built (not "shorter than 2": real initials
    like ''R'' or ''J'' stay). Rows whose ctrb_name and both name parts are all ''~'' / ''-'' hold the real donor
    in `company`, so they fall through to it and keep the reported type (Committee) instead of becoming an Individual
    named ''~ ~''. Shifted rows (#60): 3.6k rows of one committee have the columns shifted (first_name holds a numeric
    record ID, last_name the donor''s first name, address_1 the surname). A name part that is all digits is not
    a name, and when first_name is all digits the remaining parts are shifted too, so no person''s name is built
    from the row: the name stays null (a one-character company is ignored too) and the reported type is kept. Un-shifting
    (#60), only for rows matching a precise signature (the rest are left as reported): * first_name all digits,
    last_name a name, address_1 a name, no usable ctrb_name / committee / company (C180576 Enterprise Holdings PAC,
    3,619 rows; one C000593 row with a one-digit ID): the person is last_name || '' '' || address_1 (first name,
    surname), typed Individual. * last_name is the filler ''0'', first_name a name, address_1 a digit-free name
    (C000593, 51 rows, ctrb_name ''KERRY 0''): the person is first_name || '' '' || address_1, typed Individual.
    * an Individual ctrb_name ''FIRST LAST 0'' whose last_name also ends '' 0'' (3 rows): the trailing '' 0'' is
    dropped. * a Corporation whose ctrb_name and company are placeholders, last_name is blank and first_name is
    a multi-word name (C000642 / C081050, 8 rows): the organization sits in first_name; the name is kept and the
    reported type stays Corporation rather than becoming Individual. Not handled (left as reported): addresses typed
    into ctrb_name, and surnames repeated in first_name. The model exposes no address columns, so only name and
    type are repaired. Identity and double loading (#82, #75, #83): record_id is the source row''s own id, txn in
    the older export layout or cd1_a_id in the 2020-2022 layout. The two TAP files overlap for 2020 and share one
    MEC id space: all 19,231 ids present as both a txn and a cd1_a_id are the same record (same committee, date,
    amount, address), so the id is not prefixed with its layout. TAP also loaded 97.5k transactions twice (same
    id, same file; only address_clean differs, because TAP doubled the address), which counted ~$179M twice. One
    row per record_id is kept, preferring the newer layout (cd1_a_id, no txn) when an id is in both (the shared
    columns are identical; the older layout''s only extras are ctrb_name / ctrb_type), then the copy whose address_clean
    is not doubled (the shorter one). Cross-layout near-duplicates (#99): 290 person and 107 organization gifts
    (about $5.2M) appear once in each layout under different ids (an amended report re-filed in the 2020-2022 export).
    Same committee, date, amount and donor (first + last name, else company / committee / ctrb_name, upper-cased
    and trimmed), one older-layout row (txn) against one newer-layout row (cd1_a_id): the older row is dropped.
    Matching is one-to-one: rows sharing that key are numbered within each layout (by record_id) and the nth older
    row is dropped only if the newer layout has an nth row, so a donor who gave the same amount twice in a day in
    ONE layout keeps both gifts, and a pair with a different amount, date, committee or donor is never matched.
    Only 2 of 397 matched keys are not 1:1 (2 older rows, 1 newer; the extra older row is kept).'
  columns:
  - name: record_id
    description: 'The source row''s own id (`txn`, or `cd1_a_id` in the 2020-2022 layout; one MEC id space). One
      row per id: TAP loaded some transactions twice and exports two layouts overlapping in 2020, and staging keeps
      one copy (#82, #83).'
    data_tests:
    - unique
    - not_null
- name: stg_tap_mec__expenditures
  description: 'MEC itemized expenditures by Missouri committees (TAP mirror, 2011-2022): includes contributions
    the committee made to other candidates and committees.'
  columns:
  - name: record_id
    description: The source row's own id (cd3_b_id).
    data_tests:
    - unique
    - not_null
- name: stg_tap_mec__lobbyist_gifts
  description: MEC lobbyist expenditures on public officials (meals, gifts, travel...), TAP mirror 2004-2022. recipient_name
    is "LAST, FIRST"; group expenditures (e.g. "ENTIRE SENATE") have no individual name.
