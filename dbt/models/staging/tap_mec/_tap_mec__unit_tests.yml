  - name: tap_contributions_unshift_rows
    model: stg_tap_mec__contributions
    description: >
      Shifted-column rows (#60) are un-shifted only on a precise signature. (1) All-digit first_name, name in
      last_name + address_1, nothing usable in ctrb_name / committee / company (Enterprise Holdings PAC, one-digit
      ID variant): first-name + surname, Individual. (2) last_name '0' with ctrb_name 'FIRST 0': first_name +
      address_1, Individual. (3) Individual 'FIRST LAST 0' with last_name 'LAST 0': drop the trailing ' 0'.
      (4) Placeholder ctrb_name and company, blank last_name, multi-word first_name (organization in
      first_name): name kept, type stays Corporation. Look-alikes stay as reported: an ID with a digit-bearing
      address_1, a real company next to a '0' first/last name, a single-word first_name under a Corporation
      placeholder, a ctrb_name that merely ends in a real ' 0' without the '0' last_name, a '0' last_name with a real ctrb_name
      (not ending ' 0'), an all-digit first_name with a real company and a blank ctrb_name, and a multi-word first_name under a placeholder ctrb_name with a real company (the company is checked too). Placeholders of two or more characters ('~~', '--') count as missing in the un-shift signature (ctrb_name, committee and company alike; #472) and are never the fallback company name; a one-character company does not make a row an Organization.
