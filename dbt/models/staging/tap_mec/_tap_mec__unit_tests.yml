  - name: tap_contributions_dedupe_double_loaded
    model: stg_tap_mec__contributions
    description: >
      TAP loaded some transactions twice (#82): the same txn, differing only in address_clean (TAP doubled the
      address). One row per record_id is kept. A cd1_a_id equal to a txn is a different record (the id is
      prefixed with its layout), and a dupe_flag TRUE row is still dropped.
    given:
      - input: source('tap_mec', 'contributions')
        format: sql
        rows: |
          select
              cast('C1' as varchar) as cmte_id,
              cast(null as varchar) as mecid,
              cast(null as varchar) as cmte_name,
              cast(null as varchar) as committee_name,
              cast('Dup PAC' as varchar) as ctrb_name,
              cast('Committee' as varchar) as ctrb_type,
              cast(null as varchar) as committee,
              cast(null as varchar) as company,
              cast(null as varchar) as first_name,
              cast(null as varchar) as last_name,
              cast(null as varchar) as address_1,
              cast(null as varchar) as employer,
              cast(null as varchar) as occupation,
              cast(null as varchar) as city_clean,
              cast(null as varchar) as city,
              cast(null as varchar) as state_clean,
              cast(null as varchar) as state,
              cast('100' as varchar) as amount,
              cast(null as varchar) as date,
              cast(null as varchar) as year,
              cast(null as varchar) as cont_type,
              cast(null as varchar) as contribution_type,
              cast(null as varchar) as rpt_type,
              cast(null as varchar) as report,
              cast('FALSE' as varchar) as dupe_flag,
              cast('1001' as varchar) as txn,
              cast(null as varchar) as cd1_a_id,
              cast('PO BOX 537 PO BOX 537' as varchar) as address_clean
          union all select 'C1', null, null, null, 'Dup PAC', 'Committee', null, null, null, null, null, null, null, null, null, null, null, '100', null, null, null, null, null, null, 'FALSE', '1001', null, 'PO BOX 537'
          union all select 'C1', null, null, null, 'Dup PAC', 'Committee', null, null, null, null, null, null, null, null, null, null, null, '7', null, null, null, null, null, null, 'FALSE', null, '1001', null
          union all select 'C1', null, null, null, 'Flagged PAC', 'Committee', null, null, null, null, null, null, null, null, null, null, null, '3', null, null, null, null, null, null, 'TRUE', '1002', null, null
    expect:
      rows:
        - {record_id: 'txn:1001', mec_committee_id: C1, contributor_name: Dup PAC, amount: 100}
        - {record_id: 'cd1_a:1001', mec_committee_id: C1, contributor_name: Dup PAC, amount: 7}
