# Unit tests for the TAP contributions staging model: fixed source rows -> exact expected rows.
# Kept apart from the generated _tap_mec__models.yml so regenerating docs never touches them.
# The source is the raw parquet (no table to read column types from), so the fixture is SQL naming every
# column the model reads, all text as in the raw files. Later rows list values in the first row's column order.
version: 2

unit_tests:
  - name: tap_contributions_read_both_layouts
    model: stg_tap_mec__contributions
    description: >
      The first layout names and types the donor in ctrb_name / ctrb_type. The second (2020-2022, #30) has
      neither: a committee donor is in `committee`, an organization in `company`, a person in first/last name,
      and absent parts are blank strings, not nulls. Before #30 the second layout came out with a blank name
      and every donor typed Individual. contributor_committee_name is set only for committee donors.
      dupe_flag TRUE rows are dropped.
    given:
      - input: source('tap_mec', 'contributions')
        format: sql
        rows: |
          select
              cast('C1' as varchar) as cmte_id,
              cast(null as varchar) as mecid,
              cast(null as varchar) as cmte_name,
              cast(null as varchar) as committee_name,
              cast('Old Layout PAC' as varchar) as ctrb_name,
              cast('Committee' as varchar) as ctrb_type,
              cast(null as varchar) as committee,
              cast(null as varchar) as company,
              cast(null as varchar) as first_name,
              cast(null as varchar) as last_name,
              cast(null as varchar) as address_1,
              cast(null as varchar) as employer,
              cast(null as varchar) as occupation,
              cast(null as varchar) as city_clean,
              cast(null as varchar) as city,
              cast(null as varchar) as state_clean,
              cast(null as varchar) as state,
              cast('100' as varchar) as amount,
              cast(null as varchar) as date,
              cast(null as varchar) as year,
              cast(null as varchar) as cont_type,
              cast(null as varchar) as contribution_type,
              cast(null as varchar) as rpt_type,
              cast(null as varchar) as report,
              cast('FALSE' as varchar) as dupe_flag,
              cast('t1' as varchar) as txn,
              cast(null as varchar) as cd1_a_id,
              cast(null as varchar) as address_clean
          union all select 'C1', null, null, null, 'Jane Roe', 'Individual', null, null, null, null, null, null, null, null, null, null, null, '5', null, null, null, null, null, null, null, 't2', null, null
          union all select null, 'C2', null, null, null, null, ' New Layout PAC ', '', '', '', null, null, null, null, null, null, null, '50', null, null, null, null, null, null, null, 't3', null, null
          union all select null, 'C2', null, null, null, null, '', 'Acme Corp', '', '', null, null, null, null, null, null, null, '20', null, null, null, null, null, null, null, 't4', null, null
          union all select null, 'C2', null, null, null, null, '', '', 'John', 'Doe', null, null, null, null, null, null, null, '10', null, null, null, null, null, null, null, 't5', null, null
          union all select null, 'C2', null, null, null, null, 'Dupe PAC', '', '', '', null, null, null, null, null, null, null, '1', null, null, null, null, null, null, 'TRUE', 't6', null, null
    expect:
      rows:
        - {mec_committee_id: C1, contributor_name: Old Layout PAC, contributor_type: Committee, contributor_committee_name: Old Layout PAC, amount: 100}
        - {mec_committee_id: C1, contributor_name: Jane Roe, contributor_type: Individual, contributor_committee_name: null, amount: 5}
        - {mec_committee_id: C2, contributor_name: New Layout PAC, contributor_type: Committee, contributor_committee_name: New Layout PAC, amount: 50}
        - {mec_committee_id: C2, contributor_name: Acme Corp, contributor_type: Organization, contributor_committee_name: null, amount: 20}
        - {mec_committee_id: C2, contributor_name: John Doe, contributor_type: Individual, contributor_committee_name: null, amount: 10}

  - name: tap_contributions_placeholder_names
    model: stg_tap_mec__contributions
    description: >
      A one-character donor name ('C', '~', '0', '-', 'x', '_') is a placeholder (#31), not a name: it is treated
      as missing, the name falls back to the person's first/last name and the row is typed Individual, with no
      donor committee name. Without a person's name the name stays null and the reported type is kept. Real short
      names ('3M', 'TY') are two characters or more and survive untouched. The same holds for the second layout,
      where the placeholder is in `committee`. A placeholder in the first/last name columns too ('~' / '~',
      '-' / '-') is not a person's name: the row falls back to `company` and keeps its reported type. Single-letter
      initials ('R Smith') are real and kept. A shifted-column row with nothing to un-shift from (all-digit first name, no address_1; #60) gets no name.
    given:
      - input: source('tap_mec', 'contributions')
        format: sql
        rows: |
          select
              cast('C1' as varchar) as cmte_id,
              cast(null as varchar) as mecid,
              cast(null as varchar) as cmte_name,
              cast(null as varchar) as committee_name,
              cast('C' as varchar) as ctrb_name,
              cast('Committee' as varchar) as ctrb_type,
              cast('C' as varchar) as committee,
              cast('78531653' as varchar) as company,
              cast('KATRINA' as varchar) as first_name,
              cast('REESE' as varchar) as last_name,
              cast(null as varchar) as address_1,
              cast(null as varchar) as employer,
              cast(null as varchar) as occupation,
              cast(null as varchar) as city_clean,
              cast(null as varchar) as city,
              cast(null as varchar) as state_clean,
              cast(null as varchar) as state,
              cast('1' as varchar) as amount,
              cast(null as varchar) as date,
              cast(null as varchar) as year,
              cast(null as varchar) as cont_type,
              cast(null as varchar) as contribution_type,
              cast(null as varchar) as rpt_type,
              cast(null as varchar) as report,
              cast('FALSE' as varchar) as dupe_flag,
              cast('t7' as varchar) as txn,
              cast(null as varchar) as cd1_a_id,
              cast(null as varchar) as address_clean
          union all select 'C1', null, null, null, '~', 'Corporation', '~', '99', 'NOAH', 'ARSLAN', null, null, null, null, null, null, null, '2', null, null, null, null, null, null, null, 't8', null, null
          union all select 'C1', null, null, null, 'C', 'Committee', 'C', null, null, null, null, null, null, null, null, null, null, '3', null, null, null, null, null, null, null, 't9', null, null
          union all select 'C1', null, null, null, '3M', 'Corporation', '3M', null, null, null, null, null, null, null, null, null, null, '4', null, null, null, null, null, null, null, 't10', null, null
          union all select 'C1', null, null, null, 'TY', 'Committee', 'TY', null, 'ANN', 'LEE', null, null, null, null, null, null, null, '5', null, null, null, null, null, null, null, 't11', null, null
          union all select null, 'C2', null, null, null, null, ' 0 ', '', 'JOHN', 'DOE', null, null, null, null, null, null, null, '6', null, null, null, null, null, null, null, 't12', null, null
          union all select 'C1', null, null, null, '~', 'Committee', '~', 'Some PAC', '~', '~', null, null, null, null, null, null, null, '7', null, null, null, null, null, null, null, 't13', null, null
          union all select 'C1', null, null, null, '-', 'Committee', '-', 'Other PAC', '-', '-', null, null, null, null, null, null, null, '8', null, null, null, null, null, null, null, 't14', null, null
          union all select 'C1', null, null, null, 'C', 'Committee', 'C', null, 'R', 'Smith', null, null, null, null, null, null, null, '9', null, null, null, null, null, null, null, 't15', null, null
          union all select 'C1', null, null, null, 'C', 'Corporation', 'C', 'C', '79047860', 'VINCENT', null, null, null, null, null, null, null, '10', null, null, null, null, null, null, null, 't16', null, null
    expect:
      rows:
        - {mec_committee_id: C1, contributor_name: KATRINA REESE, contributor_type: Individual, contributor_committee_name: null, amount: 1}
        - {mec_committee_id: C1, contributor_name: NOAH ARSLAN, contributor_type: Individual, contributor_committee_name: null, amount: 2}
        - {mec_committee_id: C1, contributor_name: null, contributor_type: Committee, contributor_committee_name: null, amount: 3}
        - {mec_committee_id: C1, contributor_name: 3M, contributor_type: Corporation, contributor_committee_name: null, amount: 4}
        - {mec_committee_id: C1, contributor_name: TY, contributor_type: Committee, contributor_committee_name: TY, amount: 5}
        - {mec_committee_id: C2, contributor_name: JOHN DOE, contributor_type: Individual, contributor_committee_name: null, amount: 6}
        - {mec_committee_id: C1, contributor_name: Some PAC, contributor_type: Committee, contributor_committee_name: null, amount: 7}
        - {mec_committee_id: C1, contributor_name: Other PAC, contributor_type: Committee, contributor_committee_name: null, amount: 8}
        - {mec_committee_id: C1, contributor_name: R Smith, contributor_type: Individual, contributor_committee_name: null, amount: 9}
        - {mec_committee_id: C1, contributor_name: null, contributor_type: Corporation, contributor_committee_name: null, amount: 10}

  - name: tap_contributions_unshift_rows
    model: stg_tap_mec__contributions
    description: >
      Shifted-column rows (#60) are un-shifted only on a precise signature. (1) All-digit first_name, name in
      last_name + address_1, nothing usable in ctrb_name / committee / company (Enterprise Holdings PAC, one-digit
      ID variant): first-name + surname, Individual. (2) last_name '0' with ctrb_name 'FIRST 0': first_name +
      address_1, Individual. (3) Individual 'FIRST LAST 0' with last_name 'LAST 0': drop the trailing ' 0'.
      (4) Placeholder ctrb_name and company, blank last_name, multi-word first_name (organization in
      first_name): name kept, type stays Corporation. Look-alikes stay as reported: an ID with a digit-bearing
      address_1, a real company next to a '0' first/last name, a single-word first_name under a Corporation
      placeholder, a ctrb_name that merely ends in a real ' 0' without the '0' last_name, a '0' last_name with a real ctrb_name
      (not ending ' 0'), and an all-digit first_name with a real company and a blank ctrb_name.
    given:
      - input: source('tap_mec', 'contributions')
        format: sql
        rows: |
          select
              cast('C1' as varchar) as cmte_id,
              cast(null as varchar) as mecid,
              cast(null as varchar) as cmte_name,
              cast(null as varchar) as committee_name,
              cast('C' as varchar) as ctrb_name,
              cast('Corporation' as varchar) as ctrb_type,
              cast(null as varchar) as committee,
              cast('C' as varchar) as company,
              cast('79047860' as varchar) as first_name,
              cast('VINCENT' as varchar) as last_name,
              cast('SIEMER' as varchar) as address_1,
              cast(null as varchar) as employer,
              cast(null as varchar) as occupation,
              cast(null as varchar) as city_clean,
              cast(null as varchar) as city,
              cast(null as varchar) as state_clean,
              cast(null as varchar) as state,
              cast('1' as varchar) as amount,
              cast(null as varchar) as date,
              cast(null as varchar) as year,
              cast(null as varchar) as cont_type,
              cast(null as varchar) as contribution_type,
              cast(null as varchar) as rpt_type,
              cast(null as varchar) as report,
              cast('FALSE' as varchar) as dupe_flag,
              cast('t17' as varchar) as txn,
              cast(null as varchar) as cd1_a_id,
              cast(null as varchar) as address_clean
          union all select null, 'C2', null, null, null, null, null, null, '0', 'JOE', 'ABBOTT', null, null, null, null, null, null, '2', null, null, null, null, null, null, null, 't18', null, null
          union all select 'C3', null, null, null, 'KERRY 0', 'Individual', null, null, 'KERRY', '0', 'LAFFOON', null, null, null, null, null, null, '3', null, null, null, null, null, null, null, 't19', null, null
          union all select 'C3', null, null, null, 'MATTHEW SMITH 0', 'Individual', null, null, 'MATTHEW', 'SMITH 0', '8808 N ANITA AVE', null, null, null, null, null, null, '4', null, null, null, null, null, null, null, 't20', null, null
          union all select 'C4', null, null, null, '??????????', 'Corporation', null, '??????????', 'Missouri Optometric Association', null, 'x', null, null, null, null, null, null, '5', null, null, null, null, null, null, null, 't21', null, null
          union all select 'C1', null, null, null, 'C', 'Corporation', null, 'C', '79047861', 'TRICIA', '1058 Golden Orchard Dr', null, null, null, null, null, null, '6', null, null, null, null, null, null, null, 't22', null, null
          union all select 'C5', null, null, null, 'Acme Corp', 'Corporation', null, 'Acme Corp', '0', '0', '1010 Pine', null, null, null, null, null, null, '7', null, null, null, null, null, null, null, 't23', null, null
          union all select 'C4', null, null, null, 'L', 'Corporation', null, 'L', 'Belisle', null, 'x', null, null, null, null, null, null, '8', null, null, null, null, null, null, null, 't24', null, null
          union all select 'C4', null, null, null, '-', 'Corporation', null, '-', 'Harlan Harlan & Still', null, null, null, null, null, null, null, null, '10', null, null, null, null, null, null, null, 't25', null, null
          union all select 'C6', null, null, null, 'ROBERT 0', 'Individual', null, null, 'ROBERT', 'JONES', 'MAIN ST', null, null, null, null, null, null, '9', null, null, null, null, null, null, null, 't26', null, null
          union all select 'C7', null, null, null, 'SAM JONES', 'Individual', null, null, 'SAM', '0', 'MAIN ST', null, null, null, null, null, null, '11', null, null, null, null, null, null, null, 't27', null, null
