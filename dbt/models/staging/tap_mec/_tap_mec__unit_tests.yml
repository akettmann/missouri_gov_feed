              cast(null as varchar) as state,
              cast('100' as varchar) as amount,
              cast('2020-03-01' as varchar) as date,
              cast(null as varchar) as year,
              cast(null as varchar) as cont_type,
              cast(null as varchar) as contribution_type,
              cast(null as varchar) as rpt_type,
              cast(null as varchar) as report,
              cast('FALSE' as varchar) as dupe_flag,
