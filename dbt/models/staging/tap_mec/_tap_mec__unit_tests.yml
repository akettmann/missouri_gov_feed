  - name: tap_expenditures_payee_name
    model: stg_tap_mec__expenditures
    description: >
      TAP's payee_name is just coalesce(last_name, first_name, company) and merged different people sharing a
      surname (#85), so it is not used. A company wins over the contact's first/last name; when the company only
      repeats the person's last name or "First Last" the payee is "First Last"; with no company the payee is
      "First Last", then a lone first or last name. Placeholder parts ('~', '-', '?') and all-digit parts are
      dropped, so '~' / '~' falls through to the company; a whole name of one character is dropped but initials
      inside a person's name stay. TAP's payee_name alone (r8) yields null. An organization typed into both name boxes (r16, r17: the last
      name already starts with the first name) is not doubled. The prefix rule needs the first name followed by a
      space (r18: 'Robert' / 'Roberts' is a person, 'Robert Roberts'). A several-word last name equal to the company
      is the vendor itself (r19), so the contact's first name is not prefixed; a several-word last name with no
      company, or a company that is the full "First Last" (r20, r21), still gives the person. Known trade-off (r22):
      a person with a several-word last name repeated in the company ('De La Cruz') is shown as the company alone.
    given:
      - input: source('tap_mec', 'expenditures')
        format: sql
        rows: |
          select
              cast('r1' as varchar) as cd3_b_id,
              cast('C1' as varchar) as mecid,
              cast('Committee' as varchar) as committee_name,
              cast('Shepard' as varchar) as payee_name,
              cast(null as varchar) as company,
              cast('Kimmie' as varchar) as first_name,
              cast('Shepard' as varchar) as last_name,
              cast(null as varchar) as purpose,
              cast(null as varchar) as expenditure_type,
              cast('1' as varchar) as amount,
              cast(null as varchar) as date_clean,
              cast(null as varchar) as year_clean,
              cast(null as varchar) as city_final,
              cast(null as varchar) as state_norm,
              cast(null as varchar) as report,
              cast('FALSE' as varchar) as dupe_flag
          union all select 'r2', 'C1', 'Committee', 'Shepard', null, 'Kiara', ' Shepard ', null, null, '1', null, null, null, null, null, null
          union all select 'r3', 'C1', 'Committee', 'Acme Printing', 'Acme Printing', null, null, null, null, '1', null, null, null, null, null, 'FALSE'
          union all select 'r4', 'C1', 'Committee', 'Walmart', 'Walmart', '~', '~', null, null, '1', null, null, null, null, null, 'FALSE'
