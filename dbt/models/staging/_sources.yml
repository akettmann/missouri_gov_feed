version: 2
sources:
  - name: raw
    description: >
      Verbatim landings written by the Python loaders (src/mogov/loaders): one directory per table holding
      one Parquet part per loader shard (part-<shard>-of-<shards>.parquet), read together.
      JSON payloads are stored as text and read only through the mogov.json_* macros (portable SQL).
      Tables from opt-in or key-gated loaders (mec, senate_efd, fec aggregates, wikidata, case history)
      may be absent; models over them are disabled via the `enabled` vars in dbt_project.yml.
    meta:
      external_location: "read_parquet('{{ env_var('MOGOV_RAW_DIR', 'data/raw') }}/{name}/*.parquet', union_by_name = true)"
    tables:
      # rosters / careers
      - name: openstates_people
        description: One row per Open States YAML file under data/mo (legislature, retired, executive, municipalities, committees).
      - name: openstates_current_csv
        description: Open States flat current roster (has Wikidata QIDs).
      - name: congress_legislators_current
        description: unitedstates/congress-legislators current members who have ever served MO.
      - name: congress_legislators_historical
        description: "unitedstates/congress-legislators former members who ever served MO, with term history and cross-ids."
      - name: bluebook_lines
        description: Missouri Official Manual chapter PDFs (executive, legislative, judicial), one row per text line.
      - name: fjc_judges
        description: Federal Judicial Center biographical directory of Article III judges (wide CSV).
      # votes
      - name: voteview_members
        description: "Voteview member-congress rows (both chambers, loaded congresses) with DW-NOMINATE scores; national."
      - name: voteview_rollcalls
        description: "Voteview roll calls (both chambers, loaded congresses): date, bill, question, result."
      - name: voteview_votes
        description: "Voteview individual votes, one row per (roll call, member) with a cast code; national, filtered in dbt."
      - name: mo_house_members
        description: MO House member XML per session (roster, committees, bio, sponsored bills).
      - name: mo_house_bills
        description: "MO House bill XML per session (sponsors, actions, roll-call totals and RollCallPDF links), as JSON."
      - name: mo_house_lists
        description: "MO House list XML per session (MemberList, BillList, SenateActList, hearing lists...), as JSON."
      - name: mo_house_rollcalls
        description: One row per House roll-call PDF (header fields, printed totals).
      - name: mo_house_rollcall_votes
        description: One row per (House roll call, member token) parsed from the PDF grid.
      - name: mo_senate_journals
        description: "One row per MO Senate journal PDF read: URL, year, number of vote rows parsed (or the fetch error)."
      - name: mo_senate_votes
        description: One row per (Senate journal vote block, category, senator token).
      # money
      - name: fec_candidates
        description: "FEC candidate master (cn), loaded cycles, national."
      - name: fec_committees
        description: "FEC committee master (cm), loaded cycles, national. CMTE_DSGN D marks leadership PACs."
      - name: fec_cand_cmte_links
        description: "FEC candidate-committee linkage (ccl), loaded cycles, national."
      - name: fec_committee_contribs_to_candidates
        description: FEC pas2 - contributions from committees to candidates (and independent expenditures).
      - name: fec_candidate_summary
        description: "FEC all-candidates summary (weball): per-candidate cycle totals, national."
      - name: fec_sponsored_committees
        description: Committees (leadership PACs) sponsored by MO members, from the FEC API.
      - name: fec_receipt_aggregates
        description: FEC API itemized-receipt aggregates by employer/size/state (needs FEC_API_KEY).
      - name: tap_mec_contributions
        description: MEC itemized contributions received, via the Accountability Project mirror (2011-2022).
      - name: tap_mec_expenditures
        description: "MEC itemized expenditures by Missouri committees, via the Accountability Project mirror (2011-2022)."
      - name: mec_cd1_a
        description: MEC direct - itemized contributions received (opt-in `mec` loader; enable var mec_direct).
      - name: mec_cd3_b
        description: MEC direct - itemized expenditures over $100.
      - name: mec_cd3_c
        description: MEC direct - contributions made by a committee to other committees/candidates.
      - name: mec_summary
        description: "MEC direct - one row per filed campaign finance report with cover-page totals (receipts, expenditures, money on hand, debt). Landed, not yet modeled."
      - name: mec_candidate_committees
        description: MEC CF12 election search export - MECID <-> candidate name and office sought.
      - name: mec_lobbyist_expenditures
        description: MEC direct - lobbyist expenditures on public officials, 2019+.
      - name: tap_mec_lobbyist_expenditures
        description: MEC lobbyist expenditures (gifts) to public officials, via TAP (2004-2022).
      # disclosures
      - name: house_fd_index
        description: "U.S. House Clerk financial disclosure index, every filer nationally, from MOGOV_HOUSE_FD_FIRST_YEAR."
      - name: house_fd_pdf_lines
        description: "Text lines of Missouri members' House disclosure PDFs; scanned filings appear once with has_text = false."
      - name: senate_efd_filings
        description: "Senate eFD filings for MO senators/candidates (opt-in loader); paper filings flagged is_paper."
      - name: senate_efd_rows
        description: Senate eFD web-report table rows (opt-in loader).
      - name: cl_courts
        description: "CourtListener courts (bulk export)."
      - name: cl_people
        description: "CourtListener judge database: people (bulk export, national)."
      - name: cl_positions
        description: "CourtListener judge database: positions held (judgeships, prior jobs), national."
      - name: cl_political_affiliations
        description: "CourtListener judge database: party affiliations."
      - name: cl_educations
        description: "CourtListener judge database: degrees."
      - name: cl_schools
        description: "CourtListener judge database: schools."
      - name: cl_retention_events
        description: "CourtListener judge database: retention votes and reappointments."
      - name: cl_financial_disclosures
        description: "CourtListener: federal judges' AO-10 disclosure reports (one row per report)."
      - name: cl_fd_investments
        description: "AO-10 report part: investments."
      - name: cl_fd_gifts
        description: "AO-10 report part: gifts."
      - name: cl_fd_debts
        description: "AO-10 report part: liabilities."
      - name: cl_fd_positions
        description: "AO-10 report part: outside positions."
      - name: cl_fd_agreements
        description: "AO-10 report part: agreements."
      - name: cl_fd_non_investment_income
        description: "AO-10 report part: non-investment income."
      - name: cl_fd_reimbursements
        description: "AO-10 report part: reimbursements (travel, lodging, meals paid by others)."
      - name: cl_fd_spousal_income
        description: "AO-10 report part: spouse's non-investment income."
      # ideology / ratings
      - name: shor_mccarty
        description: "Shor-McCarty state legislator ideology scores, all states, 1993-2022 (wide per-year columns)."
      - name: acu_ratings
        description: "American Conservative Union ratings of MO legislators, one JSON row per person with yearly ratings."
      # knowledge graph
      - name: wikidata_positions
        description: "Wikidata P39 positions held by tracked officials (with start/end/district qualifiers)."
      - name: wikidata_attributes
        description: "Wikidata occupation, employer, party, education and memberships of tracked officials."
      - name: wikidata_relatives
        description: "Wikidata relatives of tracked officials, with organizations they lead and offices they hold."
      - name: wikidata_own_leadership
        description: "Organizations tracked officials lead, founded or own per Wikidata."
      - name: wikidata_mo_officeholders
        description: "Living people Wikidata lists as holding a Missouri position (QID discovery)."
      - name: cl_cases
        description: CourtListener opinion search hits per official judge/lawyer (stage-2 loader).
      - name: cl_mo_dockets
        description: CourtListener bulk dockets in Missouri state/federal courts (courtlistener_case_bulk; enable var cl_case_bulk).
      - name: cl_mo_opinion_clusters
        description: CourtListener bulk opinion clusters (judges, attorneys, disposition) on those dockets.
      - name: cl_mo_cluster_panel
        description: CourtListener bulk opinion-cluster panel (cluster -> judge person id).
