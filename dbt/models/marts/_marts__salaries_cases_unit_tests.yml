  - name: salaries_case_263_steve_roberts_house_and_senate_pay_is_one_official
    model: fct_salaries
    description: >
      #263. Open States keeps Steve Roberts' HD77 years (2017-20, placeholder 1900-01-01 start) under "Steven
      Roberts" (ocd-person/528445cb...); the person-id merge gives that seat his Senate id 20ad6a34, so his House
      pay (high: STEVEN = Steven) and his Senate pay (medium: STEVEN for Steve, by seat) go to one official. The
      fixture also keeps an unmerged "Steven Roberts" official under 528445cb (not in the real data: it stands for
      the alias as its own person). He holds no seat and is paid nothing; with two officials fitting "ROBERTS,
      STEVEN", the 2021 House final check ($1,496.45, set aside, so by name only) is ambiguous and goes nowhere.
      Lane Roberts (HD161 from 2019) keeps his own. Fails on the pre-#263 shape (the HD77 seat and its roster
      years under 528445cb): the 2017 and 2020 House pay goes to 528445cb by seat.
    given:
      - input: ref('stg_mo_employee_pay__pay')
        rows:
          - {calendar_year: 2017, agency_name: LEGISLATURE, position_title: STATE REPRESENTATIVE, employee_name: 'ROBERTS, STEVEN', last_name: ROBERTS, first_names: STEVEN, gross_pay: 34418.35}
