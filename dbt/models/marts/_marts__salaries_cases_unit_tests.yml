      same id as his 2025 Senate pay (63dea1c8, one person since #504), Hough's to his Senate id, and Hoskins'
      ("STATE REPRESENTATIVE-LEADERSHP", $1,558.95) to him next to his 2017 Senate pay. The checks are set aside
      and matched by name; 2017 is outside Webber's and Hough's seat years, and each is kept because no other
