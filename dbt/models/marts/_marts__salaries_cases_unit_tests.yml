# Unit tests for fct_salaries on the named people of the person-id issues (#649, #659): real payroll rows, real
# Open States person ids and seat dates (prod DB copy, 2026-10), each pinned to the one official it belongs to.
# Inputs a case does not need are empty; the federal inputs are not under test. The invented-name tests of the
# same rules are in _marts__salaries_unit_tests.yml.
version: 2

unit_tests:
  - name: salaries_case_227_cody_and_david_smith_keep_their_own_pay
    model: fct_salaries
    description: >
      #227. "SMITH, DAVID C" is Cody Smith (HD163, 2017-01-01 to 2025-01-07, no current official so his pay is
      not shown) and "SMITH, DAVID T" is David Tyson Smith (HD45 then HD46). David's HD45 seat starts on the
      1900-01-01 placeholder and his first roster year is 2021, so Cody's 2017 and 2020 pay never goes to David,
      by seat or by name. From 2021 both payees fit David's first name equally; the middle initial C pairs Cody,
      and David is the one member left for T (medium). In 2025 Cody's seat ends in January and "SMITH, DAVID C"
      ($1,636) is his final check by the middle initial too (it is not in int_mo_legislators__final_checks: DAVID
      does not fit Cody); Travis Smith's 2025 final check is set aside; Kem and Marla Smith pair by first name.
      Clem Smith (1900 start, roster 2017-18) pairs with "SMITH, CLEMENT J." in 2017. Fails if the seat start
      falls back to 1900 (David gets DAVID C in 2017 and 2020) or without the middle-initial rule (David loses
      2021, 2024 and 2025).
    given:
      - input: ref('stg_mo_employee_pay__pay')
        rows:
          - {calendar_year: 2017, agency_name: LEGISLATURE, position_title: STATE REPRESENTATIVE, employee_name: 'SMITH, DAVID C', last_name: SMITH, first_names: DAVID C, gross_pay: 34418.35}
          - {calendar_year: 2017, agency_name: LEGISLATURE, position_title: STATE REPRESENTATIVE, employee_name: 'SMITH, CLEMENT J.', last_name: SMITH, first_names: CLEMENT J., gross_pay: 35914.80}
          - {calendar_year: 2020, agency_name: LEGISLATURE, position_title: STATE REPRESENTATIVE, employee_name: 'SMITH, DAVID C', last_name: SMITH, first_names: DAVID C, gross_pay: 35914.80}
          - {calendar_year: 2021, agency_name: LEGISLATURE, position_title: STATE REPRESENTATIVE, employee_name: 'SMITH, DAVID C', last_name: SMITH, first_names: DAVID C, gross_pay: 35914.80}
