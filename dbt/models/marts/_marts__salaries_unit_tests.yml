          - {official_id: j_hemenway, office: mo_associate_circuit_judge}
      - input: ref('int_officials__name_keys')
        rows:
          - {official_id: j_hansbrough, level: state, office: mo_circuit_judge, family_key: hansbrough, given_key: w}
          - {official_id: j_hemenway, level: state, office: mo_associate_circuit_judge, family_key: hemenway, given_key: jay}
      - input: ref('int_officials__current')
        rows: *no_current
      - input: ref('stg_congress__terms')
        rows: *no_terms
      - input: ref('int_officeholders__years')
        rows: *no_years
      - input: ref('federal_salaries')
        rows: *no_federal
    expect:
      rows:
        - {official_id: j_hansbrough, calendar_year: 2022, employee_name: 'HANSBROUGH, W. ANN', match_confidence: high}
        - {official_id: j_hemenway, calendar_year: 2022, employee_name: 'HEMENWAY, JOSEPH JAY', match_confidence: medium}

  - name: salaries_pay_from_before_the_first_term_never_matches
    model: fct_salaries
    description: >
      David Smith's Open States seat starts on the 1900-01-01 placeholder; his first roster year is 2021. "SMITH,
      DAVID C" is Cody Smith (another person, no official here) and was paid in 2019, before David took office;
      neither the seat match (the seat counts from 2021) nor the name match (David sat from 2021, and Cody holds
      the surname in 2019) may give that pay to David. "SMITH, DAVID T" in 2021 is his. A final check in 2017 for
      Lincoln Hough, whose seat starts in 2019, stays his: nobody else holds the surname that year.
    given:
      - input: ref('stg_mo_employee_pay__pay')
        rows:
          - {calendar_year: 2019, agency_name: LEGISLATURE, position_title: STATE REPRESENTATIVE, employee_name: 'SMITH, DAVID C', last_name: SMITH, first_names: DAVID C, gross_pay: 34418.35}
          - {calendar_year: 2021, agency_name: LEGISLATURE, position_title: STATE REPRESENTATIVE, employee_name: 'SMITH, DAVID T', last_name: SMITH, first_names: DAVID T, gross_pay: 22646.28}
          - {calendar_year: 2017, agency_name: LEGISLATURE, position_title: STATE REPRESENTATIVE, employee_name: 'HOUGH, LINCOLN P', last_name: HOUGH, first_names: LINCOLN P, gross_pay: 1496.45}
          - {calendar_year: 2021, agency_name: LEGISLATURE, position_title: STATE REPRESENTATIVE, employee_name: 'COOPER, ANN', last_name: COOPER, first_names: ANN, gross_pay: 34418.35}
      - input: ref('mo_payroll_office_titles')
        rows:
          - {agency_name: LEGISLATURE, position_title: STATE REPRESENTATIVE, office_group: legislature}
      - input: ref('int_mo_legislators__seats')
        rows:
          - {person_id: p_david, full_name: David Smith, surname_key: smith, chamber: lower, start_date: '1900-01-01', end_date: '2023-01-03'}
          - {person_id: p_david, full_name: David Smith, surname_key: smith, chamber: lower, start_date: '2023-01-01', end_date: '9999-12-31'}
          - {person_id: p_cody, full_name: Cody Smith, surname_key: smith, chamber: lower, start_date: '2017-01-01', end_date: '2025-01-07'}
          - {person_id: p_hough, full_name: Lincoln Hough, surname_key: hough, chamber: lower, start_date: '2019-01-01', end_date: '9999-12-31'}
          - {person_id: p_cooper, full_name: Ann Cooper, surname_key: cooper, chamber: lower, start_date: '2021-01-01', end_date: '9999-12-31'}
      - input: ref('int_mo_legislators__final_checks')
        rows: *no_final_checks
      - input: ref('dim_official')
        rows:
          - {official_id: p_david, office: state_house}
          - {official_id: p_hough, office: state_house}
          - {official_id: p_cooper, office: state_house}
      - input: ref('int_officials__name_keys')
        rows:
          - {official_id: p_david, level: state, office: state_house, family_key: smith, given_key: david}
          - {official_id: p_hough, level: state, office: state_house, family_key: hough, given_key: lincoln}
      - input: ref('int_officials__current')
        rows: *no_current
      - input: ref('stg_congress__terms')
        rows: *no_terms
      - input: ref('int_officeholders__years')
        rows:
          - {year: 2021, official_id: p_david, office: state_house}
          - {year: 2022, official_id: p_david, office: state_house}
          - {year: 2019, official_id: p_hough, office: state_house}
          - {year: 2021, official_id: p_cooper, office: state_house}
      - input: ref('federal_salaries')
        rows: *no_federal
    expect:
      rows:
        - {official_id: p_david, calendar_year: 2021, employee_name: 'SMITH, DAVID T', match_confidence: high}
        - {official_id: p_hough, calendar_year: 2017, employee_name: 'HOUGH, LINCOLN P', match_confidence: high}
        - {official_id: p_cooper, calendar_year: 2021, employee_name: 'COOPER, ANN', match_confidence: high}

  - name: salaries_payee_fitting_two_members_equally_matches_neither
    model: fct_salaries
    description: >
      "KING, ALEX" fits Alexander King (starts with it) and Alexis King (same first three letters) equally, so
      the payee is given to neither: n_best_members is 2. "ABEL, ZED" is the only Abel and pairs, as a control.
    given:
      - input: ref('stg_mo_employee_pay__pay')
