  - name: salaries_pair_by_mutual_best_first_name_fit
    model: fct_salaries
    description: >
      A payee and a member pair only when each is the other's best first-name fit. LEWIS, EDWIN fits Edwin Lewis
      exactly and Ed Lewis only as a prefix, so it pairs with Edwin alone (the payee's best). Edwin Hunt fits
      HUNT, EDWIN exactly and HUNT, ED as a prefix, so he takes EDWIN and ED stays unpaired (the member's best).
    given:
      - input: ref('stg_mo_employee_pay__pay')
        rows:
          - {calendar_year: 2022, agency_name: LEGISLATURE, position_title: STATE REPRESENTATIVE, employee_name: 'LEWIS, EDWIN', last_name: LEWIS, first_names: EDWIN, gross_pay: 36775.23}
          - {calendar_year: 2022, agency_name: LEGISLATURE, position_title: STATE REPRESENTATIVE, employee_name: 'HUNT, EDWIN', last_name: HUNT, first_names: EDWIN, gross_pay: 36775.23}
          - {calendar_year: 2022, agency_name: LEGISLATURE, position_title: STATE REPRESENTATIVE, employee_name: 'HUNT, ED', last_name: HUNT, first_names: ED, gross_pay: 33744.92}
      - input: ref('mo_payroll_office_titles')
        rows:
          - {agency_name: LEGISLATURE, position_title: STATE REPRESENTATIVE, office_group: legislature}
      - input: ref('int_mo_legislators__seats')
        rows:
