# Unit tests for marts logic (dbt unit tests: fixed input rows -> exact expected rows).
version: 2

unit_tests:
  - name: lobbyist_gifts_match_recipient_name_and_title
    model: fct_lobbyist_gifts
    description: >
      Recipient "LAST, FIRST" matches an official on surname plus the first three letters of the first
      name: exact first name -> high, shortened form (Dan/Daniel) -> medium. A gift whose recipient fits
      two officials is dropped rather than guessed, and a recipient title naming another kind of office
      doesn't match.
    overrides:
      vars:
        mec_direct: false
    given:
      - input: ref('stg_tap_mec__lobbyist_gifts')
        rows:
          - {lobbyist_id: L1, lobbyist_name: A Lobbyist, recipient_raw: 'JONES, DANIEL', recipient_title: REPRESENTATIVE, recipient_last: JONES, recipient_first: DANIEL, amount: 40, expenditure_date: '2017-02-01', description: dinner}
          - {lobbyist_id: L1, lobbyist_name: A Lobbyist, recipient_raw: 'JONES, DAN', recipient_title: REPRESENTATIVE, recipient_last: JONES, recipient_first: DAN, amount: 25, expenditure_date: '2017-03-01', description: lunch}
          - {lobbyist_id: L1, lobbyist_name: A Lobbyist, recipient_raw: 'LEE, ANN', recipient_title: SENATOR, recipient_last: LEE, recipient_first: ANN, amount: 30, expenditure_date: '2017-04-01', description: tickets}
          - {lobbyist_id: L1, lobbyist_name: A Lobbyist, recipient_raw: 'JONES, DAN', recipient_title: COUNTY CLERK, recipient_last: JONES, recipient_first: DAN, amount: 15, expenditure_date: '2017-05-01', description: coffee}
      - input: ref('int_officials__name_keys')
        rows:
          - {official_id: o_dan_jones, office: state_house, family_key: jones, given_key: dan, level: state}
          - {official_id: o_ann_lee, office: state_senate, family_key: lee, given_key: ann, level: state}
          - {official_id: o_anne_lee, office: state_house, family_key: lee, given_key: anne, level: state}
    expect:
      rows:
        - {official_id: o_dan_jones, recipient_raw: 'JONES, DANIEL', match_confidence: medium}
        - {official_id: o_dan_jones, recipient_raw: 'JONES, DAN', match_confidence: high}

  - name: party_unity_yearly_counts_party_line_votes_by_year_and_party_held
    model: fct_party_unity_yearly
    description: >
      Only yea/nay votes on party-line votes count. m votes in 2023 on three votes: v1 (party-line, Republican
      majority yea, Democratic majority nay), v2 (not party-line, both parties yea) and v3 (party-line, absent
      so no vote cast). m cast yea as a Republican on v1 (with the party), then in 2024 switched to Democratic
      and cast yea on v4 (party-line, Democratic majority nay): against the party. The party at the vote
      decides the side, so the switch gives 1 of 1 in 2023 and 0 of 1 in 2024. An undated vote lands in a
      null year. Counting v2, v3, or judging 2024 by the old party fails this test.
    given:
      - input: ref('fct_votes')
        rows:
          - {official_id: m, chamber: state_house, vote_id: v1, vote_date: 2023-02-01, vote_cast: yea, party_at_vote: Republican}
          - {official_id: m, chamber: state_house, vote_id: v2, vote_date: 2023-02-02, vote_cast: yea, party_at_vote: Republican}
          - {official_id: m, chamber: state_house, vote_id: v3, vote_date: 2023-02-03, vote_cast: absent, party_at_vote: Republican}
          - {official_id: m, chamber: state_house, vote_id: v4, vote_date: 2024-02-01, vote_cast: yea, party_at_vote: Democratic}
          - {official_id: m, chamber: state_house, vote_id: v5, vote_date: null, vote_cast: nay, party_at_vote: Democratic}
      - input: ref('int_votes__party_positions')
        rows:
          - {chamber: state_house, vote_id: v1, republican_position: yea, democratic_position: nay, is_party_line: true}
          - {chamber: state_house, vote_id: v2, republican_position: yea, democratic_position: yea, is_party_line: false}
          - {chamber: state_house, vote_id: v3, republican_position: yea, democratic_position: nay, is_party_line: true}
          - {chamber: state_house, vote_id: v4, republican_position: yea, democratic_position: nay, is_party_line: true}
          - {chamber: state_house, vote_id: v5, republican_position: yea, democratic_position: nay, is_party_line: true}
    expect:
      rows:
        - {official_id: m, chamber: state_house, vote_year: 2023, party_line_votes: 1, with_party_votes: 1}
        - {official_id: m, chamber: state_house, vote_year: 2024, party_line_votes: 1, with_party_votes: 0}
        - {official_id: m, chamber: state_house, vote_year: null, party_line_votes: 1, with_party_votes: 1}

  - name: commercial_ties_skip_garbled_disclosure_items
    model: fct_commercial_ties
    description: >
      A disclosure item flagged is_garbled (unreadable AO-10 OCR text) is not a tie; a readable item in the
      same report still is (#5).
    given:
      - input: ref('fct_disclosures')
        rows:
          - {official_id: j1, section: outside position, description: Trustee - Saint Louis Art Museum, report_year: 2019, disclosure_type: Federal judicial financial disclosure (AO-10), document_url: u1, owner: null, is_garbled: false, is_latest_version: true}
          - {official_id: j1, section: outside position, description: 'S. - LE fo NY', report_year: 2019, disclosure_type: Federal judicial financial disclosure (AO-10), document_url: u1, owner: null, is_garbled: true, is_latest_version: true}
          - {official_id: j1, section: agreement, description: 'SIE = RE', report_year: 2019, disclosure_type: Federal judicial financial disclosure (AO-10), document_url: u1, owner: null, is_garbled: true, is_latest_version: true}
      - input: ref('int_officials__wikidata')
        rows: []
      - input: ref('stg_wikidata__facts')
        rows: []
    expect:
      rows:
        - {official_id: j1, tie_kind: position held, whose: self, detail: Trustee - Saint Louis Art Museum, is_latest_report: true}

  - name: family_ties_skip_garbled_spousal_income
    model: fct_family_ties
    description: >
      A spouse income source flagged is_garbled (unreadable AO-10 OCR text) is not listed as a family tie;
      a readable one is (#5).
    given:
      - input: ref('fct_disclosures')
        rows:
          - {official_id: j1, section: spousal income, description: AT&T, disclosure_type: Federal judicial financial disclosure (AO-10), document_url: u1, is_garbled: false, is_latest_version: true}
          - {official_id: j1, section: spousal income, description: '2200 =oK00 =o OL00 Es 0.', disclosure_type: Federal judicial financial disclosure (AO-10), document_url: u1, is_garbled: true, is_latest_version: true}
      - input: ref('fct_commercial_ties')
        rows: []
      - input: ref('int_officials__wikidata')
        rows: []
      - input: ref('stg_wikidata__relatives')
        rows: []
    expect:
      rows:
        - {official_id: j1, relation: spouse, role: spouse income source, organization: AT&T}

  - name: campaign_finance_links_committee_donors_by_name_and_year
    model: fct_campaign_finance
    description: >
      A committee donor's own MECID is attached from the name crosswalk only for a unique match in the gift's
      year (TAP's year column, or the date's year when it's missing); an ambiguous name, a crosswalk row for
      another year, and non-committee donors get none (#9).
    overrides:
      vars:
        mec_direct: false
    given:
      - input: ref('int_mec__official_committees')
        rows:
          - {official_id: o1, mec_committee_id: C000100, committee_name: Friends of Jane Doe, confidence: high}
      - input: ref('int_tap_mec__contributions')
        rows:
          - {mec_committee_id: C000100, contributor_name: Missouri Chamber PAC, contributor_type: Committee, contributor_committee_name: Missouri Chamber PAC, amount: 500, contribution_date: '2020-03-01', contribution_year: 2020}
          - {mec_committee_id: C000100, contributor_name: Missouri Chamber PAC, contributor_type: Committee, contributor_committee_name: Missouri Chamber PAC, amount: 250, contribution_date: '2021-03-01', contribution_year: null}
          - {mec_committee_id: C000100, contributor_name: Missouri Chamber PAC, contributor_type: Committee, contributor_committee_name: Missouri Chamber PAC, amount: 100, contribution_date: '2019-03-01', contribution_year: 2019}
          - {mec_committee_id: C000100, contributor_name: Twin PAC, contributor_type: Committee, contributor_committee_name: Twin PAC, amount: 200, contribution_date: '2020-03-01', contribution_year: 2020}
          - {mec_committee_id: C000100, contributor_name: Ann Doe, contributor_type: Individual, contributor_committee_name: null, amount: 50, contribution_date: '2020-03-01', contribution_year: 2020}
      - input: ref('int_mec__donor_committees')
        rows:
          - {donor_committee_name: Missouri Chamber PAC, contribution_year: 2020, mec_committee_id: C000001, match_status: matched, match_confidence: high}
          - {donor_committee_name: Missouri Chamber PAC, contribution_year: 2021, mec_committee_id: C000001, match_status: matched, match_confidence: medium}
          - {donor_committee_name: Twin PAC, contribution_year: 2020, mec_committee_id: null, match_status: ambiguous, match_confidence: null}
      - input: ref('stg_tap_mec__expenditures')
        rows:
          - {record_id: E1, mec_committee_id: C999999, purpose: contribution, amount: 1}  # committee not attributed to an official
      - input: ref('dim_official')
        rows: []
      - input: ref('stg_congress__fec_ids')
        rows: []
      - input: ref('stg_fec__candidate_committees')
        rows: []
      - input: ref('stg_fec__committee_contributions')
        rows: []
      - input: ref('stg_fec__committees')
        rows: []
      - input: ref('fec_committee_types')
        rows: []
    expect:
      rows:
        - {counterparty: Missouri Chamber PAC, amount: 500, counterparty_mec_committee_id: C000001, counterparty_link_confidence: high}
        - {counterparty: Missouri Chamber PAC, amount: 250, counterparty_mec_committee_id: C000001, counterparty_link_confidence: medium}
        - {counterparty: Missouri Chamber PAC, amount: 100, counterparty_mec_committee_id: null, counterparty_link_confidence: null}
        - {counterparty: Twin PAC, amount: 200, counterparty_mec_committee_id: null, counterparty_link_confidence: null}
        - {counterparty: Ann Doe, amount: 50, counterparty_mec_committee_id: null, counterparty_link_confidence: null}

  - name: campaign_finance_fec_received_links_donor_disbursements
    model: fct_campaign_finance
    description: >
      An FEC "received" row links the donor committee's disbursements page narrowed to the receiving committee
      (its outgoing money, which includes the gift), not its receipts page, which would never show the gift; a
      "given" row links the giving committee's disbursements narrowed to the recipient committee (#236).
    overrides:
      vars:
        mec_direct: false
    given:
      - input: ref('int_mec__official_committees')
        rows: []
      - input: ref('int_tap_mec__contributions')
        rows: []
      - input: ref('int_mec__donor_committees')
        rows: []
      - input: ref('stg_tap_mec__expenditures')
        rows: []
      - input: ref('dim_official')
        rows:
          - {official_id: o1, bioguide_id: B1}
      - input: ref('stg_congress__fec_ids')
        rows:
          - {bioguide_id: B1, fec_candidate_id: H0MO00001}
      - input: ref('stg_fec__candidate_committees')
        rows:
          - {candidate_id: H0MO00001, committee_id: C00000001}
      - input: ref('stg_fec__committee_contributions')
        rows:
          - {sub_id: 11, giving_committee_id: C00000099, candidate_id: H0MO00001, recipient_committee_id: C00000001, transaction_kind: direct contribution, amount: 500}
          - {sub_id: 12, giving_committee_id: C00000001, candidate_id: H0MO00002, recipient_committee_id: C00000002, transaction_kind: direct contribution, amount: 250}
      - input: ref('stg_fec__committees')
        rows: []
      - input: ref('fec_committee_types')
        rows: []
    expect:
      rows:
        - {direction: received, source_record_id: 'fec:11', source_url: 'https://www.fec.gov/data/disbursements/?committee_id=C00000099&recipient_name=C00000001'}
        - {direction: given, source_record_id: 'fec:12', source_url: 'https://www.fec.gov/data/disbursements/?committee_id=C00000001&recipient_name=C00000002'}

  - name: campaign_finance_tap_contribution_and_expenditure_ids_do_not_collide
    model: fct_campaign_finance
    description: >
      TAP contribution ids (txn / cd1_a_id) and expenditure ids (cd3_b_id) are separate id spaces, so a
      contribution and an expenditure that happen to share a raw id still get distinct source_record_ids,
      each prefixed by its own id space (#119).
    overrides:
      vars:
        mec_direct: false
    given:
      - input: ref('int_mec__official_committees')
        rows:
          - {official_id: o1, mec_committee_id: C000100, committee_name: Friends of Jane Doe, confidence: high}
      - input: ref('int_tap_mec__contributions')
        rows:
          - {record_id: '777', mec_committee_id: C000100, contributor_name: Ann Doe, contributor_type: Individual, contributor_committee_name: null, amount: 50, contribution_date: '2020-03-01', contribution_year: 2020}
      - input: ref('int_mec__donor_committees')
        rows: []
      - input: ref('stg_tap_mec__expenditures')
        rows:
          - {record_id: '777', mec_committee_id: C000100, payee_name: Other PAC, purpose: contribution, amount: 75, expenditure_date: '2020-04-01'}
      - input: ref('dim_official')
        rows: []
      - input: ref('stg_congress__fec_ids')
        rows: []
      - input: ref('stg_fec__candidate_committees')
        rows: []
      - input: ref('stg_fec__committee_contributions')
        rows: []
      - input: ref('stg_fec__committees')
        rows: []
      - input: ref('fec_committee_types')
        rows: []
    expect:
      rows:
        - {direction: received, counterparty: Ann Doe, source_record_id: 'tap_contrib:777'}
        - {direction: given, counterparty: Other PAC, source_record_id: 'tap_cd3_b:777'}

  - name: disclosures_flag_latest_version_of_each_report
    model: fct_disclosures
    description: >
      An original Senate annual report and its amendments 1 and 2 share one report; only the highest amendment
      is_latest_version. Two AO-10 pdfs for one judge-year (`..._1.pdf` is the duplicate) likewise. A House
      amended report supersedes the annual report, unless it is a scan with no extractable text. Different
      report years, and kinds that are separate filings (periodic transaction reports, Senate candidate
      reports, which carry no year), are never collapsed (#84). A House amended report amends the latest
      annual or candidate report the filer had filed that year by then: one amending a candidate report joins
      that report's group (it supersedes the candidate report and leaves the annual report alone), and one
      filed after both a candidate and an annual report amends the annual report (#142). Version beats filing
      date: a lower amendment number filed later does not supersede a higher one. The base must have been filed
      on or before the amendment (a candidate report amended before the annual report was filed is not
      re-pointed at the annual report), and in the same filing year (a later year's candidate report filed
      before the amendment is not its base). Several House amendments of one report are numbered by filing date
      (1, 2, ...), and the latest wins; same-day amendments are ordered by numeric doc id, not url string order,
      where 100 sorts before 20, and a url ending .PDF sorts the same way (#463). A termination report is a base
      too: an amendment filed after an annual and a termination report amends the termination report and leaves
      the annual report latest. The amendment's "Period Covered" line (int_house_fd__period_covered) picks the
      candidate report covering the same last day over a later candidate report, and an amendment with a period
      is taken for an amendment of an annual report only as a last resort, when no candidate or termination report
      is on file (#463). Index type H is a New Filer Report (its PDF header says so), a separate report from the
      annual report (O) of the same year, and a base like a candidate report: an amendment filed after a candidate
      report and a later H amends the H, leaves the candidate report latest, and supersedes the H rather than
      leaving it latest beside it (#560). An amendment with a Period Covered line still prefers an earlier
      candidate report over a later H (the H is a last-resort base). An H and an O of one year are both latest
      (Carey: H then O), a lone H stays latest, and an O, A, H, A chain (Miller) has the first A supersede the O
      and the second A supersede the H, leaving one latest per report. An amendment whose period matches no
      base still amends the only base on file, an H (#560; whether H and O should both be latest is #572).
    given:
      - input: ref('dim_official')
        rows:
          - {official_id: s1, office: us_senate, family_name: Smith}
          - {official_id: h1, office: us_house, district: 1, family_name: Jones}
          - {official_id: h2, office: us_house, district: 2, family_name: Brown}
          - {official_id: h4, office: us_house, district: 4, family_name: Green}
          - {official_id: h5, office: us_house, district: 5, family_name: White}
          - {official_id: h6, office: us_house, district: 6, family_name: Black}
          - {official_id: h7, office: us_house, district: 7, family_name: Red}
          - {official_id: h8, office: us_house, district: 8, family_name: Gray}
          - {official_id: h9, office: us_house, district: 9, family_name: Blue}
          - {official_id: h10, office: us_house, district: 10, family_name: Teal}
          - {official_id: h11, office: us_house, district: 11, family_name: Pink}
          - {official_id: h12, office: us_house, district: 12, family_name: Gold}
          - {official_id: h13, office: us_house, district: 13, family_name: Cyan}
          - {official_id: h14, office: us_house, district: 14, family_name: Violet}
          - {official_id: h15, office: us_house, district: 15, family_name: Amber}
          - {official_id: h16, office: us_house, district: 16, family_name: Carey}
          - {official_id: h17, office: us_house, district: 17, family_name: Lone}
          - {official_id: h18, office: us_house, district: 18, family_name: Miller}
          - {official_id: h19, office: us_house, district: 19, family_name: Zed}
