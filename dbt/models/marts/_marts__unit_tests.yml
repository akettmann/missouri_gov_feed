  - name: jurisdiction_business_donors_one_row_per_donor_and_page
    model: fct_jurisdiction_business_donors
    description: >
      A donor has one row per distinct filing page, so each page is its own row: a donor filed on both an MEC and an
      FEC page keeps both, and no single url is picked by min(), which would silently prefer fec.gov over
      mec.mo.gov (#248). The same page repeated across gifts is one row. A donor with no url keeps one row with a
      null source_url, and a donor's pages are matched on the donor key and the official, so another donor's pages, or another
      official's pages for the same donor, never attach to it. Gifts from individuals add no rows. A donor matched to two facilities has its rows on both (#370).
    given:
      - input: ref('int_jurisdiction_business_donor_matches')
        rows:
          - {official_id: o1, registry_id: F1, donor_key: ameren, donor_name: AMEREN CORPORATION}
