          - {official_id: judge1, role: judge, cluster_id: 1, case_name: Case 1, source_url: 'https://x/1b', opinion_tail: null, disposition: null}
          - {official_id: judge1, role: judge, cluster_id: 1, case_name: Case 1, source_url: 'https://x/1a', opinion_tail: null, disposition: null}
          - {official_id: judge1, role: judge, cluster_id: 2, case_name: Case 2, source_url: 'https://x/2b', opinion_tail: null, disposition: null}
          - {official_id: judge1, role: judge, cluster_id: 2, case_name: Case 2, source_url: 'https://x/2c', opinion_tail: null, disposition: null}
