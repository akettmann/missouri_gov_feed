# Unit tests for the committee-post and judge time-to-disposition metrics (fixed rows -> exact expected rows).
version: 2

unit_tests:
  - name: committee_posts_count_titles_and_keep_subcommittees_apart
    model: fct_committee_posts
    description: >
      One member in one session: chair of two full committees, vice-chair of one, ranking member of one,
      plain member of one, and chair of a subcommittee. committees_held counts the five full committees only;
      the subcommittee chair is counted in subcommittee_chair_posts and not in chair_posts.
    given:
      - input: ref('fct_committee_memberships')
        rows:
          - {official_id: o1, session_code: '254', session_year: 2024, committee_name: Budget, position_name: Chair, is_subcommittee: false, is_current_official: true, source_url: https://x/a}
          - {official_id: o1, session_code: '254', session_year: 2024, committee_name: Rules, position_name: Chair, is_subcommittee: false, is_current_official: true, source_url: https://x/a}
          - {official_id: o1, session_code: '254', session_year: 2024, committee_name: Health, position_name: Vice-Chair, is_subcommittee: false, is_current_official: true, source_url: https://x/a}
          - {official_id: o1, session_code: '254', session_year: 2024, committee_name: Utilities, position_name: Ranking Minority Member, is_subcommittee: false, is_current_official: true, source_url: https://x/a}
          - {official_id: o1, session_code: '254', session_year: 2024, committee_name: Ethics, position_name: Member, is_subcommittee: false, is_current_official: true, source_url: https://x/a}
          - {official_id: o1, session_code: '254', session_year: 2024, committee_name: Subcommittee on Roads, position_name: Chair, is_subcommittee: true, is_current_official: true, source_url: https://x/a}
          - {official_id: o1, session_code: '251', session_year: 2023, committee_name: Budget, position_name: Member, is_subcommittee: false, is_current_official: true, source_url: https://x/b}
    expect:
      rows:
        - {official_id: o1, session_code: '254', is_current_official: true, source_url: https://x/a, committees_held: 5, chair_posts: 2, vice_chair_posts: 1, co_chair_posts: 0, ranking_posts: 1, subcommittee_chair_posts: 1}
        - {official_id: o1, session_code: '251', is_current_official: true, source_url: https://x/b, committees_held: 1, chair_posts: 0, vice_chair_posts: 0, co_chair_posts: 0, ranking_posts: 0, subcommittee_chair_posts: 0}

  - name: committee_posts_keep_former_members_and_carry_the_source_url
    model: fct_committee_posts
    description: >
      A former member (is_current_official false) keeps a row, with that flag and the House file the rows came
      from, next to a current member's row.
    given:
      - input: ref('fct_committee_memberships')
        rows:
          - {official_id: gone, session_code: '201', session_year: 2020, committee_name: Budget, position_name: Chair, is_subcommittee: false, is_current_official: false, source_url: 'https://documents.house.mo.gov/xml/201.zip'}
          - {official_id: here, session_code: '201', session_year: 2020, committee_name: Budget, position_name: Member, is_subcommittee: false, is_current_official: true, source_url: 'https://documents.house.mo.gov/xml/201.zip'}
    expect:
      rows:
        - {official_id: gone, session_code: '201', is_current_official: false, source_url: 'https://documents.house.mo.gov/xml/201.zip', committees_held: 1, chair_posts: 1}
        - {official_id: here, session_code: '201', is_current_official: true, source_url: 'https://documents.house.mo.gov/xml/201.zip', committees_held: 1, chair_posts: 0}

  - name: committee_memberships_keep_former_members_flagged_not_current
    model: fct_committee_memberships
    description: >
      Only person p_now is in dim_official. p_gone (a former member, absent from dim_official) is kept, flagged
      is_current_official false; the source_url passes through unchanged for both.
    given:
      - input: ref('int_mo_house__committee_memberships')
        rows:
          - {session_code: '201', session_year: 2020, person_key: p_now, committee_name: Budget, position_name: Chair, source: member_page, source_url: 'https://documents.house.mo.gov/xml/201.zip', is_subcommittee: false}
          - {session_code: '201', session_year: 2020, person_key: p_gone, committee_name: Budget, position_name: Member, source: member_page, source_url: 'https://documents.house.mo.gov/xml/201.zip', is_subcommittee: false}
      - input: ref('dim_official')
        rows:
          - {official_id: p_now}
    expect:
      rows:
        - {official_id: p_now, session_code: '201', committee_name: Budget, is_current_official: true, source_url: 'https://documents.house.mo.gov/xml/201.zip'}
        - {official_id: p_gone, session_code: '201', committee_name: Budget, is_current_official: false, source_url: 'https://documents.house.mo.gov/xml/201.zip'}

  - name: judge_time_to_disposition_excludes_negative_and_undated_dockets
    model: fct_judge_time_to_disposition
    description: >
      Judge 1 has five civil dockets: durations 10, 20 and 100 days are measured, one ends before it was filed
      (-5) and is counted apart, one has no termination date. The civil median is over the three measured (20),
      the share with both dates is 4 of 5. Judge 1 also has two criminal dockets (300 and 500 days, median 400),
      which get their own row, and a miscellaneous docket (1 day) and an unclassified one (2 days), which appear
      in no row and do not move either median. Judge 2 has civil dockets in both districts: court moed+mowd,
      median of 30 and 50 is 40, and no criminal row.
    overrides:
      vars:
        cl_case_bulk: true
    given:
      - input: ref('int_courtlistener__district_dockets')
        rows:
          - {docket_id: d1, court_id: moed, cl_person_id: '1', case_type: civil, has_both_dates: true, days_to_disposition: 10, ends_before_filed: false}
          - {docket_id: d2, court_id: moed, cl_person_id: '1', case_type: civil, has_both_dates: true, days_to_disposition: 20, ends_before_filed: false}
          - {docket_id: d3, court_id: moed, cl_person_id: '1', case_type: civil, has_both_dates: true, days_to_disposition: 100, ends_before_filed: false}
          - {docket_id: d4, court_id: moed, cl_person_id: '1', case_type: civil, has_both_dates: true, days_to_disposition: -5, ends_before_filed: true}
          - {docket_id: d5, court_id: moed, cl_person_id: '1', case_type: civil, has_both_dates: false, days_to_disposition: null, ends_before_filed: null}
          - {docket_id: d6, court_id: moed, cl_person_id: '2', case_type: civil, has_both_dates: true, days_to_disposition: 30, ends_before_filed: false}
          - {docket_id: d7, court_id: mowd, cl_person_id: '2', case_type: civil, has_both_dates: true, days_to_disposition: 50, ends_before_filed: false}
          - {docket_id: d8, court_id: moed, cl_person_id: '1', case_type: criminal, has_both_dates: true, days_to_disposition: 300, ends_before_filed: false}
          - {docket_id: d9, court_id: moed, cl_person_id: '1', case_type: criminal, has_both_dates: true, days_to_disposition: 500, ends_before_filed: false}
          - {docket_id: d10, court_id: moed, cl_person_id: '1', case_type: miscellaneous, has_both_dates: true, days_to_disposition: 1, ends_before_filed: false}
          - {docket_id: d11, court_id: moed, cl_person_id: '1', case_type: other, has_both_dates: true, days_to_disposition: 2, ends_before_filed: false}
      - input: ref('stg_courtlistener__people')
        rows:
          - {cl_person_id: 1, name_first: Ann, name_middle: null, name_last: Judge, name_suffix: null}
          - {cl_person_id: 2, name_first: Bob, name_middle: Q, name_last: Jurist, name_suffix: jr}
      - input: ref('int_courtlistener__official_people')
        rows:
          - {official_id: 'fjc:1', cl_person_id: 1}
    expect:
      rows:
        - {cl_person_id: '1', case_type: civil, official_id: 'fjc:1', judge_name: Ann Judge, court_id: moed, dockets_assigned: 5, dockets_with_both_dates: 4, dockets_ends_before_filed: 1, dockets_measured: 3, share_with_both_dates: 0.8, median_days_to_disposition: 20}
        - {cl_person_id: '1', case_type: criminal, official_id: 'fjc:1', judge_name: Ann Judge, court_id: moed, dockets_assigned: 2, dockets_with_both_dates: 2, dockets_ends_before_filed: 0, dockets_measured: 2, share_with_both_dates: 1.0, median_days_to_disposition: 400}
        - {cl_person_id: '2', case_type: civil, official_id: null, judge_name: Bob Q Jurist jr, court_id: moed+mowd, dockets_assigned: 2, dockets_with_both_dates: 2, dockets_ends_before_filed: 0, dockets_measured: 2, share_with_both_dates: 1.0, median_days_to_disposition: 40}
