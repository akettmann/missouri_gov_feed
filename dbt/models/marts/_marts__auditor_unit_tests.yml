# Unit tests for fct_audit_report_officeholders and fct_audit_reports: fixed rows -> exact expected rows.
version: 2

unit_tests:
  - name: audit_officeholders_follow_the_audit_period_in_the_title
    model: fct_audit_report_officeholders
    description: >
      r1 is the Treasurer's final audit "Period July 1, 2016 through January 9, 2017": it ends on the day Schmitt
      took office, so Zweifel (2009-2017) is credited and Schmitt (2017-2019, term from January 15) is not. r2 is
      "Year Ended June 30, 2012" (2011-07-01 to 2012-06-30): Steelman's term ended 2009, Zweifel's covers it. r3 is
      a period spanning two holders (Governor, 2017-06-01 to 2018-12-31): Greitens (2017-2018) and Parson (2018-2025)
      are both credited; Nixon's term ended in the 2017 inauguration year, so it ends January 15 2017 and he is not. Two current officials share Greitens' first and last name, so no
      official_id is guessed for him. r4 is a county audit and r5 an "other" report: neither has rows, even
      though they name the same period.
    given:
      - input: ref('int_mo_auditor__reports')
        rows:
          - {report_number: r1, entity_type: statewide_office, office: state_treasurer, release_date: '2017-04-28', audit_period_start: '2016-07-01', audit_period_end: '2017-01-09'}
          - {report_number: r2, entity_type: statewide_office, office: state_treasurer, release_date: '2013-03-08', audit_period_start: '2011-07-01', audit_period_end: '2012-06-30'}
          - {report_number: r3, entity_type: statewide_office, office: governor, release_date: '2019-09-11', audit_period_start: '2017-06-01', audit_period_end: '2018-12-31'}
          - {report_number: r4, entity_type: county, office: null, release_date: '2018-03-01', audit_period_start: '2016-07-01', audit_period_end: '2017-06-30'}
          - {report_number: r5, entity_type: other, office: null, release_date: '2018-03-01', audit_period_start: '2016-07-01', audit_period_end: '2017-06-30'}
      - input: ref('int_bluebook__statewide_officeholders')
        rows:
          - {office: state_treasurer, full_name: Sarah Steelman, party: R, term_start_year: 2005, term_end_year: 2009}
          - {office: state_treasurer, full_name: Clint Zweifel, party: D, term_start_year: 2009, term_end_year: 2017}
          - {office: state_treasurer, full_name: Eric S. Schmitt, party: R, term_start_year: 2017, term_end_year: 2019}
          - {office: governor, full_name: Jeremiah W. (Jay) Nixon, party: D, term_start_year: 2009, term_end_year: 2017}
          - {office: governor, full_name: Eric Greitens, party: R, term_start_year: 2017, term_end_year: 2018}
          - {office: governor, full_name: Michael L. Parson, party: R, term_start_year: 2018, term_end_year: 2025}
      - input: ref('statewide_office_handovers')
        rows:
          - {office: governor, family_name: nobody, term_start_year: 1900, term_start: null, term_end: null}
      - input: ref('int_officials__name_keys')
        rows:
          - {official_id: dup_a, variant_key: eric greitens, given_key: eric, family_key: greitens}
          - {official_id: dup_b, variant_key: eric greitens, given_key: eric, family_key: greitens}
    expect:
      rows:
        - {report_number: r1, office: state_treasurer, full_name: Clint Zweifel, official_id: null, link_basis: audit_period}
        - {report_number: r2, office: state_treasurer, full_name: Clint Zweifel, official_id: null, link_basis: audit_period}
        - {report_number: r3, office: governor, full_name: Eric Greitens, official_id: null, link_basis: audit_period}
        - {report_number: r3, office: governor, full_name: Michael L. Parson, official_id: null, link_basis: audit_period}

  - name: audit_officeholders_without_a_stated_period_use_the_year_before_release
    model: fct_audit_report_officeholders
    description: >
      r1 (Lieutenant Governor, released 2019-07-18, no period in the title) is credited to everyone in office from
      2018-01-01 to the release date: Parson (2017-2018) and Kehoe (2018-2025), not Kinder (to 2017). r2 is released
      2019-01-08, so its window opens 2018-01-01 too and is credited to the same two. r3 (Governor, released
      2026-07-02) takes Parson (to 2025, still within the year before) and Kehoe (2025-, still serving), not
      Greitens. Kehoe matches a tracked current official by first and last name and carries that official_id;
      Parson matches nobody.
    given:
      - input: ref('int_mo_auditor__reports')
        rows:
          - {report_number: r1, entity_type: statewide_office, office: lt_governor, release_date: '2019-07-18', audit_period_start: null, audit_period_end: null}
          - {report_number: r2, entity_type: statewide_office, office: lt_governor, release_date: '2019-01-08', audit_period_start: null, audit_period_end: null}
          - {report_number: r3, entity_type: statewide_office, office: governor, release_date: '2026-07-02', audit_period_start: null, audit_period_end: null}
      - input: ref('int_bluebook__statewide_officeholders')
        rows:
          - {office: lt_governor, full_name: Peter D. Kinder, party: R, term_start_year: 2005, term_end_year: 2017}
          - {office: lt_governor, full_name: Michael L. Parson, party: R, term_start_year: 2017, term_end_year: 2018}
          - {office: lt_governor, full_name: Mike Kehoe, party: R, term_start_year: 2018, term_end_year: 2025}
          - {office: lt_governor, full_name: David Wasinger, party: R, term_start_year: 2025, term_end_year: null}
          - {office: governor, full_name: Eric Greitens, party: R, term_start_year: 2017, term_end_year: 2018}
          - {office: governor, full_name: Michael L. Parson, party: R, term_start_year: 2018, term_end_year: 2025}
          - {office: governor, full_name: Mike Kehoe, party: R, term_start_year: 2025, term_end_year: null}
      - input: ref('statewide_office_handovers')
        rows:
          - {office: governor, family_name: nobody, term_start_year: 1900, term_start: null, term_end: null}
      - input: ref('int_officials__name_keys')
        rows:
          - {official_id: kehoe_id, variant_key: mike kehoe, given_key: mike, family_key: kehoe}
    expect:
      rows:
        - {report_number: r1, full_name: Michael L. Parson, official_id: null, link_basis: release_window, window_start: '2018-01-01', window_end: '2019-07-18'}
        - {report_number: r1, full_name: Mike Kehoe, official_id: kehoe_id, link_basis: release_window, window_start: '2018-01-01', window_end: '2019-07-18'}
        - {report_number: r2, full_name: Michael L. Parson, official_id: null, link_basis: release_window, window_start: '2018-01-01', window_end: '2019-01-08'}
        - {report_number: r2, full_name: Mike Kehoe, official_id: kehoe_id, link_basis: release_window, window_start: '2018-01-01', window_end: '2019-01-08'}
        - {report_number: r3, full_name: Michael L. Parson, official_id: null, link_basis: release_window, window_start: '2025-01-01', window_end: '2026-07-02'}
        - {report_number: r3, full_name: Mike Kehoe, official_id: kehoe_id, link_basis: release_window, window_start: '2025-01-01', window_end: '2026-07-02'}

  - name: audit_officeholders_use_dated_handovers_and_name_variants
    model: fct_audit_report_officeholders
    description: >
      Fixed rows for #606. r1 (AG, period 2019-06-01 to 2019-12-31) is after Hawley left on 2019-01-03, so only
      Schmitt is credited, not Hawley (whom the whole-year convention would keep through December 31). r2 (AG, period
      2018-06-01 to 2018-12-31) credits Hawley alone. r3 (Governor, period 2018-05-01 to 2018-05-31) is before
      Greitens resigned on 2018-06-01, so Greitens only; r4 (same office, 2018-06-02 to 2018-06-30) is after it,
      so Parson only. r5 (AG, 2025-10-01 to 2025-12-31) is after Bailey left on 2025-09-08: Hanaway only. Hawley is printed
      "Josh Hawley" in the Manual while the official is "Joshua Hawley" with the variant "Josh Hawley", so he gets
      his official_id from the variant key; a given/family key that fits two officials (Eric Schmitt) stays null.
    given:
      - input: ref('int_mo_auditor__reports')
        rows:
          - {report_number: r1, entity_type: statewide_office, office: attorney_general, release_date: '2020-03-01', audit_period_start: '2019-06-01', audit_period_end: '2019-12-31'}
          - {report_number: r2, entity_type: statewide_office, office: attorney_general, release_date: '2019-03-01', audit_period_start: '2018-06-01', audit_period_end: '2018-12-31'}
          - {report_number: r3, entity_type: statewide_office, office: governor, release_date: '2019-03-01', audit_period_start: '2018-05-01', audit_period_end: '2018-05-31'}
          - {report_number: r4, entity_type: statewide_office, office: governor, release_date: '2019-03-01', audit_period_start: '2018-06-02', audit_period_end: '2018-06-30'}
          - {report_number: r5, entity_type: statewide_office, office: attorney_general, release_date: '2026-03-01', audit_period_start: '2025-10-01', audit_period_end: '2025-12-31'}
      - input: ref('int_bluebook__statewide_officeholders')
        rows:
          - {office: attorney_general, full_name: Josh Hawley, party: R, term_start_year: 2017, term_end_year: 2019}
          - {office: attorney_general, full_name: Eric Schmitt, party: R, term_start_year: 2019, term_end_year: 2023}
          - {office: attorney_general, full_name: Andrew Bailey, party: R, term_start_year: 2023, term_end_year: 2025}
          - {office: attorney_general, full_name: Catherine L. Hanaway, party: R, term_start_year: 2025, term_end_year: null}
          - {office: governor, full_name: Eric Greitens, party: R, term_start_year: 2017, term_end_year: 2018}
          - {office: governor, full_name: Michael L. Parson, party: R, term_start_year: 2018, term_end_year: 2025}
      - input: ref('statewide_office_handovers')
        rows:
          - {office: attorney_general, family_name: Hawley, term_start_year: 2017, term_start: null, term_end: '2019-01-03'}
          - {office: attorney_general, family_name: Schmitt, term_start_year: 2019, term_start: '2019-01-03', term_end: '2023-01-03'}
          - {office: attorney_general, family_name: Bailey, term_start_year: 2023, term_start: '2023-01-03', term_end: '2025-09-08'}
          - {office: attorney_general, family_name: Hanaway, term_start_year: 2025, term_start: '2025-09-08', term_end: null}
          - {office: governor, family_name: Greitens, term_start_year: 2017, term_start: null, term_end: '2018-06-01'}
          - {office: governor, family_name: Parson, term_start_year: 2018, term_start: '2018-06-01', term_end: null}
      - input: ref('int_officials__name_keys')
        rows:
          - {official_id: hawley_id, variant_key: joshua hawley, given_key: joshua, family_key: hawley}
          - {official_id: hawley_id, variant_key: josh hawley, given_key: joshua, family_key: hawley}
          - {official_id: schmitt_a, variant_key: eric schmitt, given_key: eric, family_key: schmitt}
          - {official_id: schmitt_b, variant_key: eric schmitt, given_key: eric, family_key: schmitt}
    expect:
      rows:
        - {report_number: r1, full_name: Eric Schmitt, official_id: null}
        - {report_number: r2, full_name: Josh Hawley, official_id: hawley_id}
        - {report_number: r3, full_name: Eric Greitens, official_id: null}
        - {report_number: r4, full_name: Michael L. Parson, official_id: null}
        - {report_number: r5, full_name: Catherine L. Hanaway, official_id: null}

  - name: audit_reports_count_their_officeholders_and_name_the_basis
    model: fct_audit_reports
    description: >
      A statewide audit with two credited holders counts 2 and carries their basis; a statewide audit with none
      counts 0 and has no basis; county and other audits are never linked.
    given:
      - input: ref('int_mo_auditor__reports')
        rows:
          - {report_number: r1, entity_type: statewide_office, office: governor, release_date: '2019-09-11', rating: Fair, rating_level: 2, rating_status: ok}
          - {report_number: r2, entity_type: statewide_office, office: state_treasurer, release_date: '2017-04-28', audit_period_start: '2016-07-01', audit_period_end: '2017-01-09', rating: Excellent, rating_level: 4, rating_status: ok}
          - {report_number: r3, entity_type: statewide_office, office: lt_governor, release_date: '1990-01-01', rating: null, rating_level: null, rating_status: not_read}
          - {report_number: r4, entity_type: county, office: null, release_date: '2018-03-01', rating: Poor, rating_level: 1, rating_status: ok}
      - input: ref('fct_audit_report_officeholders')
        rows:
          - {report_number: r1, link_basis: release_window}
          - {report_number: r1, link_basis: release_window}
          - {report_number: r2, link_basis: audit_period}
    expect:
      rows:
        - {report_number: r1, officeholder_link_basis: release_window, officeholder_count: 2, audit_period_start: null, audit_period_end: null}
        - {report_number: r2, officeholder_link_basis: audit_period, officeholder_count: 1, audit_period_start: '2016-07-01', audit_period_end: '2017-01-09'}
        - {report_number: r3, officeholder_link_basis: null, officeholder_count: 0, audit_period_start: null, audit_period_end: null}
        - {report_number: r4, officeholder_link_basis: null, officeholder_count: 0, audit_period_start: null, audit_period_end: null}
