version: 2

# Every mart is keyed by official_id (see the official_id doc block in models/_docs.md) and covers the
# officials in dim_official: people holding a tracked Missouri office today. History about them (past
# offices, old votes, old cases) is included; former officials who left office are not.

models:
  - name: dim_official
    description: >
      One row per current Missouri public official: the 6 statewide executives, the General Assembly
      (House roster from the House's own XML; Senate from Open States), the congressional delegation,
      mayors Open States tracks, Missouri state judges (Official Manual) and federal judges seated in
      Missouri (FJC). Grain: official. Identity and cross-system ids live here; every fact joins to it.
    columns:
      - name: official_id
        description: "{{ doc('official_id') }}"
        data_tests: [unique, not_null]
      - name: full_name
        description: Display name as the authoritative roster prints it (may include suffixes, e.g. "Jr.", "II").
        data_tests: [not_null]
      - name: given_name
        description: First name (sometimes with middle name); used for name matching.
      - name: family_name
        description: Surname; used for name matching against sources that only carry names.
      - name: party
        description: >
          Current party, normalized across sources (mogov.normalize_party): Republican, Democratic,
          Independent or Libertarian. Null for judges and non-partisan offices.
        data_tests:
          - accepted_values:
              arguments:
                values: ['Republican', 'Democratic', 'Independent', 'Libertarian']
      - name: level
        description: "{{ doc('level') }}"
        data_tests:
          - accepted_values:
              arguments:
                values: ['state', 'federal', 'local']
      - name: office
        description: "{{ doc('office') }}"
        data_tests: [not_null]
      - name: office_title
        description: Human-readable office, e.g. "State Representative", "Circuit Judge, 22 Judicial Circuit".
      - name: district
        description: Legislative/congressional district, judicial circuit or court district; null for statewide offices.
      - name: current_term_start
        description: Start of the current term where the roster records it (often null for state judges).
      - name: current_term_end
        description: Scheduled end of the current term where known.
      - name: openstates_id
        description: Open States person id (ocd-person/...), when the person is in Open States.
      - name: bioguide_id
        description: Congressional Biographical Directory id (members of Congress).
      - name: icpsr
        description: ICPSR id, Voteview's member key (members of Congress).
      - name: opensecrets_id
        description: OpenSecrets (CRP) candidate id (members of Congress).
      - name: votesmart_id
        description: Vote Smart candidate id (members of Congress).
      - name: wikidata_qid
        description: Wikidata item id (Q...), from congress-legislators or the Open States roster.
      - name: senate_lis_id
        description: U.S. Senate LIS member id (senators).
      - name: email
        description: Public office email from Open States.
      - name: image_url
        description: Official portrait URL from Open States.
      - name: hometown
        description: Hometown as Open States records it.

  - name: official_profile
    description: >
      One row per official: identity headline, a count of records per category, and a coverage status per
      category explaining any gap (so "no rows" is never silent). Grain: official. The intended entry point
      for a profile page.
    columns:
      - name: official_id
        description: "{{ doc('official_id') }}"
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_official')
                field: official_id
      - name: full_name
        description: As in dim_official.
      - name: party
        description: As in dim_official.
      - name: level
        description: "{{ doc('level') }}"
      - name: office
        description: "{{ doc('office') }}"
      - name: office_title
        description: As in dim_official.
      - name: district
        description: As in dim_official.
      - name: is_judge_or_lawyer
        description: True when fct_legal_careers has any row for the official (drives case-history coverage).
      - name: n_votes
        description: Rows in fct_votes.
      - name: n_donations
        description: Rows in fct_campaign_finance.
      - name: n_lobbyist_gifts
        description: Rows in fct_lobbyist_gifts.
      - name: n_disclosures
        description: Rows in fct_disclosures.
      - name: n_bias_indicators
        description: Rows in fct_bias_indicators.
      - name: n_past_offices
        description: Rows in fct_office_history.
      - name: n_commercial_ties
        description: Rows in fct_commercial_ties.
      - name: n_family_ties
        description: Rows in fct_family_ties.
      - name: n_cases
        description: Rows in fct_case_history.
      - name: n_voluntary_disclosures
        description: Rows in fct_voluntary_disclosures.
      - name: votes_status
        description: "{{ doc('coverage_status') }}"
      - name: donations_status
        description: "{{ doc('coverage_status') }}"
      - name: disclosures_status
        description: "{{ doc('coverage_status') }}"
      - name: voluntary_disclosures_status
        description: "{{ doc('coverage_status') }}"
      - name: bias_status
        description: "{{ doc('coverage_status') }}"
      - name: commercial_ties_status
        description: "{{ doc('coverage_status') }}"
      - name: family_ties_status
        description: "{{ doc('coverage_status') }}"
      - name: cases_status
        description: "{{ doc('coverage_status') }}"

  - name: fct_office_history
    description: >
      Past and present offices held by each official, from every source that records careers: Open States
      roles, congress-legislators terms, the statewide seed, FJC appointments, Wikidata "position held",
      CourtListener's judge database, and appointment/election sentences in Official Manual judge bios.
      Grain: one row per (official, office_title, start_date); when several sources report the same term,
      the most authoritative is kept (seed and FJC > congress-legislators > Open States > Wikidata >
      CourtListener > Official Manual sentences).
    columns:
      - name: official_id
        description: "{{ doc('official_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_official')
                field: official_id
      - name: office_title
        description: >
          Office as the source names it. Official Manual rows hold the whole sentence, e.g. "Appointed to the
          Court of Appeals by Governor Parson in 2021".
        data_tests: [not_null]
      - name: district
        description: District or seat qualifier where the source has one.
      - name: jurisdiction
        description: Open States / OCD jurisdiction id, or the source name where there is none (fjc, wikidata...).
      - name: start_date
        description: Term start. Official Manual rows only know the year (stored as January 1).
      - name: end_date
        description: Term end; null when ongoing or unknown.
      - name: source
        description: Which source this row came from (openstates, congress-legislators, fjc, wikidata, courtlistener, statewide_officials seed, Missouri Official Manual <edition>).

  - name: fct_votes
    description: >
      Roll-call votes by current officials, including votes cast in earlier offices (e.g. a state senator's
      House votes). Missouri House from roll-call PDFs, Missouri Senate from daily journals (both for the
      last MOGOV_LOOKBACK_YEARS), Congress from Voteview. Grain: (official, vote_id). Votes whose printed
      name couldn't be tied to exactly one person are left out rather than guessed.
    columns:
      - name: official_id
        description: "{{ doc('official_id') }}"
        data_tests: [not_null]
      - name: full_name
        description: As in dim_official.
      - name: chamber
        description: "`state_house`, `state_senate`, `us_house` or `us_senate`."
      - name: session_code
        description: MO House session code (YY + type, e.g. 251), Senate journal year, or Congress number.
      - name: vote_id
        description: Identifier of the roll call within the chamber (unique per chamber).
      - name: vote_date
        description: Date of the vote.
      - name: measure
        description: Bill or resolution voted on (e.g. "HCS HB 10"), where the record names one.
      - name: vote_description
        description: What was voted on - the House calendar item, the Senate journal sentence introducing the vote, or Voteview's description.
      - name: vote_cast
        description: "{{ doc('vote_cast') }}"
        data_tests:
          - accepted_values:
              arguments:
                values: ['yea', 'nay', 'present', 'absent', 'absent with leave', 'not voting']
      - name: party_at_vote
        description: Party of the official when the vote was cast (state) or current party (federal), normalized as in dim_official.party.
        data_tests:
          - accepted_values:
              arguments:
                values: ['Republican', 'Democratic', 'Independent', 'Libertarian']
      - name: source_url
        description: "{{ doc('source_url') }}"

  - name: fct_federal_votes
    description: >
      Every roll-call vote cast by a current member of Missouri's congressional delegation in the loaded
      congresses (MOGOV_VOTEVIEW_CONGRESSES), with Voteview's question and result. Grain: (official,
      congress, chamber, rollnumber). Its rows are also unioned into fct_votes.
    columns:
      - name: official_id
        description: "{{ doc('official_id') }}"
      - name: full_name
        description: As in dim_official.
      - name: congress
        description: Congress number (119 = 2025-2027).
      - name: chamber
        description: "`House` or `Senate` (Voteview spelling)."
      - name: rollnumber
        description: Roll-call number within the congress and chamber.
      - name: vote_date
        description: Date of the vote.
      - name: bill_number
        description: Bill number, when the vote was on a bill.
      - name: vote_question
        description: Question put to the chamber (e.g. "On Passage").
      - name: vote_desc
        description: Voteview's short description of the measure.
      - name: dtl_desc
        description: Voteview's detailed description, where present.
      - name: vote_result
        description: Outcome of the roll call (e.g. "Passed").
      - name: vote_cast
        description: "{{ doc('vote_cast') }}"
      - name: source_url
        description: "{{ doc('source_url') }}"

  - name: fct_campaign_finance
    description: >
      Money into and out of each official's campaign committees. Federal: FEC committee contributions (pas2)
      for every FEC candidate id the official has used, plus their leadership PACs. State: MEC itemized
      contributions for committees attributed to the official (int_mec__official_committees) - the TAP
      mirror for report years through 2022, MEC's own exports for 2023+. Individual federal donors are
      summarized in fct_federal_donor_summary instead of listed. Grain: one itemized transaction.
    columns:
      - name: official_id
        description: "{{ doc('official_id') }}"
      - name: direction
        description: "`received` = money given to the official's committee; `given` = contributions made by the official's committee or leadership PAC."
        data_tests:
          - accepted_values:
              arguments:
                values: ['received', 'given']
      - name: level
        description: "`federal` (FEC) or `state` (MEC)."
      - name: transaction_date
        description: Date of the contribution as reported.
      - name: amount
        description: Amount in USD. Negative values are refunds/corrections as filed.
      - name: counterparty
        description: The other party - the donor for `received`, the recipient for `given`.
      - name: counterparty_organization
        description: Donor's employer/company, or the connected organization of a giving PAC.
      - name: counterparty_type
        description: >
          Kind of counterparty. MEC: Individual / Committee / Organization / Corporation; given rows:
          "committee or candidate", "candidate committee" or "charity". FEC received rows carry the giving
          committee's type as FEC names it (seed fec_committee_types), e.g. "PAC - qualified", "Party -
          qualified", "House", "Hybrid PAC (with Non-Contribution Account) - Qualified".
      - name: kind
        description: Free-text description of the transaction (e.g. "monetary to Friends of X", "direct contribution").
      - name: source
        description: "`FEC`, `MEC`, or `MEC (via Accountability Project)`."
      - name: match_confidence
        description: "{{ doc('match_confidence') }}"
      - name: source_url
        description: "{{ doc('source_url') }}"

  - name: fct_federal_donor_summary
    description: >
      Federal fundraising per member per cycle. `cycle total` rows come from FEC's candidate summary
      (receipts, individual/PAC/party money, self-funding, disbursements, cash on hand). `by_employer`,
      `by_size` and `by_state` rows are the FEC API's aggregates of itemized individual donors (only when
      FEC_API_KEY is set). Grain: (official, cycle, aggregate_kind, bucket).
    columns:
      - name: official_id
        description: "{{ doc('official_id') }}"
      - name: cycle
        description: Two-year election cycle (e.g. 2026).
      - name: aggregate_kind
        description: "`cycle total`, `by_employer`, `by_size` or `by_state`."
      - name: bucket
        description: The metric (for cycle totals, e.g. "total receipts") or the group (an employer, a size band, a state).
      - name: total
        description: USD.
      - name: contribution_count
        description: Number of contributions in the bucket (aggregates only).

  - name: fct_lobbyist_gifts
    description: >
      Lobbyist expenditures on current state officials (meals, tickets, travel, gifts) from MEC lobbyist
      reports: the TAP mirror for 2004-2018 and, with the MEC loader, MEC's export for 2019+. Missouri's
      Amendment 1 (Dec 2018) banned most gifts over $5, so volumes drop sharply after 2018. Grain: one
      reported expenditure; rows whose recipient name fits more than one official are dropped.
    columns:
      - name: official_id
        description: "{{ doc('official_id') }}"
      - name: expenditure_date
        description: Date of the expenditure.
      - name: expenditure_year
        description: Year of expenditure_date.
      - name: amount
        description: USD.
      - name: lobbyist_name
        description: Reporting lobbyist.
      - name: lobbyist_principal
        description: The organization the lobbyist was paid to represent.
      - name: expenditure_category
        description: Category as filed (Meals, Food & Beverage / Travel / Gift / Entertainment / ...); capitalization differs between the two sources.
      - name: description
        description: Lobbyist's description of the expenditure.
      - name: recipient_title
        description: Recipient's role as reported (REPRESENTATIVE, SENATOR, SPOUSE OR CHILD, ...).
      - name: recipient_raw
        description: Recipient as written on the report ("LAST, FIRST").
      - name: match_confidence
        description: "{{ doc('match_confidence') }}"
      - name: source
        description: "`MEC lobbyist reports` or `MEC lobbyist reports (via Accountability Project)`."

  - name: fct_disclosures
    description: >
      Mandatory financial disclosure line items: U.S. House Clerk annual reports and periodic transaction
      reports (PDF text, tagged by schedule), Senate eFD reports (structured tables), and federal judges'
      AO-10 reports via CourtListener (mostly 2020 and earlier). Missouri state officials' and judges'
      personal financial disclosures are not online (see official_profile.disclosures_status). Grain: one
      disclosed item; scanned filings appear once with section "document (not text-extractable...)".
    columns:
      - name: official_id
        description: "{{ doc('official_id') }}"
      - name: disclosure_type
        description: "`U.S. House financial disclosure`, `U.S. Senate financial disclosure` or `Federal judicial financial disclosure (AO-10)`."
      - name: filing_kind
        description: Report kind - annual report, periodic transaction report, amendment, candidate report, extension request...
      - name: report_year
        description: Calendar year the report covers.
      - name: filing_date
        description: Date filed (null for AO-10 rows).
      - name: section
        description: "Report part the item sits in (e.g. \"A: assets\", \"Part 8. Positions\", \"investment\")."
      - name: owner
        description: Whose item it is, as the form codes it - SP/Spouse, DC/Child, JT/Joint, Self; blank on forms without an owner column.
      - name: amount
        description: Value as disclosed - usually a range band ("$15,001 - $50,000") or an AO-10 letter code, not a number.
      - name: description
        description: The item text (asset, income source, position, transaction...).
      - name: document_url
        description: Link to the filed report.

  - name: fct_voluntary_disclosures
    description: >
      Voluntary disclosures (financial statements, conflict-of-interest or recusal notices) officials
      published without being required to. No feed exists, so they're hand-curated in
      seeds/voluntary_disclosures.csv and matched by name. Grain: one disclosure.
    columns:
      - name: official_id
        description: "{{ doc('official_id') }}"
      - name: disclosure_date
        description: Date published.
      - name: kind
        description: Kind of disclosure as curated.
      - name: description
        description: What was disclosed.
      - name: source_url
        description: "{{ doc('source_url') }}"

  - name: fct_bias_indicators
    description: >
      Measured lean, not judgments. One row per (official, indicator, period):
      `dw_nominate_dim1` Voteview, Congress, -1 liberal .. +1 conservative (economic dimension);
      `shor_mccarty_np` state legislators 1993-2022, negative liberal / positive conservative, comparable
      across states; `acu_rating` American Conservative Union yearly score 0-100 (one advocacy group's
      view); `party_unity_pct` share of party-line votes (majorities of R and D opposed) where the official
      voted with their own party's majority, computed from fct_votes.
    columns:
      - name: official_id
        description: "{{ doc('official_id') }}"
      - name: indicator
        description: Which measure (see the model description).
        data_tests:
          - accepted_values:
              arguments:
                values: ['dw_nominate_dim1', 'shor_mccarty_np', 'acu_rating', 'party_unity_pct']
      - name: value
        description: The score, on the indicator's own scale.
      - name: period
        description: Congress number (DW-NOMINATE), last year served (Shor-McCarty), rating year (ACU); null for party unity (computed over all loaded votes).
      - name: detail
        description: Context for the value (chamber, years served, number of party-line votes).
      - name: source_url
        description: "{{ doc('source_url') }}"

  - name: fct_commercial_ties
    description: >
      Commercial ventures and relationships: positions held in businesses and organizations, earned-income
      sources, compensation over $5,000 from one source, and agreements (future employment, leave,
      continuing payments) from mandatory disclosures, plus employers and organizations the official leads
      per Wikidata. Personal holdings (stocks, funds) stay in fct_disclosures. Grain: one tie as disclosed.
    columns:
      - name: official_id
        description: "{{ doc('official_id') }}"
      - name: tie_kind
        description: "`position held`, `income source`, `compensation source`, `agreement`, or a Wikidata relation (`employer`, `chief executive of`, `board member of`, `founder of`, ...)."
      - name: whose
        description: "`self`, `spouse` or `dependent` (from the disclosure's owner code)."
      - name: detail
        description: The organization / description as disclosed.
      - name: as_of_year
        description: Report year of the disclosure (null for Wikidata).
      - name: is_latest_report
        description: True when the row comes from the official's most recent disclosure year (always true for Wikidata) - filter on it for "current" ties.
      - name: source
        description: Disclosure type or `Wikidata`.
      - name: source_url
        description: "{{ doc('source_url') }}"

  - name: fct_family_ties
    description: >
      Family members and their roles, especially leadership of companies and organizations: Wikidata
      relatives (with organizations they lead and offices they hold), and spouse/dependent positions,
      income and compensation from the latest mandatory disclosure. Missouri's business registry would
      extend this but is not machine-accessible. Grain: one (relative, role) as reported.
    columns:
      - name: official_id
        description: "{{ doc('official_id') }}"
      - name: relation
        description: Relationship to the official (spouse, child, sibling, father, mother, relative, partner, dependent).
      - name: relative_name
        description: Relative's name (Wikidata only; disclosures don't name the spouse).
      - name: role
        description: The relative's role - a leadership role, `public office`, or the disclosure tie kind (e.g. `income source`).
      - name: organization
        description: The organization led / office held / income source disclosed.
      - name: source
        description: "`Wikidata` or the disclosure type."
      - name: source_url
        description: "{{ doc('source_url') }}"

  - name: fct_legal_careers
    description: >
      Officials who are or were judges or lawyers, with the evidence for each claim: sitting on a judicial
      roster, a biography sentence (attorney, J.D., practiced law, prosecutor, admitted to the bar...), or a
      Wikidata occupation/position. Drives the case-history searches. Grain: (official, legal_role, evidence).
    columns:
      - name: official_id
        description: "{{ doc('official_id') }}"
      - name: legal_role
        description: "`judge` or `lawyer`."
      - name: evidence
        description: The roster office title, biography sentence or Wikidata fact that supports the role.
      - name: source
        description: Where the evidence came from (judicial roster, Missouri Official Manual <edition>, MO House member page <session>, FJC Biographical Directory, Wikidata).

  - name: fct_case_history
    description: >
      Court cases (CourtListener) involving officials who are or were judges or lawyers. Built from the
      quarterly bulk export (Missouri state appellate and federal courts in Missouri plus the 8th Circuit)
      matched in int_courtlistener__bulk_case_matches, topped up by REST API search hits. Trial-court
      (circuit) cases are not in CourtListener. Grain: (official, role, case). Caveats: judges-text matches
      are by surname within the judge's own courts and tenure; attorney text names an Attorney General on
      every brief their office filed (role `attorney` = office of record).
    columns:
      - name: official_id
        description: "{{ doc('official_id') }}"
      - name: role
        description: "`judge` (authored or sat on the panel) or `attorney` (named as counsel in the opinion)."
      - name: case_name
        description: Case caption.
      - name: court
        description: Court name.
      - name: court_id
        description: CourtListener court id (mo, moctapp, moctapped, moctappwd, moctappsd, moed, mowd, ca8).
      - name: docket_number
        description: Court's docket number.
      - name: date_filed
        description: Date the opinion was filed.
      - name: disposition
        description: CourtListener's disposition field, verbatim (free text, e.g. "AFFIRMED IN PART; REVERSED IN PART AND REMANDED").
      - name: outcome
        description: >
          The decision in a fixed vocabulary (mogov.classify_outcome): affirmed, reversed, reversed and
          remanded, affirmed in part, reversed in part, vacated, remanded, dismissed, writ granted, writ
          denied, transferred, or other (a disposition that fits no class, e.g. "SUSPENDED"). Read from the
          disposition when present, else from decree phrases at the end of the opinion (API rows with
          COURTLISTENER_TOKEN). Null when neither exists - most bulk rows, since CourtListener records few
          dispositions for Missouri cases.
        data_tests:
          - accepted_values:
              arguments:
                values: ['affirmed', 'reversed', 'reversed and remanded', 'affirmed in part, reversed in part',
                         'vacated', 'remanded', 'dismissed', 'writ granted', 'writ denied', 'transferred', 'other']
      - name: judges_text
        description: Judges as printed in the opinion.
      - name: attorneys_text
        description: Counsel as printed in the opinion.
      - name: publication_status
        description: "`Published` or `Unpublished` (precedential status)."
      - name: source_url
        description: "{{ doc('source_url') }}"

  - name: fct_campaign_spending
    description: >
      How each official's state campaign committees spent their money: itemized expenditures with payee,
      purpose and amount. TAP mirror for report years through 2022, MEC's own export (CD3 Part B, items
      over $100) for 2023+ when the MEC loader has run. Committees are attributed as in
      fct_campaign_finance. Grain: one itemized expenditure as filed. TAP rows include contributions to
      other committees, which fct_campaign_finance also lists as `given`.
    columns:
      - name: official_id
        description: "{{ doc('official_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_official')
                field: official_id
      - name: expenditure_date
        description: Date paid, as reported.
      - name: amount
        description: USD. Negative values are refunds/corrections as filed.
      - name: payee_name
        description: Who was paid (company, or person's name).
      - name: payee_city
        description: Payee city as reported.
      - name: payee_state
        description: Payee state as reported.
      - name: purpose
        description: Purpose as the committee described it (e.g. "Newspaper Insert for Election", "Postage").
      - name: expenditure_type
        description: How it was paid (e.g. "Paid", "Credit" / in-kind), as reported.
      - name: committee_name
        description: The official's committee that spent the money.
      - name: mec_committee_id
        description: MEC committee id (MECID).
      - name: match_confidence
        description: "{{ doc('match_confidence') }}"
      - name: source
        description: "`MEC` or `MEC (via Accountability Project)`."
      - name: source_url
        description: "{{ doc('source_url') }}"

  - name: fct_campaign_reports
    description: >
      Cover-page totals of every campaign finance report filed by an official's state committees (MEC
      direct export, report years 2023+; needs the MEC loader). The quick "raised $X, spent $Y, $Z in
      the bank" view without summing itemized rows. "This period" amounts cover the report alone;
      "this election" totals accumulate across the election's reports (total = previous + this period,
      which holds for 99.98% of full reports). Grain: one filed report. Amended reports are separate rows
      (report_name starts "AMENDED"); "Limited Activity" reports carry no amounts.
    columns:
      - name: official_id
        description: "{{ doc('official_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_official')
                field: official_id
      - name: committee_name
        description: The official's committee that filed the report.
      - name: mec_committee_id
        description: MEC committee id (MECID).
      - name: report_id
        description: MEC report id; amendments get their own.
      - name: report_name
        description: Report as MEC names it (e.g. "October Quarterly Report", "AMENDED April Quarterly Report", "8 Day Before General Election-11/3/2026").
      - name: report_year
        description: Year the report belongs to.
      - name: report_type
        description: "`Full Disclosure`, `Limited Activity`, `Termination`, ..."
      - name: contributions_received
        description: Monetary contributions received this period (USD).
      - name: loans_received
        description: Loans received this period (USD).
