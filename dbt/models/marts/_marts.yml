version: 2

# Every mart is keyed by official_id (see the official_id doc block in models/_docs.md) and covers the
# officials in dim_official: people holding a tracked Missouri office today. History about them (past
# offices, old votes, old cases) is included; former officials who left office are not.

models:
  - name: dim_official
    description: >
      One row per current Missouri public official: the 6 statewide executives, the General Assembly
      (House roster from the House's own XML; Senate from Open States), the congressional delegation,
      mayors Open States tracks, Missouri state judges (Official Manual) and federal judges seated in
      Missouri (FJC). Grain: official. Identity and cross-system ids live here; every fact joins to it.
    columns:
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }}"
        data_tests: [unique, not_null]
      - name: full_name
        data_type: varchar
        description: Display name as the authoritative roster prints it (may include suffixes, e.g. "Jr.", "II").
        data_tests: [not_null]
      - name: given_name
        data_type: varchar
        description: First name (sometimes with middle name); used for name matching.
      - name: family_name
        data_type: varchar
        description: Surname; used for name matching against sources that only carry names.
      - name: party
        data_type: varchar
        description: >
          Current party, normalized across sources (mogov.normalize_party): Republican, Democratic,
          Independent or Libertarian. Null for judges and non-partisan offices.
        data_tests:
          - accepted_values:
              arguments:
                values: ['Republican', 'Democratic', 'Independent', 'Libertarian']
      - name: level
        data_type: varchar
        description: "{{ doc('level') }}"
        data_tests:
          - accepted_values:
              arguments:
                values: ['state', 'federal', 'local']
      - name: office
        data_type: varchar
        description: "{{ doc('office') }}"
        data_tests: [not_null]
      - name: office_title
        data_type: varchar
        description: Human-readable office, e.g. "State Representative", "Circuit Judge, 22 Judicial Circuit".
      - name: district
        data_type: varchar
        description: Legislative/congressional district, judicial circuit or court district; null for statewide offices.
      - name: current_term_start
        data_type: date
        description: Start of the current term where the roster records it (often null for state judges).
      - name: current_term_end
        data_type: date
        description: Scheduled end of the current term where known.
      - name: openstates_id
        data_type: varchar
        description: Open States person id (ocd-person/...), when the person is in Open States.
      - name: bioguide_id
        data_type: varchar
        description: Congressional Biographical Directory id (members of Congress).
      - name: icpsr
        data_type: integer
        description: ICPSR id, Voteview's member key (members of Congress).
      - name: opensecrets_id
        data_type: varchar
        description: OpenSecrets (CRP) candidate id (members of Congress).
      - name: votesmart_id
        data_type: varchar
        description: Vote Smart candidate id (members of Congress).
      - name: wikidata_qid
        data_type: varchar
        description: Wikidata item id (Q...), from congress-legislators or the Open States roster.
      - name: senate_lis_id
        data_type: varchar
        description: U.S. Senate LIS member id (senators).
      - name: email
        data_type: varchar
        description: Public office email from Open States.
      - name: image_url
        data_type: varchar
        description: Official portrait URL from Open States.
      - name: hometown
        data_type: varchar
        description: Hometown as Open States records it.

  - name: official_profile
    description: >
      One row per official: identity headline, a count of records per category, and a coverage status per
      category explaining any gap (so "no rows" is never silent). Grain: official. The intended entry point
      for a profile page.
    columns:
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }}"
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_official')
                field: official_id
      - name: full_name
        data_type: varchar
        description: As in dim_official.
      - name: party
        data_type: varchar
        description: As in dim_official.
      - name: level
        data_type: varchar
        description: "{{ doc('level') }}"
      - name: office
        data_type: varchar
        description: "{{ doc('office') }}"
      - name: office_title
        data_type: varchar
        description: As in dim_official.
      - name: district
        data_type: varchar
        description: As in dim_official.
      - name: is_judge_or_lawyer
        data_type: boolean
        description: True when fct_legal_careers has any row for the official (drives case-history coverage).
      - name: n_votes
        data_type: bigint
        description: Rows in fct_votes.
      - name: n_donations
        data_type: bigint
        description: Rows in fct_campaign_finance.
      - name: n_lobbyist_gifts
        data_type: bigint
        description: Rows in fct_lobbyist_gifts.
      - name: n_disclosures
        data_type: bigint
        description: Rows in fct_disclosures.
      - name: n_bias_indicators
        data_type: bigint
        description: Rows in fct_bias_indicators.
      - name: n_past_offices
        data_type: bigint
        description: Rows in fct_office_history.
      - name: n_commercial_ties
        data_type: bigint
        description: Rows in fct_commercial_ties.
      - name: n_family_ties
        data_type: bigint
        description: Rows in fct_family_ties.
      - name: n_cases
        data_type: bigint
        description: Rows in fct_case_history.
      - name: n_voluntary_disclosures
        data_type: bigint
        description: Rows in fct_voluntary_disclosures.
      - name: votes_status
        data_type: varchar
        description: "{{ doc('coverage_status') }}"
      - name: donations_status
        data_type: varchar
        description: "{{ doc('coverage_status') }}"
      - name: disclosures_status
        data_type: varchar
        description: "{{ doc('coverage_status') }}"
      - name: voluntary_disclosures_status
        data_type: varchar
        description: "{{ doc('coverage_status') }}"
      - name: bias_status
        data_type: varchar
        description: "{{ doc('coverage_status') }}"
      - name: commercial_ties_status
        data_type: varchar
        description: "{{ doc('coverage_status') }}"
      - name: family_ties_status
        data_type: varchar
        description: "{{ doc('coverage_status') }}"
      - name: cases_status
        data_type: varchar
        description: "{{ doc('coverage_status') }}"

  - name: fct_office_history
    description: >
      Past and present offices held by each official, from every source that records careers: Open States
      roles, congress-legislators terms, the statewide seed, earlier statewide terms of current officials (Official
      Manual listings with exact dates from the statewide_office_handovers seed, terms from 2000 on: Malek's 2023
      appointment as Treasurer, Fitzpatrick's 2019-2023 Treasurer term), FJC appointments, Wikidata "position held",
      CourtListener's judge database, and appointment/election sentences in Official Manual judge bios.
      Grain: one row per (official, office_title, start_date); when several sources report the same term,
      the most authoritative is kept (seed and FJC > congress-legislators > Open States > Wikidata >
      CourtListener > Official Manual sentences).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [official_id, office_title, start_date]
    columns:
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_official')
                field: official_id
      - name: office_title
        data_type: varchar
        description: >
          Office as the source names it. Official Manual rows hold the whole sentence, e.g. "Appointed to the
          Court of Appeals by Governor Parson in 2021".
        data_tests: [not_null]
      - name: district
        data_type: varchar
        description: District or seat qualifier where the source has one.
      - name: jurisdiction
        data_type: varchar
        description: Open States / OCD jurisdiction id, or the source name where there is none (fjc, wikidata...).
      - name: start_date
        data_type: date
        description: Term start. Official Manual rows only know the year (stored as January 1).
      - name: end_date
        data_type: date
        description: Term end; null when ongoing or unknown.
      - name: source
        data_type: varchar
        description: Which source this row came from (openstates, congress-legislators, fjc, wikidata, courtlistener, statewide_officials seed, Missouri Official Manual <edition>).

  - name: fct_audit_reports
    description: >
      Missouri State Auditor reports (1999 to now) with the performance rating the Auditor printed in the report's
      Citizens Summary: "In the areas audited, the overall performance of this entity was Good." The rating
      covers only the areas audited, not the whole operation of the entity. Ratings exist from 2012 and only
      for audits the Auditor rates (not performance audits, financial statements or follow-ups); rating_status says why a
      row has none. Grain: one row per report. The people an audit of a statewide office is credited to (everyone who held
      the office during the period the audit covers, or for most reports, which name no period, in the year before
      release) are in fct_audit_report_officeholders; here only their count and basis (`release_window` is an
      approximation). A county audit is never linked to a person: the Auditor says a county's rating does not indicate the
      performance of any one elected official.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [report_number]
    columns:
      - name: report_number
        data_type: varchar
        description: Compact report number, year then sequence ("2018063").
        data_tests: [not_null]
      - name: report_number_display
        data_type: varchar
        description: Report number as the Auditor prints it ("2018-063").
      - name: report_year
        data_type: integer
        description: Year in the report number.
      - name: release_date
        data_type: date
        description: Date the report was released.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: "'1999-01-01'"
                max_value: "current_date"
      - name: title
        data_type: varchar
        description: Audited entity or subject, as the Auditor titles the report ("Scott County", "Office of State Treasurer").
      - name: entity_type
        data_type: varchar
        description: "`statewide_office` (the audit of a statewide elected office), `county`, or `other` (state agencies, cities, courts, schools, statewide reports)."
        data_tests:
          - accepted_values:
              arguments:
                values: [statewide_office, county, other]
      - name: office
        data_type: varchar
        description: Key of the statewide office (as in statewide_officials) for `statewide_office` audits; null otherwise.
      - name: rating
        data_type: varchar
        description: "Excellent, Good, Fair or Poor, as printed; null when the report has no rating."
        data_tests:
          - accepted_values:
              arguments:
                values: [Excellent, Good, Fair, Poor]
      - name: rating_level
        data_type: integer
        description: "Excellent 4, Good 3, Fair 2, Poor 1: orders the ratings. Null without a rating."
      - name: rating_status
        data_type: varchar
        description: >
          `ok` (rating read), `no_rating_sentence` (the PDF was read and the Auditor gave no rating, as in performance
          audits), `not_read` (the loader opened no PDF: financial statements, monthly reports, follow-ups, reports
          before 2012), `http_<code>` or `unreadable` (the PDF could not be fetched or parsed).
        data_tests: [not_null]
      - name: rating_sentence
        data_type: varchar
        description: The sentence the rating was read from, as extracted from the PDF text.
      - name: rating_page
        data_type: integer
        description: Page of the PDF that sentence is on (1-based).
      - name: rating_pdf_url
        data_type: varchar
        description: The PDF the rating was read from (Citizens Summary, or the full report where there is no summary).
      - name: full_report_url
        data_type: varchar
        description: The full report PDF.
      - name: citizens_summary_url
        data_type: varchar
        description: The one-page Citizens Summary PDF, where the Auditor published one.
      - name: audit_period_start
        data_type: date
        description: First day of the period the report title names ("Year Ended June 30, 2015" starts 2014-07-01); null when the title names none.
      - name: audit_period_end
        data_type: date
        description: Last day of the period the report title names; null when the title names none.
      - name: officeholder_link_basis
        data_type: varchar
        description: "How fct_audit_report_officeholders chose the people for this audit: `audit_period` (the title names a period) or `release_window` (it does not). Null for audits that are not of a statewide office."
        data_tests:
          - accepted_values:
              arguments:
                values: [audit_period, release_window]
      - name: officeholder_count
        data_type: integer
        description: Number of people in fct_audit_report_officeholders for this report; 0 for any audit that is not of a statewide office.

  - name: fct_audit_report_officeholders
    description: >
      The people an audit of a statewide office is credited to. Most rows are an
      approximation: `link_basis` = `release_window` means the report title names no period, so the people are
      those in office from January 1 of the year before the release through the release date, not a period the audit
      states. Only `audit_period` rows follow a period the title names. Grain: one row per (report, person). Only audits of a statewide office have rows; a county audit never
      does. link_basis says what "during the audit" means for the row: `audit_period` when the report title names
      the period it covers ("Period July 1, 2022 through January 9, 2023", "Year Ended June 30, 2015"), else
      `release_window`, the calendar year before the release through the release date. Most titles name no period,
      so most rows are `release_window`: the link says "in office when the audit was probably being done", not
      "audited". Terms come from the Official Manual in whole years (a term starts on the second Monday of January of its
      first year, when regular terms begin: 2017-01-09, 2021-01-11, 2025-01-13), so a term ending in an inauguration
      year (2017, 2021, 2025) ends that day; a window that ends on the hand-over day is credited to the outgoing holder only. Mid-term changes the Manual does not
      date use the exact dates in the statewide_office_handovers seed; one missing from the seed credits both holders
      for that whole year.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [report_number, office, full_name, term_start_year]
    columns:
      - name: report_number
        data_type: varchar
        description: Compact report number, as in fct_audit_reports.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_audit_reports')
                field: report_number
      - name: office
        data_type: varchar
        description: Key of the statewide office (as in statewide_officials).
        data_tests: [not_null]
      - name: full_name
        data_type: varchar
        description: The officeholder's name as the Official Manual prints it.
        data_tests: [not_null]
      - name: party
        data_type: varchar
        description: Party letter from the Official Manual (D, R, U...).
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }} Set only when the person also holds a tracked office today (matched on first and last name); null for people who left public life."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_official')
                field: official_id
      - name: term_start_year
        data_type: integer
        description: First year of the person's term in this office, per the Official Manual.
      - name: term_end_year
        data_type: integer
        description: Last year of the term; null while the person still holds the office.
      - name: link_basis
        data_type: varchar
        description: "`audit_period` or `release_window`; see the model description."
        data_tests:
          - accepted_values:
              arguments:
                values: [audit_period, release_window]
      - name: window_start
        data_type: date
        description: Start of the window the person's term was matched against.
      - name: window_end
        data_type: date
        description: End of that window (the audit period's end, or the release date).

  - name: fct_votes
    description: >
      Roll-call votes by current officials, including votes cast in earlier offices (e.g. a state senator's
      House votes). Missouri House from roll-call PDFs, Missouri Senate from daily journals (both for the
      last MOGOV_LOOKBACK_YEARS), Congress from Voteview. Grain: (official, vote_id). Votes whose printed
      name couldn't be tied to exactly one person are left out rather than guessed.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [official_id, chamber, vote_id]
    columns:
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }}"
        data_tests: [not_null]
      - name: full_name
        data_type: varchar
        description: As in dim_official.
      - name: chamber
        data_type: varchar
        description: "`state_house`, `state_senate`, `us_house` or `us_senate`."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [state_house, state_senate, us_house, us_senate]
      - name: session_code
        data_type: varchar
        description: MO House session code (YY + type, e.g. 251), Senate journal year, or Congress number.
      - name: vote_id
        data_type: varchar
        description: Identifier of the roll call within the chamber (unique per chamber).
      - name: vote_date
        data_type: date
        description: Date of the vote.
      - name: measure
        data_type: varchar
        description: Bill or resolution voted on (e.g. "HCS HB 10"), where the record names one.
      - name: vote_description
        data_type: varchar
        description: What was voted on - the House calendar item, the Senate journal sentence introducing the vote, or Voteview's description.
      - name: vote_cast
        data_type: varchar
        description: "{{ doc('vote_cast') }}"
        data_tests:
          - accepted_values:
              arguments:
                values: ['yea', 'nay', 'present', 'absent', 'absent with leave', 'not voting', 'recused']
      - name: party_at_vote
        data_type: varchar
        description: Party of the official when the vote was cast (state) or current party (federal), normalized as in dim_official.party.
        data_tests:
          - accepted_values:
              arguments:
                values: ['Republican', 'Democratic', 'Independent', 'Libertarian']
      - name: source_url
        data_type: varchar
        description: "{{ doc('source_url') }}"

  - name: fct_federal_votes
    description: >
      Every roll-call vote cast by a current member of Missouri's congressional delegation in the loaded
      congresses (MOGOV_VOTEVIEW_CONGRESSES), with Voteview's question and result. Grain: (official,
      congress, chamber, rollnumber). Its rows are also unioned into fct_votes.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [official_id, congress, chamber, rollnumber]
    columns:
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }}"
      - name: full_name
        data_type: varchar
        description: As in dim_official.
      - name: congress
        data_type: integer
        description: Congress number (119 = 2025-2027).
      - name: chamber
        data_type: varchar
        description: "`House` or `Senate` (Voteview spelling)."
      - name: rollnumber
        data_type: integer
        description: Roll-call number within the congress and chamber.
      - name: vote_date
        data_type: date
        description: Date of the vote.
      - name: bill_number
        data_type: varchar
        description: Bill number, when the vote was on a bill.
      - name: vote_question
        data_type: varchar
        description: Question put to the chamber (e.g. "On Passage").
      - name: vote_desc
        data_type: varchar
        description: Voteview's short description of the measure.
      - name: dtl_desc
        data_type: varchar
        description: Voteview's detailed description, where present.
      - name: vote_result
        data_type: varchar
        description: Outcome of the roll call (e.g. "Passed").
      - name: vote_cast
        data_type: varchar
        description: "{{ doc('vote_cast') }}"
      - name: source_url
        data_type: varchar
        description: "{{ doc('source_url') }}"
        data_tests: [not_null]

  - name: fct_federal_vote_bills
    description: >
      Which federal bill each House or Senate roll call was taken on, read from the roll calls the GovInfo BILLSTATUS
      bill actions cite and joined to Voteview. The vote is not always on the bill itself: many are procedural
      (motion to recommit, ordering the previous question on the rule's H.Res., motion to proceed, cloture, tabling),
      so read `vote_question` before calling a row a vote for or against the bill. Amendment roll calls are not
      linked (BILLSTATUS keeps them under `<amendments>`, which is not parsed yet, #738). BILLSTATUS numbers a roll call by the chamber clerk's number within
      the session; Voteview's `rollnumber` runs across the Congress, so the join uses Voteview's `clerk_rollnumber`
      and `session`. Only roll calls both sources know are listed: it covers the loaded BILLSTATUS Congresses and
      bill types, so a roll call absent here means no bill was found, not that none exists (votes on nominations,
      quorum calls and some procedural questions cite no bill). Grain: (congress, chamber, rollnumber, bill_id).
      Join to fct_federal_votes on (congress, chamber, rollnumber) to see each Missouri member's vote on the bill.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [congress, chamber, rollnumber, bill_id]
    columns:
      - name: congress
        data_type: integer
        description: Congress number (119 = 2025-2027).
      - name: chamber
        data_type: varchar
        description: "`House` or `Senate` (Voteview spelling)."
        data_tests:
          - accepted_values:
              arguments:
                values: ['House', 'Senate']
      - name: rollnumber
        data_type: integer
        description: Voteview roll-call number within the congress and chamber (as in fct_federal_votes).
        data_tests: [not_null]
      - name: session
        data_type: integer
        description: Session of the Congress (1 or 2).
      - name: clerk_rollnumber
        data_type: integer
        description: The chamber clerk's roll-call number within the session, which BILLSTATUS cites.
      - name: vote_date
        data_type: date
        description: Date of the vote (Voteview).
      - name: bill_id
        data_type: varchar
        description: "`<congress>-<type>-<number>`, e.g. 118-hr-815."
        data_tests: [not_null]
      - name: bill_type
        data_type: varchar
        description: hr, s, hjres, sjres, hconres, sconres, hres or sres.
      - name: bill_no
        data_type: integer
        description: Bill number within its type and congress.
      - name: bill_title
        data_type: varchar
        description: The bill's title as published.
      - name: legislation_url
        data_type: varchar
        description: Congress.gov page of the bill.
      - name: voteview_bill_number
        data_type: varchar
        description: Voteview's own bill text for the roll call (e.g. HR815), kept for comparison; null for some roll calls it ties to no bill.
      - name: vote_question
        data_type: varchar
        description: Question put to the chamber (e.g. "On Passage").
      - name: vote_result
        data_type: varchar
        description: Outcome of the roll call (e.g. "Passed").
      - name: yea_count
        data_type: integer
        description: Yea votes cast.
      - name: nay_count
        data_type: integer
        description: Nay votes cast.
      - name: source_url
        data_type: varchar
        description: "{{ doc('source_url') }}"
        data_tests: [not_null]

  - name: fct_federal_sponsorship
    description: >
      Federal bills sponsored or cosponsored by Missouri's members of Congress, from the GovInfo BILLSTATUS bulk
      XML (loaded congresses, MOGOV_BILLSTATUS_CONGRESSES), with the outcome as a fact: became_law is true when
      the bill carries a law number, public or private (law_type says which; a private law relieves one named person
      or entity and is rare, none among the 118th Congress's bills). Withdrawn cosponsorships are dropped. Whether that counts as a
      "successful" bill is a policy call this model does not make. Grain: (bioguide_id, bill_id, role).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [bioguide_id, bill_id, role]
    columns:
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }} Null for members who are no longer in office."
      - name: bioguide_id
        data_type: varchar
        description: Bioguide id of the member (joins congress_legislators).
        data_tests: [not_null]
      - name: full_name
        data_type: varchar
        description: Name as printed in the bill file, with party and state, e.g. "Rep. Graves, Sam [R-MO-6]".
      - name: party
        data_type: varchar
        description: Party letter as printed in the bill file (R, D, I).
      - name: role
        data_type: varchar
        description: "`sponsor` or `cosponsor`."
        data_tests:
          - accepted_values:
              arguments:
                values: ['sponsor', 'cosponsor']
      - name: is_original_cosponsor
        data_type: boolean
        description: True for a cosponsor who signed on when the bill was introduced; false for sponsors.
      - name: bill_id
        data_type: varchar
        description: "`<congress>-<type>-<number>`, e.g. 119-hr-1."
        data_tests: [not_null]
      - name: congress
        data_type: integer
        description: Congress number (119 = 2025-2027).
      - name: bill_type
        data_type: varchar
        description: hr, s, hjres, sjres, hconres, sconres, hres or sres.
      - name: bill_number
        data_type: integer
        description: Bill number within its type and congress.
      - name: introduced_date
        data_type: date
        description: Date the bill was introduced.
      - name: title
        data_type: varchar
        description: The bill's title as published.
      - name: policy_area
        data_type: varchar
        description: Congress.gov policy area (one per bill); null before one is assigned.
      - name: latest_action_date
        data_type: date
        description: Date of the bill's most recent action.
      - name: latest_action_text
        data_type: varchar
        description: Text of the most recent action, as published.
      - name: law_type
        data_type: varchar
        description: Public Law or Private Law, when the bill became law; null otherwise.
        data_tests:
          - accepted_values:
              arguments:
                values: [Public Law, Private Law]
      - name: law_number
        data_type: varchar
        description: Law number, e.g. 119-21, when the bill became law. Public and private laws are numbered
          separately, so read it with law_type. When a bill carries two laws, the earliest by number.
      - name: became_law
        data_type: boolean
        description: True when the bill carries a law number, public or private.
        data_tests: [not_null]
      - name: source_url
        data_type: varchar
        description: The bill's page on congress.gov.
        data_tests: [not_null]

  - name: fct_campaign_finance
    description: >
      Money into and out of each official's campaign committees. Federal: FEC committee contributions (pas2)
      for every FEC candidate id the official has used, plus their leadership PACs. State: MEC itemized
      contributions for committees attributed to the official (int_mec__official_committees) - the TAP
      mirror for report years through 2022, MEC's own exports for 2023+. Individual federal donors are
      summarized in fct_federal_donor_summary instead of listed. Grain: (official_id, direction, source_record_id),
      one itemized transaction per official and direction.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [official_id, direction, source_record_id]
    columns:
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }}"
      - name: direction
        data_type: varchar
        description: "`received` = money given to the official's committee; `given` = contributions made by the official's committee or leadership PAC."
        data_tests:
          - accepted_values:
              arguments:
                values: ['received', 'given']
      - name: level
        data_type: varchar
        description: "`federal` (FEC) or `state` (MEC)."
      - name: transaction_date
        data_type: date
        description: Date of the contribution as reported.
      - name: amount
        data_type: decimal(28,6)
        description: >
          Amount in USD. Negative values are refunds/corrections as filed. Sanity bound: fails at $10M either way
          (largest through 2026: $880,000; refunds down to -$11,600).
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -10000000
                max_value: 10000000
                inclusive: false
      - name: counterparty
        data_type: varchar
        description: The other party - the donor for `received`, the recipient for `given`.
      - name: counterparty_organization
        data_type: varchar
        description: Donor's employer/company, or the connected organization of a giving PAC.
      - name: counterparty_type
        data_type: varchar
        description: >
          Kind of counterparty. MEC: Individual / Committee / Organization / Corporation; given rows:
          "committee or candidate", "candidate committee" or "charity". FEC received rows carry the giving
          committee's type as FEC names it (seed fec_committee_types), e.g. "PAC - qualified", "Party -
          qualified", "House", "Hybrid PAC (with Non-Contribution Account) - Qualified".
      - name: kind
        data_type: varchar
        description: Free-text description of the transaction (e.g. "monetary to Friends of X", "direct contribution").
      - name: source
        data_type: varchar
        description: "`FEC`, `MEC`, or `MEC (via Accountability Project)`."
      - name: match_confidence
        data_type: varchar
        description: "{{ doc('match_confidence') }}"
      - name: source_url
        data_type: varchar
        description: "{{ doc('source_url') }}"
      - name: source_record_id
        data_type: varchar
        description: >
          The source row's own identity, prefixed by its feed: `fec:` (FEC sub_id), `tap_contrib:` (TAP contribution: the staged `record_id`, TAP's own id (txn or cd1_a_id), deduplicated in staging because TAP loaded some transactions twice and exports two overlapping layouts), `tap_cd3_b:` (TAP expenditure id, cd3_b_id), `mec_cd1_a:` / `mec_cd3_c:` (MEC export record ids). Contribution and expenditure ids are separate id spaces, so each gets its own prefix and a raw id can't collide across them.
        data_tests: [not_null]
      - name: counterparty_mec_committee_id
        data_type: varchar
        description: >
          State `received` rows from a committee donor: the donor committee's own MECID, when its name (as the
          receiving committee reported it) matches exactly one Missouri committee active that year
          (int_mec__donor_committees). MEC records no ID for the donor, so this is a name match. Null otherwise.
      - name: counterparty_link_confidence
        data_type: varchar
        description: >
          How counterparty_mec_committee_id was matched: `high` = curated alias, MECID written into the name, or same
          name (case ignored; punctuation and other non-alphanumeric characters turned into spaces; runs of spaces collapsed, not removed), `medium` = normalized name (abbreviations spelled out) or
          core name (words like PAC, Political, Action, Committee, Fund dropped, or a parenthesized short name).
          Null when there's no link.
        data_tests:
          - accepted_values:
              arguments:
                values: ['high', 'medium']

  - name: fct_federal_donor_summary
    description: >
      Federal fundraising per member per cycle. `cycle total` rows come from FEC's candidate summary
      (receipts, individual/PAC/party money, self-funding, disbursements, cash on hand). `by_employer`,
      `by_size` and `by_state` rows are the FEC API's aggregates of individual contributions (only when
      FEC_API_KEY is set): `by_employer` and `by_state` cover itemized donors only, while `by_size` bucket `0`
      ($200 and under) also includes unitemized money, so the size buckets add up to about the cycle's
      `individual contributions` total. Grain: (official, cycle, aggregate_kind, bucket). A member with several FEC
      candidate ids that FEC reports against one committee is counted once; separate campaigns are summed.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [official_id, cycle, aggregate_kind, bucket]
    columns:
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }}"
      - name: cycle
        data_type: integer
        description: Two-year election cycle (e.g. 2026).
      - name: aggregate_kind
        data_type: varchar
        description: "`cycle total`, `by_employer`, `by_size` or `by_state`."
      - name: bucket
        data_type: varchar
        description: The metric (for cycle totals, e.g. "total receipts") or the group (an employer, a size band, a state).
      - name: total
        data_type: decimal(28,6)
        description: USD.
      - name: contribution_count
        data_type: bigint
        description: Number of contributions in the bucket (aggregates only).

  - name: fct_lobbyist_gifts
    description: >
      Lobbyist expenditures on current state officials (meals, tickets, travel, gifts) from MEC lobbyist
      reports: the TAP mirror for 2004-2018 and, with the MEC loader, MEC's export for 2019+. Missouri's
      Amendment 1 (Dec 2018) banned most gifts over $5, so volumes drop sharply after 2018. Grain:
      (official_id, gift_key), one reported expenditure; rows whose recipient name fits more than one official are dropped.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [official_id, gift_key]
    columns:
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }}"
      - name: expenditure_date
        data_type: date
        description: Date of the expenditure.
      - name: expenditure_year
        data_type: bigint
        description: Year of expenditure_date.
      - name: amount
        data_type: decimal(28,6)
        description: >
          USD; negative values are corrections as filed. Sanity bound: the largest gift through 2026 was $3,045.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -100000
                max_value: 100000
                inclusive: false
      - name: lobbyist_name
        data_type: varchar
        description: Reporting lobbyist.
      - name: lobbyist_principal
        data_type: varchar
        description: The organization the lobbyist was paid to represent.
      - name: expenditure_category
        data_type: varchar
        description: Category as filed (Meals, Food & Beverage / Travel / Gift / Entertainment / ...); capitalization differs between the two sources.
      - name: description
        data_type: varchar
        description: Lobbyist's description of the expenditure.
      - name: recipient_title
        data_type: varchar
        description: Recipient's role as reported (REPRESENTATIVE, SENATOR, SPOUSE OR CHILD, ...).
      - name: recipient_raw
        data_type: varchar
        description: Recipient as written on the report ("LAST, FIRST").
      - name: match_confidence
        data_type: varchar
        description: "{{ doc('match_confidence') }}"
      - name: source
        data_type: varchar
        description: "`MEC lobbyist reports` or `MEC lobbyist reports (via Accountability Project)`."
      - name: gift_key
        data_type: varchar
        description: >
          Surrogate key: hash of every reported field plus the occurrence number among identical rows. The lobbyist reports carry no per-row id, and identical entries (two same-day $25 meals) are real, distinct expenditures.
        data_tests: [not_null]

  - name: fct_disclosures
    description: >
      Mandatory financial disclosure line items: U.S. House Clerk annual reports and periodic transaction
      reports (PDF text, tagged by schedule), Senate eFD reports (structured tables), and federal judges'
      AO-10 reports via CourtListener (mostly 2020 and earlier). Missouri state officials' and judges'
      personal financial disclosures are not online (see official_profile.disclosures_status). Grain:
      (official_id, disclosure_item_id), one disclosed item; scanned filings appear once with section "document (not text-extractable; see PDF)", filings whose PDF the loader failed to download or extract once with "document (download or text extraction failed; see PDF)" (the PDF link may itself be dead), and filings of a type the loader never fetches (e.g. extension requests) once with "document (not fetched; see PDF)".
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [official_id, disclosure_item_id]
    columns:
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }}"
      - name: disclosure_type
        data_type: varchar
        description: "`U.S. House financial disclosure`, `U.S. Senate financial disclosure` or `Federal judicial financial disclosure (AO-10)`."
      - name: filing_kind
        data_type: varchar
        description: Report kind - annual report, periodic transaction report, amendment, candidate report, extension request...
      - name: report_year
        data_type: integer
        description: Calendar year the report covers.
      - name: filing_date
        data_type: date
        description: Date filed (null for AO-10 rows).
      - name: section
        data_type: varchar
        description: "Report part the item sits in (e.g. \"A: assets\", \"Part 8. Positions\", \"investment\")."
      - name: owner
        data_type: varchar
        description: Whose item it is, as the form codes it - SP/Spouse, DC/Child, JT/Joint, Self; blank on forms without an owner column.
      - name: amount
        data_type: varchar
        description: Value as disclosed - usually a range band ("$15,001 - $50,000") or an AO-10 letter code, not a number.
      - name: description
        data_type: varchar
        description: The item text (asset, income source, position, transaction...).
      - name: document_url
        data_type: varchar
        description: Link to the filed report.
        data_tests: [not_null]
      - name: is_garbled
        data_type: boolean
        description: >
          True when the item is a federal judge's AO-10 item whose OCR text is unreadable (mogov.is_garbled_text,
          e.g. "SIE = RE"). The row still counts as a disclosed item but is left out of fct_commercial_ties and
          fct_family_ties. Investments are never flagged; always false for House and Senate rows (not checked).
        data_tests:
          - not_null
      - name: disclosure_item_id
        data_type: varchar
        description: >
          The source item's own identity: `house:` filing id + PDF page + line (or filing id alone for an unparsed scan), `senate:` eFD table row, `courtlistener:` AO-10 table + row id. Identical-looking items on one report are distinct source rows.
        data_tests: [not_null]
      - name: report_version
        data_type: integer
        description: >
          0 for an original report, N for amendment N (Senate "(amendment N)"; a House "amended report" is 1; an AO-10 pdf named `..._1.pdf` is 1).
        data_tests: [not_null]
      - name: is_latest_version
        data_type: boolean
        description: >
          True when this row's report is the newest version of its report: same filer, source and report year, an annual report or one of its amendments, preferring a readable version over a scan with no extractable text, then the highest report_version, then the latest filing_date. Periodic transaction reports, candidate reports (Senate ones carry no report year to match on) and extension requests are separate filings, so each is its own latest. Filter on it for any item count or sum; leave it off to list every filing. Assumes an amendment restates the whole report.
        data_tests: [not_null]

  - name: fct_voluntary_disclosures
    description: >
      Voluntary disclosures (financial statements, conflict-of-interest or recusal notices) officials
      published without being required to. No feed exists, so they're hand-curated in
      seeds/voluntary_disclosures.csv and matched by name. Grain: (official_id, disclosure_date, kind, source_url), one disclosure.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [official_id, disclosure_date, kind, source_url]
    columns:
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }}"
      - name: disclosure_date
        data_type: date
        description: Date published.
      - name: kind
        data_type: varchar
        description: Kind of disclosure as curated.
      - name: description
        data_type: varchar
        description: What was disclosed.
      - name: source_url
        data_type: varchar
        description: "{{ doc('source_url') }}"

  - name: fct_party_unity_yearly
    description: >
      Party-line votes per official, chamber and calendar year of the vote: how many they cast (yea or nay,
      where the Republican and Democratic majorities from int_votes__party_positions took opposite sides) and
      how many went with their own party's majority. The party is the one held at the vote, so a member who
      switched parties counts each vote under the party then held. Summed by fct_bias_indicators into the
      lifetime party_unity_pct and read by rpt_awards for the yearly Maverick and Team Player awards. Votes with
      no date have a null vote_year. Grain: one row per (official, chamber, vote year).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [official_id, chamber, vote_year]
      - dbt_utils.expression_is_true:
          arguments:
            expression: with_party_votes between 0 and party_line_votes
    columns:
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }}"
        data_tests: [not_null]
      - name: chamber
        data_type: varchar
        description: Chamber whose votes were counted.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['state_house', 'state_senate', 'us_house', 'us_senate']
      - name: vote_year
        data_type: bigint
        description: Calendar year of the vote; null when the vote has no date.
      - name: party_line_votes
        data_type: bigint
        description: >
          Yea or nay votes cast on party-line votes. Sanity bound: the busiest official-year loaded has about 600,
          and no chamber has ever held 2,000 party-line votes in a year.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 2000
      - name: with_party_votes
        data_type: bigint
        description: Of those, how many matched the majority position of the party held at the vote.

  - name: fct_bias_indicators
    description: >
      Measured lean, not judgments. One row per (official, indicator, period, detail):
      `dw_nominate_dim1` Voteview, Congress, -1 liberal .. +1 conservative (economic dimension);
      `shor_mccarty_np` state legislators 1993-2022, negative liberal / positive conservative, comparable
      across states; `party_unity_pct` share of party-line votes (majorities of R and D opposed) where the official
      voted with their own party's majority, one row per chamber. The majorities count every member who
      voted (int_votes__party_positions), not only the officials tracked today.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [official_id, indicator, period, detail]
    columns:
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }}"
      - name: indicator
        data_type: varchar
        description: Which measure (see the model description).
        data_tests:
          - accepted_values:
              arguments:
                values: ['dw_nominate_dim1', 'shor_mccarty_np', 'party_unity_pct']
      - name: chamber
        data_type: varchar
        description: >
          Chamber the value was measured in: the Congress chamber (DW-NOMINATE), the last legislative chamber
          served in (Shor-McCarty), or the chamber whose votes were counted (party unity). May differ from
          the official's current office.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['state_house', 'state_senate', 'us_house', 'us_senate']
      - name: value
        data_type: double
        description: The score, on the indicator's own scale.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
              config:
                where: "indicator = 'party_unity_pct'"
      - name: period
        data_type: integer
        description: Congress number (DW-NOMINATE), last year in the Shor-McCarty data (which ends 2022, so capped at 2022 for current members); null for party unity (computed over all loaded votes).
      - name: detail
        data_type: varchar
        description: Context for the value (chamber, Shor-McCarty first-last year in the data and where the data ends, number of party-line votes).
      - name: source_url
        data_type: varchar
        description: "{{ doc('source_url') }}"
      - name: first_vote_year
        data_type: integer
        description: >
          Party unity only (null otherwise): the first calendar year in which this official cast a dated party-line
          vote in `chamber`. Shown in the caption; not part of the `detail` match key.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null"
              config:
                where: "indicator = 'party_unity_pct'"
      - name: last_vote_year
        data_type: integer
        description: >
          Party unity only (null otherwise): the last calendar year in which this official cast a dated party-line
          vote in `chamber`.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= first_vote_year"
              config:
                where: "indicator = 'party_unity_pct'"
      - name: chamber_data_start_year
        data_type: integer
        description: >
          Party unity only (null otherwise): the first calendar year with a dated party-line vote for `chamber` in our
          loaded data, from any official. When `first_vote_year` equals it, the official's range starts where our
          records begin, not necessarily where their service did.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "<= first_vote_year"
              config:
                where: "indicator = 'party_unity_pct'"
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null"
              config:
                where: "indicator = 'party_unity_pct'"

  - name: fct_commercial_ties
    description: >
      Commercial ventures and relationships: positions held in businesses and organizations, earned-income
      sources, compensation over $5,000 from one source, and agreements (future employment, leave,
      continuing payments) from mandatory disclosures, plus employers and organizations the official leads
      per Wikidata. Personal holdings (stocks, funds) stay in fct_disclosures. Grain: (official_id, source_item_id), one tie as disclosed.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [official_id, source_item_id]
    columns:
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }}"
      - name: tie_kind
        data_type: varchar
        description: "`position held`, `income source`, `compensation source`, `agreement`, or a Wikidata relation (`employer`, `chief executive of`, `board member of`, `founder of`, ...)."
      - name: whose
        data_type: varchar
        description: "`self`, `spouse` or `dependent` (from the disclosure's owner code)."
      - name: detail
        data_type: varchar
        description: The organization / description as disclosed.
      - name: as_of_year
        data_type: integer
        description: Report year of the disclosure (null for Wikidata).
      - name: is_latest_report
        data_type: boolean
        description: True when the row comes from the official's most recent disclosure year (always true for Wikidata) - filter on it for "current" ties.
      - name: source
        data_type: varchar
        description: Disclosure type or `Wikidata`.
      - name: source_url
        data_type: varchar
        description: "{{ doc('source_url') }}"
      - name: source_item_id
        data_type: varchar
        description: >
          Identity of the underlying fact: the fct_disclosures `disclosure_item_id`, or `wikidata:` + QID + fact kind + value.
        data_tests: [not_null]

  - name: fct_family_ties
    description: >
      Family members and their roles, especially leadership of companies and organizations: Wikidata
      relatives (with organizations they lead and offices they hold), and spouse/dependent positions,
      income and compensation from the latest mandatory disclosure. Missouri's business registry would
      extend this but is not machine-accessible. Grain: one (relative, role, organization) per source, i.e. all columns together (each branch is `select distinct`).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [official_id, relation, relative_name, role, organization, source, source_url]
    columns:
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }}"
      - name: relation
        data_type: varchar
        description: Relationship to the official (spouse, child, sibling, father, mother, relative, partner, dependent).
      - name: relative_name
        data_type: varchar
        description: Relative's name (Wikidata only; disclosures don't name the spouse).
      - name: role
        data_type: varchar
        description: The relative's role - a leadership role, `public office`, or the disclosure tie kind (e.g. `income source`).
      - name: organization
        data_type: varchar
        description: The organization led / office held / income source disclosed.
      - name: source
        data_type: varchar
        description: "`Wikidata` or the disclosure type."
      - name: source_url
        data_type: varchar
        description: "{{ doc('source_url') }}"

  - name: fct_legal_careers
    description: >
      Officials who are or were judges or lawyers, with the evidence for each claim: sitting on a judicial
      roster, a biography sentence (attorney, J.D., practiced law, prosecutor, admitted to the bar...), or a
      Wikidata occupation/position. Drives the case-history searches. Grain: (official, legal_role, evidence).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [official_id, legal_role, evidence]
    columns:
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }}"
      - name: legal_role
        data_type: varchar
        description: "`judge` or `lawyer`."
      - name: evidence
        data_type: varchar
        description: The roster office title, biography sentence or Wikidata fact that supports the role.
      - name: source
        data_type: varchar
        description: Where the evidence came from (judicial roster, Missouri Official Manual <edition>, MO House member page <session>, FJC Biographical Directory, Wikidata).

  - name: fct_case_history
    description: >
      Court cases (CourtListener) involving officials who are or were judges or lawyers. Built from the
      quarterly bulk export (Missouri state appellate and federal courts in Missouri plus the 8th Circuit)
      matched in int_courtlistener__bulk_case_matches, topped up by REST API search hits. Trial-court
      (circuit) cases are not in CourtListener. Grain: (official, role, case). Caveats: judges-text matches
      are by surname within the judge's own courts and tenure; attorney text names an Attorney General on
      every brief their office filed (role `attorney` = office of record).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [official_id, role, source_url]
    columns:
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }}"
      - name: role
        data_type: varchar
        description: "`judge` (authored or sat on the panel) or `attorney` (named as counsel in the opinion)."
      - name: case_name
        data_type: varchar
        description: Case caption.
      - name: court
        data_type: varchar
        description: Court name.
      - name: court_id
        data_type: varchar
        description: CourtListener court id (mo, moctapp, moctapped, moctappwd, moctappsd, moed, mowd, ca8).
      - name: docket_number
        data_type: varchar
        description: Court's docket number.
      - name: date_filed
        data_type: date
        description: Date the opinion was filed.
      - name: disposition
        data_type: varchar
        description: CourtListener's disposition field, verbatim (free text, e.g. "AFFIRMED IN PART; REVERSED IN PART AND REMANDED").
      - name: outcome
        data_type: varchar
        description: >
          The decision in a fixed vocabulary (mogov.classify_outcome): affirmed, reversed, reversed and
          remanded, affirmed in part, reversed in part, vacated, remanded, dismissed, writ granted, writ
          denied, transferred, or other (a disposition that fits no class, e.g. "SUSPENDED"). Read from the
          disposition when present, else from decree phrases at the end of the opinion (API rows with
          COURTLISTENER_TOKEN). Null when neither exists - most bulk rows, since CourtListener records few
          dispositions for Missouri cases.
        data_tests:
          - accepted_values:
              arguments:
                values: ['affirmed', 'reversed', 'reversed and remanded', 'affirmed in part, reversed in part',
                         'vacated', 'remanded', 'dismissed', 'writ granted', 'writ denied', 'transferred', 'other']
      - name: judges_text
        data_type: varchar
        description: Judges as printed in the opinion.
      - name: attorneys_text
        data_type: varchar
        description: Counsel as printed in the opinion.
      - name: publication_status
        data_type: varchar
        description: "`Published` or `Unpublished` (precedential status)."
      - name: source_url
        data_type: varchar
        description: "{{ doc('source_url') }}"

  - name: fct_campaign_spending
    description: >
      How each official's state campaign committees spent their money: itemized expenditures with payee,
      purpose and amount. TAP mirror for report years through 2022, MEC's own export (CD3 Part B, items
      over $100) for 2023+ when the MEC loader has run. Committees are attributed as in
      fct_campaign_finance. Grain: (official_id, source_record_id), one itemized expenditure as filed. TAP rows include contributions to
      other committees, which fct_campaign_finance also lists as `given`.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [official_id, source_record_id]
    columns:
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_official')
                field: official_id
      - name: expenditure_date
        data_type: date
        description: Date paid, as reported.
      - name: amount
        data_type: decimal(28,6)
        description: >
          USD. Negative values are refunds/corrections as filed. Sanity bound: fails at $10M either way
          (largest through 2026: $1,041,631.57; smallest $0), same bound as fct_campaign_finance.amount.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -10000000
                max_value: 10000000
                inclusive: false
      - name: payee_name
        data_type: varchar
        description: Who was paid (company, or person's name).
      - name: payee_city
        data_type: varchar
        description: Payee city as reported.
      - name: payee_state
        data_type: varchar
        description: Payee state as reported.
      - name: purpose
        data_type: varchar
        description: Purpose as the committee described it (e.g. "Newspaper Insert for Election", "Postage").
      - name: expenditure_type
        data_type: varchar
        description: How it was paid (e.g. "Paid", "Credit" / in-kind), as reported.
      - name: committee_name
        data_type: varchar
        description: The official's committee that spent the money.
      - name: mec_committee_id
        data_type: varchar
        description: MEC committee id (MECID).
      - name: match_confidence
        data_type: varchar
        description: "{{ doc('match_confidence') }}"
      - name: source
        data_type: varchar
        description: "`MEC` or `MEC (via Accountability Project)`."
      - name: source_url
        data_type: varchar
        description: "{{ doc('source_url') }}"
      - name: source_record_id
        data_type: varchar
        description: >
          The MEC expenditure record id (`tap_cd3_b:` TAP cd3_b_id, `mec_cd3_b:` MEC export). Part of the grain with official_id because a committee can be attributed to several officials.
        data_tests: [not_null]

  - name: fct_campaign_reports
    description: >
      Cover-page totals of every campaign finance report filed by an official's state committees (MEC
      direct export, report years 2023+; needs the MEC loader). The quick "raised $X, spent $Y, $Z in
      the bank" view without summing itemized rows. "This period" amounts cover the report alone;
      "this election" totals accumulate across the election's reports (total = previous + this period,
      which holds for 99.98% of full reports). Grain: one filed report. Amended reports are separate rows
      (report_name starts "AMENDED"); "Limited Activity" reports carry no amounts.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [official_id, report_id]
    columns:
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_official')
                field: official_id
      - name: committee_name
        data_type: varchar
        description: The official's committee that filed the report.
      - name: mec_committee_id
        data_type: varchar
        description: MEC committee id (MECID).
      - name: report_id
        data_type: varchar
        description: MEC report id; amendments get their own.
      - name: report_name
        data_type: varchar
        description: Report as MEC names it (e.g. "October Quarterly Report", "AMENDED April Quarterly Report", "8 Day Before General Election-11/3/2026").
      - name: report_year
        data_type: integer
        description: Year the report belongs to.
      - name: report_type
        data_type: varchar
        description: "`Full Disclosure`, `Limited Activity`, `Termination`, ..."
      - name: contributions_received
        data_type: decimal(28,6)
        description: Monetary contributions received this period (USD).
      - name: loans_received
        data_type: decimal(28,6)
        description: Loans received this period (USD).
      - name: misc_receipts
        data_type: decimal(28,6)
        description: Other receipts this period, e.g. interest and refunds (USD).
      - name: inkind_contributions_received
        data_type: decimal(28,6)
        description: In-kind contributions received this period (USD value).
      - name: total_receipts_this_election
        data_type: decimal(28,6)
        description: All receipts for the election to date, including this period (USD).
      - name: expenditures_this_period
        data_type: decimal(28,6)
        description: Expenditures this period (USD).
      - name: total_expenditures_this_election
        data_type: decimal(28,6)
        description: Expenditures for the election to date (USD).
      - name: contributions_made_this_period
        data_type: decimal(28,6)
        description: Contributions the committee made to others this period (USD).
      - name: total_contributions_made_this_election
        data_type: decimal(28,6)
        description: Contributions made to others for the election to date (USD).
      - name: starting_money_on_hand
        data_type: decimal(28,6)
        description: Cash on hand at the start of the period (USD).
      - name: ending_money_on_hand
        data_type: decimal(28,6)
        description: Cash on hand at the end of the period (USD) - "money in the bank".
      - name: outstanding_indebtedness
        data_type: decimal(28,6)
        description: Debt owed at the end of the period (USD).
      - name: match_confidence
        data_type: varchar
        description: "{{ doc('match_confidence') }}"
      - name: source_url
        data_type: varchar
        description: "{{ doc('source_url') }}"

  - name: dim_district
    description: >
      Areas Missouri officials are elected or appointed for, with boundaries from Census TIGER/Line as
      GeoJSON (lon/lat, NAD83): state senate and house districts, congressional districts for every loaded
      Congress (is_current marks the one in session; Missouri's 2025 map applies from the 120th), counties
      with their judicial circuit (Official Manual), and places (cities). Grain: one row per area.
    columns:
      - name: district_id
        data_type: varchar
        description: >
          `state_senate:<n>`, `state_house:<n>`, `us_house:<congress>:<n>`, `county:<GEOID>`, `place:<GEOID>`.
        data_tests: [unique, not_null]
      - name: district_type
        data_type: varchar
        description: state_senate, state_house, us_house, county or place.
        data_tests:
          - accepted_values:
              arguments:
                values: ['state_senate', 'state_house', 'us_house', 'county', 'place']
      - name: district_number
        data_type: integer
        description: District number (legislative and congressional districts); null for counties and places.
      - name: congress
        data_type: integer
        description: Congress the congressional district map is for; null otherwise.
      - name: is_current
        data_type: boolean
        description: False only for congressional districts of a Congress not in session.
      - name: name
        data_type: varchar
        description: Census name (place and county name; "State Senate District 1"-style for districts).
      - name: name_with_type
        data_type: varchar
        description: Census NAMELSAD, e.g. "St. Louis city", "Boone County", "Congressional District 1".
      - name: geoid
        data_type: varchar
        description: Census GEOID (state code 29 + district / county / place code).
      - name: judicial_circuit
        data_type: integer
        description: Missouri judicial circuit number, for counties (Official Manual "Circuit courts by county").
      - name: appeals_district
        data_type: varchar
        description: Missouri Court of Appeals district (eastern, southern, western) for counties (RSMo 477.050-.070).
        data_tests:
          - accepted_values:
              arguments:
                values: ['eastern', 'southern', 'western']
      - name: federal_district
        data_type: varchar
        description: Federal judicial district (moed, mowd) for counties (28 U.S.C. 105).
        data_tests:
          - accepted_values:
              arguments:
                values: ['moed', 'mowd']
      - name: land_area_m2
        data_type: bigint
        description: Land area in square meters (Census ALAND).
      - name: interior_lat
        data_type: float
        description: Latitude of the Census internal point (inside the area; good for a map label).
      - name: interior_lon
        data_type: float
        description: Longitude of the Census internal point.
      - name: vintage
        data_type: integer
        description: TIGER/Line year the boundary comes from.
      - name: geometry_geojson
        data_type: varchar
        description: GeoJSON geometry (Polygon or MultiPolygon), lon/lat, as published by the Census Bureau.
      - name: source_url
        data_type: varchar
        description: "{{ doc('source_url') }}"

  - name: dim_zcta
    description: >
      Missouri ZIP Code Tabulation Areas (Census Gazetteer; ZIP prefixes 630-658) with each area's internal point
      and land area, for the frontend's ZIP lookup. A ZCTA approximates a USPS ZIP code and can span several
      districts; the lookup reports the district at the internal point and the others the area may reach.
      Grain: one row per ZCTA.
    columns:
      - name: zcta
        data_type: varchar
        description: Five-digit ZIP Code Tabulation Area code.
        data_tests: [unique, not_null]
      - name: vintage
        data_type: integer
        description: Gazetteer year.
      - name: interior_lat
        data_type: float
        description: Latitude of the Census internal point (inside the area, near its center).
        data_tests: [not_null]
      - name: interior_lon
        data_type: float
        description: Longitude of the Census internal point.
        data_tests: [not_null]
      - name: land_area_m2
        data_type: bigint
        description: Land area in square meters (Census ALAND).
      - name: water_area_m2
        data_type: bigint
        description: Water area in square meters (Census AWATER).

  - name: fct_official_districts
    description: >
      Which areas (dim_district) each official serves: legislators and U.S. representatives the district they
      were elected from (the Congress in session for the U.S. House), circuit and associate circuit judges every
      county of their circuit, Court of Appeals judges every county of their appellate district, U.S. district
      judges every county of E.D. and/or W.D. Mo., mayors their city. Statewide offices and the Eighth Circuit
      serve every area and have no rows. Grain: one row per (official, area).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [official_id, district_id]
    columns:
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_official')
                field: official_id
      - name: district_id
        data_type: varchar
        description: The area (dim_district).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_district')
                field: district_id
      - name: office
        data_type: varchar
        description: "{{ doc('office') }}"
      - name: relation
        data_type: varchar
        description: elected from, judicial circuit, appellate district, federal district, or mayor of.
        data_tests:
          - accepted_values:
              arguments:
                values: ['elected from', 'judicial circuit', 'appellate district', 'federal district', 'mayor of']

  - name: fct_bills
    description: >
      Missouri bills and resolutions per session. House bills from the House XML export (titles, current version,
      last action); Senate bills from the Senate's own bill list on senate.mo.gov (regular and special sessions, every
      bill including those under no topical-index keyword; its one-line description as short_title; the other
      House-only columns are null). A session whose Senate list is not loaded (the mo_senate_bills loader covers a
      window) falls back to the Senate topical index, plus the Senate bills the House XML's SenateActList lists
      as reaching the House that neither has (2024 on, with the titles, version, last action and effective date the
      XML gives). `subjects` holds the
      subject index terms, "; "-separated (fct_bill_subjects).
      Each regular session also has 15 to 17 relistings of the previous session's appropriation bills (status
      "relisted for governor message"): not new bills, so leave them out of per-session bill counts.
      Grain: one row per (session, bill).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [session_code, bill]
    columns:
      - name: session_code
        data_type: varchar
        description: House session code (two-digit year + type; 1 regular, 2-4 extraordinary).
      - name: session_year
        data_type: integer
        description: Calendar year of the session.
      - name: bill
        data_type: varchar
        description: Bill number without spaces (HB2, HJR1, HCR3, HR10, SB974, SJR3).
      - name: current_bill_string
        data_type: varchar
        description: The current version's full designation, e.g. "CCS SS SCS HCS HB 2".
      - name: short_title
        data_type: varchar
        description: Short title.
      - name: long_title
        data_type: varchar
        description: Long title (what the bill does, in one sentence).
      - name: subjects
        data_type: varchar
        description: Subject index terms, "; "-separated (null when neither chamber's index has the bill).
      - name: last_action
        data_type: varchar
        description: Last recorded action, with its date.
      - name: status
        data_type: varchar
        description: >
          The furthest stage the House XML's actions record (int_bills__status): introduced, in committee, reported
          do pass, perfected, passed one chamber, passed both chambers, truly agreed, signed, signed with line-item
          vetoes, vetoed, veto overridden; adopted for resolutions; withdrawn or defeated when the bill stopped
          there. combined into another bill: the Senate's history says "Bill Combined (w/SCS SBs ...)", its content
          went into a substitute for other bills; it is not enacted (look at the vehicle bill). relisted for
          governor message: a re-listing, not a new bill. The House relists the previous
          regular session's appropriation bills (same number and bill string, e.g. 2024 HB 1, the FY2024 budget
          bill of the 2023 session) only to record the governor's Art. IV, s. 27 message, which is their only
          action; 15 to 17 per regular session, 2017 to 2026 (143 in all), none in 2021. Their outcome is null: it
          is on the original row (relisted_from_session_code). Null for Senate bills that never reached the
          House, which means every Senate bill before 2024: the House's Senate-bill list (SENATEACTLIST) exists
          only for 2024 and later.
        data_tests:
          - accepted_values:
              arguments:
                values: [introduced, in committee, reported do pass, perfected, passed one chamber,
                  passed both chambers, truly agreed, signed, signed with line-item vetoes, vetoed, veto overridden,
                  adopted, withdrawn, defeated, combined into another bill, relisted for governor message]
      - name: outcome
        data_type: varchar
        description: >
          enacted, vetoed, sent to voters (joint resolutions), adopted (resolutions), awaiting governor, no governor
          action recorded (truly agreed, but the export stops before the governor), pending (session still open),
          failed (session over without passing). Null with status, and for relisted bills (read the original's).
        data_tests:
          - accepted_values:
              arguments:
                values: [enacted, vetoed, sent to voters, adopted, awaiting governor, no governor action recorded,
                  pending, failed]
      - name: relisted_from_session_code
        data_type: varchar
        description: >
          For a relisted bill, the previous regular session code (e.g. 231 for 241) whose bill with the same number and
          bill string it repeats; the original's status and outcome are on that row. Null for every other bill, and
          for relistings whose original session isn't loaded (2017's 15 repeat 161).
      - name: proposed_effective_date
        data_type: date
        description: Proposed effective date.
      - name: source_url
        data_type: varchar
        description: "{{ doc('source_url') }}"

  - name: fct_statute_sections
    description: >
      Revised Statutes of Missouri (RSMo) from the Revisor of Statutes, one row per section version: the versions
      listed in force (heading, text, effective date, session-law history) and the repealed and transferred sections
      (note and date only). A section can have several versions at once, e.g. one not yet effective; is_current
      marks the version(s) in effect on the build date. Grain: one row per section version (section_version_id).
    columns:
      - name: section_id
        data_type: varchar
        description: >
          Section number as the Revisor prints it: chapter, a dot, then the section ("1.010", "1.1001", "67.1360";
          the uniform codes number sections article-section: "400.3-505", "456.4A-411"). Format checked by
          tests/assert_statute_section_ids_wellformed.sql.
        data_tests:
          - not_null
      - name: bid
        data_type: integer
        description: The Revisor's id for this version of the section.
      - name: section_version_id
        data_type: varchar
        description: section_id/bid; unique.
        data_tests:
          - unique
          - not_null
      - name: chapter
        data_type: varchar
        description: RSMo chapter number.
      - name: chapter_name
        data_type: varchar
        description: Chapter name from the Revisor's table of contents (null for a chapter no longer listed there).
      - name: title_numeral
        data_type: varchar
        description: The chapter's title, as a roman numeral.
      - name: title_name
        data_type: varchar
        description: The title's name, e.g. "LAWS AND STATUTES".
      - name: heading
        data_type: varchar
        description: The section's catchline (null for repealed and transferred sections).
      - name: status
        data_type: varchar
        description: >
          in force, not yet effective (a later version printed beside the one in force), contingent (takes effect
          on an event, not a date; the Revisor dates it 1 Jan 2099), historical (an expired version still printed),
          repealed, transferred.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [in force, not yet effective, contingent, historical, repealed, transferred]
      - name: is_current
        data_type: boolean
        description: >
          The in-force version with the latest effective date on the build date. Two versions of one section can
          both be current when the Revisor prints conflicting enactments side by side. Read with
          held_unconstitutional: the newest version stays current even when a court struck it in whole or part.
      - name: effective_date
        data_type: date
        description: >
          The version's effective date (null for contingent versions and for repealed and transferred sections).
          Sanity bound: 1800 to 2098 (the Revisor's 2099 placeholder must have become `contingent`).
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: "cast('1800-01-01' as date)"
                max_value: "cast('2099-01-01' as date)"
                inclusive: false
      - name: held_unconstitutional
        data_type: boolean
        description: >
          The Revisor marks this version "(all or part is unconstitutional)": a court struck it in whole or in part.
          The Revisor then also prints the version before it (56.067, 56.816: 2014 amendments).
      - name: ended_date
        data_type: date
        description: >
          When the repeal or transfer took effect (null for listed versions, and for repeals that wait on a
          contingency, which the Revisor dates 1 Jan 2099).
      - name: transferred_to
        data_type: varchar
        description: The section a transferred section moved to.
      - name: history_note
        data_type: varchar
        description: >
          The session-law history as printed, e.g. "(RSMo 1939 § 645, A.L. 1957 p. 587, A.L. 2015 S.B. 239)";
          for repealed and transferred sections, the Revisor's note ("(Repealed L. 1975 H.B. 945 § 1)").
      - name: section_text
        data_type: varchar
        description: >
          The section's text, starting with its number and catchline; paragraphs separated by blank lines, table
          rows one per line with cells tab-separated. Null for repealed and transferred sections.
        data_tests:
          - not_null:
              config:
                where: "status in ('in force', 'not yet effective')"
      - name: repeal_pending
        data_type: boolean
        description: >
          The Revisor's repeals page also lists this listed version with a repeal that has not taken effect (the
          2026 acts that repeal 324.406 and 324.424 on a contingency, dated 1 Jan 2099). The row stays the listed
          version, in force or contingent; the repeals page's duplicate row is dropped, so section_version_id stays
          unique.
      - name: source_url
        data_type: varchar
        description: "{{ doc('source_url') }}"

  - name: fct_bill_statute_links
    description: >
      Which RSMo sections each bill enacted, amended or repealed, from the Revisor's session-law history notes
      (int_mo_revisor__session_law_bills). Covers bills that became law, back to the 1950s; a pending bill's
      targets are read from its text in fct_bill_text_statute_links (#594). Grain: one row per (session, bill, section, change).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [session_code, bill, section_id, change]
    columns:
      - name: session_code
        data_type: varchar
        description: House-style session code (two-digit year + 1 regular, 2-4 extraordinary).
      - name: session_year
        data_type: integer
        description: Year of the session law.
      - name: bill
        data_type: varchar
        description: >
          Bill number without spaces (HB945, SB299, SJR24). Format checked by
          tests/assert_statute_section_ids_wellformed.sql.
        data_tests:
          - not_null
      - name: section_id
        data_type: varchar
        description: The RSMo section (fct_statute_sections.section_id).
        data_tests:
          - not_null
      - name: change
        data_type: varchar
        description: enacted (L.), amended (A.L.) or repealed (Repealed L.).
        data_tests:
          - accepted_values:
              arguments:
                values: [enacted, amended, repealed]
      - name: citation
        data_type: varchar
        description: The act as the Revisor cites it, e.g. "A.L. 2003 S.B. 299 & 40".
      - name: section_versions
        data_type: bigint
        description: How many versions of the section cite this act.
      - name: is_lead_bill
        data_type: boolean
        description: >
          False for a bill named after "&" in a combined act ("A.L. 2023 H.B. 115 & 99": the Revisor cites the one
          substitute under both numbers), or after "and" when no act in the same year and session cites that bill
          as its first ("A.L. 2004 S.B. 968 and S.B. 969": SB969 is combined into SB968). Only the first, the lead bill, passed; the others never reached the
          governor, and fct_bills shows them as failed (2023 HB99, 2025 HB486, 2026 HB3155). Filter on this to
          list the bills that became law. A bill that leads in any act is a lead bill.
      - name: combined_into
        data_type: varchar
        description: The lead bill a non-lead bill was combined into (HB115 for 2023 HB99); null for lead bills.
      - name: in_fct_bills
        data_type: boolean
        description: Whether fct_bills has the bill (it covers the House XML export's sessions, 2017 on).
      - name: link_source
        data_type: varchar
        description: Where the link comes from, always 'revisor_history' here ('bill_text' in fct_bill_text_statute_links).
        data_tests:
          - accepted_values:
              arguments:
                values: [revisor_history]

  - name: fct_bill_text_statute_links
    description: >
      Which RSMo sections each House bill text version would repeal, amend or enact, read from the enacting title and
      Section A of the bill text PDF (mo_house_pdf loader, int_mo_house__bill_text_statute_refs; empty until that
      loader has run). Covers pending and failed bills as well as those that became law, which
      fct_bill_statute_links (the Revisor's history notes) cannot. Grain: one row per (text version, bill, section);
      a range such as "sections 1.010 to 1.050" is expanded against fct_statute_sections. A text with no RSMo
      section (appropriations, joint resolutions amending the Constitution, land conveyances) has no row. Bills are
      rewritten as they move, so read version_code T (truly agreed) or the latest lr_number for what a bill ended
      up doing; the introduced text is what the sponsor first asked for.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [document_url, bill, section_id]
    columns:
      - name: session_code
        data_type: varchar
        description: House-style session code.
        data_tests:
          - not_null
      - name: bill
        data_type: varchar
        description: Bill number without spaces (HB945, HJR12).
        data_tests:
          - not_null
      - name: document_url
        data_type: varchar
        description: The bill text PDF the link was read from (fct_bill_documents.document_url).
        data_tests:
          - not_null
      - name: lr_number
        data_type: varchar
        description: Legislative Research number of the text version (0474H.01I introduced; 5057S.04T truly agreed).
      - name: version_code
        data_type: varchar
        description: House version code of the text (I introduced, P perfected, T truly agreed, ...).
      - name: section_id
        data_type: varchar
        description: The RSMo section, in the form fct_statute_sections.section_id uses.
        data_tests:
          - not_null
      - name: change
        data_type: varchar
        description: >
          In the words of fct_bill_statute_links.change. amended: the text repeals and enacts the section in lieu
          thereof, or amends it; repealed: only repeals it; enacted: only adds it (a new section).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [enacted, amended, repealed]
      - name: link_source
        data_type: varchar
        description: Always 'bill_text' here ('revisor_history' in fct_bill_statute_links).
        data_tests:
          - accepted_values:
              arguments:
                values: [bill_text]
      - name: supp_year
        data_type: integer
        description: Year of the "RSMo Supp." the text cites the section from, when it does; else null.
      - name: from_range
        data_type: boolean
        description: Whether the section came from a range ("1.010 to 1.050"), whose members come from the statutes.
      - name: in_statutes
        data_type: boolean
        description: >
          Whether fct_statute_sections has the section today. False for a section the bill would enact, or one the
          Revisor has since moved or dropped.

  - name: fct_bill_documents
    description: >
      Links to the House's PDFs for each bill, one row per document: summaries, fiscal notes, witness forms, bill
      text versions, amendments and the change maps of text versions and amendments. The PDFs are not fetched.
      Covers House bills and the Senate bills the House acted on (2024 sessions on). Witness forms name citizens,
      so only the link is kept. Join to fct_bills on (session_code, bill); a few special-session Senate bills have
      documents here but no fct_bills row (#438). Grain: one row per (session, bill, document_kind, document_url).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [session_code, bill, document_kind, document_url]
    columns:
      - name: session_code
        data_type: varchar
        description: House session code.
        data_tests:
          - not_null
      - name: bill
        data_type: varchar
        description: Bill number without spaces (HB2, SB727).
        data_tests:
          - not_null
      - name: document_kind
        data_type: varchar
        description: What the link is (summary, fiscal_note, witness_form, bill_text, text_map, amendment, amendment_map). An amendment is the amendment's own PDF; amendment_map is its change map, which few amendments have.
        data_tests:
          - accepted_values:
              arguments:
                values: ['summary', 'fiscal_note', 'witness_form', 'bill_text', 'text_map', 'amendment', 'amendment_map']
      - name: document_url
        data_type: varchar
        description: Link to the PDF (documents.house.mo.gov; a few 2018 links point at the older house.mo.gov and moga.mo.gov hosts).
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "like 'http%://documents.house.mo.gov/%' or document_url like 'http%://house.mo.gov/%' or document_url like 'http%://www.moga.mo.gov/%'"
      - name: document_index
        data_type: bigint
        description: Position of the link in the bill's XML among documents of its kind (lowest, when listed twice).
      - name: label
        data_type: varchar
        description: The House's name for the document (summary or text version name, amendment description, witness-form description); null for fiscal notes.
      - name: page_count
        data_type: bigint
        description: Pages in the fetched PDF; null when the mo_house_pdf loader has not fetched the link (not run yet, witness forms, change maps) or the fetch failed.
      - name: text_length
        data_type: bigint
        description: Characters of extracted text (see fct_bill_document_texts); null when not fetched, 0 when fetched with no text.
      - name: has_text
        data_type: boolean
        description: True when the PDF has a text layer; null when not fetched.
      - name: fetch_error
        data_type: varchar
        description: Why the loader could not get the text ("not a PDF", HTTP error); null when fetched or not tried.

  - name: fct_bill_document_texts
    description: >
      The text of the House's bill documents, one row per document URL: bill text versions, summaries, fiscal notes
      and amendments the mo_house_pdf loader fetched (empty until it has run). A sibling of fct_bill_documents rather
      than columns on it, because the text is wide (a few GB for 2017-2026) and the link mart is small and is read
      for every bill page; join on document_url for the bill, label and index. A summary shared by several
      versions is one row here and one row per bill in fct_bill_documents. Control characters (NUL from small-caps
      glyphs) are removed. A scanned page adds to page_count but has no text. Grain: one row per document_url.
    columns:
      - name: document_url
        data_type: varchar
        description: Link to the PDF; joins to fct_bill_documents.document_url.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('fct_bill_documents')
                field: document_url
      - name: document_kind
        data_type: varchar
        description: bill_text, summary, fiscal_note or amendment.
        data_tests:
          - accepted_values:
              arguments:
                values: ['bill_text', 'summary', 'fiscal_note', 'amendment']
      - name: session_code
        data_type: varchar
        description: House session code of the first link that names the URL.
      - name: lr_number
        data_type: varchar
        description: Legislative Research number (null for fiscal notes).
      - name: version_code
        data_type: varchar
        description: Bill text version code (I introduced, H committee substitute, P perfected, T truly agreed, ...); null for fiscal notes and amendments.
      - name: n_links
        data_type: bigint
        description: How many links in the House XML name this URL.
      - name: page_count
        data_type: bigint
        description: Pages in the PDF; null when the fetch failed. Between 1 and 1,500.
      - name: text_length
        data_type: bigint
        description: Characters in document_text; 0 when there is none.
      - name: has_text
        data_type: boolean
        description: True when document_text has a non-blank character.
      - name: fetch_error
        data_type: varchar
        description: Why there is no text (HTTP error, "not a PDF"); null when fetched.
      - name: document_text
        data_type: varchar
        description: The PDF's text as extracted, control characters removed; null when the fetch failed.

  - name: fct_bill_hearings
    description: >
      House committee hearings per bill, one row per hearing notice, for House bills and the Senate bills the House
      acted on (2024 sessions on). A bill heard twice, or by two committees, has several rows. A moved hearing is
      noticed again, so one bill can show two notices on one day; the House XML has no cancelled flag, so read the
      comments ("Rescheduled hearing, previously noticed for ..."). Referrals that never got a hearing are bill
      actions ("Referred: ..."), not rows here. Email addresses and phone numbers in comments and locations are
      replaced by "[email removed]" / "[phone removed]" (a public official's office phone too); the rest of the
      text stays, and a build-failing test checks none remain. A notice the House lists twice (same committee,
      date, time and room) is one hearing: count hearings with is_superseded = false. Join to fct_bills on
      (session_code, bill). Grain: one row per (session, bill, hearing_index).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [session_code, bill, hearing_index]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "hearing_date >= cast(session_year || '-01-01' as date) and hearing_date <= cast(session_year || '-12-31' as date)"
    columns:
      - name: session_code
        data_type: varchar
        description: House session code.
        data_tests:
          - not_null
      - name: session_year
        data_type: integer
        description: Calendar year of the session (2000 + the first two digits of the code). Every hearing falls in it, special sessions included.
        data_tests:
          - not_null
      - name: bill
        data_type: varchar
        description: Bill number without spaces (HB2, SB727).
        data_tests:
          - not_null
      - name: hearing_index
        data_type: bigint
        description: Position of the notice in the House's list for the bill. The XML order is not chronological (a later list entry can carry an earlier date), so do not read it as the order the notices were issued.
        data_tests:
          - not_null
      - name: committee_name
        data_type: varchar
        description: House committee noticed to hear the bill (Rules and Fiscal Review committees included).
        data_tests:
          - not_null
      - name: hearing_date
        data_type: date
        description: Date of the hearing as noticed.
        data_tests:
          - not_null
      - name: hearing_time
        data_type: varchar
        description: Clock time as HH:MM (24-hour); null when the House gave only hearing_time_note.
      - name: hearing_time_note
        data_type: varchar
        description: The House's free-text time when it is not a clock time ("4:30 PM or upon adjournment (whichever is later)"); null when hearing_time is set.
      - name: location
        data_type: varchar
        description: Hearing room (House Hearing Room 5). Contact strings are redacted as in comments.
      - name: comments
        data_type: varchar
        description: The committee's note on the notice (time or room change, rescheduling, bills added, COVID-19 procedures). Email addresses and phone numbers are replaced by "[email removed]" / "[phone removed]".
      - name: superseded_by_index
        data_type: bigint
        description: hearing_index of the later notice that repeats this one exactly (same committee, date, time or time note, and room); null when no later notice does.
      - name: is_superseded
        data_type: boolean
        description: True when the House lists the same notice again later (superseded_by_index is set). Filter to false to count hearings once.
        data_tests:
          - not_null

  - name: fct_bill_subjects
    description: >
      Subject index terms per bill, one row per term. House bills keep the House XML's terms (2024 sessions on);
      earlier House bills that reached the Senate, and Senate bills, get the Senate topical index's (same
      vocabulary). Join to fct_vote_bills to group votes by topic. Grain: one row per (session, bill, subject).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [session_code, bill, subject_id, subject_name]
    columns:
      - name: session_code
        data_type: varchar
        description: House session code.
      - name: bill
        data_type: varchar
        description: Bill number (fct_bills).
      - name: subject_id
        data_type: varchar
        description: House subject index id (null for Senate index rows).
      - name: subject_name
        data_type: varchar
        description: Subject term, e.g. "APPROPRIATIONS", "ELEMENTARY AND SECONDARY EDUCATION, DEPT. OF".
      - name: subject_source
        data_type: varchar
        description: Which index the term comes from (house or senate).
        data_tests:
          - accepted_values:
              arguments:
                values: ['house', 'senate']

  - name: fct_bill_sponsors
    description: >
      Sponsors, co-sponsors, handlers and House/Senate conferees of each House bill, as the House lists them,
      matched to officials where the district and surname agree. The House lists a member's latest district for every session, so for a member whose district number changed (2022 redistricting) the match goes through the session's roster by surname and the listed district being one the member held; two candidates leave the row unmatched. Re-listed appropriation bills (fct_bills status
      "relisted for governor message") are excluded: they repeat the original's sponsors only to record the
      governor's message. Grain: one row per (session, bill, sponsor type, sponsor name).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [session_code, bill, sponsor_type, sponsor_name]
    columns:
      - name: session_code
        data_type: varchar
        description: House session code.
      - name: bill
        data_type: varchar
        description: Bill number (fct_bills).
      - name: sponsor_type
        data_type: varchar
        description: Sponsor, Co-Sponsor, Handler, HouseConferee or SenateConferee.
      - name: sponsor_name
        data_type: varchar
        description: Name as the House lists it.
      - name: sponsor_chamber
        data_type: varchar
        description: state_house or state_senate (the House numbers senators 200 + senate district).
      - name: sponsor_district
        data_type: integer
        description: District in the sponsor's own chamber.
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }} Null when the sponsor isn't a current official or didn't match."


  - name: fct_sponsorship_outcomes
    description: >
      What became of the bills each House member sponsored, per member and House session: counts from the House's
      own bill actions (int_bills__status), each with its n; not a score. Counted: bills where the member is the
      primary sponsor (sponsor_type Sponsor, exactly one per bill), as a House bill (HB) or House joint resolution
      (HJR: a proposed law or constitutional amendment). Co-sponsors, handlers and conferees are not counted.
      Resolutions (HR, HCR) are left out: they are adopted on a voice vote or not at all and would swamp the
      share. Senate sponsors are left out (the House XML lists them for 2017-2022 only). Re-listed appropriation
      bills are not counted twice (fct_bill_sponsors drops them). Appropriation bills are kept: they are real
      sponsorships, and the Budget chair sponsors them and almost all pass, so the chair's shares are high for
      that reason (a member who has left office, such as a former Budget chair, has no row). Only current officials (dim_official) have an official_id, so former members are not here
      (2026: 2,044 of 2,086 House sponsor rows match; 2017: 32 of 1,205). Survivorship: the earliest sessions (2017-2018) hold only
      members still in office today, mostly long-serving leaders, so their shares are not comparable with recent sessions. A bill is "decided" unless its outcome
      is pending (session still open) or awaiting governor (truly agreed this year); decided bills are the
      denominator of both shares, and the passed and became-law counts only include decided bills, so a share
      is always between 0 and 1. A member who moved between chambers has rows only for the House sessions in
      which they sponsored House bills. Grain: one row per (official, House session) with at least one counted
      bill.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [official_id, session_code]
    columns:
      - name: official_id
        data_type: varchar
        description: The sponsoring member (dim_official).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_official')
                field: official_id
      - name: session_code
        data_type: varchar
        description: House session code.
        data_tests:
          - not_null
      - name: session_year
        data_type: integer
        description: Calendar year of the session.
      - name: is_session_over
        data_type: boolean
        description: >
          Whether the session has ended (int_bills__status). While it is false, most bills are still pending
          and not counted as decided.
      - name: bills_sponsored
        data_type: bigint
        description: >
          House bills (HB) and House joint resolutions (HJR) the member is the primary sponsor of in the session,
          whatever their outcome, pending ones included.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 60
      - name: bills_decided
        data_type: bigint
        description: >
          The denominator: those bills whose outcome is known, i.e. everything except pending (session still open)
          and awaiting governor. A bill the House passed but that failed in the Senate is decided. A truly agreed bill
          with "no governor action recorded" is decided but not counted as law.
      - name: bills_passed_house
        data_type: bigint
        description: >
          Decided bills the House passed on third reading (int_bills__status passed_house), including ones that then
          died in the Senate, were vetoed or were withdrawn afterwards. Appropriation bills are included.
      - name: bills_became_law
        data_type: bigint
        description: >
          Decided bills that became law: outcome enacted for an HB (signed, line-item vetoed, veto overridden, or
          delivered to the Secretary of State without signature), sent to voters for an HJR. A vetoed bill is not
          counted.
      - name: passed_house_share
        data_type: decimal(28,6)
        description: bills_passed_house over bills_decided; null when bills_decided is 0. Always between 0 and 1.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: became_law_share
        data_type: decimal(28,6)
        description: bills_became_law over bills_decided; null when bills_decided is 0. Always between 0 and 1.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: source_url
        data_type: varchar
        description: The House XML export for the session (documents.house.mo.gov), where the bill actions come from.
  - name: fct_vote_bills
    description: >
      Which bill a state vote was on. House roll calls are linked exactly where the bill XML names the roll-call
      PDF (the vote_id); the rest (votes on Senate bills, some on House bills) through every bill number in the
      measure printed on the PDF ("HCS HB 2", "SS SCS SBs 49 & 118" -> SB 49 and SB 118) in the same session. Senate journal votes
      through the measure in the journal text ("HB 2", "SB 974"): regular (R) and veto (V) session journals link to the
      year's regular session; extraordinary-session journals (S1, S2, T1, T2) link to the year's extraordinary session
      (YY3 or YY4) in which that bill has an action on the vote date (a Senate bill with only House-side actions
      also links when the vote precedes its first action), and to nothing when no single session fits. Re-listed
      appropriation bills (fct_bills status "relisted for governor message") are never linked: they have no floor
      action, so a vote naming one links to nothing rather than to the stub. Grain: one row
      per (chamber, vote, bill, bill version).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [chamber, vote_id, session_code, bill, bill_version]
    columns:
      - name: chamber
        data_type: varchar
        description: state_house or state_senate.
      - name: vote_id
        data_type: varchar
        description: Vote identifier (fct_votes.vote_id).
        data_tests:
          # a link may only name a roll call that exists (#538): the XML links 55 PDFs the House never published
          - relationships:
              name: fct_vote_bills_house_vote_id_in_rollcalls
              arguments:
                to: ref('stg_mo_house__rollcalls')
                field: rollcall_url
              config:
                where: "chamber = 'state_house'"
          - relationships:
              name: fct_vote_bills_senate_vote_id_in_votes
              arguments:
                to: ref('int_mo_senate__votes')
                field: vote_id
              config:
                where: "chamber = 'state_senate'"
      - name: session_code
        data_type: varchar
        description: House session code of the bill.
      - name: bill
        data_type: varchar
        description: Bill number (fct_bills).
      - name: bill_version
        data_type: varchar
        description: Version of the bill text voted on (House roll calls only), e.g. "Perfected", "Truly Agreed".
      - name: matched_by
        data_type: varchar
        description: roll-call link (exact) or measure text (read from the House roll-call PDF or the Senate journal).

  - name: fct_salaries
    description: >
      Officeholder pay per calendar year, 2017+. State officials: gross pay received, from Missouri's state payroll
      (data.mo.gov "State Employee Pay"; everything paid in the year, not the base salary), name-matched within the
      official's group of offices. Federal officials (Congress, U.S. district and circuit judges): the statutory
      annual salary of the office for each year they held it (seed federal_salaries), since federal pay isn't
      published per person. A year with a change of office has one row per position. Grain: one row per
      (official, year, agency, position).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [official_id, calendar_year, agency_name, position_title]
    columns:
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_official')
                field: official_id
      - name: calendar_year
        data_type: integer
        description: Calendar year paid.
      - name: agency_name
        data_type: varchar
        description: Paying agency (LEGISLATURE, JUDICIARY, OFFICE OF GOVERNOR..., U.S. CONGRESS, U.S. COURTS).
      - name: position_title
        data_type: varchar
        description: Position title (STATE REPRESENTATIVE, SENATOR, CIRCUIT JUDGE, GOVERNOR..., U.S. SENATOR, U.S. DISTRICT JUDGE).
      - name: employee_name
        data_type: varchar
        description: Name as the payroll prints it ("LAST, FIRST M"), so a reader can check the match; the official's name for federal rows.
      - name: pay
        data_type: decimal(12,2)
        description: >
          Dollars for the year; what it measures depends on pay_basis. Through 2026: $388 (a partial year) to
          $264,900.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1000000
      - name: pay_basis
        data_type: varchar
        description: "'gross pay': all pay received in the year (state payroll). 'statutory salary': the office's annual salary rate (federal), not what was paid."
        data_tests:
          - accepted_values:
              arguments:
                values: ['gross pay', 'statutory salary']
      - name: match_confidence
        data_type: varchar
        description: "{{ doc('match_confidence') }} Federal rows are joined by id, so always 'high'."
      - name: source_url
        data_type: varchar
        description: The Missouri Accountability Portal's employee pay search, or the federal pay table.

  - name: fct_legislator_expenses
    description: >
      Per diem (legislative daily expense allowance) and in-state mileage the state paid each legislator, per fiscal
      year (July to June), from the state expenditures (data.mo.gov "State Expenditures", agency LEGISLATURE). Each
      amount is the payee's annual total for that line, not one payment; negative totals are refunds and stay.
      Payees are paired with officials through the state payroll (fct_salaries), by legal name and year; a payee
      with no fitting payroll name, or whose fit is shared, is left out, so a legislator can be missing for a year.
      Per diem is claimed by days attended and mileage follows distance, so neither is a measure of performance.
      Grain: one row per (official, fiscal year, expense type).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [official_id, fiscal_year, expense_type]
    columns:
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_official')
                field: official_id
      - name: fiscal_year
        data_type: integer
        description: State fiscal year, July of the year before through June (fiscal year 2023 is July 2022 to June 2023).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 2000
                max_value: 2100
      - name: expense_type
        data_type: varchar
        description: "'per diem' (LEGISLATIVE DAILY EXPENSE ALLOWANCE) or 'mileage' (IN-STATE MILEAGE)."
        data_tests:
          - accepted_values:
              arguments:
                values: ['per diem', 'mileage']
      - name: payee_name
        data_type: varchar
        description: Payee as the expenditures print it ("LAST, FIRST MIDDLE", legal name), so a reader can check the match.
      - name: amount
        data_type: decimal(38,2)
        description: >
          Dollars paid to the payee for the fiscal year on this line. Sanity bounds: a legislator's annual per
          diem has never been near $30,000 and a year of mileage is far under $20,000.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 30000
      - name: match_confidence
        data_type: varchar
        description: "{{ doc('match_confidence') }}"
        data_tests:
          - accepted_values:
              arguments:
                values: ['high', 'medium']
      - name: source_url
        data_type: varchar
        description: >
          The dataset's page on data.mo.gov (https://data.mo.gov/d/<id>) for the fiscal year's rows, which a reader can
          open; source_api_url is the Socrata API URL the loader fetched.
      - name: source_api_url
        data_type: varchar
        description: The Socrata API URL (https://data.mo.gov/resource/<id>.json) the fiscal year's rows were loaded from; a raw JSON dump, not for display.

  - name: fct_county_districts
    description: >
      The current state house, state senate and congressional districts that reach each county, from the full
      unsimplified TIGER boundaries (the shipped map shapes are simplified to 50 m and open hairline gaps along
      shared edges, so they cannot answer this). A pair counts only when the overlap exceeds 0.1 km2 (about 25
      acres) and the overlap survives an inward buffer of 120 m (it erodes 120 m east-west and about 152 m
      north-south, so a kept overlap contains a circle of at least 120 m radius and is more than 240 m wide in
      every direction; real overlaps here are at least about 1.7 km wide); two boundaries that merely share an
      edge intersect with zero area and are dropped, and so are long thin slivers along a county line where two
      TIGER vintages disagree (Pulaski/CD 3 is 0.36 km2 but about 72 m wide). Also holds the
      cities (places) whose boundary covers at least 99% of the county, which is how St. Louis city (a county
      and a city at once) gets its mayor into the county view. Areas are planar lon/lat areas scaled by
      cos(latitude), accurate to a few tenths of a percent here. Grain: one row per (county, district).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [county_id, district_id]
    columns:
      - name: county_id
        data_type: varchar
        description: The county (dim_district).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_district')
                field: district_id
      - name: district_id
        data_type: varchar
        description: The district or city (dim_district) that overlaps the county.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_district')
                field: district_id
      - name: district_type
        data_type: varchar
        description: state_house, state_senate, us_house, or place.
        data_tests:
          - accepted_values:
              arguments:
                values: [state_house, state_senate, us_house, place]
      - name: overlap_km2
        data_type: double
        description: Area of the county that lies in the district, in square kilometers.
        data_tests: [not_null]
      - name: share_of_county
        data_type: double
        description: Fraction of the county's area that lies in the district (1 means the district covers the county).
        data_tests: [not_null]

  - name: fct_district_facilities
    description: >
      EPA-regulated facilities (EPA Facility Registry Service) inside each current area of dim_district: state
      house and senate districts, the U.S. House districts of the Congress in session, counties and places
      (cities). Placed by the facility's coordinates; the third of FRS sites with no coordinates, and the few
      whose coordinates fall outside Missouri, have no rows. FRS covers sites an EPA or state program regulates
      (factories, fuel stations, quarries, auto shops, dry cleaners, utilities...), not every business.
      Grain: one row per (area, facility).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [district_id, registry_id]
    columns:
      - name: district_id
        data_type: varchar
        description: The area (dim_district).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_district')
                field: district_id
      - name: registry_id
        data_type: varchar
        description: EPA FRS registry id of the facility.
        data_tests: [not_null]
      - name: facility_name
        data_type: varchar
        description: The facility's name in FRS.
      - name: address
        data_type: varchar
        description: Street address.
      - name: city
        data_type: varchar
        description: City in the facility's address.
      - name: postal_code
        data_type: varchar
        description: ZIP code.
      - name: owner_name
        data_type: varchar
        description: >
          The facility's owner or operator: the first owner-role organization any EPA program lists (owner/operator,
          owner, operator, permittee). Null when no program names one.
      - name: owner_type
        data_type: varchar
        description: The owner's FRS org_type (PRIVATE, MUNICIPAL, STATE...; mostly UNKNOWN).
      - name: parent_company_name
        data_type: varchar
        description: A parent company a program lists, when any does.
      - name: naics_code
        data_type: varchar
        description: >
          The NAICS code the most EPA program systems give (one count per system), primary codes before UNKNOWN or SECONDARY ones
          (int_epa_frs__facilities naics_source). A facility with no NAICS code but a SIC code instead gets the
          two-digit NAICS sector prefix its SIC code maps to (seed sic_naics_sectors), so a two-character
          value is a sector, not a full code. Null when the facility has neither.
      - name: naics_description
        data_type: varchar
        description: >
          The NAICS code's title, as FRS writes it. For a SIC-derived sector, the sector name and the SIC code,
          e.g. "Construction sector, from SIC 1629 HEAVY CONSTRUCTION, NOT ELSEWHERE CLASSIFIED".
      - name: is_government
        data_type: boolean
        description: A federal site, or an owner or operator is a government body (municipal, county, state, federal, district, tribal).
        data_tests: [not_null]
      - name: latitude
        data_type: float
        description: Latitude (NAD83).
      - name: longitude
        data_type: float
        description: Longitude (NAD83).
      - name: frs_url
        data_type: varchar
        description: The facility's EPA FRS detail report.

  - name: fct_jurisdiction_businesses
    description: >
      Businesses operating in a district-elected official's area: the non-government EPA-regulated facilities
      (fct_district_facilities) in the district a state legislator or U.S. representative is elected from, or in
      a mayor's city, flagged when the official received campaign contributions from them. Judges are left out
      (a circuit or federal district holds thousands of sites, and judges take almost no organization money).
      A contribution counts when the donor organization's name equals the facility's, its owner's or its parent
      company's after normalizing case, punctuation, a leading "the" and legal-form words (Inc, LLC, Co,
      Corp...), or when both names carry the same brand from the company_brands seed (corporate PACs and
      subsidiaries: "Spire PAC" and "LACLEDE GAS CO"). A company not in the seed that gives under another name
      is missed. Statewide officials have no rows (they serve every area). Grain: one row per (official,
      facility); district_id is the area that puts the facility in the official's jurisdiction. The donor
      columns (matched_by through match_confidence) are filled only when is_donor. The donors themselves, and the
      pages their gifts are filed on, are fct_jurisdiction_business_donors.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [official_id, registry_id]
    columns:
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_official')
                field: official_id
      - name: registry_id
        data_type: varchar
        description: EPA FRS registry id of the facility.
        data_tests: [not_null]
      - name: district_id
        data_type: varchar
        description: The official's area (dim_district) the facility is in.
        data_tests: [not_null]
      - name: facility_name
        data_type: varchar
        description: The facility's name in FRS.
      - name: address
        data_type: varchar
        description: Street address.
      - name: city
        data_type: varchar
        description: City in the facility's address.
      - name: postal_code
        data_type: varchar
        description: ZIP code.
      - name: owner_name
        data_type: varchar
        description: The facility's owner or operator (see fct_district_facilities).
      - name: parent_company_name
        data_type: varchar
        description: A parent company a program lists, when any does.
      - name: naics_code
        data_type: varchar
        description: >
          NAICS code the most EPA program systems give (primary before UNKNOWN or SECONDARY), or, for a
          facility with only a SIC code, the two-digit NAICS sector prefix its SIC major group maps to. Null when
          the facility has neither. See int_epa_frs__facilities.
      - name: naics_description
        data_type: varchar
        description: The NAICS code's title, or the sector name and SIC code for a SIC-derived sector.
      - name: is_donor
        data_type: boolean
        description: The official received campaign contributions from this facility, its owner or its parent company.
        data_tests: [not_null]
      - name: matched_by
        data_type: varchar
        description: >
          How the donor was tied to the facility, when is_donor: `same name` (the donor's normalized name equals
          the facility's, owner's or parent company's) or `same company` (both names carry one brand from the
          company_brands seed, e.g. "Ameren Missouri PAC" and a "UNION ELECTRIC CO" substation).
        data_tests:
          - accepted_values:
              arguments:
                values: ['same name', 'same company']
      - name: donated_amount
        data_type: decimal(38,6)
        description: >
          Total contributions the official received from the matched donors (all years loaded), when is_donor.
          The same total repeats on every facility of that company in the official's area.
      - name: n_contributions
        data_type: hugeint
        description: Number of those contributions.
      - name: first_year
        data_type: integer
        description: Year of the earliest matched contribution, when is_donor.
      - name: last_year
        data_type: integer
        description: Year of the latest matched contribution, when is_donor.
      - name: match_confidence
        data_type: varchar
        description: >
          `medium` when any of the matched contributions was tied to the official by a name-only match
          (fct_campaign_finance.match_confidence), else `high`; null when not is_donor. This is about who received
          the money, not about the donor-to-facility match (see matched_by).
        data_tests:
          - accepted_values:
              arguments:
                values: ['high', 'medium']
      - name: frs_url
        data_type: varchar
        description: The facility's EPA FRS detail report.

  - name: fct_jurisdiction_business_donors
    description: >
      The donors behind fct_jurisdiction_businesses (#370): for each facility flagged is_donor, the donor
      organizations tied to it and each filing page their gifts to the official are filed on. A donor that gave
      through an MEC and an FEC committee, or to two FEC committees, has one row per page, so no single url is
      picked (#248). A donor with no filing-page url has one row with a null source_url. An MEC page is the
      committee that received the money (the committee matched to the official), not filtered to the donor; an
      FEC page is the donor committee's disbursements filtered to the receiving committee, so it lists the gifts
      themselves. Which regulator a page belongs to is in the url. Names are as filed (a ";" or "," inside one
      stays), except that line breaks become spaces. Rows have no meaningful order: a consumer sorts. Grain: one
      row per (official, facility, donor name, source url). The donated totals are on fct_jurisdiction_businesses
      and repeat per facility.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [official_id, registry_id, donor_name, source_url]
    columns:
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_official')
                field: official_id
      - name: registry_id
        data_type: varchar
        description: >
          EPA FRS registry id of the facility. (official_id, registry_id) is a row of fct_jurisdiction_businesses
          with is_donor (assert_business_donors_have_a_business).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_jurisdiction_businesses')
                field: registry_id
      - name: donor_name
        data_type: varchar
        description: The donor organization as filed in the campaign-finance record (one name per company_key).
        data_tests: [not_null]
      - name: source_url
        data_type: varchar
        description: >
          A filing page the donor's gifts to the official are filed on (MEC committee page or FEC disbursements
          page); null when none of them has a url.
        data_tests:
          - dbt_utils.not_empty_string

  - name: fct_election_races
    description: >
      One row per race in the Missouri Secretary of State's official election returns (statewide Grand Totals
      PDFs for the general and primary elections of 2012 on): office, winner, runner-up, margin, and whether the
      winner had no opponent. A primary race is one party's ballot (race_party), so a contested primary has one
      row per party. Candidates are counted without write-ins; a race whose only entries are write-ins is not
      listed. Winner is the candidate with the most votes (single-seat races; the PDFs do not print the number
      of seats). Keyed by election and contest, not by official: former officials and losing candidates are
      here too. Grain: one row per (election, contest, race party).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [election_key, contest_seq, race_party]
    columns:
      - name: election_key
        data_type: varchar
        description: "`<yyyy-mm-dd>-general` or `<yyyy-mm-dd>-primary`."
        data_tests: [not_null]
      - name: election_type
        data_type: varchar
        description: general or primary.
        data_tests:
          - accepted_values:
              arguments:
                values: [general, primary]
      - name: election_date
        data_type: date
        description: Election day.
        data_tests: [not_null]
      - name: contest_seq
        data_type: integer
        description: Position of the contest in its PDF (1 = first); with election_key it identifies the contest.
      - name: race_party
        data_type: varchar
        description: The party whose primary ballot this is; null in general elections.
      - name: contest_title
        data_type: varchar
        description: Contest as printed, without the precinct count, e.g. "State Representative - District 34".
      - name: office
        data_type: varchar
        description: The title before the first " - " ("State Representative", "U.S. Senator", "Circuit Judge"...).
        data_tests: [not_null]
      - name: district
        data_type: varchar
        description: District number when the title has "District n"; null for statewide offices and judicial circuits.
      - name: candidates
        data_type: integer
        description: Candidates on the ballot, write-ins not counted.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 30
      - name: is_uncontested
        data_type: boolean
        description: >
          Exactly one candidate on the ballot, write-ins not counted (a write-in with votes does not make a race
          contested). In a primary this is per party ballot.
        data_tests: [not_null]
      - name: total_votes
        data_type: bigint
        description: Votes for all candidates including write-ins; the PDF's "Total Votes" (checked against it in a test).
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 6000000
      - name: write_in_votes
        data_type: bigint
        description: Votes for the write-in candidates the SoS lists.
      - name: write_in_share
        data_type: decimal(5,2)
        description: write_in_votes as a percentage of total_votes (points).
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: winner_name
        data_type: varchar
        description: Candidate with the most votes (write-ins excluded), as printed.
        data_tests: [not_null]
      - name: winner_party
        data_type: varchar
        description: Winner's party as printed.
      - name: winner_votes
        data_type: bigint
        description: Winner's votes.
      - name: winner_share
        data_type: decimal(5,2)
        description: Winner's votes as a percentage of total_votes (points).
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: runner_up_name
        data_type: varchar
        description: Candidate with the second most votes (write-ins excluded); null when uncontested.
      - name: runner_up_party
        data_type: varchar
        description: Runner-up's party as printed.
      - name: runner_up_votes
        data_type: bigint
        description: Runner-up's votes.
      - name: margin_votes
        data_type: bigint
        description: winner_votes minus runner_up_votes; null when uncontested.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: margin_pct
        data_type: decimal(5,2)
        description: (winner_votes minus runner_up_votes) as a percentage of total_votes, in points; null when uncontested.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: precincts_reported
        data_type: integer
        description: Precincts reported, from the contest header.
      - name: precincts_total
        data_type: integer
        description: Precincts in the contest.
      - name: winner_official_id
        data_type: varchar
        description: >
          The winner's official_id when the winner is a current official with the same name (suffixes ignored) in
          the same office and district; null otherwise (former officials, losers, offices not tracked).
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_official')
                field: official_id
      - name: source_url
        data_type: varchar
        description: The Grand Totals PDF the race was read from.

  - name: fct_judicial_retention
    description: >
      One row per judge on a retention ballot in the Secretary of State's official returns (Supreme Court, Court
      of Appeals, and the circuit and associate circuit judges under the nonpartisan plan; elections of 2012 on):
      Yes and No votes and the printed Yes share. A judge is retained with a majority of Yes votes. Keyed by
      election and contest. Grain: one row per (election, contest, judge).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [election_key, contest_seq, subcontest_seq]
    columns:
      - name: election_key
        data_type: varchar
        description: "`<yyyy-mm-dd>-general` or `<yyyy-mm-dd>-primary`."
        data_tests: [not_null]
      - name: election_type
        data_type: varchar
        description: general or primary.
      - name: election_date
        data_type: date
        description: Election day.
      - name: contest_seq
        data_type: integer
        description: Position of the contest header in its PDF.
      - name: subcontest_seq
        data_type: integer
        description: Which judge under that header (1 = first); a Court of Appeals header lists several judges.
      - name: contest_title
        data_type: varchar
        description: Contest as printed, e.g. "Court of Appeals - Western District".
      - name: office
        data_type: varchar
        description: The title before the first " - " ("Missouri Supreme Court", "Court of Appeals", "Circuit Judge"...).
      - name: judge_name
        data_type: varchar
        description: Judge as printed.
        data_tests: [not_null]
      - name: yes_votes
        data_type: bigint
        description: Votes to retain.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 6000000
      - name: no_votes
        data_type: bigint
        description: Votes against; null where the PDF's No line lost its vote count (2016 only).
      - name: yes_pct
        data_type: decimal(5,1)
        description: The printed percentage of Yes votes (points), the official figure.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: no_pct
        data_type: decimal(5,1)
        description: The printed percentage of No votes (points).
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: is_retained
        data_type: boolean
        description: More Yes than No votes (the printed Yes share above 50% when the No line is lost).
      - name: precincts_reported
        data_type: integer
        description: Precincts reported, from the contest header.
      - name: precincts_total
        data_type: integer
        description: Precincts in the contest.
      - name: judge_official_id
        data_type: varchar
        description: >
          The judge's official_id when they are a current Supreme Court or Court of Appeals judge with the same
          name; null for circuit judges and former judges.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_official')
                field: official_id
      - name: source_url
        data_type: varchar
        description: The Grand Totals PDF the judge was read from.

  - name: fct_committee_memberships
    description: >
      House committee and subcommittee memberships per official and session, with the member's position (Chair,
      Vice-Chair, Co-Chair, Ranking Minority Member, Member). An end-of-session snapshot from the House member
      pages (every session since 2017 but 253) and the COMMITTEELIST export for 253. Former members are kept:
      official_id is the person id, and is_current_official says whether that person is in dim_official (only
      current officials have a profile page). Committee names change across sessions, so compare a committee by
      name only within a session. Grain: one row per (person, session, committee).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [official_id, session_code, committee_name]
      - dbt_utils.expression_is_true:
          arguments:
            expression: session_year between 2017 and 2030
    columns:
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }}"
        data_tests: [not_null]
      - name: session_code
        data_type: varchar
        description: House session code.
        data_tests: [not_null]
      - name: session_year
        data_type: integer
        description: Calendar year of the session.
      - name: committee_name
        data_type: varchar
        description: Committee name as the House lists it for that session. Subcommittees say "Subcommittee".
        data_tests: [not_null]
      - name: position_name
        data_type: varchar
        description: The member's position on the committee.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Chair', 'Vice-Chair', 'Co-Chair', 'Ranking Minority Member', 'Member']
      - name: is_subcommittee
        data_type: boolean
        description: True when the committee name contains "Subcommittee".
      - name: source
        data_type: varchar
        description: member_page (the member's own House page) or committee_list (the COMMITTEELIST export).
        data_tests:
          - accepted_values:
              arguments:
                values: ['member_page', 'committee_list']
      - name: source_url
        data_type: varchar
        description: >
          The House file this row was read from, as the loader fetched it: the session zip for a closed session,
          the member's own XML file (documents.house.mo.gov/xml/261-072.xml) for the open one, the COMMITTEELIST
          file's zip for session 253.
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "like 'https://documents.house.mo.gov/xml/%'"
      - name: is_current_official
        data_type: boolean
        description: True when official_id is in dim_official (a current official with a profile page).
        data_tests: [not_null]

  - name: dim_house_session
    description: >
      The House's own names for its legislative sessions ("2025 1st Extraordinary Session", "2018 Special
      Session"), from the SESSIONLIST file in every House session zip. The code's last digit does not say which
      extraordinary session it is, so the frontend labels sessions from this table. A session the House has not
      listed yet (the open one before its first list is loaded) is absent: show the code, never guess a name.
      Grain: one row per session.
    columns:
      - name: session_code
        data_type: varchar
        description: House session code (two-digit year plus a type digit), the key the other House models carry.
        data_tests: [unique, not_null]
      - name: session_name
        data_type: varchar
        description: The House's name for the session.
        data_tests: [not_null]
      - name: session_year
        data_type: integer
        description: Calendar year of the session.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 2000
                max_value: 2100
      - name: session_type
        data_type: varchar
        description: The House's type code (R regular, S1, S2 later sessions of the year).
        data_tests:
          - accepted_values:
              arguments:
                values: ['R', 'S1', 'S2', 'S3']
      - name: general_assembly
        data_type: varchar
        description: General Assembly the session belongs to ("103rd General Assembly").
      - name: session_of_general_assembly
        data_type: varchar
        description: Which session of that assembly it is ("1st Regular Session", "1st Special Session").

  - name: fct_committee_posts
    description: >
      Committee posts held per official and House session, counted from the House's own committee lists: full
      committees served on, and the titles held on them (chair, vice-chair, co-chair, ranking minority member).
      Subcommittees are counted apart (subcommittee_chair_posts) so chairing several subcommittees is not shown as
      chairing several committees. A count of titles, not a score. Former members are kept (is_current_official).
      Grain: one row per (person, session).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [official_id, session_code]
      - dbt_utils.expression_is_true:
          arguments:
            expression: chair_posts + vice_chair_posts + co_chair_posts + ranking_posts <= committees_held
    columns:
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }}"
        data_tests: [not_null]
      - name: session_code
        data_type: varchar
        description: House session code.
      - name: session_year
        data_type: integer
        description: Calendar year of the session.
      - name: is_current_official
        data_type: boolean
        description: True when official_id is in dim_official (a current official with a profile page).
        data_tests: [not_null]
      - name: source_url
        data_type: varchar
        description: >
          The House file the member's rows were read from (the session zip, or the member's own XML file for the
          open session). If a person held two House member files in one session, one of them.
        data_tests: [not_null]
      - name: committees_held
        data_type: bigint
        description: Full (non-sub) committees the member served on.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 25
      - name: chair_posts
        data_type: bigint
        description: Full committees chaired.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 6
      - name: vice_chair_posts
        data_type: bigint
        description: Full committees where the member is Vice-Chair.
      - name: co_chair_posts
        data_type: bigint
        description: Full committees where the member is Co-Chair.
      - name: ranking_posts
        data_type: bigint
        description: Full committees where the member is Ranking Minority Member.
      - name: subcommittee_chair_posts
        data_type: bigint
        description: Subcommittees chaired.

  - name: fct_judge_time_to_disposition
    description: >
      Median days from filing to termination of the civil and criminal federal district-court dockets (E.D. and
      W.D. Missouri) assigned to each judge, one row per case type, from the CourtListener bulk export. Built only
      with the cl_case_bulk var. Case type comes from the docket-number type (see
      int_courtlistener__district_dockets); miscellaneous dockets (warrants, subpoenas, complaints) and the few
      unclassified old docket types are left out, and a judge with no dockets of a type has no row for it. Counts
      and medians describe that case type only. The state
      courts carry no judge or dates in that export. Dockets that end before they were filed are left out of the
      median and counted in dockets_ends_before_filed. Show dockets_measured next to the median, and
      share_with_both_dates for how much of the judge's docket load it covers. "Assigned" is the judge on the
      docket record, not necessarily who decided it. Includes judges who no longer sit. Grain: one row per judge and case type.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cl_person_id, case_type]
      - dbt_utils.expression_is_true:
          arguments:
            expression: dockets_measured + dockets_ends_before_filed = dockets_with_both_dates
      # Sanity: a measured median is a real number of days. A civil or criminal federal docket taking under a month
      # or over four years at the median means the case-type or date logic broke (the combined median that mixed in
      # warrants and subpoenas read 0-15 days for those).
      - dbt_utils.expression_is_true:
          arguments:
            expression: median_days_to_disposition between 30 and 1500
            config:
              where: dockets_measured >= 30
    columns:
      - name: cl_person_id
        data_type: varchar
        description: CourtListener person id of the judge.
        data_tests: [not_null]
      - name: case_type
        data_type: varchar
        description: >
          civil (docket type cv, or md for multidistrict litigation) or criminal (cr). Every count and median on
          the row is for dockets of this type only.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['civil', 'criminal']
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }} Null for judges not in the officials list (retired or senior)."
      - name: judge_name
        data_type: varchar
        description: Name from the CourtListener judge database.
      - name: court_id
        data_type: varchar
        description: moed, mowd, or moed+mowd for a judge with dockets in both districts.
        data_tests:
          - accepted_values:
              arguments:
                values: ['moed', 'mowd', 'moed+mowd']
      - name: dockets_assigned
        data_type: bigint
        description: Dockets of this case type assigned to the judge.
      - name: dockets_with_both_dates
        data_type: bigint
        description: Of those, dockets with both a filing and a termination date.
      - name: dockets_ends_before_filed
        data_type: bigint
        description: Dockets with both dates where the termination is before the filing (excluded from the median).
      - name: dockets_measured
        data_type: bigint
        description: Dockets behind the median (both dates, duration of zero or more days).
      - name: share_with_both_dates
        data_type: float
        description: dockets_with_both_dates / dockets_assigned.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: median_days_to_disposition
        data_type: float
        description: Median days from filing to termination over the measured dockets. Null when none were measured.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 7305
