version: 2

# Reporting models are shaped for the frontend's pages (docs/frontend_principles.md). Like the marts, their columns are
# a contract (data_type per column) and descriptions persist as warehouse comments. They read only marts and
# intermediate models. Every row keeps official_id (rpt_committee_donors, keyed by committee, is the exception),
# and source_url / match_confidence wherever the facts behind it have them.

models:
  - name: rpt_indicator_peers
    description: >
      Each bias indicator value (fct_bias_indicators) with the same measure's distribution over the
      official's peers: every tracked official with that indicator in the same chamber (and Congress, for
      DW-NOMINATE). peer_group names the group, so a strip chart selects all rows sharing it. Medians, not
      means; no ranks. Grain: one row per fct_bias_indicators row.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [official_id, indicator, period, detail]
    columns:
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_official')
                field: official_id
      - name: full_name
        data_type: varchar
        description: Display name (dim_official).
      - name: party
        data_type: varchar
        description: Current party (dim_official); shown as a label, not a color.
      - name: indicator
        data_type: varchar
        description: Which measure (see fct_bias_indicators).
      - name: chamber
        data_type: varchar
        description: Chamber the value was measured in (see fct_bias_indicators).
      - name: period
        data_type: integer
        description: As in fct_bias_indicators (Congress number, last year served, or null).
      - name: detail
        data_type: varchar
        description: As in fct_bias_indicators.
      - name: value
        data_type: double
        description: The official's value, on the indicator's own scale.
      - name: peer_group
        data_type: varchar
        description: "`<indicator>:<chamber>` plus `:<congress>` for DW-NOMINATE. Rows sharing it are compared."
        data_tests: [not_null]
      - name: peer_count
        data_type: bigint
        description: Officials in the peer group, including this one.
      - name: peer_median
        data_type: double
        description: Median value over the peer group.
      - name: peer_min
        data_type: double
        description: Lowest value in the peer group.
      - name: peer_max
        data_type: double
        description: Highest value in the peer group.
      - name: party_peer_count
        data_type: bigint
        description: Peers of the official's own party (null without a party).
      - name: party_median
        data_type: double
        description: Median over peers of the official's own party.
      - name: republican_median
        data_type: double
        description: Median over Republican peers (null if none).
      - name: democratic_median
        data_type: double
        description: Median over Democratic peers (null if none).
      - name: source_url
        data_type: varchar
        description: "{{ doc('source_url') }}"

  - name: rpt_party_breaks
    description: >
      Party-line votes (Republican and Democratic majorities on opposite sides, counted over every member
      who voted) where the official voted yea/nay against their own party's majority. These are the votes
      behind a party_unity_pct below 100. Grain: one row per (official, chamber, vote).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [official_id, chamber, vote_id]
    columns:
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }}"
        data_tests: [not_null]
      - name: full_name
        data_type: varchar
        description: Display name.
      - name: chamber
        data_type: varchar
        description: state_house, state_senate, us_house or us_senate.
      - name: session_code
        data_type: varchar
        description: Legislative session (MO House session code, Senate year) or Congress number.
      - name: vote_id
        data_type: varchar
        description: Vote identifier, as in fct_votes.
      - name: vote_date
        data_type: date
        description: Date of the vote.
      - name: measure
        data_type: varchar
        description: Bill or measure voted on, where the source names one.
      - name: vote_description
        data_type: varchar
        description: What the vote was on (calendar item, journal sentence or Voteview description).
      - name: party_at_vote
        data_type: varchar
        description: The official's party when the vote was cast.
      - name: vote_cast
        data_type: varchar
        description: The official's vote (yea or nay).
      - name: party_position
        data_type: varchar
        description: Majority position of the official's party (the side they broke from).
      - name: other_party_position
        data_type: varchar
        description: Majority position of the other major party (the side they voted with).
      - name: republican_yea
        data_type: hugeint
        description: Republicans voting yea (all members, not only tracked officials).
      - name: republican_nay
        data_type: hugeint
        description: Republicans voting nay.
      - name: democratic_yea
        data_type: hugeint
        description: Democrats voting yea.
      - name: democratic_nay
        data_type: hugeint
        description: Democrats voting nay.
      - name: source_url
        data_type: varchar
        description: "{{ doc('source_url') }}"

  - name: rpt_donor_rollup
    description: >
      Money received by each official's campaign committees (fct_campaign_finance, direction 'received'),
      summed per donor, donor class and year. Individual federal donors are only available summarized
      (fct_federal_donor_summary). Grain: one row per (official, level, year, donor class, donor, match
      confidence, source, source_url, donor's MECID).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              [official_id, level, transaction_year, donor_class, donor_name, match_confidence, source, source_url,
                donor_mec_committee_id]
    columns:
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }}"
        data_tests: [not_null]
      - name: level
        data_type: varchar
        description: federal (FEC) or state (MEC).
      - name: transaction_year
        data_type: integer
        description: Calendar year of the contributions.
      - name: election_cycle
        data_type: integer
        description: Two-year cycle the year belongs to, named by its even (election) year.
      - name: donor_class
        data_type: varchar
        description: >
          individual, pac, party, candidate committee, committee (MEC committees of any kind), business or
          organization, other. Grouped from the sources' counterparty types.
        data_tests:
          - accepted_values:
              arguments:
                values: ['individual', 'pac', 'party', 'candidate committee', 'committee',
                  'business or organization', 'other']
      - name: donor_name
        data_type: varchar
        description: >
          The counterparty's organization where the source names one (an individual's employer or company,
          a PAC's connected organization), else the counterparty's name.
      - name: match_confidence
        data_type: varchar
        description: "{{ doc('match_confidence') }}"
      - name: source
        data_type: varchar
        description: Where the records come from (FEC, MEC, MEC via the Accountability Project).
      - name: source_url
        data_type: varchar
        description: "{{ doc('source_url') }}"
      - name: donor_mec_committee_id
        data_type: varchar
        description: >
          A Missouri committee donor's own MECID, matched by name (fct_campaign_finance.counterparty_mec_committee_id);
          its donors are in rpt_committee_donors. Null for other donors and unmatched names.
      - name: donor_link_confidence
        data_type: varchar
        description: >
          `high` (a curated alias, MECID written into the name, or same name) or `medium` (spelling-normalized name,
          with abbreviations spelled out and filler words dropped; or core name, with words like PAC, Political,
          Action, Committee, Fund, Account dropped, or a filer's parenthesized short name) for
          donor_mec_committee_id; null without one.
      - name: total_amount
        data_type: decimal(38,6)
        description: Sum received, in dollars.
      - name: contribution_count
        data_type: bigint
        description: Number of contributions summed.
      - name: first_date
        data_type: date
        description: Earliest contribution date in the row.
      - name: last_date
        data_type: date
        description: Latest contribution date in the row.

  - name: rpt_gift_rollup
    description: >
      Lobbyist gifts (fct_lobbyist_gifts) summed per official, principal, category and year. Missouri's
      Amendment 1 (December 2018) banned most gifts over $5, so totals drop sharply after 2018. Grain: one
      row per (official, year, principal, category, match confidence, source).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              [official_id, expenditure_year, lobbyist_principal, expenditure_category, match_confidence, source]
    columns:
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }}"
        data_tests: [not_null]
      - name: expenditure_year
        data_type: bigint
        description: Year of the gifts.
      - name: lobbyist_principal
        data_type: varchar
        description: The client the lobbyist reported the gift for; "(not reported)" if blank.
      - name: expenditure_category
        data_type: varchar
        description: MEC category, upper-cased (MEALS, FOOD, & BEVERAGE; ENTERTAINMENT; GIFT; TRAVEL; ...).
      - name: match_confidence
        data_type: varchar
        description: "{{ doc('match_confidence') }}"
      - name: source
        data_type: varchar
        description: MEC lobbyist reports, direct or via the Accountability Project.
      - name: total_amount
        data_type: decimal(38,6)
        description: Sum of the gifts, in dollars.
      - name: gift_count
        data_type: bigint
        description: Number of gifts summed.
      - name: lobbyist_count
        data_type: bigint
        description: Distinct lobbyists who reported them.
      - name: first_date
        data_type: date
        description: Earliest gift date in the row.
      - name: last_date
        data_type: date
        description: Latest gift date in the row.
      - name: source_url
        data_type: varchar
        description: MEC's lobbyist expenditure search (MEC has no per-report permalink).

  - name: rpt_attendance
    description: >
      Attendance for recorded votes per official, chamber and session, with the whole chamber's rate for the
      same session (every member, tracked or not). Present = yea, nay or present. Grain: one row per
      (official, chamber, session).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [official_id, chamber, session_code]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "votes_present + absent + absent_with_leave + not_voting + recused_from_voting = votes_recorded"
    columns:
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }}"
        data_tests: [not_null]
      - name: full_name
        data_type: varchar
        description: Display name.
      - name: chamber
        data_type: varchar
        description: state_house, state_senate, us_house or us_senate.
      - name: session_code
        data_type: varchar
        description: >
          MO House session code (two-digit year + type: 1 regular, 2-4 extraordinary), MO Senate journal
          year, or Congress number.
      - name: first_vote_date
        data_type: date
        description: First recorded vote of the official in the session.
      - name: last_vote_date
        data_type: date
        description: Last recorded vote of the official in the session.
      - name: votes_recorded
        data_type: bigint
        description: Votes on which the official was listed (as a member) in the session.
      - name: votes_present
        data_type: hugeint
        description: Of those, votes where they voted yea, nay or present.
      - name: absent
        data_type: hugeint
        description: Listed as absent.
      - name: absent_with_leave
        data_type: hugeint
        description: Listed as absent with leave (an excused absence; MO Senate journals).
      - name: not_voting
        data_type: hugeint
        description: Listed as not voting (Congress, Voteview code 9; the source does not say whether it was excused).
      - name: recused_from_voting
        data_type: hugeint
        description: >
          Recused: "Excused from voting" in the MO Senate journals, a Senate Rule 91 recusal by a member present on the
          floor. Only the MO Senate records this (0 elsewhere does not mean never recused). votes_present + absent +
          absent_with_leave + not_voting + recused_from_voting = votes_recorded.
      - name: attendance_pct
        data_type: double
        description: >
          100 * votes_present / votes_recorded. A recusal counts as not present here; whether it should count as
          attended is an open decision (#135).
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: chamber_attendance_pct
        data_type: double
        description: The same rate over every member of the chamber in the session.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100

  - name: rpt_attendance_pay
    description: >
      Dollars paid per vote attended, to show next to rpt_attendance. Pay is per calendar year (fct_salaries), so
      votes are counted per calendar year of the vote date and the two cover the same period; sessions sharing a
      year (a regular and an extraordinary House session) are one year row. Attended = yea, nay or present, the
      numerator of attendance_pct; a recusal (MO Senate Rule 91, open decision #135) is not attended. Pay =
      the sum of the official's pay rows in that chamber's own positions for the year: gross pay from the state
      payroll (everything paid that calendar year, not the base salary) or, for Congress, the statutory salary
      of the office. Two kinds of row, told apart by period: a calendar year ('2021'), and 'covered years', the
      official's total over the years where both pay and votes exist (a year with votes but no pay row, e.g.
      before the payroll starts in 2017, stays out of the total; voting_years vs covered_years says how many
      years that left out). Zero attended votes gives a null figure. Grain: one row per (official, chamber,
      period).
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [official_id, chamber, period]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "votes_attended <= votes_recorded and covered_years <= voting_years"
      # Sanity: nobody is paid more than the top federal salary in one year, and no vote costs $20,000
      # (through 2026 the highest was $9,231: a senator who joined late in 2017 and cast one vote).
      # Intended trip-wire: a senator in office most of a year who casts a single vote in it would exceed
      # $20,000 per vote and fail this test; that is worth a look, not a bug in the bound.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "pay_amount <= 300000 or period = 'covered years'"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "dollars_per_vote_attended is null or dollars_per_vote_attended between 1 and 20000"
    columns:
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }}"
        data_tests: [not_null]
      - name: chamber
        data_type: varchar
        description: state_house, state_senate, us_house or us_senate (as rpt_attendance).
      - name: period
        data_type: varchar
        description: A calendar year such as '2021', or 'covered years' for the total over years with both pay and votes.
        data_tests: [not_null]
      - name: calendar_year
        data_type: bigint
        description: The year of a yearly row; null on 'covered years'.
      - name: voting_years
        data_type: bigint
        description: Calendar years in which the official has recorded votes in this chamber (1 on a yearly row).
      - name: covered_years
        data_type: hugeint
        description: Of those, years with a pay row (the payroll starts in 2017). Only these count in 'covered years'.
      - name: votes_recorded
        data_type: hugeint
        description: Votes on which the official was listed in the period; on 'covered years', only in covered years.
      - name: votes_attended
        data_type: hugeint
        description: Of those, votes where they voted yea, nay or present.
      - name: pay_amount
        data_type: decimal(38,2)
        description: Dollars paid in the period (see pay_basis); null when no pay row exists for the year.
      - name: pay_basis
        data_type: varchar
        description: "'gross pay' (state payroll, all pay received in the year) or 'statutory salary' (Congress)."
      - name: match_confidence
        data_type: varchar
        description: >
          The lowest match_confidence of the fct_salaries rows summed into pay_amount ('medium' if any is
          name-prefix only, else 'high'); on 'covered years', the lowest over the covered years. Null when
          there is no pay.
        data_tests:
          - accepted_values:
              arguments:
                values: [high, medium]
      - name: pay_source_url
        data_type: varchar
        description: Where the pay comes from (the state payroll site, or the page the federal salary was taken from).
      - name: dollars_per_vote_attended
        data_type: double
        description: pay_amount / votes_attended, in dollars; null when there is no pay or no attended vote.

  - name: rpt_interest_vote_overlap
    description: >
      Missouri legislators' roll-call votes on bills whose subject index terms touch an industry or
      interest that gave the official money (organization/PAC contributions or lobbyist gifts) in or before the
      vote's year. Industries come from donor and principal names (interest_keywords seed) and are tied to bill
      subjects by the industry_subjects seed. Co-occurrence, not causation: a row says money and a vote meet, not
      that one caused the other. Only votes linked to a bill with subject terms (fct_vote_bills, fct_bill_subjects).
      A vote on combined bills ("SBs 49 & 118") is a vote on each of them, so it gets a row per bill.
      Grain: one row per (official, chamber, vote, bill, industry).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [official_id, chamber, vote_id, bill, industry]
    columns:
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_official')
                field: official_id
      - name: chamber
        data_type: varchar
        description: state_house or state_senate.
      - name: session_code
        data_type: varchar
        description: MO House session code of the bill.
      - name: vote_id
        data_type: varchar
        description: Vote identifier, as in fct_votes.
      - name: vote_date
        data_type: date
        description: Date of the vote.
      - name: vote_description
        data_type: varchar
        description: >
          What the roll call decided, as in fct_votes. Senate journal text names the question ("read the 3rd time
          and passed", "SA 2 failed of adoption"); House roll calls carry only the calendar item, which does not
          tell an amendment from passage. The site uses it to pick one example vote per bill.
      - name: bill
        data_type: varchar
        description: The bill voted on (fct_vote_bills).
      - name: short_title
        data_type: varchar
        description: The bill's short title (fct_bills).
      - name: vote_cast
        data_type: varchar
        description: The official's vote, as in fct_votes.
      - name: industry
        data_type: varchar
        description: Industry or interest (interest_keywords / industry_subjects seeds).
        data_tests: [not_null]
      - name: matched_subjects
        data_type: varchar
        description: The bill's subject index terms that tie it to the industry, '; '-separated.
      - name: contributions_amount
        data_type: decimal(38,6)
        description: Contributions from the industry's organizations and PACs to the official in or before the vote's year.
      - name: gifts_amount
        data_type: decimal(38,6)
        description: Lobbyist gifts from the industry's principals to the official in or before the vote's year.
      - name: first_money_year
        data_type: integer
        description: First year the official received money from the industry.
      - name: last_money_year
        data_type: integer
        description: Last year (up to the vote's year) the official received money from the industry.
      - name: match_confidence
        data_type: varchar
        description: "{{ doc('match_confidence') }} The weakest among the money rows counted."
      - name: vote_source_url
        data_type: varchar
        description: The roll call or journal the vote comes from.
      - name: bill_source_url
        data_type: varchar
        description: The bill's page.

  - name: rpt_votes_by_subject
    description: >
      Recorded votes per official on bills by subject (fct_votes -> fct_vote_bills -> fct_bill_subjects).
      Counts are distinct roll calls, so a roll call on two bills sharing a subject counts once. Subjects come
      from the House subject index and the Senate topics index and are kept apart (subject_source). Only votes
      linked to a bill are counted. Grain: one row per (official, chamber, subject, subject source).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [official_id, chamber, subject_name, subject_source]
    columns:
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }}"
        data_tests: [not_null]
      - name: chamber
        data_type: varchar
        description: state_house or state_senate.
      - name: subject_name
        data_type: varchar
        description: Subject as the index names it (e.g. TRANSPORTATION).
      - name: subject_source
        data_type: varchar
        description: Which index the subject comes from (house, senate).
      - name: roll_calls
        data_type: bigint
        description: Distinct roll calls on bills with this subject where the official was recorded.
      - name: yea
        data_type: bigint
        description: Of those, roll calls where they voted yea.
      - name: nay
        data_type: bigint
        description: Of those, roll calls where they voted nay.
      - name: other
        data_type: bigint
        description: >
          Of those, roll calls where they did anything other than vote yea or nay: present, absent, absent with
          leave, not voting or recused (Senate Rule 91).
      - name: bills
        data_type: bigint
        description: Distinct bills with this subject among those roll calls.
      - name: first_session
        data_type: varchar
        description: Earliest session code among the roll calls.
      - name: last_session
        data_type: varchar
        description: Latest session code among the roll calls.

  - name: rpt_awards
    description: >
      Number-based awards for the frontend: the top officials (ties share a rank; 5 by default, set per award
      by the awards_threshold var) on one measured number within one office, per calendar year and over all
      loaded years ('lifetime'), each shown with its opposite: lowest/highest attendance (rpt_attendance,
      100+ recorded votes, ranked in the chamber the votes were cast in; an official who served in both
      chambers has a row per chamber, so `office` can differ from the official's current office), most money from PACs, committees and parties / lowest share of it among officials
      raising $10,000+ (rpt_donor_rollup, medium name matches excluded; federal officials' share is per FEC
      two-year cycle, reported under the cycle's end year, over FEC total receipts from fct_federal_donor_summary,
      since the rollup holds only their committee receipts), most breaks with / most loyal to
      their party (party unity from fct_party_unity_yearly, current chamber, per calendar year and lifetime, at
      least awards_min_party_line_votes party-line votes in the period (default 20); the lifetime figure equals
      the profile's party_unity_pct, the yearly figures appear with the award only). Most breaks needs at least
      one break. Only attendance and party unity are pairs (the two ends rank one number over one field); each end's
      cutoff is at most half that field (floor(group_size / 2)), ties at the cutoff can add more, so
      no official is in both lists of a pair for one office and period; an official a tie at the cut would put
      in both is in neither. Only offices with awards_min_field_size
      (5) or more qualifying officials in the period. streak_years counts consecutive qualifying years. No
      composite scores. Grain: one row per (award, office, period, official).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [award, office, period, official_id]
    columns:
      - name: award
        data_type: varchar
        description: >
          lowest_attendance, highest_attendance, most_committee_money, least_committee_money_share,
          most_party_breaks, most_party_loyal.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['lowest_attendance', 'highest_attendance', 'most_committee_money',
                  'least_committee_money_share', 'most_party_breaks', 'most_party_loyal']
      - name: office
        data_type: varchar
        description: The comparison group (dim_official.office); officials are ranked only against their office.
      - name: period
        data_type: varchar
        description: >
          Calendar year, the even end year of a two-year FEC cycle (period_kind = 'fec_cycle'), or 'lifetime' for
          all loaded years.
      - name: period_kind
        data_type: varchar
        description: >
          What the period is: 'year' (calendar year), 'fec_cycle' (two-year FEC cycle named by its even end
          year; federal officials' least_committee_money_share) or 'lifetime' (all loaded years). The
          frontend words the period from this instead of guessing from the award and office.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['year', 'fec_cycle', 'lifetime']
      - name: award_rank
        data_type: bigint
        description: 1 = the official the award describes most strongly; ties share a rank.
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }}"
        data_tests: [not_null]
      - name: metric
        data_type: decimal(28,6)
        description: >
          The ranked number: attendance %, dollars from PACs/committees/parties, % of money from them, or party
          unity %.
      - name: sample_size
        data_type: decimal(28,6)
        description: What the metric is out of (recorded votes, total dollars raised, or party-line votes cast).
      - name: group_size
        data_type: bigint
        description: >
          How many officials in the office qualified for this award and period. For the party awards, the whole
          ranked field (including officials with no break, who are left out of most_party_breaks).
      - name: streak_years
        data_type: bigint
        description: >
          Yearly periods only (null for 'lifetime'): how many qualifying yearly periods in a row, up to this
          one, the official qualified for this award in this office. Years the official wasn't ranked for that
          award (in another office, not eligible for the measure, or too few officials to rank, i.e. below
          awards_min_field_size) are skipped: they neither add to nor break the streak, so a streak can span
          more calendar years than its count. A year ranked outside the threshold breaks it. 1 = qualified
          this year only.

  - name: rpt_donor_size
    description: >
      State officials' contributions from individuals by contribution size and election cycle, in the FEC's
      bands (0, 200, 500, 1000, 2000 dollars and up) so they compare with fct_federal_donor_summary by_size.
      MEC itemizes only contributions over $100, so the smallest band undercounts small donors. Grain: one row
      per (official, election cycle, band, match confidence).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [official_id, election_cycle, band_floor, match_confidence]
    columns:
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }}"
        data_tests: [not_null]
      - name: election_cycle
        data_type: integer
        description: Two-year cycle, named by its even (election) year.
      - name: band_floor
        data_type: integer
        description: The band's lower bound in dollars (0, 200, 500, 1000, 2000).
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 200, 500, 1000, 2000]
      - name: match_confidence
        data_type: varchar
        description: "{{ doc('match_confidence') }}"
      - name: total_amount
        data_type: decimal(28,6)
        description: Dollars contributed in the band.
      - name: contribution_count
        data_type: bigint
        description: Contributions in the band.

  - name: rpt_donor_employers
    description: >
      Employers of the individuals who gave to each official, from the employer field on individual
      contributions (fct_campaign_finance.counterparty_organization). Contributions with no employer, or with a
      placeholder answer (donor_employer_placeholders seed: retired, none, self-employed, bare occupations), are
      left out. Spelling variants are not merged. State money only. Grain: one row per (official, lower-cased
      employer, match confidence).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [official_id, employer, match_confidence]
    columns:
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }}"
        data_tests: [not_null]
      - name: employer
        data_type: varchar
        description: The employer as filed (one spelling per lower-cased name).
        data_tests: [not_null]
      - name: match_confidence
        data_type: varchar
        description: "{{ doc('match_confidence') }}"
      - name: donor_count
        data_type: bigint
        description: Distinct contributors (by lower-cased name) giving that employer.
      - name: contribution_count
        data_type: bigint
        description: Contributions summed.
      - name: total_amount
        data_type: decimal(28,6)
        description: Dollars given by that employer's employees.
      - name: first_year
        data_type: integer
        description: Earliest contribution year.
      - name: last_year
        data_type: integer
        description: Latest contribution year.
      - name: source_url
        data_type: varchar
        description: "{{ doc('source_url') }}"

  - name: rpt_district_business_industries
    description: >
      EPA-regulated business sites (fct_jurisdiction_businesses) in each district-elected official's area,
      counted by NAICS sector (naics_sectors seed, matched on the first two digits of the site's naics_code), with
      how many are tied to a donor. The code is the NAICS code the most EPA program systems give (the stormwater
      permit code 238910 loses ties) or, for a site with no NAICS code, the sector its SIC code maps to (int_epa_frs__facilities). The donor sites themselves
      are listed in fct_jurisdiction_businesses (is_donor). EPA FRS covers regulated sites only (factories, fuel
      stations, shops with permits), and about 45% of (official, site) rows have neither a NAICS nor a SIC code;
      those are counted under sector_name "No industry code" with a null sector_code. Grain: one row per
      (official, sector).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [official_id, sector_name]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "n_donor_sites <= n_sites"
    columns:
      - name: official_id
        data_type: varchar
        description: "{{ doc('official_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_official')
                field: official_id
      - name: sector_code
        data_type: varchar
        description: NAICS sector code (`31-33` for manufacturing); null for sites with neither a NAICS nor a SIC code.
      - name: sector_name
        data_type: varchar
        description: NAICS sector title, or "No industry code".
        data_tests: [not_null]
      - name: n_sites
        data_type: bigint
        description: Sites in the official's area in this sector.
        data_tests:
          # sanity: the most sites in any area was 11,089 (a U.S. House district) in October 2026
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 40000
      - name: n_donor_sites
        data_type: bigint
        description: Of those, sites whose name, owner or parent company matches a donor to the official.
        data_tests: [not_null]
  - name: rpt_officeholders_by_year
    description: >
      Who held each tracked office in each year, for the browse page's year control. The current calendar
      year is everyone serving now (dim_official, every office). Earlier years list the past holders of the
      offices with dated rosters only (int_officeholders__years: MO House from its session rosters, MO Senate
      dated from the journal roll calls where Open States has no start or a wrong end, Congress, federal judges); statewide officers, mayors and
      state judges have no rows before the current year. A term counts for a year when it runs past January 15.
      Grain: one row per (year, office, person).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [year, office, official_id]
    columns:
      - name: year
        data_type: integer
        description: Calendar year. The latest year is the build year and lists those serving now.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1990
                max_value: 2100
      - name: official_id
        data_type: varchar
        description: >
          Person key: dim_official.official_id for anyone serving now; otherwise the same kind of key the
          source gives (Open States id, mohouse:<House member id>, bioguide:<id>, fjc:<nid>).
        data_tests: [not_null]
      - name: full_name
        data_type: varchar
        description: Display name.
        data_tests: [not_null]
      - name: party
        data_type: varchar
        description: >
          Party as the source records it for that year (House roster, congress-legislators term); Open States'
          current party for past senators; none for judges. A label, not a color.
      - name: level
        data_type: varchar
        description: state, federal or local.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [state, federal, local]
      - name: office
        data_type: varchar
        description: Office key, as in dim_official.office.
        data_tests: [not_null]
      - name: office_title
        data_type: varchar
        description: Office as displayed.
      - name: district
        data_type: varchar
        description: District number, or court key for federal judges (moed, mowd, ca8, moed+mowd).
      - name: has_profile
        data_type: boolean
        description: True when the person serves now (in any office) and so has a profile page.
        data_tests: [not_null]
      - name: source
        data_type: varchar
        description: >
          Where the row comes from - dim_official (current year), mo_house roster, openstates,
          congress-legislators or fjc.
      - name: source_url
        data_type: varchar
        description: >
          Link to the roster behind a past-year row: the House's session XML export (a zip download) for that
          year (mo_house roster), the Open States people folder holding the person's file (retired or
          legislature; openstates), the congress-legislators repository, or the judge's own FJC page (fjc).
          Null for the current year (source dim_official).
        data_tests:
          - not_null:
              config:
                where: "source <> 'dim_official'"
  - name: rpt_committee_donors
    description: >
      One hop back from an official's donors: for each Missouri committee that gave to an official (a
      unique name match, fct_campaign_finance.counterparty_mec_committee_id), who funded that committee, over
      every year loaded from both MEC feeds (int_mec__contributions_received). Its 10 largest non-individual
      donors are ranked; itemized individuals are summed into one unranked row. trail_status says whether a
      donor can be followed further (mec committee), is a committee we can't place (ambiguous mec name, not an
      mec filer), or is the end of the trail (a business or organization: MEC does not receive a
      non-committee's donors, so nonprofits' funders are not disclosed). Keyed by committee, not official:
      join on rpt_donor_rollup.donor_mec_committee_id. Grain: one row per (committee, donor class, donor).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [mec_committee_id, donor_class, donor_name]
    columns:
      - name: mec_committee_id
        data_type: varchar
        description: The committee whose donors these are (MECID).
        data_tests: [not_null]
      - name: committee_name
        data_type: varchar
        description: The committee's most recent name as filed.
      - name: committee_total_amount
        data_type: decimal(38,6)
        description: >
          All itemized contributions the committee received in the loaded years, every donor included (not only
          the rows listed).
      - name: donor_rank
        data_type: bigint
        description: 1 = the committee's largest non-individual donor by total_amount; null for the individuals row.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 10
      - name: donor_class
        data_type: varchar
        description: As in rpt_donor_rollup (macro donor_class).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['individual', 'pac', 'party', 'candidate committee', 'committee',
                  'business or organization', 'other']
      - name: donor_name
        data_type: varchar
        description: The donor as the committee reported it; '(individuals)' for the summed individuals row.
        data_tests: [not_null]
      - name: total_amount
        data_type: decimal(38,6)
        description: Sum given to the committee, in dollars.
      - name: contribution_count
        data_type: bigint
        description: Number of contributions summed.
      - name: first_year
        data_type: integer
        description: Earliest contribution year.
      - name: last_year
        data_type: integer
        description: Latest contribution year.
      - name: trail_status
        data_type: varchar
        description: mec committee, ambiguous mec name, not an mec filer, end of trail, or individuals (see above).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['mec committee', 'ambiguous mec name', 'not an mec filer', 'end of trail', 'individuals']
      - name: donor_mec_committee_id
        data_type: varchar
        description: >
          For a committee donor matched by name to one Missouri committee (int_mec__donor_committees), its MECID;
          this table has rows for that ID only if the committee itself gave directly to an official; many matched
          committees have none, so check before following it. When the name matched different IDs in different
          years, the one with the most money.
      - name: donor_link_confidence
        data_type: varchar
        description: >
          `high` (a curated alias, MECID in the name, or same name) or `medium` (spelling-normalized name, with
          abbreviations spelled out and filler words dropped; or core name, with words like PAC, Political, Action,
          Committee, Fund, Account dropped, or a filer's parenthesized short name) for donor_mec_committee_id.
      - name: source_url
        data_type: varchar
        description: The committee's MEC page, where its reports and itemized contributions are.

exposures:
  - name: voter_frontend
    label: Missouri officials frontend
    type: application
    maturity: low
    description: >
      Static site that shows each official's measurable lean and potential conflicts of interest, as
      evidence rather than verdicts (docs/frontend_principles.md). Its build reads the exported marts and reporting
      tables (`mogov export`).
    owner:
      name: mriswithe
    depends_on:
      - ref('dim_official')
      - ref('official_profile')
      - ref('fct_bias_indicators')
      - ref('fct_federal_donor_summary')
      - ref('fct_commercial_ties')
      - ref('fct_family_ties')
      - ref('fct_disclosures')
      - ref('fct_case_history')
      - ref('dim_district')
      - ref('fct_official_districts')
      - ref('dim_zcta')
      - ref('rpt_indicator_peers')
      - ref('rpt_party_breaks')
      - ref('rpt_donor_rollup')
      - ref('rpt_gift_rollup')
      - ref('rpt_attendance')
      - ref('rpt_votes_by_subject')
      - ref('rpt_awards')
      - ref('rpt_donor_size')
      - ref('rpt_donor_employers')
      - ref('rpt_interest_vote_overlap')
      - ref('fct_jurisdiction_businesses')
      - ref('fct_jurisdiction_business_donors')
      - ref('rpt_district_business_industries')
      - ref('rpt_officeholders_by_year')
      - ref('rpt_committee_donors')
