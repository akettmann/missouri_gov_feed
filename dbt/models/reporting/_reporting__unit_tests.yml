  - name: attendance_pay_per_vote_attended
    model: rpt_attendance_pay
    description: >
      Dollars per vote attended = the year's pay / the year's attended votes (yea, nay, present; an absence and
      a recusal are not attended). Official a: $5,000 over 5 attended votes spread over two sessions of 2021
      (a regular and an extraordinary one) = $1,000 (the issue's $50,000 / 50 votes example, scaled down), 2
      other votes not attended. b: pay but no attended vote -> null, not infinity. c: votes in 2016, before
      pay exists -> null pay, and no 'covered years' row at all. d: two pay rows in the year (a member and a
      leadership title) are summed: $4,000 / 2 = $2,000. e: 2016 votes without pay stay out of the total,
      which covers 2017-2018 only: $3,000 / 6 attended = $500, with 2 of 3 voting years covered. f: a
      representative who became a senator the same year: each chamber's votes are paid by its own position.
      d's second pay row is a name-only (medium) match, so d's year and total are medium; e: 2017 is medium and
      2018 high, so the total is medium. a, f and g stay high. g: a statutory salary for a year not over yet (2099) is not counted. h: pay for a position that casts
      no votes (a judge) is ignored.
    given:
      - input: ref('fct_votes')
        rows:
          - {official_id: a, chamber: state_house, session_code: '211', vote_date: 2021-02-01, vote_cast: yea}
