        - {award: most_committee_money, period: '2024', official_id: s3, award_rank: 2, metric: 5000, sample_size: 10000}
        - {award: most_committee_money, period: '2024', official_id: s1, award_rank: 3, metric: 3000, sample_size: 10000}
        - {award: most_committee_money, period: lifetime, official_id: s2, award_rank: 1, metric: 9000, sample_size: 10000}
        - {award: most_committee_money, period: lifetime, official_id: s3, award_rank: 2, metric: 5000, sample_size: 10000}
        - {award: most_committee_money, period: lifetime, official_id: s1, award_rank: 3, metric: 3000, sample_size: 10000}
        - {award: least_committee_money_share, period: '2024', official_id: s1, award_rank: 1, metric: 30.0, sample_size: 10000}
        - {award: least_committee_money_share, period: '2024', official_id: s3, award_rank: 2, metric: 50.0, sample_size: 10000}
        - {award: least_committee_money_share, period: '2024', official_id: s2, award_rank: 3, metric: 90.0, sample_size: 10000}
        - {award: least_committee_money_share, period: lifetime, official_id: s1, award_rank: 1, metric: 30.0, sample_size: 10000}
        - {award: least_committee_money_share, period: lifetime, official_id: s3, award_rank: 2, metric: 50.0, sample_size: 10000}
