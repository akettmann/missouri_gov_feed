          - {official_id: s3, level: state, transaction_year: 2024, election_cycle: 2024, donor_class: pac, match_confidence: high, total_amount: 5000}
          - {official_id: s3, level: state, transaction_year: 2024, election_cycle: 2024, donor_class: individual, match_confidence: high, total_amount: 5000}
      - input: ref('fct_federal_donor_summary')
