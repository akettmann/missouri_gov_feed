# Unit tests for reporting logic (dbt unit tests: fixed input rows -> exact expected rows).
# Kept apart from _reporting.yml (the contracts) so each stays readable.
version: 2

unit_tests:
  - name: committee_donors_one_hop_back
    model: rpt_committee_donors
    description: >
      Only committees that gave to an official get rows, under their most recent name. Their 10 largest
      non-individual donors are ranked (an 11th and 12th are dropped) and itemized individuals are summed into
      one unranked row; committee_total_amount counts every donor. trail_status follows each donor: a committee
      matched to one MECID (over several years) -> mec committee with that ID; an ambiguous name -> ambiguous
      mec name; an unmatched committee -> not an mec filer; a business -> end of trail.
    given:
      - input: ref('fct_campaign_finance')
        rows:
          - {official_id: o1, direction: received, counterparty_mec_committee_id: C000100}
          - {official_id: o1, direction: received, counterparty_mec_committee_id: null}
          - {official_id: o1, direction: given, counterparty_mec_committee_id: null}
      - input: ref('int_mec__committee_names')
        rows:
          - {mec_committee_id: C000100, committee_name: Old Name PAC, last_year_under_name: 2015}
          - {mec_committee_id: C000100, committee_name: New Name PAC, last_year_under_name: 2022}
          - {mec_committee_id: C000200, committee_name: Not A Donor PAC, last_year_under_name: 2022}
      - input: ref('int_mec__contributions_received')
        rows:
          - {mec_committee_id: C000100, contributor_type: Individual, contributor_name: Ann Doe, contributor_committee_name: null, amount: 100, contribution_year: 2020}
          - {mec_committee_id: C000100, contributor_type: Individual, contributor_name: Bob Roe, contributor_committee_name: null, amount: 50, contribution_year: 2021}
          - {mec_committee_id: C000100, contributor_type: Corporation, contributor_name: Acme Corp, contributor_committee_name: null, amount: 500, contribution_year: 2020}
          - {mec_committee_id: C000100, contributor_type: Committee, contributor_name: Missouri Chamber PAC, contributor_committee_name: Missouri Chamber PAC, amount: 300, contribution_year: 2020}
          - {mec_committee_id: C000100, contributor_type: Committee, contributor_name: Missouri Chamber PAC, contributor_committee_name: Missouri Chamber PAC, amount: 100, contribution_year: 2021}
          - {mec_committee_id: C000100, contributor_type: Committee, contributor_name: Twin PAC, contributor_committee_name: Twin PAC, amount: 200, contribution_year: 2020}
          - {mec_committee_id: C000100, contributor_type: Committee, contributor_name: Federal Freedom Fund, contributor_committee_name: Federal Freedom Fund, amount: 100, contribution_year: 2020}
          - {mec_committee_id: C000100, contributor_type: Organization, contributor_name: Org 01, contributor_committee_name: null, amount: 90, contribution_year: 2020}
          - {mec_committee_id: C000100, contributor_type: Organization, contributor_name: Org 02, contributor_committee_name: null, amount: 80, contribution_year: 2020}
          - {mec_committee_id: C000100, contributor_type: Organization, contributor_name: Org 03, contributor_committee_name: null, amount: 70, contribution_year: 2020}
          - {mec_committee_id: C000100, contributor_type: Organization, contributor_name: Org 04, contributor_committee_name: null, amount: 60, contribution_year: 2020}
          - {mec_committee_id: C000100, contributor_type: Organization, contributor_name: Org 05, contributor_committee_name: null, amount: 50, contribution_year: 2020}
          - {mec_committee_id: C000100, contributor_type: Organization, contributor_name: Org 06, contributor_committee_name: null, amount: 40, contribution_year: 2020}
          - {mec_committee_id: C000100, contributor_type: Organization, contributor_name: Org 07, contributor_committee_name: null, amount: 30, contribution_year: 2020}
          - {mec_committee_id: C000100, contributor_type: Organization, contributor_name: Org 08, contributor_committee_name: null, amount: 20, contribution_year: 2020}
          - {mec_committee_id: C000200, contributor_type: Individual, contributor_name: Zed Poe, contributor_committee_name: null, amount: 10, contribution_year: 2020}
      - input: ref('int_mec__donor_committees')
        rows:
          - {donor_committee_name: Missouri Chamber PAC, contribution_year: 2020, mec_committee_id: C000001, match_status: matched, match_confidence: high}
          - {donor_committee_name: Missouri Chamber PAC, contribution_year: 2021, mec_committee_id: C000001, match_status: matched, match_confidence: high}
          - {donor_committee_name: Twin PAC, contribution_year: 2020, mec_committee_id: null, match_status: ambiguous, match_confidence: null}
          - {donor_committee_name: Federal Freedom Fund, contribution_year: 2020, mec_committee_id: null, match_status: no match, match_confidence: null}
    expect:
      rows:
        - {mec_committee_id: C000100, committee_name: New Name PAC, committee_total_amount: 1790, donor_rank: 1, donor_name: Acme Corp, total_amount: 500, trail_status: end of trail, donor_mec_committee_id: null}
        - {mec_committee_id: C000100, committee_name: New Name PAC, committee_total_amount: 1790, donor_rank: 2, donor_name: Missouri Chamber PAC, total_amount: 400, trail_status: mec committee, donor_mec_committee_id: C000001}
        - {mec_committee_id: C000100, committee_name: New Name PAC, committee_total_amount: 1790, donor_rank: 3, donor_name: Twin PAC, total_amount: 200, trail_status: ambiguous mec name, donor_mec_committee_id: null}
        - {mec_committee_id: C000100, committee_name: New Name PAC, committee_total_amount: 1790, donor_rank: 4, donor_name: Federal Freedom Fund, total_amount: 100, trail_status: not an mec filer, donor_mec_committee_id: null}
        - {mec_committee_id: C000100, committee_name: New Name PAC, committee_total_amount: 1790, donor_rank: 5, donor_name: Org 01, total_amount: 90, trail_status: end of trail, donor_mec_committee_id: null}
        - {mec_committee_id: C000100, committee_name: New Name PAC, committee_total_amount: 1790, donor_rank: 6, donor_name: Org 02, total_amount: 80, trail_status: end of trail, donor_mec_committee_id: null}
        - {mec_committee_id: C000100, committee_name: New Name PAC, committee_total_amount: 1790, donor_rank: 7, donor_name: Org 03, total_amount: 70, trail_status: end of trail, donor_mec_committee_id: null}
        - {mec_committee_id: C000100, committee_name: New Name PAC, committee_total_amount: 1790, donor_rank: 8, donor_name: Org 04, total_amount: 60, trail_status: end of trail, donor_mec_committee_id: null}
        - {mec_committee_id: C000100, committee_name: New Name PAC, committee_total_amount: 1790, donor_rank: 9, donor_name: Org 05, total_amount: 50, trail_status: end of trail, donor_mec_committee_id: null}
        - {mec_committee_id: C000100, committee_name: New Name PAC, committee_total_amount: 1790, donor_rank: 10, donor_name: Org 06, total_amount: 40, trail_status: end of trail, donor_mec_committee_id: null}
        - {mec_committee_id: C000100, committee_name: New Name PAC, committee_total_amount: 1790, donor_rank: null, donor_name: (individuals), total_amount: 150, trail_status: individuals, donor_mec_committee_id: null}

  - name: committee_donors_name_with_unknown_year_ranks_last
    model: rpt_committee_donors
    description: >
      A committee name whose last_year_under_name is null must lose to one with a known year, whatever the
      adapter's default null ordering is (guards the coalesce that replaced NULLS LAST). Name ties on year
      fall back to alphabetical order.
    given:
      - input: ref('fct_campaign_finance')
        rows:
          - {official_id: o1, direction: received, counterparty_mec_committee_id: C000100}
      - input: ref('int_mec__committee_names')
        rows:
          - {mec_committee_id: C000100, committee_name: AAA Unknown Year PAC, last_year_under_name: null}
          - {mec_committee_id: C000100, committee_name: ZZZ Dated PAC, last_year_under_name: 2015}
      - input: ref('int_mec__contributions_received')
        rows:
          - {mec_committee_id: C000100, contributor_type: Corporation, contributor_name: Acme Corp, contributor_committee_name: null, amount: 500, contribution_year: 2020}
      - input: ref('int_mec__donor_committees')
        rows:
          - {donor_committee_name: Placeholder PAC, contribution_year: 2020, mec_committee_id: null, match_status: no match, match_confidence: null}
    expect:
      rows:
        - {mec_committee_id: C000100, committee_name: ZZZ Dated PAC, committee_total_amount: 500, donor_rank: 1, donor_name: Acme Corp, total_amount: 500, trail_status: end of trail, donor_mec_committee_id: null}

  - name: awards_threshold_decides_who_qualifies
    model: rpt_awards
    description: >
      Four state_house members are ranked on attendance in one year. lowest_attendance has its own threshold
      of 2 in the awards_threshold var, every other award uses the default of 1: two officials qualify for
      the lowest-attendance award and one for the highest. A threshold of 0 would leave an award empty and
      the old hard-coded 5 would take all four, so ignoring the var fails this test. The 4-member field
      clears awards_min_field_size (3). Each yearly row is a streak of 1; lifetime rows have no streak.
    overrides:
      vars:
        awards_threshold: {default: 1, lowest_attendance: 2}
        awards_min_field_size: 3
    given:
      - input: ref('dim_official')
        rows:
          - {official_id: a, office: state_house}
          - {official_id: b, office: state_house}
          - {official_id: c, office: state_house}
          - {official_id: d, office: state_house}
      - input: ref('rpt_attendance')
        rows:
          - {official_id: a, first_vote_date: 2020-03-01, votes_present: 100, votes_recorded: 100}
          - {official_id: b, first_vote_date: 2020-03-01, votes_present: 90, votes_recorded: 100}
          - {official_id: c, first_vote_date: 2020-03-01, votes_present: 80, votes_recorded: 100}
          - {official_id: d, first_vote_date: 2020-03-01, votes_present: 70, votes_recorded: 100}
      - input: ref('rpt_donor_rollup')
        rows: []
      - input: ref('fct_federal_donor_summary')
        rows: []
      - input: ref('fct_party_unity_yearly')
        rows: []
    expect:
      rows:
        - {award: lowest_attendance, period: '2020', official_id: d, award_rank: 1, group_size: 4, streak_years: 1}
        - {award: lowest_attendance, period: '2020', official_id: c, award_rank: 2, group_size: 4, streak_years: 1}
        - {award: lowest_attendance, period: lifetime, official_id: d, award_rank: 1, group_size: 4, streak_years: null}
        - {award: lowest_attendance, period: lifetime, official_id: c, award_rank: 2, group_size: 4, streak_years: null}
        - {award: highest_attendance, period: '2020', official_id: a, award_rank: 1, group_size: 4, streak_years: 1}
        - {award: highest_attendance, period: lifetime, official_id: a, award_rank: 1, group_size: 4, streak_years: null}

  - name: awards_streak_counts_consecutive_qualifying_years
    model: rpt_awards
    description: >
      Official x ranks first on highest_attendance (threshold 1) in 2015, 2016, 2018, 2020 and 2022, with
      three kinds of year in between. 2017: x is not in the field (not in that office); 2019: the field is
      too thin (only x has 100+ recorded votes, below awards_min_field_size of 2); neither breaks the streak
      or adds to it, so x reaches 4 in 2020. 2021: x is ranked second (outside the threshold), which breaks
      the streak, so 2022 starts again at 1. Lifetime rows never get a streak; the party-unity
      awards (x loyal, r breaks in 2015 and 2016) streak like the rest. lowest_attendance has a threshold of 0 so its rows stay out of this test.
    overrides:
      vars:
        awards_threshold: {default: 1, lowest_attendance: 0}
        awards_min_field_size: 2
    given:
      - input: ref('dim_official')
        rows:
          - {official_id: x, office: state_house}
          - {official_id: r, office: state_house}
          - {official_id: s, office: state_house}
      - input: ref('rpt_attendance')
        rows:
          - {official_id: x, first_vote_date: 2015-03-01, votes_present: 99, votes_recorded: 100}
          - {official_id: r, first_vote_date: 2015-03-01, votes_present: 90, votes_recorded: 100}
          - {official_id: x, first_vote_date: 2016-03-01, votes_present: 99, votes_recorded: 100}
          - {official_id: r, first_vote_date: 2016-03-01, votes_present: 90, votes_recorded: 100}
          - {official_id: r, first_vote_date: 2017-03-01, votes_present: 90, votes_recorded: 100}
          - {official_id: s, first_vote_date: 2017-03-01, votes_present: 70, votes_recorded: 100}
          - {official_id: x, first_vote_date: 2018-03-01, votes_present: 99, votes_recorded: 100}
          - {official_id: r, first_vote_date: 2018-03-01, votes_present: 90, votes_recorded: 100}
          - {official_id: x, first_vote_date: 2019-03-01, votes_present: 99, votes_recorded: 100}
          - {official_id: r, first_vote_date: 2019-03-01, votes_present: 50, votes_recorded: 50}
          - {official_id: x, first_vote_date: 2020-03-01, votes_present: 99, votes_recorded: 100}
          - {official_id: r, first_vote_date: 2020-03-01, votes_present: 90, votes_recorded: 100}
          - {official_id: x, first_vote_date: 2021-03-01, votes_present: 80, votes_recorded: 100}
          - {official_id: r, first_vote_date: 2021-03-01, votes_present: 90, votes_recorded: 100}
          - {official_id: x, first_vote_date: 2022-03-01, votes_present: 99, votes_recorded: 100}
          - {official_id: r, first_vote_date: 2022-03-01, votes_present: 90, votes_recorded: 100}
      - input: ref('rpt_donor_rollup')
        rows: []
      - input: ref('fct_federal_donor_summary')
        rows: []
      - input: ref('fct_party_unity_yearly')
        rows:
          - {official_id: x, chamber: state_house, vote_year: 2015, party_line_votes: 100, with_party_votes: 95}
          - {official_id: r, chamber: state_house, vote_year: 2015, party_line_votes: 100, with_party_votes: 80}
          - {official_id: x, chamber: state_house, vote_year: 2016, party_line_votes: 100, with_party_votes: 95}
          - {official_id: r, chamber: state_house, vote_year: 2016, party_line_votes: 100, with_party_votes: 80}
    expect:
      rows:
        - {award: highest_attendance, period: '2015', official_id: x, award_rank: 1, group_size: 2, streak_years: 1}
        - {award: highest_attendance, period: '2016', official_id: x, award_rank: 1, group_size: 2, streak_years: 2}
        - {award: highest_attendance, period: '2017', official_id: r, award_rank: 1, group_size: 2, streak_years: 1}
        - {award: highest_attendance, period: '2018', official_id: x, award_rank: 1, group_size: 2, streak_years: 3}
        - {award: highest_attendance, period: '2020', official_id: x, award_rank: 1, group_size: 2, streak_years: 4}
        - {award: highest_attendance, period: '2021', official_id: r, award_rank: 1, group_size: 2, streak_years: 1}
        - {award: highest_attendance, period: '2022', official_id: x, award_rank: 1, group_size: 2, streak_years: 1}
        - {award: highest_attendance, period: lifetime, official_id: x, award_rank: 1, group_size: 3, streak_years: null}
        - {award: most_party_breaks, period: '2015', official_id: r, award_rank: 1, group_size: 2, streak_years: 1}
        - {award: most_party_breaks, period: '2016', official_id: r, award_rank: 1, group_size: 2, streak_years: 2}
        - {award: most_party_breaks, period: lifetime, official_id: r, award_rank: 1, group_size: 2, streak_years: null}
        - {award: most_party_loyal, period: '2015', official_id: x, award_rank: 1, group_size: 2, streak_years: 1}
        - {award: most_party_loyal, period: '2016', official_id: x, award_rank: 1, group_size: 2, streak_years: 2}
        - {award: most_party_loyal, period: lifetime, official_id: x, award_rank: 1, group_size: 2, streak_years: null}

  - name: awards_party_unity_per_year
    model: rpt_awards
    description: >
      Party unity is ranked per calendar year as well as lifetime (issue 164). a votes with its party on
      90 of 90 party-line votes in 2023 (100.0) and 50 of 100 in 2024 (50.0); b on 80 of 100 (80.0) and 90 of
      100 (90.0). Maverick (most_party_breaks) is the lowest unity, so b in 2023 and a in 2024; Team Player
      (most_party_loyal) is the highest, so a in 2023 and b in 2024. c has 19 party-line votes in 2024, below
      awards_min_party_line_votes (20), so c's 0.0% gets no row. d's only party-line votes were cast in the
      state_house while d is a us_house member, so they are not ranked against the House; d's us_house row
      (60 of 100) is ranked against e's (40 of 100) in the us_house field of 2, so a join that ignores the
      chamber fans d out into two rows and changes the us_house ranking. a's 10 undated
      votes (all with the party) count towards lifetime only: a 150 of 200 = 75.0, b 170 of 200 = 85.0.
      Dropping the yearly rows, ignoring the minimum or the chamber match fails this test.
    overrides:
      vars:
        awards_threshold: {default: 1}
        awards_min_field_size: 2
        awards_min_party_line_votes: 20
    given:
      - input: ref('dim_official')
        rows:
          - {official_id: a, office: state_house}
          - {official_id: b, office: state_house}
          - {official_id: c, office: state_house}
          - {official_id: d, office: us_house}
          - {official_id: e, office: us_house}
      - input: ref('rpt_attendance')
        rows: []
      - input: ref('rpt_donor_rollup')
        rows: []
      - input: ref('fct_federal_donor_summary')
        rows: []
      - input: ref('fct_party_unity_yearly')
        rows:
          - {official_id: a, chamber: state_house, vote_year: 2023, party_line_votes: 90, with_party_votes: 90}
          - {official_id: a, chamber: state_house, vote_year: 2024, party_line_votes: 100, with_party_votes: 50}
          - {official_id: a, chamber: state_house, vote_year: null, party_line_votes: 10, with_party_votes: 10}
          - {official_id: b, chamber: state_house, vote_year: 2023, party_line_votes: 100, with_party_votes: 80}
          - {official_id: b, chamber: state_house, vote_year: 2024, party_line_votes: 100, with_party_votes: 90}
          - {official_id: c, chamber: state_house, vote_year: 2024, party_line_votes: 19, with_party_votes: 0}
          - {official_id: d, chamber: state_house, vote_year: 2024, party_line_votes: 100, with_party_votes: 0}
          - {official_id: d, chamber: us_house, vote_year: 2024, party_line_votes: 100, with_party_votes: 60}
          - {official_id: e, chamber: us_house, vote_year: 2024, party_line_votes: 100, with_party_votes: 40}
    expect:
      rows:
        - {award: most_party_breaks, period: '2023', official_id: b, award_rank: 1, metric: 80.0, sample_size: 100, group_size: 2, streak_years: 1}
        - {award: most_party_breaks, period: '2024', official_id: a, award_rank: 1, metric: 50.0, sample_size: 100, group_size: 2, streak_years: 1}
        - {award: most_party_breaks, period: lifetime, official_id: a, award_rank: 1, metric: 75.0, sample_size: 200, group_size: 2, streak_years: null}
        - {award: most_party_loyal, period: '2023', official_id: a, award_rank: 1, metric: 100.0, sample_size: 90, group_size: 2, streak_years: 1}
        - {award: most_party_loyal, period: '2024', official_id: b, award_rank: 1, metric: 90.0, sample_size: 100, group_size: 2, streak_years: 1}
        - {award: most_party_loyal, period: lifetime, official_id: b, award_rank: 1, metric: 85.0, sample_size: 200, group_size: 2, streak_years: null}
        - {award: most_party_breaks, period: '2024', official_id: e, award_rank: 1, metric: 40.0, sample_size: 100, group_size: 2, streak_years: 1}
        - {award: most_party_breaks, period: lifetime, official_id: e, award_rank: 1, metric: 40.0, sample_size: 100, group_size: 2, streak_years: null}
        - {award: most_party_loyal, period: '2024', official_id: d, award_rank: 1, metric: 60.0, sample_size: 100, group_size: 2, streak_years: 1}
        - {award: most_party_loyal, period: lifetime, official_id: d, award_rank: 1, metric: 60.0, sample_size: 100, group_size: 2, streak_years: null}

  - name: awards_party_awards_need_a_break_and_never_overlap
    model: rpt_awards
    description: >
      A state_senate field of 6 in 2020 (shaped like the real one), default cutoff 5. p and q vote with their
      party on 20 of 20 party-line votes (100.0%), r on 19, s on 18, t on 16, u on 14. Maverick and Team Player
      each take at most half
      the field (3), so nobody sits in both lists: Maverick is u, t, s and Team Player is p, q (tied first) and
      r. The old logic put most of the field in both lists. (The one-break rule is covered by
      awards_maverick_needs_a_break_even_inside_the_cutoff, where the cap alone would not keep p and q out.)
      Lifetime repeats the one year.
    overrides:
      vars:
        awards_threshold: {default: 5}
        awards_min_field_size: 5
        awards_min_party_line_votes: 20
    given:
      - input: ref('dim_official')
        rows:
          - {official_id: p, office: state_senate}
          - {official_id: q, office: state_senate}
          - {official_id: r, office: state_senate}
          - {official_id: s, office: state_senate}
          - {official_id: t, office: state_senate}
          - {official_id: u, office: state_senate}
      - input: ref('rpt_attendance')
        rows: []
      - input: ref('rpt_donor_rollup')
        rows: []
      - input: ref('fct_federal_donor_summary')
        rows: []
      - input: ref('fct_party_unity_yearly')
        rows:
          - {official_id: p, chamber: state_senate, vote_year: 2020, party_line_votes: 20, with_party_votes: 20}
          - {official_id: q, chamber: state_senate, vote_year: 2020, party_line_votes: 20, with_party_votes: 20}
          - {official_id: r, chamber: state_senate, vote_year: 2020, party_line_votes: 20, with_party_votes: 19}
          - {official_id: s, chamber: state_senate, vote_year: 2020, party_line_votes: 20, with_party_votes: 18}
          - {official_id: t, chamber: state_senate, vote_year: 2020, party_line_votes: 20, with_party_votes: 16}
          - {official_id: u, chamber: state_senate, vote_year: 2020, party_line_votes: 20, with_party_votes: 14}
    expect:
      rows:
        - {award: most_party_breaks, period: '2020', official_id: u, award_rank: 1, metric: 70.0, sample_size: 20, group_size: 6, streak_years: 1}
        - {award: most_party_breaks, period: '2020', official_id: t, award_rank: 2, metric: 80.0, sample_size: 20, group_size: 6, streak_years: 1}
        - {award: most_party_breaks, period: '2020', official_id: s, award_rank: 3, metric: 90.0, sample_size: 20, group_size: 6, streak_years: 1}
        - {award: most_party_loyal, period: '2020', official_id: p, award_rank: 1, metric: 100.0, sample_size: 20, group_size: 6, streak_years: 1}
        - {award: most_party_loyal, period: '2020', official_id: q, award_rank: 1, metric: 100.0, sample_size: 20, group_size: 6, streak_years: 1}
        - {award: most_party_loyal, period: '2020', official_id: r, award_rank: 3, metric: 95.0, sample_size: 20, group_size: 6, streak_years: 1}
        - {award: most_party_breaks, period: lifetime, official_id: u, award_rank: 1, metric: 70.0, sample_size: 20, group_size: 6, streak_years: null}
        - {award: most_party_breaks, period: lifetime, official_id: t, award_rank: 2, metric: 80.0, sample_size: 20, group_size: 6, streak_years: null}
