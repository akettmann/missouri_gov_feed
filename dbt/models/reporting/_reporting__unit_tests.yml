  - name: awards_federal_money_share_uses_fec_total_receipts
    model: rpt_awards
    description: >
      Two U.S. House members. The rollup holds only their committee receipts (FEC individual donors are not
      itemized), so a share taken from the rollup alone is 100% for both and both rank 1st (the bug of issue
      188). The share must instead divide the rollup's committee money for the FEC cycle by FEC's total
      receipts for that cycle: a gets 10,000 of 40,000 = 25.0% (6,000 in 2023 and 4,000 in 2024 both fall in
      cycle 2024), b gets 20,000 of 25,000 = 80.0% (its medium name match is left out). a's 500 in cycle 2022
      has no FEC total, so cycle 2022 gets no share and stays out of the lifetime share. The share is reported
      under the cycle's end year; most_committee_money stays per calendar year. awards_min_field_size of 2
      leaves a's thin 2022 and 2023 calendar years unranked.
    overrides:
      vars:
        awards_threshold: {default: 5}
        awards_min_field_size: 2
    given:
      - input: ref('dim_official')
        rows:
          - {official_id: a, office: us_house, level: federal}
          - {official_id: b, office: us_house, level: federal}
      - input: ref('rpt_attendance')
        rows: []
      - input: ref('rpt_donor_rollup')
        rows:
          - {official_id: a, level: federal, transaction_year: 2022, election_cycle: 2022, donor_class: pac, match_confidence: high, total_amount: 500}
          - {official_id: a, level: federal, transaction_year: 2023, election_cycle: 2024, donor_class: pac, match_confidence: high, total_amount: 6000}
          - {official_id: a, level: federal, transaction_year: 2024, election_cycle: 2024, donor_class: pac, match_confidence: high, total_amount: 4000}
          - {official_id: b, level: federal, transaction_year: 2024, election_cycle: 2024, donor_class: committee, match_confidence: high, total_amount: 20000}
          - {official_id: b, level: federal, transaction_year: 2024, election_cycle: 2024, donor_class: pac, match_confidence: medium, total_amount: 99999}
      - input: ref('fct_federal_donor_summary')
        rows:
          - {official_id: a, cycle: 2024, aggregate_kind: cycle total, bucket: total receipts, total: 40000}
          - {official_id: a, cycle: 2024, aggregate_kind: cycle total, bucket: PAC contributions, total: 9999}
          - {official_id: b, cycle: 2024, aggregate_kind: cycle total, bucket: total receipts, total: 25000}
      - input: ref('fct_party_unity_yearly')
        rows: []
    expect:
      rows:
        - {award: most_committee_money, period: '2024', official_id: b, award_rank: 1, metric: 20000, sample_size: 20000}
        - {award: most_committee_money, period: '2024', official_id: a, award_rank: 2, metric: 4000, sample_size: 4000}
        - {award: most_committee_money, period: lifetime, official_id: b, award_rank: 1, metric: 20000, sample_size: 20000}
        - {award: most_committee_money, period: lifetime, official_id: a, award_rank: 2, metric: 10500, sample_size: 10500}
        - {award: least_committee_money_share, period: '2024', official_id: a, award_rank: 1, metric: 25.0, sample_size: 40000}
        - {award: least_committee_money_share, period: '2024', official_id: b, award_rank: 2, metric: 80.0, sample_size: 25000}
        - {award: least_committee_money_share, period: lifetime, official_id: a, award_rank: 1, metric: 25.0, sample_size: 40000}
        - {award: least_committee_money_share, period: lifetime, official_id: b, award_rank: 2, metric: 80.0, sample_size: 25000}

  - name: awards_state_money_share_uses_rollup_total
    model: rpt_awards
    description: >
      Two state_house members keep the calendar-year share from the donor rollup, individuals included in the
      total: s1 gets 3,000 of 10,000 = 30.0%, s2 gets 9,000 of 10,000 = 90.0% (lowest share ranks first). The
      FEC cycle totals only apply to federal officials: s3 is a state_house member who also has FEC data (as if
