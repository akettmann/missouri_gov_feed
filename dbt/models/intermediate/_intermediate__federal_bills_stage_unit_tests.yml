# Unit tests for int_federal_bills__stage: stage, President outcome and veto result read from BILLSTATUS action codes.
version: 2
unit_tests:
- name: federal_bills_stage_from_action_codes
  model: int_federal_bills__stage
  description: 'Each bill id names the case. 118-hr-1 passed both chambers, was presented and signed, and became law (the Library of Congress copies carry the codes). 118-hr-2 became law but its only "unsigned" mark is the House own E30000 copy ("Sent to Archivist unsigned"), which is ignored, so it has no signed date and became law without signature. 118-sjres-3 was vetoed and the Senate failed to override; the House own copy of the veto is ignored and nothing counts twice. 118-hr-4 was vetoed, both chambers passed it over the veto and it became law: stage became_law, outcome veto_overridden. 118-hr-5 passed over the veto in both chambers with no law number yet: stage veto_overridden. 118-hjres-6 was vetoed and the House failed the override (veto stands). 118-hr-7 was vetoed with an override passed in the House only: override_passed_one_chamber. 118-hr-8 has a pocket veto in the action text. 118-hr-9 was vetoed and no override vote is listed. 118-hres-10 passed the House: agreed_to, not passed_one_chamber. 118-hconres-11 passed both chambers: passed_both_chambers, never presented. 118-hr-12 passed the House twice (two rows): passed_one_chamber on the first date. 118-hr-13 was reported by committee. 118-hr-14 has no actions: introduced. 118-hr-15 lists a law number but no matching action: became_law with no outcome. 118-hr-16 was presented and nothing followed. 118-hr-17 passed the House only in the House own copy of the action (no Library of Congress code), so it stays introduced. 118-s-18 was discharged from committee. 118-hr-19 failed in the House: introduced, with a failed date. 118-hr-20 passed the House and failed in the Senate: passed_one_chamber.

    '
  given:
  - input: ref('stg_govinfo_billstatus__bills')
    rows:
    - {bill_id: 118-hr-1, congress: 118, bill_type: hr, bill_number: 1}
