      - input: ref('int_mo_legislators__seats_as_given')
        rows:
          - {openstates_id: 'ocd-person/b742d6cb-a63d-40c9-afd0-033f26190063', person_id: 'ocd-person/b742d6cb-a63d-40c9-afd0-033f26190063', full_name: Paul Wieland, chamber: upper, district_number: 22, start_date: '1900-01-01', start_quality: undated, end_date: '2023-01-04'}
