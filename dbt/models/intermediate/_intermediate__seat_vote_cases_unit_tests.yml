      Wiley Price IV (HD84) and Open States dated neither seat (a roster loaded before Open States), PRICE is Tiffany
      Price, the exact surname, not the suffix-stripped one. This combination is constructed: the real lists never
      hold both, and in the real data (house_vote_tokens_of_named_members) the session lists and seat dates decide
      PRICE before the name fit does.
