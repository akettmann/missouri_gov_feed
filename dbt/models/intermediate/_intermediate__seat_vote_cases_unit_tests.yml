# Named-person cases for the rules decided downstream of person ids (#649, #658): Senate seat dating
# (int_mo_legislators__seats), officeholders by year (int_officeholders__years) and House vote-token attribution
# (int_mo_house__votes). Each fixture copies the real rows of the people named (Open States ids, districts, dates,
# PDF tokens, session codes, roll-call URLs) from the production tables, so a regression in a rule fails on the real
# case it was written for. The synthetic tests of the same rules stay in _intermediate__seats_unit_tests.yml,
# _intermediate__officeholders_unit_tests.yml and _intermediate__mo_house_votes_unit_tests.yml.
version: 2

unit_tests:
  - name: senate_seat_terms_of_named_senators_dated_from_the_journal
    model: int_mo_legislators__seats
    description: >
      Real Open States Senate terms and journal votes (first and last vote of each term; the journals begin
      2017-01-04; Mike Cierpiot's first vote of each year 2018-2024 stands in for the rest of the journal, so every
      year of every term has votes). #516, undated start becomes the term's first journal vote: Paul Wieland (SD22),
      Jeanie Riddle (SD10) and Jason Holsman (SD7) start 2017-01-04. #522, Open States end more than a year after the
      last vote is capped at that vote: Will Kraus (SD8, 2018-12-31 -> 2017-07-25) and Ryan Silvey (SD17,
      2018-12-31 -> 2017-09-13). Silvey's end is today's behaviour (option 1 of #551, a needs-user decision): payroll
      shows him paid into January 2018, so this expectation changes if #551 decides otherwise. #522, a term ending
      2018-12-31 with no journal vote, started before the journals, ends the day before them (2017-01-03): Joseph
      Keaveny (SD4), Eric Schmitt (SD15), Kurt Schaefer (SD19), David Pearce (SD21); Pearce's SD31 term, which ended
      in 2012, keeps its dates. Not capped: Holsman resigned 2020-01-16 with his last vote 2020-01-13 (under a year),
      Lauren Arthur (SD17 from a dated 2018-09-12 start, last vote 2024-05-13, end 2024-07-21) keeps her Open States
      dates. Cierpiot (open end; first vote 2018-01-08, #525) keeps his start: Open States has 2018-01-03 (the
      journal oath), and the January-1 rule in seat_terms makes it 2018-01-01.
