      dated holder, so these years exist only because the starts of Wieland, Riddle and Holsman were dated from the
      journal. Real terms for the named districts (as int_mo_legislators__seats outputs them), one dated filler term
      for each other district. SD8 2017 lists Kraus only (#525): Cierpiot's Senate term starts 2018-01-01 and his
      first Senate vote is 2018-01-08, so he is SD8's holder from 2018, Kraus (ended 2017-07-25) is not. SD17:
      Silvey in 2017 (ended 2017-09-13, today's #551 behaviour), Arthur in 2018. Keaveny, Schmitt, Schaefer and Pearce
      (ended 2017-01-03, before the January 15 handover) are not 2017 holders: their successors are (Jacob Hummel SD4,
      Andrew Koenig SD15, Caleb Rowden SD19, Denny Hoskins SD21). Jolie Justus (SD10, ended 2016-12-31) is not listed.
      2019 has a House roster but no Senate year: Hummel's SD4 term ends 2018-12-31 and the fixture leaves out his
      successor (Karla May), so SD4 has no 2019 holder and the 34-district rule drops the whole Senate year.
