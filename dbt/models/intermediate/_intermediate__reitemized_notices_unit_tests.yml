  - name: direct_contributions_drop_24_hour_notices_reitemized_in_full_report
    model: int_mec__contributions_direct
    description: >
      The same rule for the MEC direct export: a "24 Hour" notice is dropped when the same committee's full report
      itemizes the same gift (donor compared by name_key); a notice with no full-report line, and two equal gifts in
      full reports, are kept. The second tier (#542) applies too: "Platte Rentals and Supply" / "Platte Rental and Supply"
      in the same city is one gift, the same names in different cities are not.
    overrides:
      vars:
        mec_direct: true
    given:
