# Unit tests for the 24-hour-notice dedupe (#156): fixed input rows -> exact expected rows.
# Kept apart from the generated _intermediate.yml so regenerating docs never touches them.
version: 2

unit_tests:
  - name: tap_contributions_drop_24_hour_notices_reitemized_in_full_report
    model: int_tap_mec__contributions
    description: >
      A "24 Hour" notice row is dropped only when a full report of the same committee itemizes the same gift (same
      date, amount, donor). 1: notice + 30 Day After row -> notice dropped. 2: an AMENDED notice against a quarterly
      -> dropped. 3: donor spelled differently (case, punctuation, double space) -> dropped. 4: a notice with no
      full-report line -> kept. 5: a notice whose full-report line differs in amount, date, committee or donor ->
      kept. 6: two equal gifts the same day, both in full reports -> both kept. 7: two identical notices against one
      full-report line -> one notice dropped (one-to-one). 8: a notice matched against an amended full report ->
      dropped. 9: rows without a donor name, date or amount are never matched. 10: a full-report line alone is
      never dropped.
    given:
      - input: ref('stg_tap_mec__contributions')
        rows:
          # 1
          - {record_id: n1, mec_committee_id: C1, contributor_name: Pat Doe, amount: 5000, contribution_date: 2020-07-28, report: '24 Hour Expenditure Report-8/4/2020 Primary'}
          - {record_id: f1, mec_committee_id: C1, contributor_name: Pat Doe, amount: 5000, contribution_date: 2020-07-28, report: '30 Day After Primary Election-8/4/2020'}
          # 2
          - {record_id: n2, mec_committee_id: C2, contributor_name: Acme PAC, amount: 7000, contribution_date: 2018-03-01, report: 'AMENDED 24 Hour Expenditure Report-4/3/2018 General Municipal'}
          - {record_id: f2, mec_committee_id: C2, contributor_name: Acme PAC, amount: 7000, contribution_date: 2018-03-01, report: April Quarterly Report}
          # 3
          - {record_id: n3, mec_committee_id: C3, contributor_name: 'Terry  Bloomberg', amount: 1000, contribution_date: 2014-07-25, report: '24 Hour Expenditure Report-8/5/2014 Primary'}
          - {record_id: f3, mec_committee_id: C3, contributor_name: 'TERRY BLOOMBERG.', amount: 1000, contribution_date: 2014-07-25, report: October Quarterly Report}
          # 4
          - {record_id: n4, mec_committee_id: C4, contributor_name: Lone Giver, amount: 9000, contribution_date: 2022-10-30, report: '24 Hour Expenditure Report-11/8/2022 General'}
