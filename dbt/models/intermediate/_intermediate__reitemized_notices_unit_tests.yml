          - {record_id: f5a, mec_committee_id: C5, contributor_name: Near Miss, amount: 5001, contribution_date: 2020-01-10, report: April Quarterly Report}
          - {record_id: n5b, mec_committee_id: C5, contributor_name: Near Miss, amount: 5000, contribution_date: 2020-01-11, report: '24 Hour Expenditure Report-8/4/2020 Primary'}
          - {record_id: f5b, mec_committee_id: C5, contributor_name: Near Miss, amount: 5000, contribution_date: 2020-01-14, report: April Quarterly Report}
          - {record_id: n5c, mec_committee_id: C5, contributor_name: Near Miss, amount: 5000, contribution_date: 2020-01-12, report: '24 Hour Expenditure Report-8/4/2020 Primary'}
          - {record_id: f5c, mec_committee_id: C6, contributor_name: Near Miss, amount: 5000, contribution_date: 2020-01-12, report: April Quarterly Report}
          - {record_id: n5d, mec_committee_id: C5, contributor_name: Near Miss, amount: 5000, contribution_date: 2020-01-13, report: '24 Hour Expenditure Report-8/4/2020 Primary'}
          - {record_id: f5d, mec_committee_id: C5, contributor_name: Other Donor, amount: 5000, contribution_date: 2020-01-13, report: April Quarterly Report}
          # 6
          - {record_id: f6a, mec_committee_id: C7, contributor_name: Twice Giver, amount: 100, contribution_date: 2020-02-01, report: April Quarterly Report}
          - {record_id: f6b, mec_committee_id: C7, contributor_name: Twice Giver, amount: 100, contribution_date: 2020-02-01, report: April Quarterly Report}
          # 7
