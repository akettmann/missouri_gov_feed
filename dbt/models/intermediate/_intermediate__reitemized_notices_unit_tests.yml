  - name: direct_contributions_keep_notices_whose_full_report_line_differs
    model: int_mec__contributions_direct
    description: >
      MEC direct export, the cases where a notice must survive (#554): a full-report line with a different amount (a),
      date (b), committee (c) or donor (d) is not the same gift. Rows missing a date or amount are never matched (e, f).
      The one-to-one rank (g): two equal notices against one full-report line lose one notice only. A true repeat
      gift, the same amount from the same donor the same day on two notices and two full-report lines, keeps both
      gifts (h). A full-report line alone is never dropped (i).
    overrides:
      vars:
        mec_direct: true
    given:
      - input: ref('stg_mec__contributions')
        rows:
          # a
          - {record_id: na, mec_committee_id: E1, contributor_name: Pat Doe, amount: 5000, contribution_date: 2026-08-02, report: '24 Hour Expenditure Report-8/4/2026 Primary'}
          - {record_id: fa, mec_committee_id: E1, contributor_name: Pat Doe, amount: 5001, contribution_date: 2026-08-02, report: October Quarterly Report}
          # b
          - {record_id: nb, mec_committee_id: E2, contributor_name: Pat Doe, amount: 5000, contribution_date: 2026-08-02, report: '24 Hour Expenditure Report-8/4/2026 Primary'}
          - {record_id: fb, mec_committee_id: E2, contributor_name: Pat Doe, amount: 5000, contribution_date: 2026-08-03, report: October Quarterly Report}
          # c
          - {record_id: nc, mec_committee_id: E3, contributor_name: Pat Doe, amount: 5000, contribution_date: 2026-08-02, report: '24 Hour Expenditure Report-8/4/2026 Primary'}
          - {record_id: fc, mec_committee_id: E4, contributor_name: Pat Doe, amount: 5000, contribution_date: 2026-08-02, report: October Quarterly Report}
          # d
          - {record_id: nd, mec_committee_id: E5, contributor_name: Pat Doe, amount: 5000, contribution_date: 2026-08-02, report: '24 Hour Expenditure Report-8/4/2026 Primary'}
          - {record_id: fd, mec_committee_id: E5, contributor_name: Sam Roe, amount: 5000, contribution_date: 2026-08-02, report: October Quarterly Report}
          # e
          - {record_id: ne, mec_committee_id: E6, contributor_name: No Date, amount: 5000, contribution_date: null, report: '24 Hour Expenditure Report-8/4/2026 Primary'}
