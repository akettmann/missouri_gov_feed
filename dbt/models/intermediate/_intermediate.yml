# Generated from each model's header comment (+ grain for intermediate models); edit the SQL header,
# not this file, then regenerate.
version: 2
models:
- name: int_bills__list
  description: 'Every Missouri bill and resolution per session, from the places that list them; fct_bills and fct_vote_bills
    both read this one list so a bill cannot be in one and not the other. Re-listed appropriation bills are kept
    here (they are House bills; int_bills__status marks them). House bills  the House XML export: titles, current
    version, last action Senate bills the Senate''s own bill list (senate.mo.gov, regular and special sessions;
    mo_senate_bills loader, #586): complete, including bills filed under no topical-index keyword (2018 SB 975 and
    1024) and bills that never left the Senate. Its one-line description is the short title. It covers the sessions
    the loader''s window reached; for a session it has not landed, the next two sources stand in Senate bills the
    Senate topical index (regular sessions) of a session the Senate list has no rows for: its one-line description
    as the short title; bills filed under no keyword are missing Senate bills the House XML''s SenateActList lists
    as having reached the House (2024 on), when neither of the above lists them, with the titles, version, last
    action and effective date the XML gives. Senate bills of older special sessions are missing without the Senate
    list (#237). source_url is the Senate''s bill link, else the bill''s page on house.mo.gov from the House XML
    (House bills and the House-listed Senate bills). A column a source does not give is null. Grain: one row per
    (session, bill), House and Senate bills.'
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - session_code
        - bill
- name: int_bills__status
  description: 'Where each bill stands: House bills (the House XML export''s actions), Senate bills that reached
    the House (the same export''s SenateActList: House-side and governor actions only; a Senate bill listed there
    has passed the Senate), and every Senate bill the Senate''s own action history covers (stg_mo_senate__bill_actions,
    #588), including the ones that never left the Senate. A bill in both feeds takes the furthest stage of either
    (the flags are max() over both). A Senate bill has a row only when one of the two feeds has an action for it:
    a listed bill whose Actions tab was not landed (mo_senate_bills.fragment_rejected, #637) has none, so its status
    stays null (unknown) rather than a stage. The Senate''s wording is mapped to the stage flags by the seed mo_senate_action_flags
    (one row per phrasing; an unmapped action counts for no stage). The House XML''s wording is matched below. status   the
    furthest stage the actions record: introduced, in committee, reported do pass, perfected, passed one chamber,
    passed both chambers, truly agreed, then signed / signed with line-item vetoes / vetoed / veto overridden; resolutions:
    adopted. withdrawn and defeated when the bill stopped there. relisted for governor message when every recorded
    action is the governor''s Art. IV, s. 27 message (the budget/withholding message). These are not new bills:
    the House relists the previous regular session''s appropriation bills (same bill number, bill string and effective
    date; LR numbers from 241 on) under the new session, only to record that message. The real history, and the
    outcome, live on the original row; relisted_from_session_code names its session. outcome  null for relisted
    for governor message; otherwise enacted (signed, line-item vetoed, veto overridden, or truly agreed and delivered
    to the Secretary of State without a signature), vetoed, sent to voters (truly agreed joint resolutions), adopted
    (resolutions), awaiting governor (truly agreed this year, no governor action yet), no governor action recorded
    (truly agreed in an earlier year, but neither feed lists a governor action; the House''s list of a Senate bill
    can stop at the speaker''s signature, which the Senate''s own history fills in), pending (session still open),
    failed (session over without passing). passed_house  true when the actions record the House''s Third Read and
    Passed (or Adopted); a bill that passed the House and then stopped (withdrawn, defeated in the Senate) is still
    true. In the House XML a Senate bill''s House action counts only when it was amended and passed again here;
    the Senate''s own history records "H Third Read and Passed" for every Senate bill the House passed. relisted_from_session_code  for
    a relisting, the previous regular session whose bill (same number and bill string) it repeats; null for other
    bills, and for a relisting whose original isn''t loaded (2017''s 15 repeat the 2016 session, 161). A session
    is over once its year has ended; a regular session also once June starts (it adjourns in mid-May) and an extraordinary
    session 30 days after its last action (the latest of either feed). var as_of_date pins "today" (unit tests).
    action_count and the governor-message count come from the House XML''s actions only: they drive the relisting
    rule, which is about House appropriation bills. Grain: one row per (session, bill) with an action in either
    feed (Senate-only bills included).'
- name: int_bills__subjects
  description: 'Subject index terms per bill from both chambers'' indexes. A House bill keeps the House XML''s own
    terms (2024 sessions on); the Senate topical index fills in House bills without them (earlier sessions, when
    the bill reached the Senate) and covers Senate bills. The two indexes tag the same House bill a little differently,
    so they''re not mixed for one bill. subject_source says which index a row comes from. Grain: one row per (session,
    bill, subject) from one chamber''s index.'
- name: int_bluebook__bios
  description: 'Official Manual biographies split per person. Legislative chapter entries start with "District 12—FIRST
    LAST" and run until the next entry; lines are joined in reading order. Grain: one biography per (edition, person)
    in the legislative/executive chapters.'
- name: int_bluebook__county_circuits
  description: 'Missouri judicial circuit of every county, from the Official Manual''s "Circuit courts by county"
    table ("Adair......... Circuit No. 2"; St. Louis appears as "St. Louis Co." and "St. Louis City"). Lines can
    carry a stray character from the neighbouring column, so the name is taken from its first capital letter. county_key
    matches stg_census_tiger__features names through name_key(), minus "county"/"co". Grain: one row per county
    (and St. Louis City) in the latest edition.'
- name: int_bluebook__judge_bios
  description: 'Official Manual judicial-chapter biographies split per judge. Circuit and associate circuit entries
    are "<NAME IN CAPS>" followed by "Office address: ..."; appellate entries open with "<NAME IN CAPS> was born
    / received / served ...". The bio runs until the next entry; words hyphenated across lines are rejoined. Grain:
    one biography per judge in the judicial chapter.'
- name: int_bluebook__statewide_officeholders
  description: Every holder of each statewide elected office since 1820, from the Official Manual's "Historical
    Listing" tables in the executive chapter (Governors, Lieutenant Governors, Secretaries of State, State Auditors,
    State Treasurers, Attorneys General). A row looks like "57. Michael L. Parson (R)12 2018–25 Polk 09/17/1955";
    the digits after the party are footnote marks. The Manual gives years only, so a term is (start year, end year);
    end year is null while the person still holds the office. A person who held an office more than once is listed
    once (the Manual says so), with the whole span. Appointed successors (Wilson 2000, Parson 2018) are rows like
    any other; the Manual does not date mid-year hand-overs here. Only the latest edition loaded is used. office
    keys match the statewide_officials seed.
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - office
        - full_name
        - term_start_year
  - dbt_utils.expression_is_true:
      arguments:
        expression: term_end_year is null or term_end_year >= term_start_year
  columns:
  - name: office
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - governor
          - lt_governor
          - secretary_of_state
          - state_auditor
          - state_treasurer
          - attorney_general
  - name: full_name
    data_tests:
    - not_null
  - name: term_start_year
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: 1816
          max_value: extract(year from current_date)
- name: int_courtlistener__bulk_case_matches
  description: 'Officials matched to Missouri cases in the CourtListener bulk export. Mirrors the API loader''s
    searches (src/mogov/loaders/courtlistener_cases.py) over the same people (fct_legal_careers): judge     on the
    opinion''s panel (CourtListener person id), or their surname as a whole word in the judges text of a case in
    a court they sit on (panels are sparse for state courts) attorney  "<first> <last>" as whole words in the attorneys
    text, for lawyers and for judges whose own court CourtListener doesn''t cover (trial courts) Names are compared
    as name_key()s padded with spaces, so "Hall" doesn''t match "Marshall". Surnames repeat across generations on
    the same court (a 1910 Judge Smith on the 8th Circuit, fathers and sons on the Court of Appeals), so judges-text
    matches only count from the judge''s first known judicial start date (fct_office_history, else dim_official.current_term_start);
    without one, panel matches only. Attorney matches start at var case_history_min_year (default 1975): earlier
    namesakes aren''t them. Grain: one row per (official, role, cluster); matched_by says how.'
- name: int_courtlistener__district_dockets
  description: 'Federal district-court dockets (E.D. and W.D. Missouri) that have an assigned judge: filed and terminated
    dates (null when the docket has none) and the days between. A docket whose termination date is before its filing
    date has a negative duration (a source error): it is kept and flagged with ends_before_filed, and the judge
    metric leaves it out. The state courts carry no judge or dates in the bulk export, so only the federal districts
    are here. case_type comes from the docket-number type: the federal_dn_case_type CourtListener parsed when it
    has one (empty for about 84% of these dockets), else the type token of the docket number itself ("4:25-cr-00236"
    is cr). Mapped to civil (cv, and md: multidistrict-litigation master dockets, which carry civil nature-of-suit
    codes), criminal (cr), miscellaneous (mc, mj, sw, wi, sm, pr: warrants, subpoenas, complaints, special matters
    and the like, not cases) and other (fp, sc, cn and docket numbers with no type: a few dozen pre-2008 filings
    the maintainer has not ruled on, #465). The CourtListener type wins where the two disagree: the one such docket
    (1:00-cr-00008) is a civil suit with a mistyped docket number. Grain: one row per federal district docket with
    an assigned judge.'
  columns:
  - name: docket_id
    data_tests:
    - unique
    - not_null
  - name: case_type
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - civil
          - criminal
          - miscellaneous
          - other
- name: int_courtlistener__judge_disclosure_items
  description: 'Federal judges'' disclosure line items with the report they come from and the judge''s FJC id. Grain:
    one disclosed item per federal judge report.'
- name: int_courtlistener__mo_cases
  description: 'One row per opinion cluster in a tracked Missouri state or federal court (CourtListener bulk export),
    with its docket and court. Grain: one row per opinion cluster (decided case) in a tracked court.'
- name: int_courtlistener__official_people
  description: 'Officials matched to people in CourtListener''s judge database: federal judges by FJC id (falling
    back, for CourtListener people with no fjc_id, to exact first+last name + same court + judgeship start equal
    to the FJC commission date, only when that pairs exactly one judge with exactly one person), state judges by
    exact first+last name among people who held a seat on a tracked court (only when the name is unambiguous). Grain:
    one row per (official, CourtListener person).'
  columns:
  - name: official_id
    data_tests:
    - unique
    - not_null
  - name: cl_person_id
    data_tests:
    - unique
    - not_null
- name: int_courtlistener__official_positions
  description: 'Career positions from CourtListener''s judge database for officials it covers (matching in int_courtlistener__official_people).
    Grain: one row per CourtListener position of a matched official.'
- name: int_epa_frs__facilities
  description: 'EPA FRS facilities in Missouri that have coordinates, with one owner, one parent company and one
    primary NAICS code each. The owner is the first owner-role organization (owner/operator, owner, operator, permittee;
    a known org_type before UNKNOWN, then name, then org_type alphabetically (a stable key, not a ranking of types),
    then program record, so tied names pick the same row every build, #386); the NAICS code is the code the most
    program systems give (program_system: RCRAINFO, NPDES, AIR, ... each counts once per code however many records
    it has, so a duplicated NPDES permit or an air record listed twice adds nothing; AIR and AIRS/AFS are one program
    under two names (the same air permit, mirrored IDs) and count once; a 4- or 5-digit code (RCRAINFO, EIS and
    RMP truncate: 81232) counts for the 6-digit code at the same facility that extends it (812320), so the two forms
    of one code no longer split the vote, #432; a short code gives a full vote to EVERY 6-digit code it extends,
    so two 6-digit codes sharing a 5-digit prefix both get that vote), taking the programs'' primary codes first
    (naics_source ''naics''), then the ones FRS leaves UNKNOWN (''naics_unknown''), then the ones it calls SECONDARY
    (''naics_secondary''). Only a facility with no NAICS code at all but a SIC code (a primary one before an unknown
    or secondary one, then the one the most program systems give) gets the NAICS sector that SIC code''s major group
    falls in (seed sic_naics_sectors): naics_code is then the two-digit sector prefix, naics_description names the
    sector and the SIC code, and naics_source is ''sic''. naics_source is null when the facility has no usable code.
    A real NAICS code, even a non-primary one, is more precise than a two-digit SIC-derived sector, and agrees with
    it on the sector for about 90% of facilities. Codes tied on tier and program-system count: the one more program
    systems give across ALL tiers, not counting MO-DNR and RMP (the same count over primary, unknown and secondary
    rows; the UNKNOWN-tier rows usually back the right code, #432). MO-DNR is a state copy of what other systems
    report: at most facilities where another system also reports a NAICS code, its code matches (or extends or truncates)
    one of theirs. RMP, the facility''s own Risk Management Plan, does so at only about two-thirds of those facilities,
    and matches exactly at under half (it mostly files 5-digit codes), so it is not a pure mirror. It is left out
    on purpose: counted, it would let one more UNKNOWN row outvote the SIC sector (#513, #520); a judgment call,
    not a claim that RMP duplicates another system. Then the one in the SIC-derived sector (NAICS 31-33 count as
    one sector); then any other code before the construction stormwater-permit noise code NAICS 238910 (a site holds
    that permit beside its real industry, #432), which still wins when the SIC sector is construction; then the
    all-tier count again with MO-DNR and RMP included (they still back a code when nothing else separates them),
    then a 6-digit code before a shorter one, then the lowest code. The SIC sector counts only as a signal when
    the SIC code is not itself tied (same tier and program-system count) with a SIC code in a different sector,
    and is not construction stormwater-permit noise: SIC 1629, or 1541/1542/1611 given only by NPDES (or its MO-DNR
    copy), #513. A 1541/1542/1611 given only by MO-DNR, with no NPDES row, is read as noise too (21 facility/code
    pairs), #520. is_government: a federal site, any owner-role organization typed as a government body (municipal,
    county, state, federal, district, tribal), or a facility or owner named like one ("City of ...", "... County",
    "... School District"; most organizations are typed UNKNOWN). The *_key columns are company_key names for matching
    donors. Grain: one row per geocoded EPA FRS facility.'
- name: int_federal_bills__stage
  description: 'How far each federal bill got, read from the GovInfo BILLSTATUS action codes (never the action text).
    Each event is read from the Library of Congress''s coded copy of the action (source_system ''Library of Congress'';
    the chamber''s own copy is ignored so nothing counts twice) and the first date of each code is kept, so repeated
    actions change nothing. Codes: 8000/9000 passed/failed in House, 17000/18000 passed/failed in Senate, 28000
    presented to the President, 31000 vetoed, 32000/34000 passed House/Senate over the veto, 33000/35000 failed
    of passage in House/Senate over the veto, 36000 and 41000 became Public/Private Law, E30000 "Signed by President".
    Committee: 1010, 5000, 14000, 14900 reported; 5500, 14500 discharged. `stage` is the furthest point reached:
    introduced, committee_reported_or_discharged, passed_one_chamber, passed_both_chambers (each chamber passed
    a version of it; the texts may still differ, presented_to_president is when they agreed), agreed_to (a simple
    resolution, hres or sres, agreed to in its own chamber, or a concurrent resolution, hconres or sconres, adopted
    by both: none of these is presented to the President, so this is their final stage), presented_to_president,
    vetoed (vetoed, not overridden, not law), veto_overridden (both chambers passed it over the veto but no law
    is recorded yet), became_law. stage_rank orders the stages in that order, with the endings sharing 6 (agreed_to
    is 4); a failed vote does not lower the stage, see the failed dates. `goes_to_president` is true for every bill
    and joint resolution (hr, s, hjres, sjres), including a joint resolution proposing a constitutional amendment,
    which goes to the states instead of the President (none in the 118th or 119th). `president_outcome` for bills
    presented to the President: signed, became_law_without_signature (became law, no "Signed by President" action),
    vetoed, veto_overridden, or presented_no_action_recorded (presented, nothing after it: still pending, or the
    Congress ended). `veto_result` for vetoed bills: overridden, override_failed_house, override_failed_senate (a
    vote under the 2/3 required; the veto stands), override_passed_one_chamber, or no_override_vote_recorded. Whether
    a bill "succeeded" is the reader''s choice (#622): this model only says what happened. Pocket vetoes: BILLSTATUS
    has no code or wording of its own for them; a claimed pocket veto is recorded as a plain 31000 "Vetoed by President."
    (110 H.R. 1585, 111 H.J.Res. 64, 111 H.R. 3808), so it shows here as `vetoed`. `became_law` comes from the actions
    only (36000/41000). `has_law_number` is a separate flag: the BILLSTATUS laws list names a law for the bill.
    They can disagree: 119-hr-766 (the SEWER Act; actions stop at referral) lists Public Law 119-120, which is really
    119 S. 766 (a GovInfo data error, #729). Trusting the list would make two bills share one law, so the list only
    sets the flag. Grain: one row per federal bill of the loaded Congresses, with its furthest stage.'
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - bill_id
  - dbt_utils.expression_is_true:
      arguments:
        expression: stage_rank < 5 or goes_to_president
  - dbt_utils.expression_is_true:
      arguments:
        expression: became_law_date is null or presented_date is null or became_law_date >= presented_date
      config:
        severity: warn
  - dbt_utils.expression_is_true:
      arguments:
        expression: vetoed_date is null or presented_date is null or vetoed_date >= presented_date
  columns:
  - name: bill_id
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_govinfo_billstatus__bills')
          field: bill_id
  - name: stage
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - introduced
          - committee_reported_or_discharged
          - passed_one_chamber
          - passed_both_chambers
          - agreed_to
          - presented_to_president
          - vetoed
          - veto_overridden
          - became_law
  - name: president_outcome
    data_tests:
    - accepted_values:
        arguments:
          values:
          - signed
          - became_law_without_signature
          - vetoed
          - veto_overridden
          - presented_no_action_recorded
  - name: veto_result
    data_tests:
    - accepted_values:
        arguments:
          values:
          - overridden
          - override_failed_house
          - override_failed_senate
          - override_passed_one_chamber
          - no_override_vote_recorded
- name: int_house_fd__period_covered
  description: 'The "Period Covered: 01/01/2016-11/11/2017" line on page 1 of a House disclosure PDF. Candidate
    reports and their amendments carry it; annual reports do not. It is the only thing that says which kind of report
    an amendment restates, because the Clerk index links an amendment to nothing (#463).'
  columns:
  - name: doc_id
    description: House Clerk document id.
    data_tests:
    - unique
    - not_null
  - name: period_start
    description: First day the report covers.
  - name: period_end
    description: Last day the report covers.
- name: int_house_fd__schedule_lines
  description: 'House disclosure PDF text, each line tagged with the schedule it falls under (the nearest preceding
    "Schedule X:" header in the same document). Column-header rows, "None disclosed." and boilerplate drop out.
    Entries the PDF wraps over several lines are joined back into one row (see "continuation" below): on the schedules
    that feed commercial ties (C, E, F, J) so a wrapped tail never becomes a tie of its own (#599), and on A, B,
    D and H so a wrapped entry is not counted as several disclosure items (#641). PDFs from 2021 on extract their
    small-caps text with NUL characters; the words are restored first (#576). Grain: one text line per House disclosure
    PDF, tagged with its schedule.'
- name: int_interests__industry_money
  description: 'Money each official received from an industry or interest, per year: campaign contributions from
    organizations, PACs and committees (individuals are left out: their employer is not their money) and lobbyist
    gifts by the lobbyist''s principal. The donor or principal name is classified by the whole-word keywords in
    the interest_keywords seed ("Missouri Hospital Association PAC" -> health_care). A name can match several industries
    ("Missouri Association of Insurance and Financial Advisors" -> insurance and banking_finance) and then counts
    for each. Names with no keyword (opaque PAC acronyms) are left out. match_confidence is the weakest official
    match among the rows rolled up. Grain: one row per (official, industry, money kind, year).'
- name: int_judges__current
  description: 'All sitting judges we track: Missouri state judges (Official Manual, latest edition) and federal
    judges seated in Missouri (FJC). Grain: one row per sitting judge (state and federal).'
- name: int_judges__federal
  description: 'Sitting federal judges in Missouri: E.D./W.D. Mo. district judges, plus Eighth Circuit judges whose
    FJC career record mentions Missouri (the FJC has no duty-station field, so this is labeled, not assumed). Grain:
    one row per sitting federal judge in Missouri.'
- name: int_judges__state_index
  description: 'Missouri state judges from the Official Manual''s alphabetical judge index: "Crane, Sue M. ........
    Associate ....... 13th   Harrell, Kevin D. ....... Circuit ....... 16th" Each index line holds up to two entries.
    Entries whose name wrapped onto two lines are lost (a handful per edition); compare the count against the manual''s
    chapter totals when reviewing. The dot leader sometimes runs straight into the circuit ("Associate ..............35th"),
    so the space before it is optional; without that, 7 judges in the 2025-2026 edition lost their circuit. The
    page header can share a line with the first entry ("Alphabetical list of Missouri Judges Brewer, Craig D. ...",
    #41), so it''s stripped first. Names may use a typographic apostrophe ("O’Hara", #42); it''s normalized to ''
    so the name matches and IDs stay ASCII. Grain: one row per state judge in the Official Manual index.'
- name: int_jurisdiction_business_donor_matches
  description: 'One row per (official, facility, donor) tying a donor organization to an EPA-regulated facility
    in the area of a district-elected official it gave to: the matching behind fct_jurisdiction_businesses (one
    row per facility) and fct_jurisdiction_business_donors (one row per donor and filing page). See fct_jurisdiction_businesses
    for what counts as a match. donor_key is the normalized organization name (company_key); donor_name is the name
    as filed.'
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - official_id
        - registry_id
        - donor_key
- name: int_mec__committee_names
  description: 'Every name a Missouri committee has filed under, with the years the committee was active (filed
    a report, received or spent money, or was registered for an election), from both MEC feeds. A committee that
    changes its name keeps its MECID, so one ID can carry several names; a name reused by a new committee after
    the old one closed maps to several IDs, told apart by their active years. Years outside 2000..next year are
    typos in the source dates and are ignored. MECIDs are upper-cased. Grain: one row per (MEC committee, name it
    filed under).'
- name: int_mec__contributions_direct
  description: 'MEC direct-export contributions without the 24-hour notices that a full report itemizes again (#156):
    the same pattern as the TAP mirror (int_tap_mec__contributions). See the drop_reitemized_notices macro for the
    rule. Grain: one direct-export contribution, minus re-itemized 24-hour notices.'
- name: int_mec__contributions_received
  description: 'Itemized contributions received by Missouri committees from both MEC feeds: the TAP mirror (contribution
    years 2011-2022) and, when the opt-in loader has run, MEC''s direct export (report years 2023+, so the two don''t
    overlap; see fct_campaign_finance). mec_committee_id is always the receiving committee. A committee donor is
    identified only by contributor_committee_name: MEC records no MECID for it. MECIDs are upper-cased: a few rows
    carry "c000525" for C000525. Both feeds are read without their 24-hour notices that a full report itemizes again
    (int_tap_mec__contributions, int_mec__contributions_direct; #156). Grain: one itemized contribution received
    by a Missouri committee.'
- name: int_mec__donor_committees
  description: 'Name -> MECID crosswalk for committee donors. MEC records a committee-to-committee gift with the
    donor''s name only (the row''s MECID is the receiving committee), so the donor''s own MECID is found by matching
    that name to the names committees file under (int_mec__committee_names), in tiers: curated alias      a curated
    donor name -> MECID list (committee_donor_aliases seed), each alias group checked against the committee''s filings
    or its own filed name, for acronym and shortened names no rule can expand ("HRCC", "AMECPAC", "MHA PAC", #33);
    each row cites its evidence. Tried first, but only counts when that committee was active that year 0 mecid in
    name    the filer typed the donor''s MECID into the name ("... (MEC ID# C221962)") and it''s a known committee;
    taken whatever its active years 1 same name        name_key: case ignored; punctuation and other non-alphanumeric
    characters turned into spaces; runs of spaces collapsed, not removed (#108) 2 normalized name  committee_key:
    abbreviations spelled out (MO, Assn, Cmte...), "the/of/for/inc" dropped 3 core name        committee_core_key:
    also without words like PAC, Political, Action, Committee, Fund, Account, at least 4 characters; also tried
    on the name outside parentheses, and against a filer''s own parenthesized short name ("Carpenters Help in the
    Political Process (CHIPP)" -> CHIPP) A candidate counts only if it was active within a year of the gift (first_active_year
    - 1 .. last_active_year + 1). The lowest tier with an active candidate decides: one candidate -> matched, several
    -> ambiguous (no MECID; the candidates are listed). Names that only match committees active in other years are
    "not active that year" (usually an older or newer committee under the same name), the rest "no match" (mostly
    federal and out-of-state PACs, which don''t file with MEC). One-character names ("C", "~") are placeholders
    (#31): "placeholder name", never matched. match_confidence: high for curated aliases and tiers 0-1 (each alias
    group was checked against the committee''s filings or its own filed name; some spellings rest on their group),
    medium for the looser tiers; either way it rests on the name. Grain: one row per (donor committee name as reported,
    contribution year).'
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - donor_committee_name
        - contribution_year
  - dbt_utils.expression_is_true:
      arguments:
        expression: (match_status = 'matched') = (mec_committee_id is not null and n_candidates = 1)
  columns:
  - name: match_status
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - matched
          - ambiguous
          - not active that year
          - placeholder name
          - no match
  - name: match_method
    data_tests:
    - accepted_values:
        arguments:
          values:
          - curated alias
          - mecid in name
          - same name
          - normalized name
          - core name
- name: int_mec__official_committees
  description: 'Missouri Ethics Commission committees attributed to current state/local officials by committee name
    (e.g. "Nicole Galloway For Missouri", "Friends of Wesley Bell"). TAP''s mirror has no candidate<-> committee
    crosswalk, so this is a name match, labeled by confidence: high    committee name contains the official''s first
    and last name medium  named surname-first ("Riggs for Missouri", "Friends of Riggs", "Riggs Committee"), no
    other current official shares that surname, and it isn''t a local-office committee ("... for Sheriff"). A different
    first name anywhere in the name ("Committee to Elect Caleb Rowden") never matches. When the MEC loader has run,
    its CF12 crosswalk (exact MECID<->candidate) should replace this. Grain: one row per (official, MEC committee)
    with a confidence label.'
- name: int_mo_auditor__reports
  description: 'State Auditor reports with their rating and the kind of entity audited. A report has a rating only
    when its PDF carried the sentence "the overall performance of this entity was ..." (rating_status ''ok''); ''not_read''
    means the loader never opened a PDF for it (financial statements, monthly filing reports, follow-ups, reports
    before the 2012 summaries). rating_level orders the Auditor''s four levels (Excellent 4 ... Poor 1). entity_type:
    ''statewide_office'' when the title starts with an audited statewide office (seed mo_auditor_statewide_entities),
    ''county'' for a title ending in " County", else ''other'' (state agencies, cities, courts, schools, districts,
    statewide reports). Only a statewide office is ever linked to an officeholder. audit_period_start / audit_period_end:
    the period the title says the audit covers, when it says one: "Period July 1, 2022 through January 9, 2023"            a
    final audit of a departing officeholder "Year Ended June 30, 2012", "Three Years Ended June 30, 2003"   whole
    fiscal years, ending on that date "Period July 1, 2008 to January 12, 2009, and the Two Years Ended June 30,
    2008" both: the earliest start and the latest end Most titles say nothing ("Office of Governor"); both are then
    null. A date is "Month d, yyyy"; the month name''s first three letters give the month (mogov.month_name_date).
    Grain: one row per State Auditor report, with its rating and audited entity type.'
- name: int_mo_house__bill_text_statute_refs
  description: 'The RSMo sections each House bill text version names in its enacting title and Section A (stg_mo_house__statute_refs),
    one row per (text version, bill, action, ordinal, section) with ranges expanded: "sections 2.020 to 2.040" becomes
    every section of that span that fct_statute_sections has, plus both endpoints (a repealed range may end at a
    section the Revisor no longer lists; an enacted range names sections that do not exist yet). A range that crosses
    a chapter is not expanded: only its two endpoints are kept. Within a chapter sections run in the order of the
    number after the point, read as an integer (140.995 is followed by 140.1000, 67.646 by 67.1157), then its letter
    or uniform-code suffix as text. The section lists in House bill titles follow that order in 1,698 of 1,699 consecutive
    pairs (the other is a section named twice), not a decimal one. bill comes from fct_bill_documents (a text version
    shared by combined bills gives a row per bill); a text PDF no bill links has no row. in_statutes says whether
    fct_statute_sections has the section today: false for a section the bill would enact, or one the Revisor has
    since moved or dropped. from_range marks a section that came from a range. Grain: one row per (bill text version,
    bill, action, ordinal, section).'
- name: int_mo_house__committee_memberships
  description: 'House committee and subcommittee memberships per member and session, keyed to the person (person_key
    from int_mo_house__member_identity). The member pages (stg_mo_house__member_committees) cover every session
    but 253; for a session with no member-page rows the COMMITTEELIST export fills in (House members only, matched
    on session + district). source_url is the House file each row was read from. Grain: one row per (House session,
    member, committee).'
- name: int_mo_house__member_identity
  description: 'Identity for each MO House member per session (House XML is authoritative for the House roster).
    person_key = the stable person id (int_officials__person_ids) of the key the seat match gave: an Open States
    id when the seat (district + date + surname) matches one person, otherwise mohouse:<House member id>, so people
    missing from Open States still get a key and a person split across several keys gets one. raw_person_key is
    the key before that. Grain: one row per (House session, member) with a person_key.'
- name: int_mo_house__member_seat_keys
  description: 'Seat-matched key for each MO House member per session (House XML is authoritative for the House
    roster). raw_person_key = Open States id when the seat (district + date + surname) matches one person (or, among
    several same-surname terms, one whose name also starts with the member''s given name), otherwise mohouse:<House
    member id>, so people missing from Open States still get a key. One person can end up with several raw keys
    across sessions (see int_officials__person_ids); int_mo_house__member_identity applies that. Grain: one row
    per (House session, member) with the seat-matched raw_person_key.'
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - session_code
        - district_number
- name: int_mo_house__votes
  description: 'MO House roll-call votes attributed to people. A PDF token ("SMITH 46", "FOUNTAIN HENDERS", "MR
    SPEAKER") is matched against that session''s House member list: same surname (prefix match for names the PDF
    truncates) and, when the token carries one, same district. The PDF prints a compound surname by its last word
    ("REHDER" for Holly Thompson Rehder) and drops a generational suffix ("PRICE" for Wiley Price IV), so those
    spellings match too. The Speaker comes from the house_speakers seed. Members who left mid-session are missing
    from that session''s (end-of-session) list, so a second pass matches against every session''s members; there
    a person whose dated seat missed the vote date is ruled out even if alone, and one whose seat covered it outranks
    one with no dated seat. In a session the exact surname beats the suffix-stripped one ("PRICE" is Price not Price
    IV). Keys ignore spaces ("VANSCHOIACK" = "Van Schoiack"). When several people still fit a token, the Open States
    seat dates break the tie: a person whose seat did not cover the vote date is dropped if another candidate''s
    did ("EVANS" after Jean Evans left on 2019-02-05 is David Evans). Tokens still matching zero or several people
    stay unattributed rather than guessed. Grain: one row per (House roll call, attributed person).'
- name: int_mo_legislators__final_checks
  description: 'Legislator payroll rows that are a departed member''s final check: a small payment to a payee whose
    surname and first name fit a member of the same chamber whose seat ended the December before the pay year, or
    that January (Open States ends the 2022 and 2024 departures on 2023-01-03 and 2025-01-07), and who was paid
    well under a full year''s salary (under half of the year''s highest pay for the position). It is that departed
    member''s last pay, unless the member later held a seat in the chamber again, so neither it nor the member competes
    for the seats held now ("BLACK, LINDA R." 2017 is Linda Black''s, not a second claimant to Rusty Black''s seat,
    whose middle initial it shares, #250). fct_salaries sets these rows aside and, for a departed member, matches
    them by name only (#269, #471). The payee is identified by the payroll''s employee_name, exactly as printed.
    Grain: one row per (pay year, chamber, payroll employee_name, departed member).'
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - calendar_year
        - seat_chamber
        - employee_name
        - person_id
- name: int_mo_legislators__seat_terms
  description: 'Every Missouri legislative seat-term in Open States (current and retired people), keyed for matching:
    chamber, district number, surname key, and date range (open-ended where Open States has no date). One row per
    Open States id as given, so a person Open States holds twice has rows under both ids; int_mo_legislators__seats
    adds the stable person_id. Two corrections to Open States: * a term starting in January counts from January
    1. Open States starts the 2017 class on January 11, but the session (and their votes) began January 4. * seed
    legislator_seat_corrections adds terms Open States lacks or cuts short (senators who left mid-term for statewide
    office), each with its source. source_start_date/source_end_date carry the dates exactly as Open States (or
    the seed) gives them, without those adjustments (null start when undated; end 9999-12-31 while open). Quality
    flags (#656) say how far each date can be trusted; they change no other column, so consumers can move to them
    one by one. start_quality is dated, undated (no start) or placeholder (an Open States start on January 1, never
    a real start); seed rows with a start are always dated and taken at face value, January 1 included, and a seed
    row with a blank start is undated. known_start_date is the as-given start only when dated. end_quality is open,
    dated, conflicts_with_journal (a Senate end the journal roll calls contradict: the terms int_mo_legislators__seats
    re-dates) or conflicts_with_roster (a House end the House''s session rosters contradict), with the evidence
    dates behind it. The column docs give each rule. The evidence is read from staging (stg_mo_senate__votes, stg_mo_house__members),
    never from a model carrying person_id: this model is upstream of int_officials__person_ids. Grain: one row per
    Open States legislative seat-term, under the id Open States gave.'
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - openstates_id
        - chamber
        - district_number
        - start_date
        - end_date
  - dbt_utils.expression_is_true:
      arguments:
        expression: (known_start_date is null) = (start_quality <> 'dated')
  - dbt_utils.expression_is_true:
      arguments:
        expression: start_quality <> 'dated' or known_start_date = source_start_date
  - dbt_utils.expression_is_true:
      arguments:
        expression: (end_quality = 'open') = (source_end_date = cast('9999-12-31' as date)) or end_quality like
          'conflicts%'
  - dbt_utils.expression_is_true:
      arguments:
        expression: (end_quality <> 'conflicts_with_journal' or chamber = 'upper') and (end_quality <> 'conflicts_with_roster'
          or chamber = 'lower')
  - dbt_utils.expression_is_true:
      arguments:
        expression: end_quality <> 'conflicts_with_roster' or (evidence_first_date is not null and evidence_last_date
          >= evidence_first_date)
  columns:
  - name: start_quality
    description: 'How far the start date can be trusted. dated: Open States (or the seed) gives a real start. undated:
      Open States gives none (start_date is 1900-01-01). placeholder: any Open States start on January 1 (as given),
      which is never a real start, as the General Assembly convenes in the first half of January. Open States uses
      January 1 of 2011, 2013 and 2015 as a stand-in for "in office by then" (111 + 79 + 4 House terms and 24 +
      3 Senate terms); every other dated January start is January 3 to 11. 2017 has one January 1 start, Nick Schroer''s
      HD107 term, a near-true case (his first term began with the session on 2017-01-04): flagged all the same,
      as the rule does not look at the year. Seed rows (legislator_seat_corrections) with a start are always dated
      and taken at face value, January 1 included; a seed row with a blank start is undated. A seed start is where
      the correction begins, not necessarily the first start in the seat (Mike Kehoe''s SD6 and Mike Parson''s SD28
      rows start 2017-01-01, continuing terms Open States starts in 2011).'
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - dated
          - undated
          - placeholder
  - name: known_start_date
    description: source_start_date when start_quality is dated, else null. Never invented.
  - name: end_quality
    description: 'How far the end date can be trusted. conflicts_with_journal (Senate): a closed term whose end
      is more than a year after its last journal token, or that runs into the journal years with no token, where
      the journals cover every year of the term from their first date; the terms int_mo_legislators__seats re-dates.
      A smaller gap stays dated (Jason Holsman resigned 2020-01-16 and voted last 2020-01-13). conflicts_with_roster
      (House): the term ended before the January 15 handover of a roster year whose list has a member with its surname
      in its district while no Open States House term matching that member runs into the year (Lauren Arthur, HD18,
      ends 2016-12-31; the 2017-2018 rosters list her), or the list names someone else in its district every roster
      year from some point to the term''s end, counting only years the term runs from before January 15 to past
      May 31 (a member who left during a session is missing from its end-of-session list) and the district is listed
      at all. Surnames match ignoring spacing and generational suffixes (Van Schoiack, Franks Jr.), or by the last
      word of a compound roster surname. Otherwise open (no end date) or dated. A flag is evidence that the sources
      disagree, not a correction: a roster can also outlive a member (#152).'
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - open
          - dated
          - conflicts_with_roster
          - conflicts_with_journal
  - name: evidence_first_date
    description: 'Senate terms: the first journal vote whose token matches the term (its surname key, and district
      when the journal gives one, on a date inside start_date..end_date, naming only one (surname key, district)
      among the Senate terms that day; so a person Open States holds under two ids in one seat is one candidate,
      not an ambiguous pair), for every term with one, flagged or not; null when the term has none. House terms:
      January 1 of the first roster year behind a conflicts_with_roster flag; null otherwise.'
  - name: evidence_last_date
    description: 'Senate terms: the last matching journal vote, as evidence_first_date. House terms: December 31
      of the last roster year behind a conflicts_with_roster flag; null otherwise.'
- name: int_mo_legislators__seats
  description: 'Every Missouri legislative seat-term in Open States (current and retired people), keyed for matching:
    chamber, district number, surname key, and date range (open-ended where Open States has no date), plus person_id,
    the stable id of the person holding the seat (int_officials__person_ids). openstates_id stays the id Open States
    gave the term; use person_id wherever a seat holder becomes an official. Rows and corrections are those of int_mo_legislators__seat_terms
    (via int_mo_legislators__seats_as_given). House terms keep Open States'' dates. Senate terms are dated from
    the journal roll calls where Open States cannot (#516, #522), term by term: the votes int_mo_senate__votes attributes
    to a term are the ones cast by its person within the term''s Open States dates. Open States has no start date
    for 25 senators in office from 2017, and a few terms end long after the person left (Joseph Keaveny, 2011-2018,
    never voted in the journals, which begin 2017-01-04; Ryan Silvey''s last vote was 2017-09-13, not 2018-12-31):
    * an undated start (start_quality undated) becomes the term''s first roll-call vote. That is the latest the
    start can be (a senator seated on the journal''s first day, 2017-01-04, started on or before it), so it decides
    which years the senator held the seat in without inventing a start. It agrees with every dated start (the first
    vote falls on or just after it). A term that ended before the journals begin keeps Open States'' dates. * a
    closed term that Open States ends more than a year after the term''s last roll-call vote ends at that vote.
    A smaller gap stays: a senator who resigned on January 16 voted last on January 13 (Jason Holsman, 2020), and
    the Open States date, not the last vote, says whether they held the seat past the January 15 handover. An open
    term (no end date) is never cut. * a closed term that runs into the journal years with no vote at all was not
    held in them. Where it started before the journals began, it ends the day before the first journal date (the
    latest it can have ended); otherwise (an undated start, or a start inside the journal years) the term is dropped.
    The last two rules need the journals to cover the term: with no journal loaded, or a calendar year inside the
    term (from the journals'' first date to the term''s end; to the journals'' last date for an open term) with
    no journal vote at all, which includes years after the journals stop, a term is left as Open States gives it,
    never dropped or capped for lacking votes (#534). Only the first rule (an undated start) needs a vote of the
    term itself. start_quality is int_mo_legislators__seat_terms'' flag (dated, undated or placeholder), except
    that a start re-dated from the first roll-call vote is first_vote: a known start, though the latest it can be.
    Consumers that need a known start test start_quality <> ''undated'', never the date (a placeholder start counts
    as known, as it always has). Grain: one row per Open States legislative seat-term.'
  columns:
  - name: start_quality
    description: int_mo_legislators__seat_terms.start_quality (dated, undated, placeholder), except first_vote for
      an undated Senate start re-dated from the term's first roll-call vote. Test a known start with start_quality
      <> 'undated' (placeholder starts count as known).
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - dated
          - undated
          - placeholder
          - first_vote
- name: int_mo_legislators__seats_as_given
  description: 'Every Missouri legislative seat-term in Open States (current and retired people), keyed for matching:
    chamber, district number, surname key, and date range (open-ended where Open States has no date), plus person_id,
    the stable id of the person holding the seat (int_officials__person_ids). openstates_id stays the id Open States
    gave the term; use person_id wherever a seat holder becomes an official. Rows and corrections are those of int_mo_legislators__seat_terms.
    The dates are still Open States'' own: the Senate terms are re-dated from the journal roll calls in int_mo_legislators__seats,
    which is what to use. This model exists so int_mo_senate__votes can attribute votes to senators without depending
    on the dates those votes later correct. start_quality is int_mo_legislators__seat_terms'' flag (dated, undated
    or placeholder), carried so the re-dating in int_mo_legislators__seats reads it instead of the 1900-01-01 start.'
- name: int_mo_revisor__session_law_bills
  description: 'The bills named in the Revisor''s session-law citations: each RSMo section version''s history note
    and each repeal note, split into one row per (section version, act, bill). A history note lists the acts that
    made the section: "(L. 1945 p. 1428 § 48, A.L. 2003 S.B. 299 & 40)" is enacted in 1945 (session-law page, no
    bill number) and amended in 2003 by SB 299 and SB 40 (combined); "merged with" joins bills that changed the
    same section in one session; "1st Ex. Sess." names an extraordinary session (the Revisor also prints "2d", "3d",
    "4th", "1st.", "lst", "First" ... "Fourth", and "Ex. Sess" without its last period). change is enacted (L.),
    amended (A.L., or "A." in the 1949 revision''s notes) or repealed ("Repealed L."). Acts cited by page ("p. 1428")
    name no bill and are left out. session_code follows the House XML codes: two-digit year, then 1 for the regular
    session. The House numbers every special session (codes 2-4, in order), but the Revisor counts only extraordinary
    sessions that passed bills: 2018''s legislature-called impeachment session (183, resolutions only) isn''t one,
    so the Revisor''s 2018 "1st Ex. Sess." is House 184. So the Nth extraordinary session is the House''s session
    named "Nth Extraordinary Session" (stg_mo_house__sessions); for years the House''s list lacks, N + 2 is assumed.
    "Extraordinary Session" with no number (1997''s three "Repealed L." notes) is the year''s only numbered session
    if the other notes name just one (1997: "2d"), else the 1st. A combined act ("H.B. 115 & 99": one substitute
    that carries several bills'' subjects) names the bills after "&"; only the first, the lead bill (is_lead_bill),
    is the one that passed. The others stay as rows, with combined_into naming the lead, because the act did take
    their subjects, but they never reached the governor themselves. A bill after "&" may repeat its bill head ("H.B.
    237 & H.B. 238 & H.B. 482", "H.B. 5 & S.B. 7"); a bare number takes the type of the bill before it ("H.B. 69
    & 179 & H.B. 669"). "and" ("H.B. 1270 and H.B. 2032") is ambiguous: the Revisor uses it both for bills of one
    combined act (2004 "S.B. 968 and S.B. 969" is one act, lead SB 968) and for separate acts ("H.B. 1606 and S.B.
    743" in 2018, SB 743 also cited alone). A bill after "and" is its own lead bill only when the same year and
    session cite it as the first bill of an act elsewhere (in any section''s notes); otherwise it is combined like
    one after "&", into the lead bill of its group (every bill up to the next separate lead). The Revisor''s "H.B.
    1268 & 1211 and S.B. 966" is HB1211 combined into HB1268, with SB966 a lead only if 2004 cites SB 966 on its
    own somewhere. The older notes also list several bills of one act after commas ("A.L. 1978 H.B. 971, S.B. 628").
    A piece that is only a bill ("S.B. 628", "merged with S.B. 5") continues the act before it (same year, session
    and change), as long as only such pieces come between (or the act is just a year, "A.L. 1985, H.B. 366"); after
    a page cite ("p. 509") or an RSMo piece there is no act to continue. A section cite may follow a bill ("H.B.
    1574 § 6 and S.B. 721 § 2", "H.B. 1807, et al. § 301.4044 and S.B. 480"): it is read past, so the bill after
    "and" is kept; the typo ".S.B. 58" (stray period) is read as "S.B. 58". A Senate bill the note marks "Revision"
    (2018 "S.B. 975 & 1024 Revision") is named SRB975 and SRB1024, as the Senate''s list and fct_bills do, when
    the session''s list has SRB n and no SB n (#627). Parse bounds (macros/session_law_bounds.sql): a note is read
    up to 60 acts (longest real note: 43, RSMo 301.010), an act up to 10 "merged with" bills (longest: 6) and 6
    "&"/"and" bills (longest: 4). Parts past a bound would be dropped silently, and notes list acts oldest first,
    so the newest acts would go; assert_session_law_bounds_not_exceeded fails the build when real data needs more.
    Grain: one row per (RSMo section version, act, bill) a history or repeal note names.'
- name: int_mo_senate__votes
  description: 'MO Senate journal votes attributed to people: the senator serving on the vote date with a matching
    surname (and district, when the journal adds one to disambiguate), by the dates Open States gives the seat (int_mo_legislators__seats_as_given;
    int_mo_legislators__seats re-dates Senate terms from these votes). Ambiguous tokens stay unattributed. Grain:
    one row per (Senate journal vote, attributed person).'
- name: int_officeholders__years
  description: 'Who held each tracked office in each year, for the offices whose past holders have dated records:
    state_house    the House''s own roster for each session year (int_mo_house__member_identity). Members who left
    mid-session are missing from that session''s end-of-session list. state_senate   Open States seat-terms (int_mo_legislators__seats,
    which dates them from the Senate journal roll calls where Open States has no start or a wrong end). A year is
    kept only when all 34 districts have a dated holder, so a partial year doesn''t pass as the full Senate. us_house,
    us_senate                 congress-legislators terms for Missouri us_district_court, us_court_of_appeals   FJC
    commissions on the E.D./W.D. Mo. district courts, and Eighth Circuit judges whose FJC career mentions Missouri
    (as int_judges__federal) A term counts for a year when it runs past January 15 of it, so a hand-over in the
    first days of January (Congress turns over on January 3) doesn''t list both the outgoing and the incoming holder.
    Years are those with a House roster. A roster row is dropped when the roster outlived the member, by either
    of two tests: the person''s last roll-call vote was before the year''s handover (any row, #491; only in a year
    with House roll calls on or after the handover, so a roster stays whole until that year''s roll calls are loaded),
    or the row''s Open States person has a last House term that ended before the handover (only rows whose roster
    member carries an Open States id: the name-anchor override, #152). Statewide officers, mayors and state judges
    have no dated past rosters here. person keys match dim_official.official_id, so a past holder who serves today
    links to their profile. official_id is the stable person id; openstates_id is the Open States record the senate
    row came from (null for other sources), kept so rpt_officeholders_by_year can find that record''s folder. session_code
    is the House session file (e.g. 251, 253) listing the member, the earliest one in the year; null for other sources.
    Grain: one row per (year, person, office) for offices with dated past rosters.'
- name: int_officials__bios
  description: 'One biography text per current official where a source has one: Official Manual (legislators), MO
    House XML (representatives), FJC professional career (federal judges), Open States (others). Grain: one biography
    text per official per source.'
- name: int_officials__current
  description: 'Everyone currently holding a Missouri public office that we track, one row per (person, office).
    official_id: Open States ocd-person id when one exists, else bioguide:<id>, statewide:<office>, or judge:<key>
    (see int_judges__current). A legislator Open States or the House roster knows under several ids gets one stable
    id (int_officials__person_ids); a current official keeps the id they had. Grain: one row per (person, current
    office).'
- name: int_officials__identity_terms
  description: 'Who held which legislative seat in which year under which id, before ids are reconciled: the evidence
    int_officials__person_ids works from. One row per (id as the source gave it, year, office, district, House member
    id) for the years with a House roster, from the House''s own roster (its raw seat-matched key: an Open States
    id or mohouse:<House member id>) and from Open States seat-terms (both chambers). A term counts for a year when
    it runs past January 15 of it. A term with an undated start (start_quality undated in int_mo_legislators__seat_terms)
    counts only for its last year (below); a placeholder start (January 1, #656) counts like a dated one. house_member_id
    is the MO House member id the roster gave the row (null for Open States seat-terms): the House keeps one member
    id per person across sessions and name changes, so the person-id rule can follow it. name_key is the id''s own
    full name. term_start/term_end are the Open States term''s dates exactly as Open States gives them (DATE; end
    9999-12-31 while open; null for House roster rows, which carry only a year), so a rule can tell overlap from
    succession. They are not the January-1 adjusted dates used for the year membership above: those would make a
    January successor (from Jan 1) overlap a predecessor Open States ends on Jan 6-9. The two years before the first
    roster year are included too (Open States seat-terms only), so a member whose seat ended the December before
    the roster begins (Stephen Webber, #504) or resigned in 2015 (Tom Dempsey, Paul LeVota, #512) still has evidence
    to be joined by. Earlier years are not: their Open States terms are mostly the 2011 and 2013 placeholder starts
    (#332), and nobody who left before 2015 is a roster member. A term with an undated start (22 senators of 2017-2023
    and some House members, #512) counts for one year only, the last year it ran past the January 15 handover: Open
    States gives its end, so the person held the seat that year, and no first year is invented. That is enough to
    give the id a person_ids row and to let the name rules see its name and seat. An undated id has only that one
    year of evidence, which weakens rule 2 (a seat conflict needs more than one shared year) and rule 2b (the chamber-move
    check compares the first and last year) of int_officials__person_ids (#519). The data test assert_undated_open_states_ids_share_no_name
    fails if such an id ever shares a name (rule 2) or a rule 2b variant name (Dan / Daniel Brown) with another
    id, so the weakness cannot join or split wrongly unnoticed. Known edge: the min(start)/max(end) collapse per
    (alias_id, year, office, district) spans any gap if one id holds the same seat in two separate terms in a year.
    Grain: one row per (id as sourced, year, office, district, House member id).'
- name: int_officials__name_keys
  description: 'Normalized name variants per current official, for matching sources that only carry names (MEC committees,
    lobbyist reports, Wikidata labels, ratings). One row per (official, variant). Grain: one row per (official,
    normalized name variant).'
- name: int_officials__person_ids
  description: 'One stable person_id per id a legislator has been given. The sources key the same person differently:
    Open States sometimes holds two records for one person (a move between districts or chambers), and the House
    roster falls back to mohouse:<member id> when its seat can''t be tied to an Open States record. Every id seen
    in int_officials__identity_terms gets one row: alias_id (as the source gave it) -> person_id (what the pipeline
    calls the person). Rules, in order: 1. seed official_id_links, same_person: a curated id for a person the name
    rule can''t join (statewide officers, judges). basis = curated. A row moves the whole person its alias_id was
    merged into by the rules below to the person its person_id was merged into, so naming a merged id the rules
    did not choose, on either side, does not split the person (#174, #682). 2. ids with the same exact full name
    (case, punctuation and spacing ignored: "Van Schoiack" and "VanSchoiack" are one name, #228) are one person,
    basis = name_continuity, unless two of them hold different seats in more than one shared year. The same seat
    in the same year is how a split shows (Jean Evans, Joe Adams); different seats across several shared years mean
    two people, while a single shared year is a hand-over between seats. A pair listed as different_people in official_id_links
    also keeps that whole name apart. 2b. two names that differ only in the given name, one being the start of the
    other ("Steve"/"Steven" Roberts, "Ken"/"Kenneth" Jamison; #263), are one person when each name belongs to exactly
    one such pair and the names never hold different seats in the same year (across all ids of both names), and
    either hold a seat at the same time (their dated terms in one seat overlap: start_a < end_b and start_b < end_a,
    an open term ending 9999-12-31; the same start day overlaps, one term ending the day the other starts does not),
    or follow each other within a year in a different chamber (a move, as Roberts went House to Senate). Overlap
    alone is not enough: Open States often leaves a member who left mid-term with the normal term end, so a special-election
    successor overlaps on paper (Silvey to 2018-12-31, Lauren Arthur from 2018-09-12, SD17). The shared-seat case
    also needs one term to be a stub (under 90 days) inside the other, starting within 31 days of it; equal or nested
    multi-year terms do not qualify (Open States'' placeholder 2013-01-01 starts, #332). Years alone cannot decide
    the shared-seat case: Kenneth Jamison (2025 only) inside Ken Jamison (2025-26) is a duplicate, but Danielle
    Smith (2019 only, or 2026 only after a special election) inside a Dan Smith successor''s span looks the same
    by year. Dates tell them apart: Kenneth''s term is a 26-day stub that overlaps Ken''s, while a successor''s
    term starts on or after the predecessor''s ends (or is no stub). Undated House-roster rows prove no overlap.
    A name left with more than one partner (a chain or a fork) is ambiguous and joins nothing. 2d. duplicate stubs
    (#294, #292): Open States holds some members twice, once as a stub. An Open States id whose only seat-term is
    a dated stub under 90 days joins another name when that name''s dated term (90 days or more) in the same office
    and district contains the stub and starts at most 7 days before it, the surnames match (one side may drop a
    one-letter middle initial: "David A." / "David" Dolan) and the given names fit (mogov.first_name_fit: "Martin"
    / "Marty" Jacobs; not "Daniel" / "Robert"), basis = duplicate_stub. Every id of the stub''s name must be such
    a stub, the stub must have exactly one such partner name, neither name may be kept apart, and a stub name already
    in a rule 2b pair (Kenneth / Ken Jamison) is left to rule 2b. A special-election successor never qualifies:
    its term starts on or after the predecessor''s ends, or (when Open States leaves a departed member''s normal
    term end) months after the predecessor''s term starts. The stub''s name joins the other name''s group, so rule
    2c still applies to the joined person. 2c. MO House member id continuity (#151): the House keeps one member
    id per person across sessions and name changes (Mazzie Boyd, 2023, and Mazzie Christensen, 2024-26, are member
    2381), so ids that share a House member id are one person whatever their names, basis = member_id_continuity.
    This is applied after rules 2 and 2b and joins the persons they made, so it also reaches ids the name rules
    keep apart. It skips an id that carries more than one member id (Open States'' Rick Roeber holds member 2215
    and, through a seat-match error, Rebecca Roeber''s 1790, #152: the shared 1790 would join two people) and any
    id listed as different_people in official_id_links. Only ids with a roster row (a House member id) take part;
    Senate-only ids rely on names. 3. otherwise the id is its own person, basis = self. Among merged ids the person_id
    is an Open States id over mohouse:, then the one whose service ends latest, then the one that is not a duplicate
    stub, then the smaller id. The choice never looks at the latest roster year, so an official''s id does not change
    when they leave office. Curated rows (official_id_links) take effect only once a maintainer has signed them
    off (checked_by and checked_on both filled, #174). Grain: one row per id a legislator has been given, with the
    stable person_id.'
- name: int_officials__wikidata
  description: 'Wikidata QID per official: from roster cross-references when present, else a unique exact name match
    against living Missouri officeholders on Wikidata. Grain: one row per official with a Wikidata QID.'
- name: int_tap_mec__contributions
  description: 'TAP MEC contributions without the 24-hour notices that a full report itemizes again (#156): stg_tap_mec__contributions
    keeps every row of the source; everything that totals gifts (committee receipts, donor summaries, the campaign-finance
    fact) reads this model. See the drop_reitemized_notices macro for the rule. Grain: one itemized contribution
    in the TAP mirror, minus re-itemized 24-hour notices.'
- name: int_votes__member_votes
  description: 'Every recorded vote by every member, tracked official or not: MO House roll calls and MO Senate
    journals (member_key is the attributed person, else the printed token) and Congress from the loaded Voteview
    files (member_key is the ICPSR id). Chamber-wide figures (party majorities, chamber attendance) count from here,
    so they don''t depend on who holds office today. vote_id, chamber and session_code match fct_votes. Grain: one
    row per (chamber, vote, member) for every member, tracked or not.'
  columns:
  - name: chamber
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - state_house
          - state_senate
          - us_house
          - us_senate
- name: int_votes__party_positions
  description: 'Each party''s majority position on every recorded vote, counted over every member who voted (int_votes__member_votes),
    not only the officials tracked today. A party''s position is the side most of its yea/nay voters took; a tie
    has no position. A party-line vote is one where the Republican and Democratic majorities took opposite sides.
    vote_id and chamber match fct_votes. Grain: one row per (chamber, vote) with any Republican or Democratic yea/nay.'
