unit_tests:
  - name: senate_seat_terms_dated_from_the_journal_roll_calls_per_term
    model: int_mo_legislators__seats
    description: >
      Senate seat-terms are re-dated from the journal roll calls where Open States cannot (#516, #522), term by
      term. The journals begin 2017-01-04. a01: an undated start becomes the term's first vote. a02: Open States
      ends the term 2018-12-31 but the last vote was 2017-09-13, over a year earlier, so the term ends there.
      a03: a senator who resigned January 16 and voted last January 13 keeps the Open States date (within a
      year of the last vote). a04: an open term is never cut. a05: a closed term running into the journal years
      with no vote, which started before them, ends the day before the journals begin. a06: the same with an
      undated start is dropped. a07: the same with a start inside the journal years is dropped. a08: a term that
      ended before the journals begin keeps its dates. a09: a term with no vote but an open end is kept as it is.
      a10 has two terms: the first is capped by its own last vote, not by the person's later votes in the second
      term, and the second keeps its dated start. House terms keep Open States' dates, undated or not. start_quality
      passes through, except first_vote for a start re-dated from the first vote (a01); a placeholder start (a05)
      is a known start, so it is capped, not dropped.
    given:
      - input: ref('int_mo_legislators__seats_as_given')
        rows:
          - {openstates_id: a01, person_id: a01, chamber: upper, district_number: 1, start_date: '1900-01-01', start_quality: undated, end_date: '2020-12-31'}
          - {openstates_id: a02, person_id: a02, chamber: upper, district_number: 2, start_date: '2011-01-01', start_quality: placeholder, end_date: '2018-12-31'}
          - {openstates_id: a03, person_id: a03, chamber: upper, district_number: 3, start_date: '2017-01-01', start_quality: dated, end_date: '2018-01-16'}
          - {openstates_id: a04, person_id: a04, chamber: upper, district_number: 4, start_date: '2017-01-01', start_quality: dated, end_date: '9999-12-31'}
          - {openstates_id: a05, person_id: a05, chamber: upper, district_number: 5, start_date: '2011-01-01', start_quality: placeholder, end_date: '2018-12-31'}
          - {openstates_id: a06, person_id: a06, chamber: upper, district_number: 6, start_date: '1900-01-01', start_quality: undated, end_date: '2018-12-31'}
          - {openstates_id: a07, person_id: a07, chamber: upper, district_number: 7, start_date: '2017-02-01', start_quality: dated, end_date: '2018-12-31'}
          - {openstates_id: a08, person_id: a08, chamber: upper, district_number: 8, start_date: '2009-01-01', start_quality: dated, end_date: '2016-12-31'}
          - {openstates_id: a09, person_id: a09, chamber: upper, district_number: 9, start_date: '2017-02-01', start_quality: dated, end_date: '9999-12-31'}
          - {openstates_id: a10, person_id: a10, chamber: upper, district_number: 10, start_date: '2011-01-01', start_quality: placeholder, end_date: '2018-12-31'}
          - {openstates_id: a10b, person_id: a10, chamber: upper, district_number: 10, start_date: '2019-01-01', start_quality: dated, end_date: '9999-12-31'}
          - {openstates_id: h01, person_id: h01, chamber: lower, district_number: 1, start_date: '1900-01-01', start_quality: undated, end_date: '2018-12-31'}
      - input: ref('int_mo_senate__votes')
        rows:
          - {person_key: a01, vote_date: '2017-01-04'}
          - {person_key: a01, vote_date: '2020-12-02'}
          - {person_key: a02, vote_date: '2017-01-04'}
          - {person_key: a02, vote_date: '2017-09-13'}
          - {person_key: a03, vote_date: '2017-02-01'}
          - {person_key: a03, vote_date: '2018-01-13'}
          - {person_key: a04, vote_date: '2017-02-01'}
          - {person_key: a10, vote_date: '2017-01-04'}
          - {person_key: a10, vote_date: '2017-09-13'}
          - {person_key: a10, vote_date: '2019-01-09'}
          - {person_key: a10, vote_date: '2026-05-15'}
    expect:
      rows:
        - {openstates_id: a01, district_number: 1, start_date: '2017-01-04', end_date: '2020-12-31', start_quality: first_vote}
        - {openstates_id: a02, district_number: 2, start_date: '2011-01-01', end_date: '2017-09-13', start_quality: placeholder}
        - {openstates_id: a03, district_number: 3, start_date: '2017-01-01', end_date: '2018-01-16', start_quality: dated}
        - {openstates_id: a04, district_number: 4, start_date: '2017-01-01', end_date: '9999-12-31', start_quality: dated}
        - {openstates_id: a05, district_number: 5, start_date: '2011-01-01', end_date: '2017-01-03', start_quality: placeholder}
        - {openstates_id: a08, district_number: 8, start_date: '2009-01-01', end_date: '2016-12-31', start_quality: dated}
        - {openstates_id: a09, district_number: 9, start_date: '2017-02-01', end_date: '9999-12-31', start_quality: dated}
        - {openstates_id: a10, district_number: 10, start_date: '2011-01-01', end_date: '2017-09-13', start_quality: placeholder}
        - {openstates_id: a10b, district_number: 10, start_date: '2019-01-01', end_date: '9999-12-31', start_quality: dated}
        - {openstates_id: h01, district_number: 1, start_date: '1900-01-01', end_date: '2018-12-31', start_quality: undated}

  - name: senate_seat_terms_untouched_when_the_journal_is_empty
    model: int_mo_legislators__seats
    description: >
      With no Senate journal votes loaded (a fresh or partial environment) nothing can be said about who voted, so no
      Senate term is dropped, capped or moved (#534). Before the guard the empty journal's first date was null and the
      final filter dropped every closed Senate term. b01: a closed term running into the journal years. b02: an
      undated start. b03: a term that ended before the journals begin. h01: a House term.
    given:
      - input: ref('int_mo_legislators__seats_as_given')
        rows:
          - {openstates_id: b01, person_id: b01, chamber: upper, district_number: 1, start_date: '2011-01-01', start_quality: placeholder, end_date: '2018-12-31'}
          - {openstates_id: b02, person_id: b02, chamber: upper, district_number: 2, start_date: '1900-01-01', start_quality: undated, end_date: '2018-12-31'}
          - {openstates_id: b03, person_id: b03, chamber: upper, district_number: 3, start_date: '2009-01-01', start_quality: dated, end_date: '2016-12-31'}
          - {openstates_id: h01, person_id: h01, chamber: lower, district_number: 1, start_date: '2011-01-01', start_quality: placeholder, end_date: '2018-12-31'}
      - input: ref('int_mo_senate__votes')
        rows: []
    expect:
      rows:
        - {openstates_id: b01, district_number: 1, start_date: '2011-01-01', end_date: '2018-12-31'}
        - {openstates_id: b02, district_number: 2, start_date: '1900-01-01', end_date: '2018-12-31'}
        - {openstates_id: b03, district_number: 3, start_date: '2009-01-01', end_date: '2016-12-31'}
        - {openstates_id: h01, district_number: 1, start_date: '2011-01-01', end_date: '2018-12-31'}

  - name: senate_seat_terms_untouched_when_a_journal_year_is_missing
    model: int_mo_legislators__seats
    description: >
      Dropping or capping a term for lacking votes needs journal votes in every calendar year the term spans within
      the journals (#534). Here the journal has votes in 2017 and 2019 only, so 2018 is missing and a partial raw load
      is assumed. c01 ends 2018-12-31 with its last vote in 2017: not capped. c02 ends 2018-12-31 with no vote:
      not dropped or moved to 2017-01-03. c03 ends 2017-12-31, a year the journal covers, with no vote and a dated start
      before the journals: ends the day before the journals begin (2017-01-31 here) as usual. c04 ends 2020-12-31, a
      year after the journals stop (no 2020 votes): not capped, as the journals may simply not reach 2020.
    given:
      - input: ref('int_mo_legislators__seats_as_given')
        rows:
          - {openstates_id: c01, person_id: c01, chamber: upper, district_number: 1, start_date: '2011-01-01', start_quality: placeholder, end_date: '2018-12-31'}
          - {openstates_id: c02, person_id: c02, chamber: upper, district_number: 2, start_date: '2011-01-01', start_quality: placeholder, end_date: '2018-12-31'}
          - {openstates_id: c03, person_id: c03, chamber: upper, district_number: 3, start_date: '2011-01-01', start_quality: placeholder, end_date: '2017-12-31'}
          - {openstates_id: c04, person_id: c04, chamber: upper, district_number: 4, start_date: '2019-01-01', start_quality: dated, end_date: '2020-12-31'}
      - input: ref('int_mo_senate__votes')
        rows:
          - {person_key: c01, vote_date: '2017-02-01'}
          - {person_key: c04, vote_date: '2019-02-01'}
    expect:
      rows:
        - {openstates_id: c01, district_number: 1, start_date: '2011-01-01', end_date: '2018-12-31'}
        - {openstates_id: c02, district_number: 2, start_date: '2011-01-01', end_date: '2018-12-31'}
        - {openstates_id: c03, district_number: 3, start_date: '2011-01-01', end_date: '2017-01-31'}
        - {openstates_id: c04, district_number: 4, start_date: '2019-01-01', end_date: '2020-12-31'}

  - name: senate_seat_terms_untouched_when_the_journal_stops_early
    model: int_mo_legislators__seats
    description: >
      A journal that stops before a closed term ends (a partial raw load, e.g. only 2017-2019) does not cover the
      years after it, so the term is neither capped nor dropped (#534). The journal has votes in 2017-2019 only.
      d01 ends 2021-12-31, last voted 2019-02-01: not capped. d02 started 2018 and ended 2021-12-31 with no vote:
      not dropped. d03 ends 2019-12-31, inside the journal years, last voted 2017-02-01: capped as usual.
    given:
      - input: ref('int_mo_legislators__seats_as_given')
        rows:
          - {openstates_id: d01, person_id: d01, chamber: upper, district_number: 1, start_date: '2017-01-01', start_quality: dated, end_date: '2021-12-31'}
          - {openstates_id: d02, person_id: d02, chamber: upper, district_number: 2, start_date: '2018-01-01', start_quality: dated, end_date: '2021-12-31'}
          - {openstates_id: d03, person_id: d03, chamber: upper, district_number: 3, start_date: '2017-01-01', start_quality: dated, end_date: '2019-12-31'}
      - input: ref('int_mo_senate__votes')
        rows:
          - {person_key: d01, vote_date: '2017-02-01'}
          - {person_key: d01, vote_date: '2018-02-01'}
          - {person_key: d01, vote_date: '2019-02-01'}
          - {person_key: d03, vote_date: '2017-02-01'}
    expect:
      rows:
        - {openstates_id: d01, district_number: 1, start_date: '2017-01-01', end_date: '2021-12-31'}
        - {openstates_id: d02, district_number: 2, start_date: '2018-01-01', end_date: '2021-12-31'}
        - {openstates_id: d03, district_number: 3, start_date: '2017-01-01', end_date: '2017-02-01'}
