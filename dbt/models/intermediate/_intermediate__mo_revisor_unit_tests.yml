            union all select 'e.6', 'e.6/1', '(L. 1993 H.B. 551 & 552 § 2 subsec. 1 and S.B. 67 § 10 subsec. 1 merged with S.B. 88 § 1 subsec. l)'
            union all select 'e.7', 'e.7/1', '(L. 2000 H.B. 5 § 3 and the like, A.L. 2001 H.B. 6)'
