# Unit tests for the Revisor session-law citation parser: fixed history and repeal notes -> exact bill rows.
version: 2

unit_tests:
  - name: session_law_citations_split_into_bills
    model: int_mo_revisor__session_law_bills
    description: >
      One row per (section version, bill) for each act that names a bill. "p. N" acts name no bill; "et al." stays
      with its act; "merged with" and "&" name several bills of one act, the numbers after "&" sharing the first
      bill's type; "A." (1949 revision) is an amendment; "S.B" without its last dot still parses. The Revisor's
      2018 "1st Ex. Sess." is House session 184 (the House's name for it): 183 was a special session with resolutions only.
      The numbers after "&" are bills combined into the first, the lead bill: only it passed.
    given:
      - input: ref('stg_mo_revisor__sections')
        format: sql
        rows: |
            select '1.010' as section_id, '1.010/42' as section_version_id, '(RSMo 1939 § 645, A.L. 1957 p. 587, A.L. 2015 S.B. 239)' as history_note union all
            select '27.117', '27.117/60727', '(L. 2026 H.B. 2273, et al. merged with H.B. 2637 & 3155 merged with S.B. 999)' union all
            select '33.210', '33.210/822', '(L. 1945 p. 1428 § 48, A.L. 2003 S.B. 299 & 40)' union all
            select '2.040', '2.040/60086', '(RSMo 1939 § 665, A.L. 1945 p. 1112; RSMo 1939 §§ 675, 676; A. 1949 S.B. 1002)' union all
            select '9.100', '9.100/1', '(L. 1990 S.B 5 § 1)' union all
            select '36.430', '36.430/999', '(L. 1945 p. 1157 § 41)'
      - input: ref('stg_mo_revisor__repeals')
        format: sql
        rows: |
            select '85.270' as section_id, '85.270/1' as section_version_id, 'repealed' as change_kind, '(Repealed L. 1983 H.B. 68 § 1 Revision)' as note union all
            select '487.010', '487.010/2', 'repealed', '(Repealed L. 2018 1st Ex. Sess. H.B. 2)' union all
            select '9.010', '9.010/3', 'transferred', '(Transferred 1959; now 442.560 )'
      - input: ref('stg_mo_house__sessions')
        format: sql
        rows: |
            select 2018 as session_year, '181' as session_code, '' as session_of_general_assembly union all
            select 2018, '183', '1st Special Session' union all
            select 2018, '184', '1st Extraordinary Session'
    expect:
      rows:
        - {section_id: '1.010', bill: SB239, change: amended, session_code: '151', is_lead_bill: true, combined_into: }
        - {section_id: '27.117', bill: HB2273, change: enacted, session_code: '261', is_lead_bill: true, combined_into: }
        - {section_id: '27.117', bill: HB2637, change: enacted, session_code: '261', is_lead_bill: true, combined_into: }
        - {section_id: '27.117', bill: HB3155, change: enacted, session_code: '261', is_lead_bill: false, combined_into: HB2637}
        - {section_id: '27.117', bill: SB999, change: enacted, session_code: '261', is_lead_bill: true, combined_into: }
        - {section_id: '33.210', bill: SB299, change: amended, session_code: '031', is_lead_bill: true, combined_into: }
        - {section_id: '33.210', bill: SB40, change: amended, session_code: '031', is_lead_bill: false, combined_into: SB299}
        - {section_id: '2.040', bill: SB1002, change: amended, session_code: '491', is_lead_bill: true, combined_into: }
        - {section_id: '9.100', bill: SB5, change: enacted, session_code: '901', is_lead_bill: true, combined_into: }
        - {section_id: '85.270', bill: HB68, change: repealed, session_code: '831', is_lead_bill: true, combined_into: }
        - {section_id: '487.010', bill: HB2, change: repealed, session_code: '184', is_lead_bill: true, combined_into: }

  - name: extraordinary_session_spellings_all_map_to_their_session
    model: int_mo_revisor__session_law_bills
    description: >
      The Revisor prints the extraordinary session as "1st", "2nd", "2d", "3d", "4th", "1st." (extra period),
      "lst" (OCR) and "Ex. Sess" (no final period). Every spelling must be read as an extraordinary session, and the
      Nth maps to the House session named "Nth Extraordinary Session" (2017: 173, 174); when the House's list lacks
      the year, N + 2 is assumed. A bill merged into an extraordinary session's act ("H.B. 1 merged with S.B. 3")
      is in that session too, not the regular one. Matching only "1st/2nd/3rd" (the old regex) loses 2017's
      "2d Ex. Sess." S.B. 5 and puts 1997's merged S.B. 3 in the regular session.
    given:
      - input: ref('stg_mo_revisor__sections')
        format: sql
        rows: |
            select 'a.1' as section_id, 'a.1/1' as section_version_id, '(A.L. 2017 2d Ex. Sess. S.B. 5)' as history_note union all
            select 'a.2', 'a.2/1', '(L. 2017 1st. Ex. Sess. H.B. 1)' union all
            select 'a.3', 'a.3/1', '(A.L. 2017 1st Ex. Sess S.B. 9)' union all
            select 'a.4', 'a.4/1', '(A.L. 2017 lst Ex. Sess. S.B. 11)' union all
            select 'a.5', 'a.5/1', '(A.L. 1997 2d Ex. Sess. H.B. 1 merged with S.B. 3)' union all
            select 'a.6', 'a.6/1', '(A.L. 2018 1st Ex. Sess. H.B. 2)' union all
            select 'a.7', 'a.7/1', '(A.L. 2017 H.B. 20)'
      - input: ref('stg_mo_revisor__repeals')
        format: sql
        rows: |
            select '9.010' as section_id, '9.010/3' as section_version_id, 'transferred' as change_kind, '(Transferred 1959; now 442.560 )' as note
      - input: ref('stg_mo_house__sessions')
        format: sql
        rows: |
            select 2017 as session_year, '173' as session_code, '1st Extraordinary Session' as session_of_general_assembly union all
            select 2017, '174', '2nd Extraordinary Session' union all
            select 2018, '183', '1st Special Session' union all
            select 2018, '184', '1st Extraordinary Session'
    expect:
      rows:
        - {section_id: a.1, bill: SB5, session_code: '174'}
        - {section_id: a.2, bill: HB1, session_code: '173'}
        - {section_id: a.3, bill: SB9, session_code: '173'}
        - {section_id: a.4, bill: SB11, session_code: '173'}
        - {section_id: a.5, bill: HB1, session_code: '974'}
        - {section_id: a.5, bill: SB3, session_code: '974'}
        - {section_id: a.6, bill: HB2, session_code: '184'}
        - {section_id: a.7, bill: HB20, session_code: '171'}

  - name: combined_bills_may_repeat_the_bill_head_after_and_or_ampersand
    model: int_mo_revisor__session_law_bills
    description: >
      "H.B. 237 & H.B. 238 & H.B. 482" (RSMo 488.429) is three bills combined into the first; reading numbers only
      after the first head kept just 237. Each bill after "&" may carry its own head ("H.B. 5 & S.B. 7"), and a bare
      number takes the type of the bill before it, even after a head of another type ("S.B. 7 & 8"; "H.B. 69 & 179
      & H.B. 669"). "and" is ambiguous (see the next test): with no other citation of the bill after it,
      "H.B. 1268 & 1211 and S.B. 966" is all one act, HB1211 and SB966 combined into HB1268, and "H.B. 996 and
      H.B. 1142 and H.B. 1201" (a real 2004 combined act) is one act led by HB996. A "§ 1" after the numbers is not
      read as another bill.
    given:
      - input: ref('stg_mo_revisor__sections')
        format: sql
        rows: |
            select 'r.1' as section_id, 'r.1/1' as section_version_id, '(A.L. 2009 H.B. 237 & H.B. 238 & H.B. 482)' as history_note union all
            select 'r.2', 'r.2/1', '(A.L. 2010 H.B. 5 & S.B. 7 & 8)' union all
            select 'r.3', 'r.3/1', '(A.L. 1997 H.B. 69 & 179 & H.B. 669)' union all
            select 'r.4', 'r.4/1', '(A.L. 2004 H.B. 1268 & 1211 and S.B. 966 § 1 merged with H.B. 9)' union all
            select 'r.5', 'r.5/1', '(A.L. 2004 H.B. 996 and H.B. 1142 and H.B. 1201)'
      - input: ref('stg_mo_revisor__repeals')
        format: sql
        rows: |
            select '9.010' as section_id, '9.010/3' as section_version_id, 'transferred' as change_kind, '(Transferred 1959; now 442.560 )' as note
      - input: ref('stg_mo_house__sessions')
        format: sql
        rows: |
            select 2018 as session_year, '181' as session_code, '' as session_of_general_assembly
    expect:
      rows:
        - {section_id: r.1, bill: HB237, is_lead_bill: true, combined_into: }
        - {section_id: r.1, bill: HB238, is_lead_bill: false, combined_into: HB237}
        - {section_id: r.1, bill: HB482, is_lead_bill: false, combined_into: HB237}
        - {section_id: r.2, bill: HB5, is_lead_bill: true, combined_into: }
        - {section_id: r.2, bill: SB7, is_lead_bill: false, combined_into: HB5}
        - {section_id: r.2, bill: SB8, is_lead_bill: false, combined_into: HB5}
        - {section_id: r.3, bill: HB69, is_lead_bill: true, combined_into: }
        - {section_id: r.3, bill: HB179, is_lead_bill: false, combined_into: HB69}
        - {section_id: r.3, bill: HB669, is_lead_bill: false, combined_into: HB69}
        - {section_id: r.4, bill: HB1268, is_lead_bill: true, combined_into: }
        - {section_id: r.4, bill: HB1211, is_lead_bill: false, combined_into: HB1268}
        - {section_id: r.4, bill: SB966, is_lead_bill: false, combined_into: HB1268}
        - {section_id: r.4, bill: HB9, is_lead_bill: true, combined_into: }
        - {section_id: r.5, bill: HB996, is_lead_bill: true, combined_into: }
        - {section_id: r.5, bill: HB1142, is_lead_bill: false, combined_into: HB996}
        - {section_id: r.5, bill: HB1201, is_lead_bill: false, combined_into: HB996}

  - name: and_joined_bills_are_separate_leads_only_when_cited_as_a_lead_elsewhere
    model: int_mo_revisor__session_law_bills
    description: >
      The Revisor's "and" joins the bills of one combined act (2004 "S.B. 968 and S.B. 969" is one act, lead SB 968)
      and also separate acts (2018 "H.B. 1606 and S.B. 743", where SB 743 is also cited alone). A bill after "and"
      is a lead bill only when the same year and session cite it as the first bill of an act elsewhere; otherwise it
      is combined into the lead of its group. Always-lead (the old reading) makes SB969 and HB1142 leads; always-
      combined makes SB743 (2018) combined. The citation must be in the same year: 2005's "S.B. 743" after "and" is
      combined although 2018 cites SB 743 alone, and so is an "and" bill cited only after "&" (not as a lead). The
      session must match too: 2004's regular-session "H.B. 20 and S.B. 30" combines SB30 although the 1st extraordinary
      session cites SB 30 alone.
    given:
      - input: ref('stg_mo_revisor__sections')
        format: sql
        rows: |
            select 'n.1' as section_id, 'n.1/1' as section_version_id, '(A.L. 2004 S.B. 968 and S.B. 969)' as history_note union all
            select 'n.2', 'n.2/1', '(A.L. 2018 H.B. 1606 and S.B. 743)' union all
            select 'n.3', 'n.3/1', '(A.L. 2018 S.B. 743)' union all
            select 'n.4', 'n.4/1', '(A.L. 2005 H.B. 1606 and S.B. 743)' union all
            select 'n.5', 'n.5/1', '(A.L. 2004 H.B. 1 & 2 and H.B. 3 and H.B. 4)' union all
            select 'n.6', 'n.6/1', '(A.L. 2004 H.B. 7 & 4)' union all
            select 'n.7', 'n.7/1', '(A.L. 2004 H.B. 3)' union all
            select 'n.8', 'n.8/1', '(A.L. 2004 H.B. 20 and S.B. 30)' union all
            select 'n.9', 'n.9/1', '(A.L. 2004 1st Ex. Sess. S.B. 30)'
      - input: ref('stg_mo_revisor__repeals')
        format: sql
        rows: |
            select '9.010' as section_id, '9.010/3' as section_version_id, 'transferred' as change_kind, '(Transferred 1959; now 442.560 )' as note
      - input: ref('stg_mo_house__sessions')
        format: sql
        rows: |
            select 2018 as session_year, '181' as session_code, '' as session_of_general_assembly
    expect:
      rows:
        - {section_id: n.1, bill: SB968, is_lead_bill: true, combined_into: }
        - {section_id: n.1, bill: SB969, is_lead_bill: false, combined_into: SB968}
        - {section_id: n.2, bill: HB1606, is_lead_bill: true, combined_into: }
        - {section_id: n.2, bill: SB743, is_lead_bill: true, combined_into: }
        - {section_id: n.3, bill: SB743, is_lead_bill: true, combined_into: }
        - {section_id: n.4, bill: HB1606, is_lead_bill: true, combined_into: }
        - {section_id: n.4, bill: SB743, is_lead_bill: false, combined_into: HB1606}
        - {section_id: n.5, bill: HB1, is_lead_bill: true, combined_into: }
        - {section_id: n.5, bill: HB2, is_lead_bill: false, combined_into: HB1}
        - {section_id: n.5, bill: HB3, is_lead_bill: true, combined_into: }
        - {section_id: n.5, bill: HB4, is_lead_bill: false, combined_into: HB3}
        - {section_id: n.6, bill: HB7, is_lead_bill: true, combined_into: }
        - {section_id: n.6, bill: HB4, is_lead_bill: false, combined_into: HB7}
        - {section_id: n.7, bill: HB3, is_lead_bill: true, combined_into: }
        - {section_id: n.8, bill: HB20, is_lead_bill: true, combined_into: }
        - {section_id: n.8, bill: SB30, is_lead_bill: false, combined_into: HB20}
        - {section_id: n.9, bill: SB30, is_lead_bill: true, combined_into: }

  - name: bills_after_a_comma_continue_the_act_before_them
    model: int_mo_revisor__session_law_bills
    description: >
      The older notes list several bills of one act after commas ("A.L. 1978 H.B. 971, S.B. 628"); the second bill
      is a piece with no "A.L. 1978" of its own, and used to be dropped (129 pieces of the 8,517 the parser skips
      are bills). It takes the year, session and change of the act before it, and each such bill is a lead bill (it
      passed on its own). A piece that is only a bill continues an act only when nothing but such pieces lies
      between: after a page cite ("A.L. 1965 p. 509, S.B. 9") or an RSMo piece it stays dropped, as do date and
      Proposition pieces ("November 4, 2008", "Proposition A"). "A.L. 1985, H.B. 366" (a stray comma after the
      year) and "merged with" as its own piece are read too, and the session and the change carry over
      ("Repealed L. 1989 1st Ex. Sess. H.B. 3, S.B. 4").
    given:
      - input: ref('stg_mo_revisor__sections')
        format: sql
        rows: |
            select 'c.1' as section_id, 'c.1/1' as section_version_id, '(L. 1947 V. I p. 432 § 2, A.L. 1969 H.B. 322, A.L. 1978 H.B. 971, S.B. 628, H.B. 1634, A.L. 1979 S.B. 236)' as history_note union all
            select 'c.2', 'c.2/1', '(RSMo 1939 § 645, S.B. 5, A.L. 1965 p. 509, S.B. 9)' union all
            select 'c.3', 'c.3/1', '(L. 2008 Adopted by Initiative, Proposition A, § 3, November 4, 2008, A.L. 2010 H.B. 5)' union all
            select 'c.4', 'c.4/1', '(A.L. 1985, H.B. 366 et al., A.L. 2005 H.B. 58, merged with S.B. 210)' union all
            select 'c.5', 'c.5/1', '(A.L. 1989 1st Ex. Sess. H.B. 3, S.B. 4, A.L. 1990 H.B. 7 & 8, S.B. 862)'
      - input: ref('stg_mo_revisor__repeals')
        format: sql
        rows: |
            select 'c.6' as section_id, 'c.6/1' as section_version_id, 'repealed' as change_kind, '(Repealed L. 1989 1st Ex. Sess. H.B. 3, S.B. 4)' as note
      - input: ref('stg_mo_house__sessions')
        format: sql
        rows: |
            select 2018 as session_year, '181' as session_code, '' as session_of_general_assembly
    expect:
      rows:
        - {section_id: c.1, bill: HB322, change: amended, session_code: '691', is_lead_bill: true}
        - {section_id: c.1, bill: HB971, change: amended, session_code: '781', is_lead_bill: true}
        - {section_id: c.1, bill: SB628, change: amended, session_code: '781', is_lead_bill: true}
        - {section_id: c.1, bill: HB1634, change: amended, session_code: '781', is_lead_bill: true}
        - {section_id: c.1, bill: SB236, change: amended, session_code: '791', is_lead_bill: true}
        - {section_id: c.3, bill: HB5, change: amended, session_code: '101', is_lead_bill: true}
        - {section_id: c.4, bill: HB366, change: amended, session_code: '851', is_lead_bill: true}
        - {section_id: c.4, bill: HB58, change: amended, session_code: '051', is_lead_bill: true}
        - {section_id: c.4, bill: SB210, change: amended, session_code: '051', is_lead_bill: true}
        - {section_id: c.5, bill: HB3, change: amended, session_code: '893', is_lead_bill: true}
        - {section_id: c.5, bill: SB4, change: amended, session_code: '893', is_lead_bill: true}
        - {section_id: c.5, bill: HB7, change: amended, session_code: '901', is_lead_bill: true}
        - {section_id: c.5, bill: HB8, change: amended, session_code: '901', is_lead_bill: false}
        - {section_id: c.5, bill: SB862, change: amended, session_code: '901', is_lead_bill: true}
        - {section_id: c.6, bill: HB3, change: repealed, session_code: '893', is_lead_bill: true}
        - {section_id: c.6, bill: SB4, change: repealed, session_code: '893', is_lead_bill: true}

  - name: extraordinary_session_without_a_number_or_spelled_out
    model: int_mo_revisor__session_law_bills
    description: >
      The Revisor also writes the ordinal out ("Repealed L. 1989 First Ex. Sess. H.B. 3" is the 1st, House 893) and
      sometimes leaves it off ("Repealed L. 1997 Extraordinary Session S.B. 1"). A year whose other notes name just
      one numbered session (1997: "2d") gives the unnumbered one that number (974); a year with none or several
      reads it as the 1st (2003 names both "1st" and "2nd", so it is ambiguous; 2011 names none). Before the fix
      these spellings parsed as no bill at all.
    given:
      - input: ref('stg_mo_revisor__sections')
        format: sql
        rows: |
            select 'e.1' as section_id, 'e.1/1' as section_version_id, '(A.L. 1997 2d Ex. Sess. H.B. 3)' as history_note union all
            select 'e.2', 'e.2/1', '(A.L. 2003 1st Ex. Sess. S.B. 2, A.L. 2003 2nd Ex. Sess. S.B. 3)'
      - input: ref('stg_mo_revisor__repeals')
        format: sql
        rows: |
            select 'e.3' as section_id, 'e.3/1' as section_version_id, 'repealed' as change_kind, '(Repealed L. 1997 Extraordinary Session SB 1)' as note union all
            select 'e.4', 'e.4/1', 'repealed', '(Repealed L. 1989 First Ex. Sess. H.B. 3)' union all
            select 'e.5', 'e.5/1', 'repealed', '(Repealed L. 2003 Extraordinary Session H.B. 7)' union all
            select 'e.6', 'e.6/1', 'repealed', '(Repealed L. 2011 Extraordinary Session H.B. 8)' union all
            select 'e.7', 'e.7/1', 'repealed', '(Repealed L. 1958 Ex. Sess. p. 29 § 1)'
      - input: ref('stg_mo_house__sessions')
        format: sql
        rows: |
            select 2003 as session_year, '033' as session_code, '1st Extraordinary Session' as session_of_general_assembly union all
            select 2003, '034', '2nd Extraordinary Session' union all
            select 2011, '113', '1st Extraordinary Session'
    expect:
      rows:
        - {section_id: e.1, bill: HB3, session_code: '974'}
        - {section_id: e.2, bill: SB2, session_code: '033'}
        - {section_id: e.2, bill: SB3, session_code: '034'}
        - {section_id: e.3, bill: SB1, session_code: '974'}
        - {section_id: e.4, bill: HB3, session_code: '893'}
        - {section_id: e.5, bill: HB7, session_code: '033'}
        - {section_id: e.6, bill: HB8, session_code: '113'}

  - name: trailing_and_act_citation_is_an_act_of_its_own
    model: int_mo_revisor__session_law_bills
    description: >
      A history note can join a later act to the bills before it with "and A.L." or "and L." ("H.B. 996 and H.B.
      1489 and A.L. 2004 S.B. 1233 et al."). The trailing act is its own act: SB 1233 is a bill of the section, not
      lost and not combined into the bills before it; the "and" inside the first act still joins its bills.
    given:
      - input: ref('stg_mo_revisor__sections')
        format: sql
        rows: |
            select 't.1' as section_id, 't.1/1' as section_version_id, '(A.L. 2004 H.B. 996 and H.B. 1489 and A.L. 2004 S.B. 1233 et al.)' as history_note union all
            select 't.2', 't.2/1', '(L. 1990 H.B. 5 and L. 1991 S.B. 7, A.L. 1995 H.B. 9)'
      - input: ref('stg_mo_revisor__repeals')
        format: sql
        rows: |
            select '9.010' as section_id, '9.010/3' as section_version_id, 'transferred' as change_kind, '(Transferred 1959; now 442.560 )' as note
      - input: ref('stg_mo_house__sessions')
        format: sql
        rows: |
            select 2018 as session_year, '181' as session_code, '' as session_of_general_assembly
    expect:
      rows:
        - {section_id: t.1, bill: HB996, act_year: 2004, is_lead_bill: true, combined_into: }
        - {section_id: t.1, bill: HB1489, act_year: 2004, is_lead_bill: false, combined_into: HB996}
        - {section_id: t.1, bill: SB1233, act_year: 2004, is_lead_bill: true, combined_into: }
        - {section_id: t.2, bill: HB5, act_year: 1990, is_lead_bill: true, combined_into: }
        - {section_id: t.2, bill: SB7, act_year: 1991, is_lead_bill: true, combined_into: }
        - {section_id: t.2, bill: HB9, act_year: 1995, is_lead_bill: true, combined_into: }

  - name: repealing_acts_joined_with_and_stay_repealed
    model: int_mo_revisor__session_law_bills
    description: >
      In a repeal note "Repealed" covers the whole list, so a bare "L." joined with "and" to a repealed act is one more
      repealing act: 478.170's "Repealed L. 2013 H.B. 374 & 434 and L. 2016 S.B. 585" is repealed by SB 585, not
      enacted by it. "A.L." names an amending act, so "Repealed L. ... and A.L. ..." (192.737, 8.710) is amended; a
      bare "L." after an amending or enacting act is enacted ("L. 1990 H.B. 5 and L. 1991 S.B. 7").
    given:
      - input: ref('stg_mo_revisor__sections')
        format: sql
        rows: |
            select 't.1' as section_id, 't.1/1' as section_version_id, '(L. 1990 H.B. 5 and L. 1991 S.B. 7)' as history_note union all
