          - {registry_id: s2, naics_code: '111998', naics_description: Crop farming, is_primary: true, is_secondary: false}
          - {registry_id: s2, naics_code: '561990', naics_description: Other support, is_primary: true, is_secondary: false}
          - {registry_id: s3, naics_code: '111998', naics_description: Crop farming, is_primary: true, is_secondary: false}
          - {registry_id: s3, naics_code: '561990', naics_description: Other support, is_primary: true, is_secondary: false}
          - {registry_id: s4, naics_code: '111998', naics_description: Crop farming, is_primary: true, is_secondary: false}
          - {registry_id: s4, naics_code: '561990', naics_description: Other support, is_primary: true, is_secondary: false}
      - input: ref('stg_epa_frs__sic')
        rows:
          - {registry_id: s1, sic_code: '4953', sic_description: REFUSE SYSTEMS, is_primary: true, is_secondary: false}
          - {registry_id: s1, sic_code: '5015', sic_description: MOTOR VEHICLE PARTS USED, is_primary: true, is_secondary: false}
          - {registry_id: s2, sic_code: '4953', sic_description: REFUSE SYSTEMS, is_primary: true, is_secondary: false}
          - {registry_id: s3, program_system: RCRAINFO, sic_code: '4953', sic_description: REFUSE SYSTEMS, is_primary: true, is_secondary: false}
          - {registry_id: s3, program_system: NPDES, sic_code: '4953', sic_description: REFUSE SYSTEMS, is_primary: true, is_secondary: false}
          - {registry_id: s3, sic_code: '5015', sic_description: MOTOR VEHICLE PARTS USED, is_primary: true, is_secondary: false}
          - {registry_id: s4, sic_code: '4953', sic_description: REFUSE SYSTEMS, is_primary: true, is_secondary: false}
          - {registry_id: s4, sic_code: '5015', sic_description: MOTOR VEHICLE PARTS USED, is_primary: false, is_secondary: true}
      - input: ref('sic_naics_sectors')
        rows:
          - {sic_prefix: '4953', naics_prefix: '56'}
          - {sic_prefix: '5015', naics_prefix: '42'}
      - input: ref('naics_sectors')
        rows:
          - {naics_prefix: '11', sector_code: '11', sector_name: Agriculture}
