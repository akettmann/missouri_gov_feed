        - {official_id: l_ann, role: attorney, cluster_id: a4, matched_by: attorneys text}
        - {official_id: l_cher, role: attorney, cluster_id: a9, matched_by: attorneys text}
        - {official_id: l_cher, role: attorney, cluster_id: a10, matched_by: attorneys text}
        - {official_id: l_buren, role: attorney, cluster_id: a12, matched_by: attorneys text}

  - name: bulk_case_matches_date_state_appellate_judges_without_a_courtlistener_person
    model: int_courtlistener__bulk_case_matches
    description: >
      A state appellate or Supreme Court judge with no CourtListener person and no dated position (#847) starts on
      the first payroll year under the title of their own court (the Court of Appeals judge's earlier CIRCUIT JUDGE
      pay, and the Supreme Court judge's APPELLATE JUDGE pay, don't count), else on their Official Manual retention
      year. Cases before that date (a predecessor of the same surname) and in another court don't match.
      j_dowd: paid APPELLATE JUDGE from 2017 and CIRCUIT JUDGE in 2010, so c1 (2018) matches, c2 (2012), c3
      (2016) and c4 (a Supreme Court case) don't. j_gooch: APPELLATE JUDGE pay in 2022, SUPREME COURT JUDGE
      pay in 2024, so c5 (2023) doesn't and c6 (2024) does. j_powell: payroll prints WESLEY BRENT, which fct_salaries
      doesn't pair, but he is the only Powell on his court and the initial W agrees, so 2017 (the 2015 ZACHARY row has
      another initial, so c15 from 2016 doesn't match), so both c7 (2019) and c8 (2017-06) match. j_gabbert: the same for ANTHONY REX from 2018 (his
      2016 CIRCUIT JUDGE pay doesn't count), so c10 (2019) matches, c11 (2017) doesn't. j_wright_a and j_wright_b share
      a surname on one court, so neither is dated from the payroll and c12 doesn't match either. j_retained: no payroll,
      retained in 2018, so c13 (2019) does and c14 (2017) doesn't. j_none: no date of any kind, so c9 doesn't match.
    overrides:
      vars:
        cl_case_bulk: true
        case_history_min_year: 1975
    given:
      - input: ref('fct_legal_careers')
        rows:
          - {official_id: j_dowd, legal_role: judge}
          - {official_id: j_gooch, legal_role: judge}
          - {official_id: j_powell, legal_role: judge}
          - {official_id: j_none, legal_role: judge}
          - {official_id: j_gabbert, legal_role: judge}
          - {official_id: j_wright_a, legal_role: judge}
          - {official_id: j_wright_b, legal_role: judge}
          - {official_id: j_retained, legal_role: judge}
      - input: ref('dim_official')
        rows:
          - {official_id: j_dowd, given_name: James, family_name: Dowd, office: mo_court_of_appeals, current_term_start: null}
          - {official_id: j_gooch, given_name: Ginger, family_name: Gooch, office: mo_supreme_court, current_term_start: null}
          - {official_id: j_powell, given_name: W. Brent, family_name: Powell, office: mo_supreme_court, current_term_start: null}
