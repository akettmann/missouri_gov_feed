          - {registry_id: m1, naics_code: '332812', naics_description: Metal coating, is_primary: true, is_secondary: false}
          - {registry_id: m2, naics_code: '238910', naics_description: Site preparation, is_primary: true, is_secondary: false}
          - {registry_id: m2, naics_code: '311111', naics_description: Dog and cat food, is_primary: true, is_secondary: false}
      - input: ref('stg_epa_frs__sic')
        rows:
          - {registry_id: m1, sic_code: '2011', sic_description: MEAT PACKING, is_primary: true, is_secondary: false}
