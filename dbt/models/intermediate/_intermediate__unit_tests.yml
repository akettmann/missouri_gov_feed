      - input: ref('stg_epa_frs__facilities')
        rows:
          - {registry_id: c1, facility_name: SIC 1629, latitude: 38.5, longitude: -92.1}
          - {registry_id: c2, facility_name: SIC 1623, latitude: 38.5, longitude: -92.1}
      - input: ref('stg_epa_frs__organizations')
        rows: []
      - input: ref('stg_epa_frs__naics')
        rows:
          - {registry_id: c1, naics_code: '111998', naics_description: Crop farming, is_primary: true, is_secondary: false}
          - {registry_id: c1, naics_code: '236220', naics_description: Commercial building construction, is_primary: true, is_secondary: false}
          - {registry_id: c2, naics_code: '111998', naics_description: Crop farming, is_primary: true, is_secondary: false}
          - {registry_id: c2, naics_code: '236220', naics_description: Commercial building construction, is_primary: true, is_secondary: false}
