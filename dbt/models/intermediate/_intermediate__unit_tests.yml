  - name: epa_frs_facility_industry_counts_program_systems_not_rows
    model: int_epa_frs__facilities
    description: >
      A code's weight is the number of distinct program systems that give it, not the number of records (#274).
      d1: 111998 is given by three NPDES records (one system), 424510 by RCRAINFO and AIR (two systems), so
      424510 wins; counting rows would pick 111998. d2: the same for SIC codes with no NAICS code at all, SIC
      5015 (two systems, sector 42) beats SIC 4953 (three NPDES records, sector 56); d3: records with no program
      system count as one system, so 111998 (one record) ties 424510 (two records, both without a system) and the
      lowest code wins; d4: tier comes before count, so the primary code (one system) beats an UNKNOWN one that
      two systems give.
    given:
      - input: ref('stg_epa_frs__facilities')
        rows:
          - {registry_id: d1, facility_name: Duplicate NPDES rows, latitude: 38.5, longitude: -92.1}
          - {registry_id: d2, facility_name: Duplicate SIC rows, latitude: 38.5, longitude: -92.1}
          - {registry_id: d3, facility_name: No program system, latitude: 38.5, longitude: -92.1}
          - {registry_id: d4, facility_name: Tier beats count, latitude: 38.5, longitude: -92.1}
      - input: ref('stg_epa_frs__organizations')
        rows: []
      - input: ref('stg_epa_frs__naics')
        rows:
          - {registry_id: d1, program_system: NPDES, naics_code: '111998', naics_description: Crop farming, is_primary: true, is_secondary: false}
          - {registry_id: d1, program_system: NPDES, naics_code: '111998', naics_description: Crop farming, is_primary: true, is_secondary: false}
          - {registry_id: d1, program_system: NPDES, naics_code: '111998', naics_description: Crop farming, is_primary: true, is_secondary: false}
          - {registry_id: d1, program_system: RCRAINFO, naics_code: '424510', naics_description: Grain wholesale, is_primary: true, is_secondary: false}
          - {registry_id: d1, program_system: AIR, naics_code: '424510', naics_description: Grain wholesale, is_primary: true, is_secondary: false}
          - {registry_id: d3, naics_code: '111998', naics_description: Crop farming, is_primary: true, is_secondary: false}
          - {registry_id: d3, naics_code: '424510', naics_description: Grain wholesale, is_primary: true, is_secondary: false}
          - {registry_id: d3, naics_code: '424510', naics_description: Grain wholesale, is_primary: true, is_secondary: false}
          - {registry_id: d4, program_system: NPDES, naics_code: '111998', naics_description: Crop farming, is_primary: true, is_secondary: false}
          - {registry_id: d4, program_system: RCRAINFO, naics_code: '424510', naics_description: Grain wholesale, is_primary: false, is_secondary: false}
          - {registry_id: d4, program_system: AIR, naics_code: '424510', naics_description: Grain wholesale, is_primary: false, is_secondary: false}
      - input: ref('stg_epa_frs__sic')
        rows:
          - {registry_id: d2, program_system: NPDES, sic_code: '4953', sic_description: REFUSE SYSTEMS, is_primary: true, is_secondary: false}
          - {registry_id: d2, program_system: NPDES, sic_code: '4953', sic_description: REFUSE SYSTEMS, is_primary: true, is_secondary: false}
          - {registry_id: d2, program_system: NPDES, sic_code: '4953', sic_description: REFUSE SYSTEMS, is_primary: true, is_secondary: false}
          - {registry_id: d2, program_system: RCRAINFO, sic_code: '5015', sic_description: MOTOR VEHICLE PARTS USED, is_primary: true, is_secondary: false}
          - {registry_id: d2, program_system: AIR, sic_code: '5015', sic_description: MOTOR VEHICLE PARTS USED, is_primary: true, is_secondary: false}
      - input: ref('sic_naics_sectors')
        rows:
          - {sic_prefix: '4953', naics_prefix: '56'}
          - {sic_prefix: '5015', naics_prefix: '42'}
      - input: ref('naics_sectors')
        rows:
          - {naics_prefix: '11', sector_code: '11', sector_name: Agriculture}
          - {naics_prefix: '42', sector_code: '42', sector_name: Wholesale Trade}
          - {naics_prefix: '56', sector_code: '56', sector_name: Administrative and Waste Services}
    expect:
      rows:
        - {registry_id: d1, naics_code: '424510', naics_source: naics}
        - {registry_id: d2, naics_code: '42', naics_source: sic}
        - {registry_id: d3, naics_code: '111998', naics_source: naics}
        - {registry_id: d4, naics_code: '111998', naics_source: naics}

  - name: epa_frs_facility_naics_tie_sic_sector_merges_31_33
    model: int_epa_frs__facilities
    description: >
      NAICS 31, 32 and 33 are one sector (Manufacturing), so a SIC 2xxx facility (sic prefix 20 maps to 31) agrees
      with a tied 33xxxx code. m1: tied 238910 (construction) and 332812 (33) go to 332812, not the lower 238910;
      m2: tied 238910 and 311111 (31) go to 311111. A plain two-digit compare would pick 238910 for m1.
    given:
      - input: ref('stg_epa_frs__facilities')
        rows:
          - {registry_id: m1, facility_name: Sector 31 vs 33, latitude: 38.5, longitude: -92.1}
