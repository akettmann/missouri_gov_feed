  - name: bulk_case_matches_skip_namesakes_paid_on_the_same_court
    model: int_courtlistener__bulk_case_matches
    description: >
      A namesake on the payroll who is not an official (Robert G. Dowd, Jr., APPELLATE JUDGE 2017-2021 beside
      James M. Dowd) makes a bare "Dowd" ambiguous while he was paid, so j_dowd starts in 2022, the year after
      (d1 in 2018 and d2 in 2021, "Dowd, Hess, Hoff" and "Dowd, J.", don't match; d3 in 2022 does). A text that
      prints the surname right after another first name or a middle initial that isn't the judge's is the namesake
      even after that: d4 "Robert G. Dowd, Jr., J." and d6 "Robert Dowd" don't match, d5 "James M. Dowd, J." and d7
      "J. Dowd" and d8 "Dowd, Hess, Hoff" do. A CIRCUIT JUDGE named Dowd (2030) is not on the judge's court and
      doesn't push the start. j_hall, with no namesake, keeps his payroll start in 2017 (d9). j_page's own first name
      before a middle initial she doesn't have in her given name ("Lisa P. Page", d10) is still her, and a trailing letter of the word before a comma ("División, Hall", read as "divisi n") is no first initial (d11).
