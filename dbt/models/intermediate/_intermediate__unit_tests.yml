  - name: epa_frs_facility_industry_prefers_naics_over_sic_sector
    model: int_epa_frs__facilities
    description: >
      A facility's industry is its primary NAICS code when it has one, else an UNKNOWN-type NAICS code, else a
      SECONDARY one (f7 and f10-f12: a real NAICS code beats the SIC-derived sector even when it is not primary;
      f9: a primary code beats an UNKNOWN one that more program systems give; f10: UNKNOWN beats SECONDARY; f13: a NULL
      code never counts). Only with no NAICS code at all are its SIC codes mapped to a NAICS sector through the sic_naics_sectors seed: a primary SIC code before an unknown one before a secondary
      one, and the longest matching prefix wins (4953 refuse systems matches its own row -> sector 56, but 4952 sewerage
      systems has no longer row and stays under 49 -> utilities; 4922 natural gas transmission, 6798 REITs and 7384
      photofinishing likewise override their groups 49 -> utilities, 67 -> finance and 73 -> administrative services
      with sectors 48, 53 and 81). A facility with no codes, or only a SIC code the seed does not cover, keeps a null industry.
