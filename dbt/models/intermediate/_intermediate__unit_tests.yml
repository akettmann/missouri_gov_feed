  - name: epa_frs_facility_naics_tie_ignores_sic_1629
    model: int_epa_frs__facilities
    description: >
      SIC 1629 is mostly construction stormwater-permit noise, so it gives no signal. c1: SIC 1629 (sector 23)
      with tied 111998 and 236220 (a real construction code, not demoted) goes to the lowest, 111998, not
      the code in the SIC sector; c2: the same facility with SIC 1623 (23) still pulls 236220.
