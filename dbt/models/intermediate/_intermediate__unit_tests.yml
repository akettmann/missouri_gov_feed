      1542, 1611) that only NPDES gives is the stormwater permit and says nothing about the sector; one another
      program gives is a real industry. r1: AIR gives 238910 and SIC 1795 (demolition), RCRAINFO gives 56291, so
      the SIC sector picks 238910 even though 238910 is the permit code. r2: only NPDES gives SIC 1541, so there is
      no sector signal, 238910 loses to a real code and 311111 wins. r3: AIR also gives SIC 1541, so the signal
      holds and 236220 wins over the lower code 111110.
