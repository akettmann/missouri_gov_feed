  - name: epa_frs_facility_naics_tie_ignores_sic_tied_across_sectors
    model: int_epa_frs__facilities
    description: >
      When the facility's chosen SIC code is itself tied (same tier and program-system count) with a SIC code in another
      sector, the lowest-code tie-break chose it and its sector is no signal. s1: SIC 4953 (sector 56) ties
      SIC 5015 (42), so the tied NAICS codes 111998 and 561990 go to the lowest, 111998, not the 56 code;
      s2: SIC 4953 alone (no tie) still pulls 561990;
      s3: SIC 4953 from two program systems beats SIC 5015 (42) on one, so it is not tied (same tier, more programs)
      and still pulls 561990; s4: SIC 4953 primary beats SIC 5015 (42) secondary, same program-system count (better tier),
      so it still pulls 561990. s3 and s4 pin the partition to registry, tier and program-system count.
    given:
      - input: ref('stg_epa_frs__facilities')
        rows:
          - {registry_id: s1, facility_name: SIC tied across sectors, latitude: 38.5, longitude: -92.1}
          - {registry_id: s2, facility_name: SIC not tied, latitude: 38.5, longitude: -92.1}
          - {registry_id: s3, facility_name: SIC wins on program count, latitude: 38.5, longitude: -92.1}
          - {registry_id: s4, facility_name: SIC wins on tier, latitude: 38.5, longitude: -92.1}
