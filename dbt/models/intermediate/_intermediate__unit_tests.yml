        - {registry_id: o1, owner_name: Lindenwood, owner_type: FEDERAL}
        - {registry_id: o2, owner_name: Lindenwood, owner_type: FEDERAL}
        - {registry_id: o3, owner_name: Boone Utility, owner_type: COUNTY}
        - {registry_id: o4, owner_name: Boone Utility, owner_type: COUNTY}
        - {registry_id: o5, owner_name: Three Rivers, owner_type: FEDERAL}
        - {registry_id: o6, owner_name: Alpha, owner_type: STATE}
        - {registry_id: o7, owner_name: Same Name, owner_type: STATE}
