  - name: epa_frs_facility_naics_238910_loses_to_all_tier_count
    model: int_epa_frs__facilities
    description: >
      Modeled on B N S F RAILYARD (#432). 238910 (the construction stormwater permit) is given by NPDES in the
      primary tier and mirrored by an MO-DNR UNKNOWN row, so it has two systems over all tiers against 482111's one
      (RCRAINFO, primary). Tier and primary-tier count tie at one system each; the all-tier count would pick
      238910, but the 238910 demotion comes before it, so 482111 wins. SIC 1629 gives no sector signal.
    given:
      - input: ref('stg_epa_frs__facilities')
        rows:
          - {registry_id: r1, facility_name: Railyard, latitude: 38.5, longitude: -92.1}
      - input: ref('stg_epa_frs__organizations')
        rows: []
      - input: ref('stg_epa_frs__naics')
        rows:
          - {registry_id: r1, program_system: NPDES, naics_code: '238910', naics_description: Site preparation, is_primary: true, is_secondary: false}
          - {registry_id: r1, program_system: NPDES, naics_code: '238910', naics_description: Site preparation, is_primary: true, is_secondary: false}
          - {registry_id: r1, program_system: RCRAINFO, naics_code: '482111', naics_description: Line-haul railroads, is_primary: true, is_secondary: false}
          - {registry_id: r1, program_system: MO-DNR, naics_code: '238910', naics_description: Site preparation, is_primary: false, is_secondary: false}
      - input: ref('stg_epa_frs__sic')
        rows:
          - {registry_id: r1, program_system: NPDES, sic_code: '1629', sic_description: HEAVY CONSTRUCTION NEC, is_primary: true, is_secondary: false}
      - input: ref('sic_naics_sectors')
        rows:
          - {sic_prefix: '16', naics_prefix: '23'}
      - input: ref('naics_sectors')
        rows:
          - {naics_prefix: '23', sector_code: '23', sector_name: Construction}
          - {naics_prefix: '48', sector_code: '48-49', sector_name: Transportation and Warehousing}
    expect:
      rows:
        - {registry_id: r1, naics_code: '482111', naics_source: naics}

  - name: epa_frs_facility_naics_mirror_rows_do_not_outvote_sic_sector
    model: int_epa_frs__facilities
    description: >
      Modeled on Clark Printing (#513). r1: AIR gives 323111 and RCRAINFO gives 81232, which extends the 812320 an
      MO-DNR UNKNOWN row lists, so over all tiers 812320 has two systems against 323111's one. The MO-DNR row only
      copies what another system reports, so it must not outvote the SIC sector: the SIC code (AIR, 2752 printing)
      sits in manufacturing and 323111 wins. r2 (Dairy Farmers): the SIC sector does not separate the codes (both
      manufacturing), so the RMP copy still backs 312111 over 311422 as the last all-tier tie-break.
    given:
      - input: ref('stg_epa_frs__facilities')
        rows:
          - {registry_id: r1, facility_name: Site r1, latitude: 38.5, longitude: -92.1}
          - {registry_id: r2, facility_name: Site r2, latitude: 38.5, longitude: -92.1}
      - input: ref('stg_epa_frs__organizations')
        rows: []
      - input: ref('stg_epa_frs__naics')
        rows:
          - {registry_id: r1, program_system: AIR, naics_code: '323111', naics_description: d, is_primary: true, is_secondary: false}
          - {registry_id: r1, program_system: RCRAINFO, naics_code: '81232', naics_description: d, is_primary: true, is_secondary: false}
          - {registry_id: r1, program_system: MO-DNR, naics_code: '812320', naics_description: d, is_primary: false, is_secondary: false}
          - {registry_id: r2, program_system: AIR, naics_code: '311422', naics_description: d, is_primary: true, is_secondary: false}
          - {registry_id: r2, program_system: RCRAINFO, naics_code: '312111', naics_description: d, is_primary: true, is_secondary: false}
          - {registry_id: r2, program_system: RMP, naics_code: '312111', naics_description: d, is_primary: false, is_secondary: false}
      - input: ref('stg_epa_frs__sic')
        rows:
          - {registry_id: r1, program_system: AIR, sic_code: '2752', sic_description: d, is_primary: true, is_secondary: false}
          - {registry_id: r2, program_system: AIR, sic_code: '2032', sic_description: d, is_primary: true, is_secondary: false}
      - input: ref('sic_naics_sectors')
        rows:
          - {sic_prefix: '27', naics_prefix: '32'}
          - {sic_prefix: '20', naics_prefix: '31'}
      - input: ref('naics_sectors')
        rows:
          - {naics_prefix: '31', sector_code: '31-33', sector_name: Manufacturing}
          - {naics_prefix: '32', sector_code: '31-33', sector_name: Manufacturing}
          - {naics_prefix: '81', sector_code: '81', sector_name: Other Services}
    expect:
      rows:
        - {registry_id: r1, naics_code: '323111', naics_source: naics}
        - {registry_id: r2, naics_code: '312111', naics_source: naics}

