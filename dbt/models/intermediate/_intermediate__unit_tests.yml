          - {naics_prefix: '32', sector_code: '31-33', sector_name: Manufacturing}
          - {naics_prefix: '33', sector_code: '31-33', sector_name: Manufacturing}
          - {naics_prefix: '42', sector_code: '42', sector_name: Wholesale Trade}
