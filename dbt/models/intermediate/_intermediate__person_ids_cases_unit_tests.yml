# Named-person cases for the person-id layer (#649, #657): one fixed-input row group per real person from the
# identity issues, grouped into tests by the rule that decides them. The shape-only tests in
# _intermediate__person_ids_unit_tests.yml cover the same rules with invented people; these tests name the real ones,
# so a rule change that breaks a known case fails a test that says who it is.
# Rows are copied from int_officials__identity_terms (or its inputs) as the pipeline built them: real Open States ids,
# House member ids, seats and Open States dates. A row with a house_member_id and no dates is a House roster row; a row
# with dates (or only an end: an undated start, #512) is an Open States seat-term row. Where a hazard needs a name
# variant that does not exist in the data, the row keeps the real id, seat and dates and takes an invented name; the
# test description says so.
# The Dolan and Jacobs 2025 duplicate stubs (#292, #294) are #661's cases and live with its rule change.
version: 2

unit_tests:
  # --- int_officials__person_ids -------------------------------------------------------------------------------------

  - name: person_ids_cases_join_redistricted_seat_changes
    model: int_officials__person_ids
    description: >
      #97: the 2022 redistricting renumbered these members' House seats and Open States gave each a second record
      for the new seat. Same exact name, different seats, no shared year (the old record ends 2023-01-03, in 2022;
      the new one starts 2023-01-04), so rule 2 joins each pair and the id that serves latest is kept: Bennie Cook
      HD142 -> HD143, Josh Hurlbert HD12 -> HD8, David Tyson Smith HD45 -> HD46 (name_key "david smith"), Bill
      Hardwick HD122 -> HD121, Mark Matthiesen HD70 (2017-18) -> HD107 (2023+). Each pair also shares a House member
      id, so rule 2c would join them too, but the name rule decides first and the basis stays name_continuity. Peggy
      McGaugh (HD39 to 2022, HD7 from 2023) has one Open States id across both seats today: it must stay one person,
      not split by the seat change.
