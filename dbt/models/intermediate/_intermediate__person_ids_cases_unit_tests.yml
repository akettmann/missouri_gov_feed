  - name: person_ids_cases_join_house_fallback_keys_to_the_senate_record
    model: int_officials__person_ids
    description: >
      #97 / #136: the House roster keyed Mike Cierpiot (HD30, 2017-18) as mohouse:476 and Sandy Crawford (HD129,
      2017) as mohouse:478; both later have an Open States Senate record. Open States dates both Senate terms early
      (Cierpiot SD8 from 2018-01-03, Crawford SD28 from 2017-09-13), so each holds a House seat and a Senate seat in
      one shared year. One shared year is a hand-over, not a seat conflict, so rule 2 joins the fallback key to the
      Open States id. Requiring no shared year at all (seat_conflicts on one year) splits both.
    given:
      - input: ref('int_officials__identity_terms')
        rows:
          # Mike Cierpiot: mohouse:476 HD30 2017-18, Open States SD8 from 2018-01-03
          - {alias_id: 'mohouse:476', year: 2017, office: state_house, district: '30', house_member_id: '476', name_key: mike cierpiot}
