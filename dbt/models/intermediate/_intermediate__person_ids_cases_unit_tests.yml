    model: int_officials__person_ids
    description: >
      #519, documented behaviour (int_officials__identity_terms header): an undated id has one evidence year, so rule
      2 cannot see a seat conflict with a same-name id (that needs two shared years), and rule 2b reads a chamber
      move from its single year. Real undated ids with HYPOTHETICAL dated neighbours (no such records exist today):
      Paul Wieland (b742d6cb, SD22, last year 2022) beside a dated "Paul Wieland" House id in HD99 2021-22 joins by
      name although both seats are held in 2022; Dan Brown (2713f041, SD16, last year 2018) beside a dated "Daniel
      Brown" House id in HD50 2016-17 joins as a chamber move. Both joins are the known weakness: the data test
      assert_undated_open_states_ids_share_no_name fails on either shape in real data, to be settled by hand. If a
      rule change gives undated ids more evidence, this test should change with it.
