# Unit tests for #740: org-word list, the 3-letter prefix minimum and the abbreviation map in the 24-hour-notice dedupe.
version: 2

unit_tests:
  - name: tap_contributions_notice_dedupe_abbreviations_and_org_words
    model: int_tap_mec__contributions
    description: >
      Two abbreviations of one word pair through the map org_word_abbreviation (Ass / Assoc / Assn / Association, Ed / Edu / Educ, Int / Intl, Com / Comm,
      Telecom / Telecomm, Govt / Government) and the organisation words added to is_org_word_prefix pair with their truncations (womens, offices, missouri,
      fighters, masons, funds, casinos, nurses). Dropped: every notice of the n0..n17 pairs. Kept: Missouri St Council / Missouri State Council (a 2-letter
      prefix never pairs, whichever word it starts), Com / Dist and Assoc / Educ (abbreviations of different words).
