      - input: ref('stg_tap_mec__contributions')
        rows:
          - {record_id: n0, mec_committee_id: R0, contributor_name: Workers Int Ass, amount: 5000, contribution_date: 2020-07-28, report: '24 Hour Expenditure Report-8/4/2020 Primary', contributor_city: Jefferson City, contributor_state: MO}
