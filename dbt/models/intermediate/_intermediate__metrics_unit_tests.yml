# Unit tests for the committee-post and judge time-to-disposition metrics (fixed rows -> exact expected rows).
version: 2

unit_tests:
  - name: committee_memberships_use_member_pages_and_fill_sessions_without_them_from_the_list
    model: int_mo_house__committee_memberships
    description: >
      A session with member-page rows takes only those (the COMMITTEELIST rows for it are ignored, so no member
      is counted twice). A session with none (253) is filled from COMMITTEELIST by district, House members only
      (chamber H): Senate members drop out.
    given:
      - input: ref('int_mo_house__member_identity')
        rows:
          - {session_code: '251', house_member_id: '9001', district_number: 1, person_key: p_one}
          - {session_code: '253', house_member_id: '9001', district_number: 1, person_key: p_one}
          - {session_code: '253', house_member_id: '9002', district_number: 2, person_key: p_two}
      - input: ref('stg_mo_house__member_committees')
        rows:
          - {session_code: '251', house_member_id: '9001', committee_name: Budget, position_name: Chair, source_url: https://documents.house.mo.gov/xml/251.zip}
          - {session_code: '251', house_member_id: '9001', committee_name: Subcommittee on Roads, position_name: Member, source_url: https://documents.house.mo.gov/xml/251.zip}
      - input: ref('stg_mo_house__committee_list_members')
        rows:
          - {session_code: '251', committee_name: Budget, district_number: 1, position_name: Member, chamber: H, source_url: https://x/list251}
          - {session_code: '253', committee_name: Budget, district_number: 1, position_name: Chair, chamber: H, source_url: https://x/list253}
          - {session_code: '253', committee_name: Budget, district_number: 2, position_name: Member, chamber: H, source_url: https://x/list253}
          - {session_code: '253', committee_name: Budget, district_number: 2, position_name: Member, chamber: S, source_url: https://x/list253}
    expect:
      rows:
        - {session_code: '251', person_key: p_one, committee_name: Budget, position_name: Chair, source: member_page, source_url: https://documents.house.mo.gov/xml/251.zip, is_subcommittee: false}
        - {session_code: '251', person_key: p_one, committee_name: Subcommittee on Roads, position_name: Member, source: member_page, source_url: https://documents.house.mo.gov/xml/251.zip, is_subcommittee: true}
        - {session_code: '253', person_key: p_one, committee_name: Budget, position_name: Chair, source: committee_list, source_url: https://x/list253, is_subcommittee: false}
        - {session_code: '253', person_key: p_two, committee_name: Budget, position_name: Member, source: committee_list, source_url: https://x/list253, is_subcommittee: false}

  - name: district_dockets_case_type_from_docket_number
    model: int_courtlistener__district_dockets
    description: >
      The type CourtListener parsed wins when present (d1 is civil by its cv type though its number says cr, as
      1:00-cr-00008 really does; d4 has an empty type and falls back to its number); otherwise the number's type
      token decides, case-insensitively. cv and md are civil, cr is criminal, mc/mj/sw/wi/sm/pr are miscellaneous,
      and fp and an untyped number (a date in place of a docket number) are other. A docket in another court or
      with no judge is not in the model.
    overrides:
      vars:
        cl_case_bulk: true
    given:
      - input: ref('stg_courtlistener__mo_dockets')
        rows:
          - {docket_id: d1, court_id: moed, docket_number: '1:00-cr-00008', federal_dn_case_type: cv, assigned_to_person_id: '1', date_filed: '2000-01-01', date_terminated: '2000-02-01'}
          - {docket_id: d2, court_id: mowd, docket_number: '4:21-md-02993', federal_dn_case_type: md, assigned_to_person_id: '1', date_filed: '2021-01-01', date_terminated: '2021-01-11'}
          - {docket_id: d3, court_id: moed, docket_number: '4:25-cv-00236', federal_dn_case_type: null, assigned_to_person_id: '1', date_filed: '2025-01-01', date_terminated: null}
          - {docket_id: d4, court_id: moed, docket_number: '4:25-CR-00236-ABC', federal_dn_case_type: '', assigned_to_person_id: '1', date_filed: '2025-01-01', date_terminated: '2025-01-02'}
          - {docket_id: d5, court_id: moed, docket_number: '4:25-mj-07168', federal_dn_case_type: mj, assigned_to_person_id: '1', date_filed: '2025-01-01', date_terminated: '2025-01-02'}
          - {docket_id: d6, court_id: moed, docket_number: '4:24-wi-00035', federal_dn_case_type: null, assigned_to_person_id: '1', date_filed: '2025-01-01', date_terminated: '2025-01-02'}
          - {docket_id: d7, court_id: moed, docket_number: '4:03-fp-04010', federal_dn_case_type: null, assigned_to_person_id: '1', date_filed: '2003-01-01', date_terminated: '2003-01-02'}
          - {docket_id: d8, court_id: mowd, docket_number: '01-Jan-1970', federal_dn_case_type: null, assigned_to_person_id: '1', date_filed: '1991-01-01', date_terminated: '1992-01-01'}
          - {docket_id: d9, court_id: moed, docket_number: '4:25-mc-00001', federal_dn_case_type: '', assigned_to_person_id: '1', date_filed: '2025-01-01', date_terminated: '2025-01-02'}
          - {docket_id: d10, court_id: mo, docket_number: '4:25-cv-00001', federal_dn_case_type: null, assigned_to_person_id: '1', date_filed: '2025-01-01', date_terminated: '2025-01-02'}
          - {docket_id: d11, court_id: moed, docket_number: '4:25-cv-00002', federal_dn_case_type: null, assigned_to_person_id: null, date_filed: '2025-01-01', date_terminated: '2025-01-02'}
    expect:
      rows:
        - {docket_id: d1, docket_type: cv, case_type: civil}
        - {docket_id: d2, docket_type: md, case_type: civil}
        - {docket_id: d3, docket_type: cv, case_type: civil}
        - {docket_id: d4, docket_type: cr, case_type: criminal}
        - {docket_id: d5, docket_type: mj, case_type: miscellaneous}
        - {docket_id: d6, docket_type: wi, case_type: miscellaneous}
        - {docket_id: d7, docket_type: fp, case_type: other}
        - {docket_id: d8, docket_type: jan, case_type: other}
        - {docket_id: d9, docket_type: mc, case_type: miscellaneous}
