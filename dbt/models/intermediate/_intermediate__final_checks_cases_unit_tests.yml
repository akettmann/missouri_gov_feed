          - {calendar_year: 2025, agency_name: LEGISLATURE, position_title: STATE REPRESENTATIVE, employee_name: 'NURRENBERN, MARGARET', last_name: NURRENBERN, first_names: MARGARET, gross_pay: 1636.00}
