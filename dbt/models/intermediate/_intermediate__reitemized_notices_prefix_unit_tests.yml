          - {record_id: fe1, mec_committee_id: P90, contributor_name: C D, amount: 5000, contribution_date: 2020-07-28, report: April Quarterly Report, contributor_city: Jefferson City, contributor_state: MO}
          - {record_id: ne2, mec_committee_id: P91, contributor_name: A B, amount: 5000, contribution_date: 2020-07-28, report: '24 Hour Expenditure Report-8/4/2020 Primary', contributor_city: Jefferson City, contributor_state: MO}
          - {record_id: fe2a, mec_committee_id: P91, contributor_name: C D, amount: 5000, contribution_date: 2020-07-28, report: April Quarterly Report, contributor_city: Jefferson City, contributor_state: MO}
          - {record_id: fe2b, mec_committee_id: P91, contributor_name: The Co, amount: 5000, contribution_date: 2020-07-28, report: April Quarterly Report, contributor_city: Jefferson City, contributor_state: MO}
    expect:
      rows:
        - {record_id: na}
        - {record_id: fa}
        - {record_id: nb}
        - {record_id: fb}
        - {record_id: nc}
        - {record_id: fc}
        - {record_id: nd}
        - {record_id: fd}
        - {record_id: ne}
        - {record_id: fe}
        - {record_id: nf}
        - {record_id: ff}
        - {record_id: fg}
        - {record_id: fh}
        - {record_id: fi}
        - {record_id: fj}
        - {record_id: fk}
        - {record_id: nl}
        - {record_id: fl}
        - {record_id: ne1}
        - {record_id: fe1}
        - {record_id: ne2}
        - {record_id: fe2a}
        - {record_id: fe2b}

  - name: direct_contributions_notice_dedupe_prefix_words_and_empty_keys
    model: int_mec__contributions_direct
    description: >
      The same word-prefix and empty-key rules for the MEC direct export (#634): John Smith / John Smithson is kept
      (a), Acme Builders Assoc / Associates is dropped (b), "A B" / "C D" with empty loose keys is kept (c).
    overrides:
      vars:
        mec_direct: true
    given:
      - input: ref('stg_mec__contributions')
        rows:
          - {record_id: na, mec_committee_id: Q1, contributor_name: John Smith, amount: 5000, contribution_date: 2020-07-28, report: '24 Hour Expenditure Report-8/4/2020 Primary', contributor_city: Jefferson City, contributor_state: MO}
          - {record_id: fa, mec_committee_id: Q1, contributor_name: John Smithson, amount: 5000, contribution_date: 2020-07-28, report: April Quarterly Report, contributor_city: Jefferson City, contributor_state: MO}
          - {record_id: nb, mec_committee_id: Q2, contributor_name: Acme Builders Assoc, amount: 5000, contribution_date: 2020-07-28, report: '24 Hour Expenditure Report-8/4/2020 Primary', contributor_city: Jefferson City, contributor_state: MO}
          - {record_id: fb, mec_committee_id: Q2, contributor_name: Acme Builders Associates, amount: 5000, contribution_date: 2020-07-28, report: April Quarterly Report, contributor_city: Jefferson City, contributor_state: MO}
          - {record_id: nc, mec_committee_id: Q3, contributor_name: A B, amount: 5000, contribution_date: 2020-07-28, report: '24 Hour Expenditure Report-8/4/2020 Primary', contributor_city: Jefferson City, contributor_state: MO}
          - {record_id: fc, mec_committee_id: Q3, contributor_name: C D, amount: 5000, contribution_date: 2020-07-28, report: April Quarterly Report, contributor_city: Jefferson City, contributor_state: MO}
    expect:
      rows:
        - {record_id: na}
        - {record_id: fa}
        - {record_id: fb}
        - {record_id: nc}
        - {record_id: fc}
