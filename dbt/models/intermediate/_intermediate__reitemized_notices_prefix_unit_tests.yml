          - {record_id: nc, mec_committee_id: P3, contributor_name: Mary Ann, amount: 5000, contribution_date: 2020-07-28, report: '24 Hour Expenditure Report-8/4/2020 Primary', contributor_city: Jefferson City, contributor_state: MO}
