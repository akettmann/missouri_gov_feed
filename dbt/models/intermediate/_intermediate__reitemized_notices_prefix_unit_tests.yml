# Unit tests for #634: surname-prefix pairing and empty loose keys in the 24-hour-notice dedupe.
version: 2

unit_tests:
  - name: tap_contributions_notice_dedupe_prefix_words_and_empty_keys
    model: int_tap_mec__contributions
    description: >
      Surname prefixes and empty loose keys (#634). A word that is only the start of another word pairs two names only
      when the longer word is an organisation word in the macro is_org_word_prefix and the prefix has 3+ letters (2 for
      Ed / Education); surnames never pair (m, n, o, t) and Roman numerals must be equal (p). Kept: John Smith / John Smithson (a), Mary Ann Smith / Mary Ann Smithson (b), Mary Ann / Mary
      Anderson (c), Jon Van / Jon Vance (d), a hyphenated surname that is a prefix (e), Jim Mc / Jim McDonald (f), Bob Kellogg Smith / Bob Kellogg
      Smithson (l), John Hill / Hillhouse (m), smith alex / alexandra (n), Committee to Elect John Smith / Smithson (o),
      holding iii / holdings ii (p), Robert Good / Goodspeed (t). Dropped: deVries & Associates / DeVries and Assoc (q), Nationwide Mutual Ins / Insurance (r), Assoc / Associates (g, h), Tech / Technical (i), a name of four or more words with a truncated
      last word (j), an added legal-form word after a hyphenated surname (k). A name with an empty loose key ("A B", "The
      Co") is never paired, with one or several leftover lines (the ne/fe cases).
    given:
      - input: ref('stg_tap_mec__contributions')
        rows:
          - {record_id: na, mec_committee_id: P1, contributor_name: John Smith, amount: 5000, contribution_date: 2020-07-28, report: '24 Hour Expenditure Report-8/4/2020 Primary', contributor_city: Jefferson City, contributor_state: MO}
          - {record_id: fa, mec_committee_id: P1, contributor_name: John Smithson, amount: 5000, contribution_date: 2020-07-28, report: April Quarterly Report, contributor_city: Jefferson City, contributor_state: MO}
          - {record_id: nb, mec_committee_id: P2, contributor_name: Mary Ann Smith, amount: 5000, contribution_date: 2020-07-28, report: '24 Hour Expenditure Report-8/4/2020 Primary', contributor_city: Jefferson City, contributor_state: MO}
