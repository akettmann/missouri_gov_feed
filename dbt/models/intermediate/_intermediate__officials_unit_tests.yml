# Unit tests for int_officials__current (dbt unit tests: fixed input rows -> exact expected rows).
# Kept apart from the generated _intermediate.yml so regenerating docs never touches them.
version: 2

unit_tests:
  - name: municipal_office_titles_keep_of_lower_case
    model: int_officials__current
    description: >
      A municipal office title is "<Role> of <Place>": role and place are title-cased on their own, with
      underscores as spaces, so the joining "of" stays lower case ("Mayor of Saint Louis", not "Mayor Of
      Saint Louis"). Title-casing the joined string capitalized it (#7).
    given:
      - input: ref('stg_openstates__people')
        rows:
          - {openstates_id: p_mayor, full_name: Ann Mayor, given_name: Ann, family_name: Mayor, party: Democratic, folder: municipalities}
          - {openstates_id: p_council, full_name: Bo Council, given_name: Bo, family_name: Council, party: Republican, folder: municipalities}
      - input: ref('stg_openstates__roles')
        rows:
          - {openstates_id: p_mayor, role_type: mayor, jurisdiction: 'ocd-jurisdiction/country:us/state:mo/place:saint_louis/government', district: null, start_date: '2025-04-15', end_date: null}
          - {openstates_id: p_council, role_type: council_member, jurisdiction: 'ocd-jurisdiction/country:us/state:mo/place:lees_summit/government', district: null, start_date: '2024-04-15', end_date: null}
      - input: ref('stg_openstates__other_names')
        rows: []
      - input: ref('int_mo_house__member_identity')
        rows: []
      - input: ref('statewide_officials')
        rows: []
      - input: ref('stg_congress__legislators')
        rows: []
      - input: ref('int_judges__current')
        rows: []
    expect:
      rows:
        - {official_id: p_mayor, office: mayor, office_title: Mayor of Saint Louis}
        - {official_id: p_council, office: council_member, office_title: Council Member of Lees Summit}
