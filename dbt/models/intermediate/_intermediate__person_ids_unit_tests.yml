# Unit tests for the person-id reconciliation (#97): fixed input rows -> exact expected rows.
# Kept apart from the generated _intermediate.yml so regenerating docs never touches them.
version: 2

unit_tests:
  - name: person_ids_join_a_redistricted_seat_change
    model: int_officials__person_ids
    description: >
      Open States holds one person twice when a redistricting renumbers their seat (David Smith, HD45 until 2022,
      HD46 from 2023): the same exact name, different seats, never in the same year. Both ids resolve to the one
      whose service ends latest, so the current profile keeps its id.
    given:
      - input: ref('int_officials__identity_terms')
        rows:
          - {alias_id: ocd-person/smith-old, year: 2021, office: state_house, district: '45', name_key: david smith}
          - {alias_id: ocd-person/smith-old, year: 2022, office: state_house, district: '45', name_key: david smith}
          - {alias_id: ocd-person/smith-new, year: 2023, office: state_house, district: '46', name_key: david smith}
          - {alias_id: ocd-person/smith-new, year: 2026, office: state_house, district: '46', name_key: david smith}
      - input: ref('official_id_links')
        rows: []
    expect:
      rows:
        - {alias_id: ocd-person/smith-old, person_id: ocd-person/smith-new, basis: name_continuity}
        - {alias_id: ocd-person/smith-new, person_id: ocd-person/smith-new, basis: self}

  - name: person_ids_join_a_house_fallback_key_to_the_senate_record
    model: int_officials__person_ids
    description: >
      The House roster keys a member mohouse:<id> when its seat match fails; the same person later has an Open States
      record as a senator (Mike Cierpiot, HD30 in 2017-18, SD8 from 2023). The mohouse key resolves to the Open States
      id, which is also the one whose service ends latest.
    given:
      - input: ref('int_officials__identity_terms')
        rows:
          - {alias_id: 'mohouse:476', year: 2017, office: state_house, district: '30', name_key: mike cierpiot}
          - {alias_id: 'mohouse:476', year: 2018, office: state_house, district: '30', name_key: mike cierpiot}
          - {alias_id: ocd-person/cierpiot, year: 2026, office: state_senate, district: '8', name_key: mike cierpiot}
      - input: ref('official_id_links')
        rows: []
    expect:
      rows:
        - {alias_id: 'mohouse:476', person_id: ocd-person/cierpiot, basis: name_continuity}
        - {alias_id: ocd-person/cierpiot, person_id: ocd-person/cierpiot, basis: self}

  - name: person_ids_join_a_same_seat_split
    model: int_officials__person_ids
    description: >
      The same seat under two ids is the same person, not two (Jean Evans, HD99 under an Open States id until
      February 2019 and under mohouse:1912 in 2019). The Open States id wins
      over the fallback key.
    given:
      - input: ref('int_officials__identity_terms')
        rows:
          - {alias_id: ocd-person/evans, year: 2017, office: state_house, district: '99', name_key: jean evans}
          - {alias_id: ocd-person/evans, year: 2018, office: state_house, district: '99', name_key: jean evans}
          - {alias_id: ocd-person/evans, year: 2019, office: state_house, district: '99', name_key: jean evans}
          - {alias_id: 'mohouse:1912', year: 2019, office: state_house, district: '99', name_key: jean evans}
          - {alias_id: ocd-person/someone-else, year: 2026, office: state_house, district: '1', name_key: some one}
      - input: ref('official_id_links')
        rows: []
    expect:
      rows:
        - {alias_id: ocd-person/evans, person_id: ocd-person/evans, basis: self}
        - {alias_id: 'mohouse:1912', person_id: ocd-person/evans, basis: name_continuity}
        - {alias_id: ocd-person/someone-else, person_id: ocd-person/someone-else, basis: self}

  - name: person_ids_keep_same_name_in_two_seats_the_same_year_apart
    model: int_officials__person_ids
    description: >
      Two people can share a name. When two ids with the same exact name hold different seats across several of the
      same years they cannot be one person, so neither is merged.
    given:
      - input: ref('int_officials__identity_terms')
        rows:
          - {alias_id: ocd-person/smith-a, year: 2023, office: state_house, district: '10', name_key: pat smith}
          - {alias_id: ocd-person/smith-a, year: 2024, office: state_house, district: '10', name_key: pat smith}
          - {alias_id: ocd-person/smith-b, year: 2023, office: state_house, district: '77', name_key: pat smith}
          - {alias_id: ocd-person/smith-b, year: 2024, office: state_house, district: '77', name_key: pat smith}
      - input: ref('official_id_links')
        rows: []
    expect:
      rows:
        - {alias_id: ocd-person/smith-a, person_id: ocd-person/smith-a, basis: self}
        - {alias_id: ocd-person/smith-b, person_id: ocd-person/smith-b, basis: self}

  - name: person_ids_join_a_one_year_hand_over_between_seats
    model: int_officials__person_ids
    description: >
      A member sworn into the Senate partway through their last House year shows in both seats for that one year
      (Lauren Arthur, HD18 and SD17 in 2018; the House roster also had no Open States match for her). One shared
      year is a hand-over, not two people, so the fallback key joins the Open States id.
    given:
      - input: ref('int_officials__identity_terms')
        rows:
          - {alias_id: 'mohouse:1810', year: 2017, office: state_house, district: '18', name_key: lauren arthur}
          - {alias_id: 'mohouse:1810', year: 2018, office: state_house, district: '18', name_key: lauren arthur}
          - {alias_id: ocd-person/arthur, year: 2018, office: state_senate, district: '17', name_key: lauren arthur}
          - {alias_id: ocd-person/arthur, year: 2019, office: state_senate, district: '17', name_key: lauren arthur}
          - {alias_id: ocd-person/someone-else, year: 2026, office: state_house, district: '1', name_key: some one}
      - input: ref('official_id_links')
        rows: []
    expect:
      rows:
        - {alias_id: 'mohouse:1810', person_id: ocd-person/arthur, basis: name_continuity}
        - {alias_id: ocd-person/arthur, person_id: ocd-person/arthur, basis: self}
        - {alias_id: ocd-person/someone-else, person_id: ocd-person/someone-else, basis: self}

  - name: person_ids_keep_a_different_people_pair_apart
    model: int_officials__person_ids
    description: >
      A pair listed as different_people in official_id_links is never merged by name, even when their seats never
      overlap in time.
    given:
      - input: ref('int_officials__identity_terms')
        rows:
          - {alias_id: ocd-person/lee-a, year: 2017, office: state_house, district: '10', name_key: sam lee}
          - {alias_id: ocd-person/lee-b, year: 2024, office: state_house, district: '77', name_key: sam lee}
      - input: ref('official_id_links')
        rows:
          - {alias_id: ocd-person/lee-a, person_id: ocd-person/lee-b, relation: different_people, checked_by: maintainer, checked_on: '2026-01-01'}
    expect:
      rows:
        - {alias_id: ocd-person/lee-a, person_id: ocd-person/lee-a, basis: self}
        - {alias_id: ocd-person/lee-b, person_id: ocd-person/lee-b, basis: self}

  - name: person_ids_follow_a_curated_link_to_a_judge
    model: int_officials__person_ids
    description: >
      A former legislator who is now a state judge holds no legislative seat the name rule could continue, so a
      curated same_person link names their current id (Joe Don McGaugh). The link applies to the id the name rule
      chose as well as to the id it names, so both the Open States and the fallback key resolve to the judge.
    given:
      - input: ref('int_officials__identity_terms')
        rows:
          - {alias_id: ocd-person/mcgaugh, year: 2017, office: state_house, district: '39', name_key: joe don mcgaugh}
          - {alias_id: 'mohouse:658', year: 2017, office: state_house, district: '39', name_key: joe don mcgaugh}
          - {alias_id: ocd-person/someone-else, year: 2026, office: state_house, district: '1', name_key: some one}
      - input: ref('official_id_links')
        rows:
          - {alias_id: ocd-person/mcgaugh, person_id: 'mojudge:joe don mcgaugh', relation: same_person, checked_by: maintainer, checked_on: '2026-01-01'}
    expect:
      rows:
        - {alias_id: ocd-person/mcgaugh, person_id: 'mojudge:joe don mcgaugh', basis: curated}
        - {alias_id: 'mohouse:658', person_id: 'mojudge:joe don mcgaugh', basis: curated}
        - {alias_id: ocd-person/someone-else, person_id: ocd-person/someone-else, basis: self}

  - name: person_ids_ignore_unsigned_curated_links
    model: int_officials__person_ids
    description: >
      Curated rows wait for maintainer sign-off: a same_person row with no checked_by changes nothing (the ids stay
      their own, joined only by name), and an unsigned different_people row does not keep a name apart.
    given:
      - input: ref('int_officials__identity_terms')
        rows:
          - {alias_id: ocd-person/mcgaugh, year: 2017, office: state_house, district: '39', name_key: joe don mcgaugh}
          - {alias_id: 'mohouse:658', year: 2017, office: state_house, district: '39', name_key: joe don mcgaugh}
          - {alias_id: ocd-person/lee-a, year: 2017, office: state_house, district: '10', name_key: sam lee}
          - {alias_id: ocd-person/lee-b, year: 2024, office: state_house, district: '10', name_key: sam lee}
      - input: ref('official_id_links')
        rows:
          - {alias_id: ocd-person/mcgaugh, person_id: 'mojudge:joe don mcgaugh', relation: same_person}
          - {alias_id: ocd-person/lee-a, person_id: ocd-person/lee-b, relation: different_people}
    expect:
      rows:
        - {alias_id: ocd-person/mcgaugh, person_id: ocd-person/mcgaugh, basis: self}
        - {alias_id: 'mohouse:658', person_id: ocd-person/mcgaugh, basis: name_continuity}
        - {alias_id: ocd-person/lee-a, person_id: ocd-person/lee-b, basis: name_continuity}
        - {alias_id: ocd-person/lee-b, person_id: ocd-person/lee-b, basis: self}

  - name: person_ids_keep_the_id_after_the_official_leaves_office
    model: int_officials__person_ids
    description: >
      The chosen id does not depend on who serves in the latest roster year. Here the newer Open States id sorts
      after the older one and neither serves in the latest year (someone else does); the id that served last is
      kept, so a former official's id and URL do not change when the roster year moves on.
    given:
      - input: ref('int_officials__identity_terms')
        rows:
          - {alias_id: ocd-person/aaa-old, year: 2013, office: state_house, district: '45', name_key: pat cook}
          - {alias_id: ocd-person/aaa-old, year: 2016, office: state_house, district: '45', name_key: pat cook}
          - {alias_id: ocd-person/zzz-new, year: 2017, office: state_house, district: '46', name_key: pat cook}
          - {alias_id: ocd-person/zzz-new, year: 2020, office: state_house, district: '46', name_key: pat cook}
          - {alias_id: ocd-person/someone-else, year: 2026, office: state_house, district: '1', name_key: some one}
      - input: ref('official_id_links')
        rows: []
    expect:
      rows:
        - {alias_id: ocd-person/aaa-old, person_id: ocd-person/zzz-new, basis: name_continuity}
        - {alias_id: ocd-person/zzz-new, person_id: ocd-person/zzz-new, basis: self}
        - {alias_id: ocd-person/someone-else, person_id: ocd-person/someone-else, basis: self}

  - name: house_member_identity_uses_the_stable_person_id
    model: int_mo_house__member_identity
    description: >
      person_key is the person id for the key the seat match gave; raw_person_key keeps the key itself. A key with
      no row in the crosswalk stays as it is.
    given:
      - input: ref('int_mo_house__member_seat_keys')
        rows:
          - {session_code: '171', district_number: 30, raw_person_key: 'mohouse:476'}
          - {session_code: '171', district_number: 31, raw_person_key: 'mohouse:999'}
      - input: ref('int_officials__person_ids')
        rows:
          - {alias_id: 'mohouse:476', person_id: ocd-person/cierpiot, basis: name_continuity}
    expect:
      rows:
        - {session_code: '171', district_number: 30, raw_person_key: 'mohouse:476', person_key: ocd-person/cierpiot}
        - {session_code: '171', district_number: 31, raw_person_key: 'mohouse:999', person_key: 'mohouse:999'}


  - name: person_ids_ignore_spacing_inside_a_surname
    model: int_officials__person_ids
    description: >
      The House roster spells Dean Van Schoiack with a space and Open States without (#228). Same seat, same years:
      one person, and the Open States id wins over the roster fallback key.
    given:
      - input: ref('int_officials__identity_terms')
        rows:
          - {alias_id: 'mohouse:2243', year: 2025, office: state_house, district: '9', name_key: dean van schoiack}
          - {alias_id: 'mohouse:2243', year: 2026, office: state_house, district: '9', name_key: dean van schoiack}
          - {alias_id: ocd-person/vanschoiack, year: 2025, office: state_house, district: '9', name_key: dean vanschoiack}
          - {alias_id: ocd-person/vanschoiack, year: 2026, office: state_house, district: '9', name_key: dean vanschoiack}
      - input: ref('official_id_links')
        rows: []
    expect:
      rows:
        - {alias_id: 'mohouse:2243', person_id: ocd-person/vanschoiack, basis: name_continuity}
        - {alias_id: ocd-person/vanschoiack, person_id: ocd-person/vanschoiack, basis: self}

  - name: person_ids_join_a_given_name_variant_across_chambers
    model: int_officials__person_ids
    description: >
      Open States keeps Steve Roberts' House years (as "Steven", 2017-20) and Senate years (2021+) as two people
      (#263). The names differ only in the given name, one starting with the other, the seats never clash and the
      second begins the year after the first ends: one person, and the id that served last is kept.
    given:
      - input: ref('int_officials__identity_terms')
        rows:
          - {alias_id: ocd-person/roberts-house, year: 2019, office: state_house, district: '77', name_key: steven roberts}
          - {alias_id: ocd-person/roberts-house, year: 2020, office: state_house, district: '77', name_key: steven roberts}
          - {alias_id: ocd-person/roberts-senate, year: 2021, office: state_senate, district: '5', name_key: steve roberts}
          - {alias_id: ocd-person/roberts-senate, year: 2026, office: state_senate, district: '5', name_key: steve roberts}
      - input: ref('official_id_links')
        rows: []
    expect:
      rows:
        - {alias_id: ocd-person/roberts-house, person_id: ocd-person/roberts-senate, basis: name_continuity}
        - {alias_id: ocd-person/roberts-senate, person_id: ocd-person/roberts-senate, basis: self}

  - name: person_ids_join_a_given_name_variant_in_the_same_seat
    model: int_officials__person_ids
    description: >
      Two Open States records for the same seat under "Ken" and "Kenneth" Jamison are one person: Kenneth's stub term (2025-01-08 to 2025-02-03, dates as Open States gives them) overlaps in time with Ken's term from 2025-01-08.
    given:
      - input: ref('int_officials__identity_terms')
        rows:
          - {alias_id: ocd-person/jamison-ken, year: 2025, office: state_house, district: '15', name_key: ken jamison, term_start: '2025-01-08', term_end: '9999-12-31'}
          - {alias_id: ocd-person/jamison-ken, year: 2026, office: state_house, district: '15', name_key: ken jamison, term_start: '2025-01-08', term_end: '9999-12-31'}
          - {alias_id: ocd-person/jamison-kenneth, year: 2025, office: state_house, district: '15', name_key: kenneth jamison, term_start: '2025-01-08', term_end: '2025-02-03'}
      - input: ref('official_id_links')
        rows: []
    expect:
      rows:
        - {alias_id: ocd-person/jamison-ken, person_id: ocd-person/jamison-ken, basis: self}
        - {alias_id: ocd-person/jamison-kenneth, person_id: ocd-person/jamison-ken, basis: name_continuity}

  - name: person_ids_keep_placeholder_start_same_span_given_name_variants_apart
    model: int_officials__person_ids
    description: >
      Open States gives some pre-2015 terms a placeholder 2013-01-01 start, so two different people can hold the identical 2013-01-01 to 2014-12-31 term in one seat (Jason Smith and Shawn Sisco, HD120, shown here with variant names). Equal multi-year terms are not a stub, so they are not joined (#332).
    given:
      - input: ref('int_officials__identity_terms')
        rows:
          - {alias_id: ocd-person/jon-smith, year: 2013, office: state_house, district: '120', name_key: jon smith, term_start: '2013-01-01', term_end: '2014-12-31'}
          - {alias_id: ocd-person/jon-smith, year: 2014, office: state_house, district: '120', name_key: jon smith, term_start: '2013-01-01', term_end: '2014-12-31'}
          - {alias_id: ocd-person/jonathan-smith, year: 2013, office: state_house, district: '120', name_key: jonathan smith, term_start: '2013-01-01', term_end: '2014-12-31'}
          - {alias_id: ocd-person/jonathan-smith, year: 2014, office: state_house, district: '120', name_key: jonathan smith, term_start: '2013-01-01', term_end: '2014-12-31'}
      - input: ref('official_id_links')
        rows: []
    expect:
      rows:
        - {alias_id: ocd-person/jon-smith, person_id: ocd-person/jon-smith, basis: self}
        - {alias_id: ocd-person/jonathan-smith, person_id: ocd-person/jonathan-smith, basis: self}

  - name: person_ids_keep_a_long_term_nested_in_a_longer_one_given_name_variants_apart
    model: int_officials__person_ids
    description: >
      A multi-year term nested in a longer one (Fowler 2013-2014 inside Hubrecht 2013-2018, HD151, shown with variant names) is a genuine long overlap on paper but not a stub, so the names are not joined (#332).
    given:
      - input: ref('int_officials__identity_terms')
        rows:
          - {alias_id: ocd-person/greg-lee, year: 2013, office: state_house, district: '151', name_key: greg lee, term_start: '2013-01-01', term_end: '2018-12-31'}
          - {alias_id: ocd-person/greg-lee, year: 2014, office: state_house, district: '151', name_key: greg lee, term_start: '2013-01-01', term_end: '2018-12-31'}
          - {alias_id: ocd-person/gregory-lee, year: 2013, office: state_house, district: '151', name_key: gregory lee, term_start: '2013-01-01', term_end: '2014-12-31'}
          - {alias_id: ocd-person/gregory-lee, year: 2014, office: state_house, district: '151', name_key: gregory lee, term_start: '2013-01-01', term_end: '2014-12-31'}
      - input: ref('official_id_links')
        rows: []
    expect:
      rows:
        - {alias_id: ocd-person/greg-lee, person_id: ocd-person/greg-lee, basis: self}
        - {alias_id: ocd-person/gregory-lee, person_id: ocd-person/gregory-lee, basis: self}

  - name: person_ids_keep_a_same_end_later_start_successor_apart
    model: int_officials__person_ids
    description: >
      Dan Kim (HD7 from 2019-01-09 to 2021-01-06) and Daniel Kim (HD7 from 2020-11-01, a 66-day term ending the same
      day) overlap on paper and the later term is a stub under 90 days nested in the longer one, but it starts
      almost two years after it, not within 31 days of it: a successor, not a duplicate (#332).
    given:
      - input: ref('int_officials__identity_terms')
        rows:
          - {alias_id: ocd-person/dan-kim, year: 2019, office: state_house, district: '7', name_key: dan kim, term_start: '2019-01-09', term_end: '2021-01-06'}
          - {alias_id: ocd-person/dan-kim, year: 2020, office: state_house, district: '7', name_key: dan kim, term_start: '2019-01-09', term_end: '2021-01-06'}
          - {alias_id: ocd-person/daniel-kim, year: 2020, office: state_house, district: '7', name_key: daniel kim, term_start: '2020-11-01', term_end: '2021-01-06'}
      - input: ref('official_id_links')
        rows: []
    expect:
      rows:
        - {alias_id: ocd-person/dan-kim, person_id: ocd-person/dan-kim, basis: self}
        - {alias_id: ocd-person/daniel-kim, person_id: ocd-person/daniel-kim, basis: self}

  - name: person_ids_keep_a_same_seat_successor_with_a_hand_over_year_apart
    model: int_officials__person_ids
    description: >
      Dan Smith (HD10 2018-2019) and his successor Danielle Smith (HD10 2019-2021) both appear in 2019 in the same
      seat, but Dan's term ends the day Danielle's starts, which is succession, not overlap, so they are two people.
    given:
      - input: ref('int_officials__identity_terms')
        rows:
          - {alias_id: ocd-person/dan, year: 2018, office: state_house, district: '10', name_key: dan smith, term_start: '2017-01-04', term_end: '2019-01-09'}
          - {alias_id: ocd-person/dan, year: 2019, office: state_house, district: '10', name_key: dan smith, term_start: '2017-01-04', term_end: '2019-01-09'}
          - {alias_id: ocd-person/danielle, year: 2019, office: state_house, district: '10', name_key: danielle smith, term_start: '2019-01-09', term_end: '2021-01-06'}
          - {alias_id: ocd-person/danielle, year: 2020, office: state_house, district: '10', name_key: danielle smith, term_start: '2019-01-09', term_end: '2021-01-06'}
          - {alias_id: ocd-person/danielle, year: 2021, office: state_house, district: '10', name_key: danielle smith, term_start: '2019-01-09', term_end: '2021-01-06'}
      - input: ref('official_id_links')
        rows: []
    expect:
      rows:
        - {alias_id: ocd-person/dan, person_id: ocd-person/dan, basis: self}
        - {alias_id: ocd-person/danielle, person_id: ocd-person/danielle, basis: self}

  - name: person_ids_keep_a_successor_who_holds_only_the_first_year_of_the_seat_apart
    model: int_officials__person_ids
    description: >
      Dan Smith (HD10 2019 only, term ending 2019-01-09) and Danielle Smith (HD10 2019-2021, term from 2019-01-09)
      share one seat-year and Dan's years sit inside Danielle's, but the terms only touch, so they are two people.
    given:
      - input: ref('int_officials__identity_terms')
        rows:
          - {alias_id: ocd-person/dan, year: 2019, office: state_house, district: '10', name_key: dan smith, term_start: '2017-01-04', term_end: '2019-01-09'}
          - {alias_id: ocd-person/danielle, year: 2019, office: state_house, district: '10', name_key: danielle smith, term_start: '2019-01-09', term_end: '2021-01-06'}
          - {alias_id: ocd-person/danielle, year: 2020, office: state_house, district: '10', name_key: danielle smith, term_start: '2019-01-09', term_end: '2021-01-06'}
          - {alias_id: ocd-person/danielle, year: 2021, office: state_house, district: '10', name_key: danielle smith, term_start: '2019-01-09', term_end: '2021-01-06'}
      - input: ref('official_id_links')
        rows: []
    expect:
      rows:
        - {alias_id: ocd-person/dan, person_id: ocd-person/dan, basis: self}
