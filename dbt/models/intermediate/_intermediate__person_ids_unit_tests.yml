  - name: house_departed_member_keeps_own_person_when_roster_outlives_term
    model: int_mo_house__member_seat_keys
    description: >
      The House roster still lists a member after her Open States term ended and a successor with the same surname took
      the seat (Rebecca Roeber, HD34, listed in 2020; Rick Roeber was elected in November 2020, #152). The seat match
      lands on the successor, whose given name differs, so the member id keeps the person its other sessions matched by
      given name. A member with no such session (Ann Lee) stays on the seat match, and a member whose seat match
      already carries the given name (Rick) is untouched.
    given:
      - input: ref('stg_mo_house__members')
        rows:
          - {session_code: '191', session_year: 2019, district_number: 34, house_member_id: '1790', first_name: Rebecca, last_name: Roeber}
          - {session_code: '201', session_year: 2020, district_number: 34, house_member_id: '1790', first_name: Rebecca, last_name: Roeber}
          - {session_code: '211', session_year: 2021, district_number: 34, house_member_id: '2215', first_name: Rick, last_name: Roeber}
          - {session_code: '201', session_year: 2020, district_number: 42, house_member_id: '902', first_name: Ann, last_name: Lee}
      - input: ref('int_mo_legislators__seat_terms')
        rows:
          - {openstates_id: ocd-person/rebecca, chamber: lower, district_number: 34, surname_key: roeber, full_name_key: rebecca roeber, start_date: '2015-01-01', end_date: '2019-07-30'}
          - {openstates_id: ocd-person/rick, chamber: lower, district_number: 34, surname_key: roeber, full_name_key: rick roeber, start_date: '2019-08-01', end_date: '2021-04-21'}
          - {openstates_id: ocd-person/lee, chamber: lower, district_number: 42, surname_key: lee, full_name_key: bo lee, start_date: '2015-01-01', end_date: '2020-12-31'}
    expect:
      rows:
        - {session_code: '191', district_number: 34, house_member_id: '1790', raw_person_key: ocd-person/rebecca}
        - {session_code: '201', district_number: 34, house_member_id: '1790', raw_person_key: ocd-person/rebecca}
        - {session_code: '211', district_number: 34, house_member_id: '2215', raw_person_key: ocd-person/rick}
        - {session_code: '201', district_number: 42, house_member_id: '902', raw_person_key: ocd-person/lee}

  - name: house_member_with_two_given_name_anchors_keeps_the_seat_match
    model: int_mo_house__member_seat_keys
    description: >
      A member id whose other sessions matched two different Open States people by given name (duplicate Open States
      records for one person, e.g. member 2235 Cook) has no single anchor, so a session whose seat match lands on
      someone else stays on the seat match. Loosening the anchor guard to one-or-more would pick one of the two
      duplicates and override the seat match (#152).
    given:
      - input: ref('stg_mo_house__members')
        rows:
          - {session_code: '171', session_year: 2017, district_number: 10, house_member_id: '2235', first_name: Ann, last_name: Cook}
          - {session_code: '191', session_year: 2019, district_number: 11, house_member_id: '2235', first_name: Ann, last_name: Cook}
          - {session_code: '201', session_year: 2020, district_number: 12, house_member_id: '2235', first_name: Ann, last_name: Cook}
      - input: ref('int_mo_legislators__seat_terms')
        rows:
          - {openstates_id: ocd-person/ann-one, chamber: lower, district_number: 10, surname_key: cook, full_name_key: ann cook, start_date: '2015-01-01', end_date: '2018-12-31'}
          - {openstates_id: ocd-person/ann-two, chamber: lower, district_number: 11, surname_key: cook, full_name_key: ann cook, start_date: '2019-01-01', end_date: '2019-12-31'}
          - {openstates_id: ocd-person/bob, chamber: lower, district_number: 12, surname_key: cook, full_name_key: bob cook, start_date: '2020-01-01', end_date: '2021-12-31'}
    expect:
      rows:
        - {session_code: '171', district_number: 10, house_member_id: '2235', raw_person_key: ocd-person/ann-one}
        - {session_code: '191', district_number: 11, house_member_id: '2235', raw_person_key: ocd-person/ann-two}
        - {session_code: '201', district_number: 12, house_member_id: '2235', raw_person_key: ocd-person/bob}

  - name: house_given_name_anchor_ends_at_a_word_boundary
    model: int_mo_house__member_seat_keys
    description: >
      The name anchor matches the House member's given name against the Open States name only up to a word boundary,
      like the seat match: Dan Hart (member 800) sits in HD50 beside "daniel hart" and in HD51 beside "bob hart". "dan"
      is a prefix of "daniel" but not a whole given name, so HD50 gives no anchor and HD51 stays on its seat match.
      Dropping the boundary in name_anchors would anchor Dan to Daniel and override Bob (#498).
    given:
      - input: ref('stg_mo_house__members')
        rows:
          - {session_code: '171', session_year: 2017, district_number: 50, house_member_id: '800', first_name: Dan, last_name: Hart}
          - {session_code: '201', session_year: 2020, district_number: 51, house_member_id: '800', first_name: Dan, last_name: Hart}
      - input: ref('int_mo_legislators__seat_terms')
        rows:
          - {openstates_id: ocd-person/daniel, chamber: lower, district_number: 50, surname_key: hart, full_name_key: daniel hart, start_date: '2015-01-01', end_date: '2018-12-31'}
          - {openstates_id: ocd-person/bob, chamber: lower, district_number: 51, surname_key: hart, full_name_key: bob hart, start_date: '2019-01-01', end_date: '2021-12-31'}
    expect:
      rows:
        - {session_code: '171', district_number: 50, house_member_id: '800', raw_person_key: ocd-person/daniel}
        - {session_code: '201', district_number: 51, house_member_id: '800', raw_person_key: ocd-person/bob}

  - name: identity_terms_cover_the_year_before_the_first_roster
    model: int_officials__identity_terms
    description: >
      The first House roster year is 2017. A member whose Open States seat ended 2016-12-31 (Stephen Webber, House
      to 2016, Senate from 2025; #504) has no roster row, so without the year before the first roster year he would
      leave no evidence at all and keep an id of his own. 2016 and 2015 are covered (Tom Dempsey and Paul LeVota
      resigned in mid-2015; #512), 2014 is not (a seat ended 2014-12-31 is three years back, and the older Open
      States terms are mostly placeholder starts, #332), and the 2016 row carries no House roster row (the roster
      starts 2017).
    given:
      - input: ref('int_mo_house__member_seat_keys')
        rows:
          - {raw_person_key: 'mohouse:9', session_year: 2017, district_number: 99, full_name: Zed Zed, openstates_id: null}
      - input: ref('stg_openstates__people')
        rows: []
