    expect:
      rows:
        - {alias_id: 'mohouse:9', year: 2017, office: state_house, district: '99', name_key: zed zed, term_start: null, term_end: null}
        - {alias_id: ocd-person/webber-house, year: 2015, office: state_house, district: '46', name_key: stephen webber, term_start: '2013-01-01', term_end: '2016-12-31'}
