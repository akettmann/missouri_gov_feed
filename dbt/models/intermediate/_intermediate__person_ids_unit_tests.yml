  - name: person_ids_keep_given_name_variants_apart_when_another_id_holds_a_different_seat
    model: int_officials__person_ids
    description: >
      The seat check covers every id of both names. A second "Steven Smith" id (HD10 in 2017-18) does not clash with
      "Steve Smith" (SD5, 2019-20) on its own, but the first "Steven Smith" id (one person with a2, same seat) also holds HD10 in 2019-20, the same
