          - {alias_id: ocd-person/a2, year: 2018, office: state_house, district: '10', name_key: steven smith}
          - {alias_id: ocd-person/b, year: 2019, office: state_senate, district: '5', name_key: steve smith}
          - {alias_id: ocd-person/b, year: 2020, office: state_senate, district: '5', name_key: steve smith}
      - input: ref('official_id_links')
        rows: []
    expect:
      rows:
