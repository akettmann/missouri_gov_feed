[project]
name = "missouri-gov-feed"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "dbt-core>=1.12.6",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pdfplumber>=0.11.10",
    "playwright>=1.64.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
mogov = "mogov.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mogov"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=8",
    "ruff>=0.17.1",
    "sqlfluff>=4.4.0",
    "sqlfluff-templater-dbt>=4.4.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# journal text uses en/em dashes and curly apostrophes; the regexes must match them literally
"src/mogov/loaders/mo_senate.py" = ["RUF001"]
