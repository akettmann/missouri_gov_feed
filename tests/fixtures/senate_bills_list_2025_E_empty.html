<script>
    function toggleBillLinks(header) {
        const content = header.nextElementSibling;
        const chevron = header.querySelector('.chevron');
        const isExpanded = content.style.display === 'block';

        if (isExpanded) {
            content.style.display = 'none';
            chevron.innerHTML = '&#9662;'; // Down arrow
            header.classList.remove('expanded');
        } else {
            content.style.display = 'block';
            chevron.innerHTML = '&#9652;'; // Up arrow
            header.classList.add('expanded');
        }
    }
</script>

<div x-data="{ showModal: false, modalContent: '', modalTitle: 'Loading...' }" id="ajax-modal-container">
    <div x-show="showModal"
         x-cloak
         x-transition:enter="transition ease-out duration-200"

                <button @click="closeModal()"

<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@~3/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@~3/dist/cdn.min.js"></script>

<script>
    // Modal scroll lock functions
    function lockScroll() {
        document.body.classList.add('modal-open');
    }

    function unlockScroll() {
        document.body.classList.remove('modal-open');
    }

    function closeModal() {
        var container = document.getElementById('ajax-modal-container');
        if (container) {
            var data = Alpine.$data(container);
            data.showModal = false;
            // Delay cleanup until after the 150ms fade-out transition completes
            setTimeout(function () { data.modalContent = ''; }, 200);
        }
        unlockScroll();
    }

    /**
     * Executes scripts from AJAX-loaded HTML content.
     * When HTML is injected via innerHTML/x-html, script tags don't execute automatically.
     * This function extracts and re-creates script elements to execute them.
     * @param {HTMLElement} container - The container where HTML was injected
     */
    function executeScriptsInContainer(container) {
        const scripts = container.querySelectorAll('script');
        scripts.forEach(oldScript => {
            const newScript = document.createElement('script');

            // Copy all attributes (src, type, etc.)
            Array.from(oldScript.attributes).forEach(attr => {
                newScript.setAttribute(attr.name, attr.value);
            });

            // Copy inline script content
            newScript.textContent = oldScript.textContent;

            // Replace old script with new one to trigger execution
            oldScript.parentNode.replaceChild(newScript, oldScript);
        });
    }

    /**
     * Shows the AJAX modal with content loaded from the specified URL
     * @param {string} url - The URL to fetch content from (must be relative/same-origin)
     * @param {string} title - The modal title
     */
    function showAjaxModal(url, title) {
        // Security: Only allow relative URLs to prevent loading external content
        if (url.startsWith('http://') || url.startsWith('https://') || url.startsWith('//')) {
            console.error('Security: External URLs are not allowed in modal');
            return;
        }

        const container = document.getElementById('ajax-modal-container');
        if (!container) {
            console.error('Ajax modal container not found');
            return;
        }

        const alpineData = Alpine.$data(container);

        // Set loading state
        alpineData.modalTitle = title || 'Loading...';
        alpineData.modalContent = '<p style="text-align: center; padding: 40px;">Loading...</p>';
        alpineData.showModal = true;
        lockScroll();

        // Fetch content
        fetch(url)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.text();
            })
            .then(html => {
                alpineData.modalContent = html;

                // Execute scripts after Alpine updates the DOM
                // Use requestAnimationFrame to ensure DOM is updated
                requestAnimationFrame(() => {
                    const modalBody = container.querySelector('.modal__body');
                    if (modalBody) {
                        executeScriptsInContainer(modalBody);
                    }
                });
            })
            .catch(error => {
                console.error('Error loading modal content:', error);
                alpineData.modalContent = '<p style="text-align: center; padding: 40px; color: #dc3545;">Failed to load content. Please try again.</p>';
            });
    }

    // Data attribute trigger handler
    document.addEventListener('click', function(e) {
        const trigger = e.target.closest('.modal-trigger');
        if (!trigger) return;

        e.preventDefault();

        const url = trigger.dataset.modalUrl;
        const title = trigger.dataset.modalTitle;

        if (!url) {
            console.error('Modal trigger missing data-modal-url attribute');
            return;
        }

        showAjaxModal(url, title);
    });

    // Keyboard accessibility for trigger elements
    document.addEventListener('keydown', function(e) {
        if (e.key !== 'Enter' && e.key !== ' ') return;

        const trigger = e.target.closest('.modal-trigger');
        if (!trigger) return;

        e.preventDefault();
        trigger.click();
    });
</script>

<script>
    function downloadSenateBillsCSV() {
        // Get the filtered bill data from the Model
        const bills = [];

        // Create CSV header
        let csv = 'Bill,Sponsor,Handler,Description\n';

        // Add each bill's data — use camelCase names matching JSON serialization
        bills.forEach(bill => {
            const billNumber = `${bill.billPrefix} ${bill.billSuffix}`;
            const sponsorFirstName = bill.sponsorFirstName || '';
            const sponsorLastName = bill.sponsorLastName || '';
            const sponsor = `${sponsorFirstName} ${sponsorLastName}`.trim().replace(/"/g, '""');
            const handlerFirstName = bill.handlerFirstName || '';
            const handlerLastName = bill.handlerLastName || '';
            const handler = `${handlerFirstName} ${handlerLastName}`.trim().replace(/"/g, '""');
            const description = (bill.briefDescription || '').replace(/"/g, '""');

            csv += `"${billNumber}","${sponsor}","${handler}","${description}"\n`;
        });

        // Create blob and download
        const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);

        link.setAttribute('href', url);
        link.setAttribute('download', `senate_bills_${2025}.csv`);
        link.style.visibility = 'hidden';

        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>
