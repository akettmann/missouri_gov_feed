<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="924px" preserveAspectRatio="none" style="width:1302px;height:924px;background:#FFFFFF;" version="1.1" viewBox="0 0 1302 924" width="1302px" zoomAndPan="magnify"><title>mogov run: how a full refresh flows</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="236.4619" x="531.3003" y="34.5332">mogov run: how a full refresh flows</text><rect fill="none" height="22.6406" style="stroke:none;stroke-width:1.0;" width="1269.0625" x="15" y="51.0645"/><ellipse cx="225.3877" cy="88.7051" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><path d="M341.0986,108.7051 L341.0986,199.6387 L321.0986,203.6387 L341.0986,207.6387 L341.0986,298.5723 A0,0 0 0 0 341.0986,298.5723 L649.6221,298.5723 A0,0 0 0 0 649.6221,298.5723 L649.6221,118.7051 L639.6221,108.7051 L341.0986,108.7051 A0,0 0 0 0 341.0986,108.7051 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M639.6221,108.7051 L639.6221,118.7051 L649.6221,118.7051 L639.6221,108.7051 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199.4243" x="347.0986" y="127.2002">Each loader lists its work units and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="184.9771" x="347.0986" y="143.5518">processes those its shard owns:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="201.5889" x="347.0986" y="159.9033">crc32(unit key) % shards == shard.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="158.209" x="347.0986" y="176.2549">--shards N        all N shards</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" text-decoration="line-through" textLength="52.019" x="347.0986" y="192.6064">shards N</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="107.6753" x="402.7295" y="192.6064">shard i   one shard</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="287.5234" x="347.0986" y="208.958">Cloud Run: CLOUD_RUN_TASK_COUNT/INDEX</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="213.8779" x="347.0986" y="225.3096">Jobs: (loaders of one service, shard),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.9644" x="347.0986" y="241.6611">run by --workers processes: different</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.2935" x="347.0986" y="258.0127">services concurrently, slow ones first.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="237.0405" x="347.0986" y="274.3643">Shards needing the same URL download</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.4771" x="347.0986" y="290.7158">it once (lock file in data/cache).</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="191.4219" x="129.6768" y="186.0918"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="171.4219" x="139.6768" y="208.5488">mogov load (all stage-1 loaders)</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1.0;" width="410.7754" x="21" y="318.5723"/><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="196.0801" x="33" y="352.1191"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="176.0801" x="43" y="374.5762">fetch (cached HTTP, data/cache)</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="160.6953" x="257.0801" y="344.5723"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="140.6953" x="267.0801" y="367.0293">parse PDFs / XML / HTML</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="131.3965" x="267.0801" y="382.123">to text rows (no shaping)</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1.0;" width="410.7754" x="21" y="414.7598"/><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="222.1191" x="114.3281" y="440.7598"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="78.6855" x="124.3281" y="463.2168">stream rows to</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="117.4043" x="124.3281" y="478.3105">data/raw/&lt;table&gt;/part-</text><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="84.7148" x="241.7324" y="478.3105">-of-&lt;N&gt;.parquet</text><line style="stroke:#000000;stroke-width:1.5;" x1="15" x2="15" y1="51.0645" y2="912.9395"/><path d="M846.3594,500.9473 L846.3594,526.4746 L826.3594,530.4746 L846.3594,534.4746 L846.3594,560.002 A0,0 0 0 0 846.3594,560.002 L1049.48,560.002 A0,0 0 0 0 1049.48,560.002 L1049.48,510.9473 L1039.48,500.9473 L846.3594,500.9473 A0,0 0 0 0 846.3594,500.9473 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1039.48,500.9473 L1039.48,510.9473 L1049.48,510.9473 L1039.48,500.9473 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.1206" x="852.3594" y="519.4424">sources read &lt;table&gt;/*.parquet;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="180.6606" x="852.3594" y="535.7939">empty placeholders for optional</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.6426" x="852.3594" y="552.1455">JSON tables that aren't loaded</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="141.4004" x="684.959" y="512.9277"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="121.4004" x="694.959" y="535.3848">mogov build (dbt build)</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="190.0742" x="660.6221" y="580.002"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="170.0742" x="670.6221" y="602.459">staging -&gt; intermediate -&gt; marts</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="61.6992" x="670.6221" y="617.5527">-&gt; reporting</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="84.7051" x="713.3066" y="750.5645"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="64.7051" x="723.3066" y="773.0215">mogov build</text><rect fill="#F1F1F1" height="65.2813" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="159.1953" x="676.0615" y="805.6582"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="126.0645" x="686.0615" y="828.1152">mogov export (optional)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="117.3926" x="686.0615" y="843.209">marts and reporting to</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="139.1953" x="686.0615" y="858.3027">data/exports/*.csv|parquet</text><ellipse cx="755.6592" cy="901.9395" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="755.6592" cy="901.9395" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#000000;stroke-width:1.5;" x1="654.6221" x2="654.6221" y1="51.0645" y2="912.9395"/><rect fill="#F1F1F1" height="80.375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="218.082" x="1060.48" y="650.1895"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="103.3828" x="1070.48" y="672.6465">courtlistener_cases</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="168.7383" x="1070.48" y="687.7402">(needs marts.fct_legal_careers)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="43.3535" x="1070.48" y="702.834">wikidata</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="198.082" x="1070.48" y="717.9277">(needs QIDs from the landed rosters)</text><line style="stroke:#000000;stroke-width:1.5;" x1="1054.48" x2="1054.48" y1="51.0645" y2="912.9395"/><line style="stroke:#000000;stroke-width:1.5;" x1="1282.562" x2="1282.562" y1="51.0645" y2="912.9395"/><line style="stroke:#181818;stroke-width:1.0;" x1="225.3877" x2="225.3877" y1="98.7051" y2="186.0918"/><polygon fill="#181818" points="221.3877,176.0918,225.3877,186.0918,229.3877,176.0918,225.3877,180.0918" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="131.04" x2="131.04" y1="324.5723" y2="352.1191"/><polygon fill="#181818" points="127.04,342.1191,131.04,352.1191,135.04,342.1191,131.04,346.1191" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="337.4277" x2="337.4277" y1="324.5723" y2="344.5723"/><polygon fill="#181818" points="333.4277,334.5723,337.4277,344.57