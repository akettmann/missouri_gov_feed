<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="782px" preserveAspectRatio="none" style="width:1272px;height:782px;background:#FFFFFF;" version="1.1" viewBox="0 0 1272 782" width="1272px" zoomAndPan="magnify"><title>mogov run: how a full refresh flows</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="236.4619" x="516.6284" y="34.5332">mogov run: how a full refresh flows</text><rect fill="none" height="22.6406" style="stroke:none;stroke-width:1.0;" width="1239.7188" x="15" y="51.0645"/><ellipse cx="225.3877" cy="88.7051" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><path d="M341.0986,108.7051 L341.0986,158.7598 L321.0986,162.7598 L341.0986,166.7598 L341.0986,216.8145 A0,0 0 0 0 341.0986,216.8145 L649.6221,216.8145 A0,0 0 0 0 649.6221,216.8145 L649.6221,118.7051 L639.6221,108.7051 L341.0986,108.7051 A0,0 0 0 0 341.0986,108.7051 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M639.6221,108.7051 L639.6221,118.7051 L649.6221,118.7051 L639.6221,108.7051 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199.4243" x="347.0986" y="127.2002">Each loader lists its work units and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="184.9771" x="347.0986" y="143.5518">processes those its shard owns:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="201.5889" x="347.0986" y="159.9033">crc32(unit key) % shards == shard.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.7344" x="347.0986" y="176.2549">--shards N        process pool of N</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" text-decoration="line-through" textLength="52.019" x="347.0986" y="192.6064">shards N</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="107.6753" x="402.7295" y="192.6064">shard i   one shard</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="287.5234" x="347.0986" y="208.958">Cloud Run: CLOUD_RUN_TASK_COUNT/INDEX</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="191.4219" x="129.6768" y="145.2129"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="171.4219" x="139.6768" y="167.6699">mogov load (all stage-1 loaders)</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1.0;" width="410.7754" x="21" y="236.8145"/><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="196.0801" x="33" y="270.3613"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="176.0801" x="43" y="292.8184">fetch (cached HTTP, data/cache)</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="160.6953" x="257.0801" y="262.8145"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="140.6953" x="267.0801" y="285.2715">parse PDFs / XML / HTML</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="131.3965" x="267.0801" y="300.3652">to text rows (no shaping)</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1.0;" width="410.7754" x="21" y="333.002"/><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="222.1191" x="114.3281" y="359.002"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="78.6855" x="124.3281" y="381.459">stream rows to</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="117.4043" x="124.3281" y="396.5527">data/raw/&lt;table&gt;/part-</text><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="84.7148" x="241.7324" y="396.5527">-of-&lt;N&gt;.parquet</text><line style="stroke:#000000;stroke-width:1.5;" x1="15" x2="15" y1="51.0645" y2="770.8066"/><path d="M846.3594,419.1895 L846.3594,444.7168 L826.3594,448.7168 L846.3594,452.7168 L846.3594,478.2441 A0,0 0 0 0 846.3594,478.2441 L1049.48,478.2441 A0,0 0 0 0 1049.48,478.2441 L1049.48,429.1895 L1039.48,419.1895 L846.3594,419.1895 A0,0 0 0 0 846.3594,419.1895 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1039.48,419.1895 L1039.48,429.1895 L1049.48,429.1895 L1039.48,419.1895 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.1206" x="852.3594" y="437.6846">sources read &lt;table&gt;/*.parquet;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="180.6606" x="852.3594" y="454.0361">empty placeholders for optional</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.6426" x="852.3594" y="470.3877">JSON tables that aren't loaded</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="141.4004" x="684.959" y="431.1699"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="121.4004" x="694.959" y="453.627">mogov build (dbt build)</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="190.0742" x="660.6221" y="498.2441"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" 