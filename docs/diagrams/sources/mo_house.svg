<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="937px" preserveAspectRatio="none" style="width:972px;height:937px;background:#FFFFFF;" version="1.1" viewBox="0 0 972 937" width="972px" zoomAndPan="magnify"><title>mo_house: MO House XML + roll-call PDFs</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="286.6582" x="341.3413" y="34.5332">mo_house: MO House XML + roll-call PDFs</text><ellipse cx="397.6504" cy="58.6094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="394.1973" x="200.5518" y="88.6094"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="374.1563" x="210.5518" y="111.0664">for each year in the lookback window (MOGOV_LOOKBACK_YEARS)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="374.1973" x="210.5518" y="126.1602">and session type 1-4: GET documents.house.mo.gov/xml/&lt;YY&gt;&lt;t&gt;.zip</text><polygon fill="#F1F1F1" points="68.0701,158.7969,135.3323,158.7969,147.3323,170.7969,135.3323,182.7969,68.0701,182.7969,56.0701,170.7969,68.0701,158.7969" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="105.7012" y="194.2158">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="67.2622" x="68.0701" y="175.2979">body is a zip?</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="181.4023" x="11" y="215.7158"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="161.4023" x="21" y="238.1729">read every *.xml in the archive</text><polygon fill="#F1F1F1" points="263.9443,158.7969,436.9795,158.7969,448.9795,170.7969,436.9795,182.7969,263.9443,182.7969,251.9443,170.7969,263.9443,158.7969" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="354.4619" y="194.2158">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="173.0352" x="263.9443" y="175.2979">regular session of the current year?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="57.4707" x="448.9795" y="168.3799">HTML page</text><rect fill="#F1F1F1" height="65.2813" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="276.1191" x="212.4023" y="215.7158"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="136.7402" x="222.4023" y="238.1729">open session (no zip yet):</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="218.748" x="222.4023" y="253.2666">walk MemberList / BillList / SenateActList</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="256.1191" x="222.4023" y="268.3604">and fetch each linked per-member / per-bill XML</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="275.7793" x="508.5215" y="219.3447"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="114.0586" x="518.5215" y="241.8018">skip: no such session</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="255.7793" x="518.5215" y="256.8955">(site answers unknown codes with 200 + HTML)</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="424.8652" x="185.2178" y="369.915"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="404.8652" x="195.2178" y="392.3721">gzip each XML file, unchanged, under RAW_DIR/mo_house_xml/SESSION/</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="256.7891" x="269.2559" y="434.9619"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="236.7891" x="279.2559" y="457.4189">one state row per file in mo_house_xml_files</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="198.7793" x="279.2559" y="472.5127">(path, URL, size, sha256, fetched_at)</text><polygon fill="#F1F1F1" points="325.4978,320.9971,469.803,320.9971,481.803,332.9971,469.803,344.9971,325.4978,344.9971,313.4978,332.9971,325.4978,320.9971" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="401.6504" y="356.416">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="144.3052" x="325.4978" y="337.498">session owned by this shard?</text><polygon fill="#F1F1F1" points="397.6504,505.1494,409.6504,517.1494,397.6504,529.1494,385.6504,517.1494,397.6504,505.1494" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="250.7598" x="272.2705" y="549.1494"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="230.7598" x="282.2705" y="571.6064">parse each file once with lxml (every shard)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="174.7207" x="282.2705" y="586.7002">and collect its RollCallPDF URLs</text><rect fill="#F1F1F1" height="80.375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="352.4316" x="221.4346" y="619.3369"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="332.4316" x="231.4346" y="641.7939">Parser (mogov.parsers.mo_house) reads this shard's gzip files</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="322.8223" x="231.4346" y="656.8877">and walks each document: bills with actions, sponsors, texts,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="324.1406" x="231.4346" y="671.9814">amendments, roll calls, subjects and hearings; members with</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="282.0938" x="231.4346" y="687.0752">committee posts; sessions, committees and list items</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="260.1348" x="267.583" y="719.7119"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="240.1348" x="277.583" y="742.1689">typed rows land as the mo_house_xml tables</text><path d="M573.7158,770.3721 L573.7158,795.8994 L553.7158,799.8994 L573.7158,803.8994 L573.7158,829.4268 A0,0 0 0 0 573.7158,829.4268 L960.3408,829.4268 A0,0 0 0 0 960.3408,829.4268 L960.3408,780.3721 L950.3408,770.3721 L573.7158,770.3721 A0,0 0 0 0 573.7158,770.3721 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M950.3408,770.3721 L950.3408,780.3721 L960.3408,780.3721 L950.3408,770.3721 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="354.4023" x="579.7158" y="788.8672">Tokens are printed surnames ("SMITH 46", "MR SPEAKER"),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="365.625" x="579.7158" y="805.2188">matched to members in dbt (int_mo_house__member_identity).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="284.686" x="579.7158" y="821.5703">PDFs are cached forever: roll calls never change.</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="312.1309" x="241.585" y="774.8057"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="245.7715" x="251.585" y="797.2627">owned roll-call PDFs -&gt; pdfplumber layout text</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="292.1309" x="251.585" y="812.3564">-&gt; header fields + one row per (roll call, member token)</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="261.4648" x="266.918" y="849.4268"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="241.4648" x="276.918" y="871.8838">mo_house_rollcalls, mo_house_rollcall_votes</text><ellipse cx="397.6504" cy="915.5205" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="397.6504" cy="915.5205" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="397.6504" x2="397.6504" y1="68.6094" y2="88.6094"/><polygon fill="#181818" points="393.6504,78.6094,397.6504,88.6094,401.6504,78.6094,397.6504,82.6094" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="101.7012" x2="101.7012" y1="182.7969" y2="215.7158"/><polygon fill="#181818" points="97.7012,205.7158,101.7012,215.7158,105.7012,205.7158,101.7012,209.7158" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="101.7012" x2="101.7012" y1="250.8096" y2="300.9971"/><polygon fill="#181818" points="97.7012,290.9971,101.7012,300.9971,105.7012,290.9971,101.7012,294.9971" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="350.4619" 