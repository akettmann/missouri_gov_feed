<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="795px" preserveAspectRatio="none" style="width:762px;height:795px;background:#FFFFFF;" version="1.1" viewBox="0 0 762 795" width="762px" zoomAndPan="magnify"><title>mo_revisor: Revisor of Statutes (RSMo)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="264.4961" x="247.6736" y="34.5332">mo_revisor: Revisor of Statutes (RSMo)</text><ellipse cx="290.7861" cy="58.6094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="263.457" x="159.0576" y="88.6094"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="200.0625" x="169.0576" y="111.0664">GET revisor.mo.gov/main/Home.aspx</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="243.457" x="169.0576" y="126.1602">(table of contents: titles and chapters; weekly)</text><path d="M402.501,148.7969 L402.501,182.5 L382.501,186.5 L402.501,190.5 L402.501,224.2031 A0,0 0 0 0 402.501,224.2031 L750.8433,224.2031 A0,0 0 0 0 750.8433,224.2031 L750.8433,158.7969 L740.8433,148.7969 L402.501,148.7969 A0,0 0 0 0 402.501,148.7969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M740.8433,148.7969 L740.8433,158.7969 L750.8433,158.7969 L740.8433,148.7969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="222.5488" x="408.501" y="167.292">Requests from all shards take turns on</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="327.3423" x="408.501" y="183.6436">one lock, 2 s apart: the site blocks an IP that reads faster</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.5796" x="408.501" y="199.9951">than ~1 page/s. A warning page backs off</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="143.7935" x="408.501" y="216.3467">1 / 5 / 15 min and retries.</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="183.4297" x="199.0713" y="161.4063"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="84.7207" x="209.0713" y="183.8633">owned chapters</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="163.4297" x="209.0713" y="198.957">(one unit per chapter, by hash)</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1.0;" width="561.5723" x="11" y="244.2031"/><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="183.043" x="35.8643" y="312.7969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="138.5801" x="45.8643" y="335.2539">shard that owns "rx.aspx":</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="163.043" x="45.8643" y="350.3477">GET rx.aspx (~10 MB, weekly)</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="208.7715" x="23" y="397.9844"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="188.7715" x="33" y="420.4414">one row per repealed or transferred</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="174.123" x="33" y="435.5352">section: note and date as printed</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="125.3809" x="64.6953" y="483.1719"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="105.3809" x="74.6953" y="505.6289">mo_revisor_repeals</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="252.4355" x="282.9541" y="270.2031"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="232.4355" x="292.9541" y="292.6602">GET OneChapter.aspx?chapter=N (weekly)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="193.752" x="292.9541" y="307.7539">-&gt; the (section, bid) versions in force</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="298.8008" x="259.7715" y="355.3906"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="218.127" x="269.7715" y="377.8477">GET OneSection.aspx?section=S&amp;bid=B</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="278.8008" x="269.7715" y="392.9414">(re-read every 180 days; a new version is a new bid)</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="249.7813" x="284.2813" y="440.5781"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="229.7813" x="294.2813" y="463.0352">content block verbatim + text, effective line,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="184.7285" x="294.2813" y="478.1289">footnotes (session-law history first)</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="130.0449" x="344.1494" y="525.7656"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="110.0449" x="354.1494" y="548.2227">mo_revisor_sections</text><rect fill="#555555" height="6" rx="2.5" 