<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="347px" preserveAspectRatio="none" style="width:728px;height:347px;background:#FFFFFF;" version="1.1" viewBox="0 0 728 347" width="728px" zoomAndPan="magnify"><title>courtlistener_bulk: judges + federal judges' disclosures</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="370.9385" x="177.4883" y="34.5332">courtlistener_bulk: judges + federal judges' disclosures</text><ellipse cx="185.5723" cy="58.6094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="250.8301" x="60.1572" y="88.6094"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="215.4492" x="70.1572" y="111.0664">list the public S3 bucket; pick the newest</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="230.8301" x="70.1572" y="126.1602">people-db-people-&lt;date&gt;.csv.bz2 snapshot</text><path d="M380.1445,148.7969 L380.1445,182.5 L360.1445,186.5 L380.1445,190.5 L380.1445,224.2031 A0,0 0 0 0 380.1445,224.2031 L716.915,224.2031 A0,0 0 0 0 716.915,224.2031 L716.915,158.7969 L706.915,148.7969 L380.1445,148.7969 A0,0 0 0 0 380.1445,148.7969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M706.915,148.7969 L706.915,158.7969 L716.915,158.7969 L706.915,148.7969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="315.7705" x="386.1445" y="167.292">Postgres CSV exports with backslash-escaped quotes:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="287.8662" x="386.1445" y="183.6436">the reader is told escape='\' (sniffing lost rows and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.6543" x="386.1445" y="199.9951">choked on the reimbursements file).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="244.2261" x="386.1445" y="216.3467">Filtering to Missouri courts happens in dbt.</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="349.1445" x="11" y="161.4063"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="329.1445" x="21" y="183.8633">download each table's .csv.bz2 (cached forever per snapshot)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="157.4297" x="21" y="198.957">and decompress to the cache</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="215.4336" x="77.8555" y="244.2031"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="195.4336" x="87.8555" y="266.6602">cl_people, cl_positions, cl_courts, ...,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="169.4238" x="87.8555" y="281.7539">cl_financial_disclosures, cl_fd_*</text><ellipse cx="185.5723" cy="325.3906" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="185.5723" cy="325.3906" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="185.5723" x2="185.5723" y1="68.6094" y2="88.6094"/><polygon fill="#181818" points="181.5723,78.6094,185.5723,88.6094,189.5723,78.6094,185.5723,82.6094" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="185.5723" x2="185.5723" y1="138.7969" y2="161.4063"/><polygon fill="#181818" points="181.5723,151.4063,185.5723,161.4063,189.5723,151.4063,185.5723,155.4063" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="185.5723" x2="185.5723" y1="211.5938" y2="244.2031"/><polygon fill="#181818" points="181.5723,234.2031,185.5723,244.2031,189.5723,234.2031,185.5723,238.2031" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="185.5723" x2="185.5723" y1="294.3906" y2="314.3906"/><polygon fill="#181818" points="181.5723,304.3906,185.5723,314.3906,189.5723,304.3906,185.5723,308.3906" style="stroke:#181818;stroke-width:1.0;"/></g></svg>