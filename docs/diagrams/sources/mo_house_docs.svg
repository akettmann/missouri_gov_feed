OCS_KINDS and the sessions in MOGOV_HOUSE_DOCS_SESSIONS</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="332.1406" x="141.2255" y="173.8906"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="312.1406" x="151.2255" y="196.3477">one unit per distinct URL, owned by hash(URL) % --shards</text><polygon fill="#F1F1F1" points="154.1471,272.9844,460.4445,272.9844,472.4445,286.8203,460.4445,300.6563,154.1471,300.6563,142.1471,286.8203,154.1471,272.9844" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="306.2974" x="154.1471" y="284.4033">file already under RAW_DIR/mo_house_docs/SESSION/KIND/</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="222.5781" x="154.1471" y="298.2393">and (closed session or younger than 7 days)?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="125.0294" y="284.4033">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="12.2354" x="472.4445" y="284.4033">no</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="168.7344" x="11" y="310.6563"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="148.7344" x="21" y="333.1133">read it from disk: no request</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="242.7676" x="397.8406" y="310.6563"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="222.7676" x="407.8406" y="333.1133">GET at the host-wide throttle (1 request/s,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="214.1191" x="407.8406"