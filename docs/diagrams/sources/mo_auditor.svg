<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="727px" preserveAspectRatio="none" style="width:889px;height:727px;background:#FFFFFF;" version="1.1" viewBox="0 0 889 727" width="889px" zoomAndPan="magnify"><title>mo_auditor: Missouri State Auditor audit reports and ratings</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="402.9238" x="241.9229" y="34.5332">mo_auditor: Missouri State Auditor audit reports and ratings</text><ellipse cx="342.8296" cy="58.6094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><path d="M522.9146,84.8047 L522.9146,102.1563 L502.9146,106.1563 L522.9146,110.1563 L522.9146,127.5078 A0,0 0 0 0 522.9146,127.5078 L877.7695,127.5078 A0,0 0 0 0 877.7695,127.5078 L877.7695,94.8047 L867.7695,84.8047 L522.9146,84.8047 A0,0 0 0 0 522.9146,84.8047 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M867.7695,84.8047 L867.7695,94.8047 L877.7695,94.8047 L867.7695,84.8047 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="281.0996" x="528.9146" y="103.2998">the unfiltered list stops at the newest 1,000 rows,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="333.855" x="528.9146" y="119.6514">a year holds 90-150, a full year is checked against its total</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="320.1699" x="182.7446" y="88.6094"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="300.1699" x="192.7446" y="111.0664">SearchAudits, one calendar year at a time (1999 to now)</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="374.8379" x="155.4106" y="147.5078"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="354.8379" x="165.4106" y="169.9648">mo_auditor_reports (the list records verbatim, one shard unit each)</text><polygon fill="#F1F1F1" points="227.2732,209.1904,458.386,209.1904,470.386,221.1904,458.386,233.1904,227.2732,233.1904,215.2732,221.1904,227.2732,209.1904" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="231.1128" x="227.2732" y="225.6914">summary id, or a rated-looking title since 2012?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="198.1555" y="218.7734">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="200.5405" x="470.386" y="204.9375">no: financial statements, monthly reports,</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="114.3506" x="470.386" y="218.7734">follow-ups, before 2012</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="221.4395" x="78.3711" y="243.1904"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="177.3867" x="88.3711" y="265.6475">fetch the Citizens Summary PDF,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="201.4395" x="88.3711" y="280.7412">or else the first pages of the full report</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="285.752" x="46.2148" y="313.3779"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="265.752" x="56.2148" y="335.835">find "In the areas audited, the overall performance</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="263.0742" x="56.2148" y="350.9287">of this entity was &lt;rating&gt;." (page, sentence kept)</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="356.1816" x="11" y="383.5654"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="336.1816" x="21" y="406.0225">mo_auditor_ratings (status ok / no_rating_sentence / http error)</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="218.7734" x="387.1816" y="243.1904"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="198.7734" x="397.1816" y="265.6475">no PDF read (rating_status not_read)</text><polygon fill="#F1F1F1" points="342.8296,424.6592,354.8296,436.6592,342.8296,448.6592,330.8296,436.6592,342.8296,424.6592" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="240.1191" x="222.77" y="468.6592"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="220.1191" x="232.77" y="491.1162">dbt staging: dates, links, rating title-cased</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="350.1816" x="167.7388" y="523.7529"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="271.4707" x="177.7388" y="546.21">dbt: entity type (statewide office by title prefix seed,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="330.1816" x="177.7388" y="561.3037">county by title) and rating_level 4..1 (int_mo_auditor__reports)</text><path d="M549.8911,620.9521 L549.8911,630.1279 L529.8911,634.1279 L549.8911,638.1279 L549.8911,647.3037 A0,0 0 0 0 549.8911,647.3037 L827.438,647.3037 A0,0 0 0 0 827.438,647.3037 L827.438,630.9521 L817.438,620.9521 L5