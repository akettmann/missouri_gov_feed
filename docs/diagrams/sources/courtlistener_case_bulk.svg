<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="658px" preserveAspectRatio="none" style="width:758px;height:658px;background:#FFFFFF;" version="1.1" viewBox="0 0 758 658" width="758px" zoomAndPan="magnify"><title>courtlistener_case_bulk: case history from quarterly bulk files</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="413.9297" x="171.0176" y="34.5332">courtlistener_case_bulk: case history from quarterly bulk files</text><ellipse cx="185.4199" cy="58.6094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="290.8086" x="40.0156" y="88.6094"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="270.8086" x="50.0156" y="111.0664">newest snapshot date (same as courtlistener_bulk)</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="334.1563" x="18.3418" y="192.6211"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="314.1563" x="28.3418" y="215.0781">download dockets (~5 GB bz2), opinion-clusters (~2.5 GB),</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="199.1133" x="28.3418" y="230.1719">search_opinioncluster_panel (~5 MB)</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="279.4355" x="45.7021" y="262.8086"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="259.4355" x="55.7021" y="285.2656">stream-decompress; split records by quote parity</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="256.1367" x="55.7021" y="300.3594">(newlines inside quoted fields stay in the record)</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="331.4902" x="19.6748" y="332.9961"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="311.4902" x="29.6748" y="355.4531">dockets: keep court_id in mo, moctapp*, moed, mowd, ca8</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="274.8125" x="48.0137" y="388.0898"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="254.8125" x="58.0137" y="410.5469">opinion-clusters: keep docket_id in kept dockets</text><path d="M334.8252,433.1836 L334.8252,458.7109 L314.8252,462.7109 L334.8252,466.7109 L334.8252,492.2383 A0,0 0 0 0 334.8252,492.2383 L598.6548,492.2383 A0,0 0 0 0 598.6548,492.2383 L598.6548,443.1836 L588.6548,433.1836 L334.8252,433.1836 A0,0 0 0 0 334.8252,433.1836 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M588.6548,433.1836 L588.6548,443.1836 L598.6548,443.1836 L588.6548,433.1836 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.1987" x="340.8252" y="451.6787">The only loader that filters before landing:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="242.8296" x="340.8252" y="468.0303">the national files are too big to land whole.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.7852" x="340.8252" y="484.3818">Kept records are copied byte for byte.</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="258.8105" x="56.0146" y="445.1641"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="238.8105" x="66.0146" y="467.6211">panel: keep opinioncluster_id in kept clusters</text><polygon fill="#F1F1F1" points="89.1189,143.7031,281.7209,143.7031,293.7209,155.7031,281.7209,167.7031,89.1189,167.7031,77.1189,155.7031,89.1189,143.7031" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="12.2354" x="189.4199" y="179.1221">no</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="192.6021" x="89.1189" y="160.2041">filtered CSVs for this snapshot cached?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="293.7209" y="153.2861">yes</text><polygon fill="#F1F1F1" points="185.4199,512.2383,197.4199,524.2383,185.4199,536.2383,173.4199,524.2383,185.4199,512.2383" style="stroke:#181818;stroke-width:0.5;"/><path d="M379.8398,546.2383 L379.8398,571.7656 L359.8398,575.7656 L379.8398,579.7656 L379.8398,605.293 A0,0 0 0 0 379.8398,605.293 L746.9648,605.293 A0,0 0 0 0 746.9648,605.293 L746.9648,556.2383 L736.9648,546.2383 L379.8398,546.2383 A0,0 0 0 0 379.8398,546.2383 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M736.9648,546.2383 L736.9648,556.2383 L746.9648,556.2383 L736.9648,546.2383 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="346.125" x="385.8398" y="564.7334">dbt: int_courtlistener__bulk_case_matches matches officials</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="323.0005" x="385.8398" y="581.085">by panel person id, surname in judges text (own courts),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="149.3921" x="385.8398" y="597.4365">"first last" in attorneys text</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="348.8398" x="11" y="558.2188"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="328.8398" x="21" y="580.6758">cl_mo_dockets, cl_mo_opinion_clusters, cl_mo_cluster_panel</text><ellipse cx="185.4199" cy="636.293" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="185.4199" cy="636.293" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="185.4199" x2="185.4199" y1="68.6094" y2="88.6094"/><polygon fill="#181818" points="181.4199,78.6094,185.4199,88.6094,189.4199,78.6094,185.4199,82.6094" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="185.4199" x2="185.4199" y1="242.8086" y2="262.8086"/><polygon fill="#181818" points="181.4199,252.8086,185.4199,262.8086,189.4199,252.8086,185.4199,256.8086" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="185.4199" x2="185.4199" y1="312.9961" y2="332.9961"/><polygon fill="#181818" points="181.4199,322.9961,185.4199,332.9961,189.4199,322.9961,185.4199,326.9961" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="185.4199" x2="185.4199" y1="368.0898" y2="388.0898"/><polygon fill="#181818" points="181.4199,378.0898,185.4199,388.0898,189.4199,378.0898,185.4199,382.0898" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="185.4199" x2="185.4199" y1="423.1836" y2="445.1641"/><polygon fill="#181818" points="181.4199,435.1641,185.4199,445.1641,189.4199,435.1641,185.4199,439.1641" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="185.4199" x2="185.4199" y1="167.7031" y2="192.6211"/><polygon fill="#181818" points="181.4199,182.6211,185.4199,192.6211,189.4199,182.6211,185.4199,186.6211" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="293.7209" x