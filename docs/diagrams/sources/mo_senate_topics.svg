<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="542px" preserveAspectRatio="none" style="width:683px;height:542px;background:#FFFFFF;" version="1.1" viewBox="0 0 683 542" width="683px" zoomAndPan="magnify"><title>mo_senate_topics: MO Senate topical index</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="292.5234" x="194.0171" y="34.5332">mo_senate_topics: MO Senate topical index</text><ellipse cx="212.748" cy="58.6094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="215.4453" x="105.0254" y="88.6094"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="195.4453" x="115.0254" y="111.0664">owned years of the lookback window</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="156.082" x="115.0254" y="126.1602">(one unit per regular session)</text><path d="M434.4961,162.5391 L434.4961,179.8906 L414.4961,183.8906 L434.4961,187.8906 L434.4961,205.2422 A0,0 0 0 0 434.4961,205.2422 L671.5576,205.2422 A0,0 0 0 0 671.5576,205.2422 L671.5576,172.5391 L661.5576,162.5391 L434.4961,162.5391 A0,0 0 0 0 434.4961,162.5391 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M661.5576,162.5391 L661.5576,172.5391 L671.5576,172.5391 L661.5576,162.5391 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.0615" x="440.4961" y="181.0342">Extraordinary sessions have no index</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="174.8589" x="440.4961" y="197.3857">(the page comes back empty).</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="403.4961" x="11" y="158.7969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="383.4961" x="21" y="181.2539">GET senate.mo.gov/BillTracking/bills/keywords?year=YYYY&amp;session=R</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="252.7559" x="21" y="196.3477">(3-6 MB; current year daily, past years monthly)</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="178.0977" x="123.6992" y="228.9844"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="158.0977" x="133.6992" y="251.4414">split at each keyword heading</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="208.0918" x="108.7021" y="284.0781"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="170.7305" x="118.7021" y="306.5352">one row per (keyword, bill card):</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="188.0918" x="118.7021" y="321.6289">bill label, link, description, sponsors</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="138.7402" x="143.3779" y="354.2656"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="118.7402" x="153.3779" y="376.7227">mo_senate_bill_topics</text><rect fill="#F1F1F1" height="80.375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="315.7871" x="54.8545" y="409.3594"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="171.4453" x="64.8545" y="431.8164">dbt: stg_mo_senate__bill_topics</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="190.418" x="64.8545" y=