<!-- render_plantuml.py source-sha256=00fd045d1c5090a17ad7f75bd6b1b4d0571fe5debdf6a3a1f15bc8e680af67f0 plantuml=1.2024.7 layout=smetana -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="715px" preserveAspectRatio="none" style="width:688px;height:715px;background:#FFFFFF;" version="1.1" viewBox="0 0 688 715" width="688px" zoomAndPan="magnify"><title>mo_senate_bills: MO Senate bill list and action history</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="362.5303" x="161.6895" y="34.5332">mo_senate_bills: MO Senate bill list and action history</text><ellipse cx="229.6025" cy="58.6094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="176.75" x="141.2275" y="88.6094"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="156.75" x="151.2275" y="111.0664">years of the lookback window</text><path d="M444.0117,146.8164 L444.0117,172.3438 L424.0117,176.3438 L444.0117,180.3438 L444.0117,205.8711 A0,0 0 0 0 444.0117,205.8711 L676.9092,205.8711 A0,0 0 0 0 676.9092,205.8711 L676.9092,156.8164 L666.9092,146.8164 L444.0117,146.8164 A0,0 0 0 0 444.0117,146.8164 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M666.9092,146.8164 L666.9092,156.8164 L676.9092,156.8164 L666.9092,146.8164 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="148.1035" x="450.0117" y="165.3115">The bill list is the JSON in</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.8975" x="450.0117" y="181.6631">"const bills = [...]" in a script element.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="153.9116" x="450.0117" y="198.0146">billId is not the bill number.</text><rect fill="#F1F1F1" height="65.2813" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="388.8184" x="35.1934" y="143.7031"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="368.8184" x="45.1934" y="166.1602">GET senate.mo.gov/BillTracking/Bills/BillList?year=YYYY&amp;session=R</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="176.0977" x="45.1934" y="181.2539">then E1, E2, ... until one is empty</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="274.7871" x="45.1934" y="196.3477">(3-6 MB, every shard, once, from the shared cache)</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="130.7129" x="164.2461" y="228.9844"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="110.7129" x="174.2461" y="251.4414">bills of every session</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="176.75" x="141.2275" y="284.0781"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="156.75" x="151.2275" y="306.5352">keep the bills this shard owns</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="146.0684" x="151.2275" y="321.6289">(hash of year/session/billId)</text><rect fill="#F1F1F1" height="65.2813" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="437.2051" x="11" y="398.2656"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="417.2051" x="21" y="420.7227">GET BillList?billId=N&amp;year=YYYY&amp;billPrefix=SB&amp;billSuffix=1&amp;handler=Actions</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="242.4551" x="21" y="435.8164">(~1 request/s host-wide, shared by all shards,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="250.1309" x="21" y="450.9102">current year cached 1 day, past years 30 days)</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="210.0898" x="124.5576" y="498.5469"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="190.0898" x="134.5576" y="521.0039">parse the action table (newest first):</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="166.7695" x="134.5576" y="536.0977">date, action, journal ref and link</text><polygon fill="#F1F1F1" points="229.6025,354.2656,241.6025,366.2656,229.6025,378.2656,217.6025,366.2656,229.6025,354.2656" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#F1F1F1" points="185.2749,568.7344,273.9302,568.7344,285.9302,580.7344,273.9302,592.7344,185.2749,592.7344,173.2749,580.7344,185.2749,568.7344" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="88.6553" x="185.2749" y="585.2354">more owned bills?</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="255.4648" x="101.8701" y="612.7344"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="194.7598" x="111.8701" y="635.1914">mo_senate_bill_list (one row per bill)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="235.4648" x="111.8701" y="650.2852">mo_senate_bill_actions (one row per action)</text><ellipse cx="229.6025" cy="693.9219" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="229.6025" cy="693.9219" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="229.6025" x2="229.6025" y1="68.6094" y2="88.6094"/><polygon fill="#181818" points="225.6025,78.6094,229.6025,88.6094,233.6025,78.6094,229.6025,82.6094" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="229.6025" x2="229.6025" y1="123.7031" y2="143.7031"/><polygon fill="#181818" points="225.6025,133.7031,229.6025,143.7031,233.6025,133.7031,229.6025,137.7031" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="229.6025" x2="229.6025" y1="208.9844" y2="228.9844"/><polygon fill="#181818" points="225.6025,218.9844,229.6025,228.9844,233.6025,218.9844,229.6025,222.9844" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="229.6025" x2="229.6025" y1="264.0781" y2="284.0781"/><polygon fill="#181818" points="225.6025,274.0781,229.6025,284.0781,233.6025,274.0781,229.6025,278.0781" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="229.6025" x2="229.6025" y1="463.5469" y2="498.5469"/><polygon fill="#181818" points="225.6025,488.5469,229.6025,498.5469,233.6025,488.5469,229.6025,492.5469" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="229.6025" x2="229.6025" y1="378.2656" y2="398.2656"/><polygon fill="#181818" points="225.6025,388.2656,229.6025,398.2656,233.6025,388.2656,229.6025,392.2656" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="285.9302" x2="460.2051" y1="580.7344" y2="580.7344"/><polygon fill="#181818" points="456.2051,483.5,460.2051,473.5,464.2051,483.5,460.2051,479.5" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="460.2051" x2="460.2051" y1="366.2656" y2="580.7344"/><line style="stroke:#181818;stroke-width:1.0;" x1="460.2051" x2="241.6025" y1="366.2656" y2="366.2656"/><polygon fill="#181818" points="251.6025,362.2656,241.6025,366.2656,251.6025,370.2656,247.6025,366.2656" style="stroke:#181818;stroke-width:1.0;