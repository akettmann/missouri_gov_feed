<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="828px" preserveAspectRatio="none" style="width:693px;height:828px;background:#FFFFFF;" version="1.1" viewBox="0 0 693 828" width="693px" zoomAndPan="magnify"><title>mec: Missouri Ethics Commission exports (OPT-IN)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="343.0615" x="173.6877" y="34.5332">mec: Missouri Ethics Commission exports (OPT-IN)</text><ellipse cx="201.4346" cy="58.6094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="192.0605" x="105.4043" y="137.5273"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="172.0605" x="115.4043" y="159.9844">skip; TAP mirror covers &lt;= 2022</text><ellipse cx="201.4346" cy="211.5742" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="201.4346" cy="211.5742" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><polygon fill="#F1F1F1" points="132.8162,88.6094,270.053,88.6094,282.053,100.6094,270.053,112.6094,132.8162,112.6094,120.8162,100.6094,132.8162,88.6094" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="12.2354" x="205.4346" y="124.0283">no</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="137.2368" x="132.8162" y="105.1104">MOGOV_MEC_OPT_IN=1?</text><rect fill="none" height="225.2031" style="stroke:#000000;stroke-width:1.5;" width="580.3784" x="11" y="254.5742"/><path d="M204.5996,254.5742 L204.5996,265.1836 L194.5996,275.1836 L11,275.1836 " fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="183.5996" x="14" y="270.1074">ASP.NET WebForms session</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="231.4004" x="85.7344" y="292.1836"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="211.4004" x="95.7344" y="314.6406">GET form page (keeps __VIEWSTATE)</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="360.8691" x="21" y="347.2773"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="340.8691" x="31" y="369.7344">postback per dropdown change (report type, year, election date)</text><path d="M285.7979,392.3711 L285.7979,426.0742 L265.7979,430.0742 L285.7979,434.0742 L285.7979,467.7773 A0,0 0 0 0 285.7979,467.7773 L581.3784,467.7773 A0,0 0 0 0 581.3784,467.7773 L581.3784,402.3711 L571.3784,392.3711 L285.7979,392.3711 A0,0 0 0 0 285.7979,392.3711 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M571.3784,392.3711 L571.3784,402.3711 L581.3784,402.3711 L571.3784,392.3711 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="244.2451" x="291.7979" y="410.8662">The export answers with a file, not a page:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263.0405" x="291.7979" y="427.2178">the form keeps the last real page to post back</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="244.9497" x="291.7979" y="443.5693">from. Posting from the export body lost the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="274.5806" x="291.7979" y="459.9209">view state and silently returned the site chrome.</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="128.7266" x="137.0713" y="412.5273"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="108.7266" x="147.0713" y="434.9844">submit export button</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="274.0977" x="64.3857" y="499.7773"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="254.0977" x="74.3857" y="522.2344">CF_ContrCSV: one CSV per (report type, year),</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="172.752" x="74.3857" y="537.3281">one form session per report type</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="234.2715" x="84.2988" y="569.9648"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="212.127" x="94.2988" y="592.4219">CF12_SearchElection: per election date</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="214.2715" x="94.2988" y="607.5156">search + "Excel" export (an HTML table)</text><path d="M349.0146,630.1523 L349.0146,663.8555 L329.0146,667.8555 L349.0146,671.8555 L349.0146,705.5586 A0,0 0 0 0 349.0146,705.5586 L681.437,705.5586 A0,0 0 0 0 681.437,705.5586 L681.437,640.1523 L671.437,630.1523 L349.0146,630.1523 A0,0 0 0 0 349.0146,630.1523 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M671.437,630.1523 L671.437,640.1523 L681.437,640.1523 L671.437,630.1523 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="250.0024" x="355.0146" y="648.6475">Imperva bot protection; robots.txt disallows.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="278.8843" x="355.0146" y="664.999">3 s pause per request (MOGOV_MEC_PAUSE);</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="275.666" x="355.0146" y="681.3506">MEC answers in &lt; 1 s, so the pauses dominate.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="311.4224" x="355.0146" y="697.7021">Everything cached: current year weekly, past monthly.</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="255.1602" x="73.8545" y="650.3086"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="235.1602" x="83.8545" y="672.7656">LobExpSearch: lobbyist expenditures 2019+</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="321.4941" x="40.6875" y="725.5586"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="287.4609" x="50.6875" y="748.0156">mec_cd1_a, mec_cd3_b, mec_cd3_c, mec_summary,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="301.4941" x="50.6875" y="763.1094">mec_candidate_committees, mec_lobbyist_expenditures</text><ellipse cx="201.4346" cy="806.7461" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="201.4346" cy="806.7461" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="201.4346" x2="201.4346" y1="172.6211" y2="200.5742"/><polygon fill="#181818" points="197.4346,190.5742,201.4346,200.5742,205.4346,190.5742,201.4346,194.5742" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="201.4346" x2="201.4346" y1="112.6094" y2="137.5273"/><polygon fill="#181818" points="197.4346,127.5273,201.4346,137.5273,205.4346,127.5273,201.4346,131.5273" style="stroke:#181818;stroke-width:1.0;"/><line st