<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="659px" preserveAspectRatio="none" style="width:690px;height:659px;background:#FFFFFF;" version="1.1" viewBox="0 0 690 659" width="690px" zoomAndPan="magnify"><title>fec: FEC bulk files + API</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="160.6514" x="263.2195" y="34.5332">fec: FEC bulk files + API</text><ellipse cx="193.7607" cy="58.6094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><path d="M365.168,78.6094 L365.168,120.4883 L345.168,124.4883 L365.168,128.4883 L365.168,170.3672 A0,0 0 0 0 365.168,170.3672 L678.0903,170.3672 A0,0 0 0 0 678.0903,170.3672 L678.0903,88.6094 L668.0903,78.6094 L365.168,78.6094 A0,0 0 0 0 365.168,78.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M668.0903,78.6094 L668.0903,88.6094 L678.0903,88.6094 L668.0903,78.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="291.9224" x="371.168" y="97.1045">Pipe-delimited, no header row: headers come from</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="285.4478" x="371.168" y="113.4561">data_dictionaries/&lt;stem&gt;_header_file.csv, except</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="282.5024" x="371.168" y="129.8076">weball (columns hard-coded from the FEC docs).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="289.0913" x="371.168" y="146.1592">quote/escape disabled: fields contain bare quotes.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.1924" x="371.168" y="162.5107">Landed nationally; filtered to MO in dbt.</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="302.8145" x="42.3535" y="99.3945"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="239.4141" x="52.3535" y="121.8516">bulk zips per cycle (cn, cm, ccl, pas2, weball)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="282.8145" x="52.3535" y="136.9453">fec.gov/files/bulk-downloads/&lt;cycle&gt;/&lt;stem&gt;&lt;yy&gt;.zip</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="365.5215" x="11" y="190.3672"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="293.4844" x="21" y="212.8242">fec_candidates, fec_committees, fec_cand_cmte_links,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="345.5215" x="21" y="227.918">fec_committee_contribs_to_candidates, fec_candidate_summary</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="290.3926" x="48.5645" y="260.5547"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="270.3926" x="58.5645" y="283.0117">API: committees sponsored by each MO member's</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="195.416" x="58.5645" y="298.1055">FEC candidate ID (leadership PACs)</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="280.8184" x="53.3516" y="379.6602"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="260.8184" x="63.3516" y="402.1172">schedule_a aggregates by employer / size / state</text><polygon fill="#F1F1F1" points="99.9197,330.7422,287.6018,330.7422,299.6018,342.7422,287.6018,354.7422,99.9197,354.7422,87.9197,342.7422,99.9197,330.7422" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="197.7607" y="366.1611">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="187.6821" x="99.9197" y="347.2432">FEC_API_KEY set (not DEMO_KEY)?</text><polygon fill="#F1F1F1" points="193.7607,434.7539,205.7607,446.7539,193.7607,458.7539,181.7607,446.7539,193.7607,434.7539" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="248.4453" x="69.5381" y="527.6719"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="228.4453" x="79.5381" y="550.1289">individual contributions (~2.3 GB per cycle)</text><polygon fill="#F1F1F1" points="131.5608,478.7539,255.9607,478.7539,267.9607,490.7539,255.9607,502.7539,131.5608,502.7539,119.5608,490.7539,131.5608,478.7539" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="197.7607" y="514.1729">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="124.3999" x="131.5608" y="495.2549">MOGOV_FEC_INDIV=1?</text><polygon fill="#F1F1F1" points="193.7607,582.7656,205.7607,594.7656,193.7607,606.7656,181.7607,594.7656,193.7607,582.7656" style="stroke:#181818;stroke-width:0.5;"/><ellipse cx="193.7607" cy="637.7656" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="193.7607" cy="637.7656" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="193.7607" x2="193.7607" y1="68.6094" y2="99.3945"/><polygon fill="#181818" points="189.7607,89.3945,193.7607,99.3945,197.7607,89.3945,193.7607,93.3945" style="stroke:#181818;stroke-width:1.0;"/><line style