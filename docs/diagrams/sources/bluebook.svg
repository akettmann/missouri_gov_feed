<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="456px" preserveAspectRatio="none" style="width:732px;height:456px;background:#FFFFFF;" version="1.1" viewBox="0 0 732 456" width="732px" zoomAndPan="magnify"><title>bluebook: Missouri Official Manual</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="231.7998" x="248.9561" y="34.5332">bluebook: Missouri Official Manual</text><ellipse cx="161.0771" cy="58.6094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="65.2813" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="232.4551" x="44.8496" y="88.6094"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="209.7832" x="54.8496" y="111.0664">edition index page -&gt; chapter PDF links</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="185.4316" x="54.8496" y="126.1602">(file names differ between editions,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="212.4551" x="54.8496" y="141.2539">falls back to the 2019+ naming scheme)</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="222.7695" x="49.6924" y="173.8906"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="202.7695" x="59.6924" y="196.3477">executive, legislative, judicial chapters</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="243.4238" x="39.3652" y="228.9844"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="223.4238" x="49.3652" y="251.4414">per page: two-column if (almost) no words</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="198.1113" x="49.3652" y="266.5352">straddle the midline, else one column</text><path d="M331.1543,289.1719 L331.1543,314.6992 L311.1543,318.6992 L331.1543,322.6992 L331.1543,348.2266 A0,0 0 0 0 331.1543,348.2266 L720.7119,348.2266 A0,0 0 0 0 720.7119,348.2266 L720.7119,299.1719 L710.7119,289.1719 L331.1543,289.1719 A0,0 0 0 0 331.1543,289.1719 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M710.7119,289.1719 L710.7119,299.1719 L720.7119,299.1719 L710.7119,289.1719 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="247.1396" x="337.1543" y="307.667">dbt splits lines into per-person biographies,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="287.187" x="337.1543" y="324.0186">and the executive chapter's Historical Listings into</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="368.5576" x="337.1543" y="340.3701">statewide officeholders (int_bluebook__statewide_officeholders)</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="300.1543" x="11" y="301.1523"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="280.1543" x="21" y="323.6094">one row per text line (edition, chapter, page, column)</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="100.0625" x="111.0459" y="368.2266"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="80.0625" x="121.0459" y="390.6836">bluebook_lines</text><ellipse cx="161.0771" cy="434.3203" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="161.0771" cy="434.3203" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;