<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="277px" preserveAspectRatio="none" style="width:681px;height:277px;background:#FFFFFF;" version="1.1" viewBox="0 0 681 277" width="681px" zoomAndPan="magnify"><title>tap_mec: MEC via The Accountability Project mirror</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="345.4199" x="166.7195" y="34.5332">tap_mec: MEC via The Accountability Project mirror</text><ellipse cx="153.3955" cy="58.6094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><path d="M315.791,78.6094 L315.791,112.3125 L295.791,116.3125 L315.791,120.3125 L315.791,154.0156 A0,0 0 0 0 315.791,154.0156 L669.8589,154.0156 A0,0 0 0 0 669.8589,154.0156 L669.8589,88.6094 L659.8589,78.6094 L315.791,78.6094 A0,0 0 0 0 315.791,78.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M659.8589,78.6094 L659.8589,88.6094 L669.8589,88.6094 L659.8589,78.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="320.8486" x="321.791" y="97.1045">Coverage ends in 2022. Re-cleaned by TAP, so column</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="219.9399" x="321.791" y="113.4561">names differ from MEC's own exports.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="333.0679" x="321.791" y="129.8076">Some rows are malformed: ignore_errors, strict_mode off,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="314.3042" x="321.791" y="146.1592">with quote/escape set explicitly (sniffing merged rows).</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="284.791" x="11" y="98.7656"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="264.791" x="21" y="121.2227">3 cleaned CSVs from s3://publicaccountability/csv</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="272.1523" x="17.3193" y="174.0156"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="252.1523" x="27.3193" y="196.4727">tap_mec_contributions, tap_mec_expenditures,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="168.7734" x="27.3193" y="211.5664">tap_mec_lobbyist_expenditures</text><ellipse cx="153.3955" cy="255.2031" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="153.3955" cy="255.2031" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="153.3955" x2="153.3955" y1="68.6094" y2="98.7656"/><polygon fill="#181818" points="149.3955,88.7656,153.3955,98.7656,157.3955,88.7656,153.3955,92.7656" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="153.3955" x2="153.3955" y1="133.8594" y2="174.0156"/><polygon fill="#181818" points="149.3955,164.0156,153.3955,174.0156,157.3955,164.0156,153.3955,168.0156" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="153.3955" x2="153.3955" y1="224.2031" y2="244.2031"/><polygon fill="#181818" points="149.3955,234.2031,153.3955,244.2031,157.3955,234.2031,153.3955,238.2031" style="stroke:#181818;stroke-width:1.0;"/></g></svg>