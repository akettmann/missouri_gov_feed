<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="527px" preserveAspectRatio="none" style="width:616px;height:527px;background:#FFFFFF;" version="1.1" viewBox="0 0 616 527" width="616px" zoomAndPan="magnify"><title>epa_frs: EPA Facility Registry Service (Missouri state file)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="384.3643" x="114.6565" y="34.5332">epa_frs: EPA Facility Registry Service (Missouri state file)</text><ellipse cx="205.7344" cy="58.6094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="314.1758" x="48.6465" y="88.6094"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="294.1758" x="58.6465" y="111.0664">download state_combined_mo.zip once (30-day cache)</text><path d="M331.4531,147.4453 L331.4531,164.7969 L311.4531,168.7969 L331.4531,172.7969 L331.4531,190.1484 A0,0 0 0 0 331.4531,190.1484 L604.6772,190.1484 A0,0 0 0 0 604.6772,190.1484 L604.6772,157.4453 L594.6772,147.4453 L331.4531,147.4453 A0,0 0 0 0 331.4531,147.4453 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M594.6772,147.4453 L594.6772,157.4453 L604.6772,157.4453 L594.6772,147.4453 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.1016" x="337.4531" y="165.9404">Python csv module: fused rows kept</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.2241" x="337.4531" y="182.292">under _fields instead of dropping good rows</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="211.4375" x="100.0156" y="143.7031"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="191.4375" x="110.0156" y="166.1602">for each CSV (one shard unit each):</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="164.0684" x="110.0156" y="181.2539">facilities, organizations, NAICS</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="322.1738" x="44.6475" y="213.8906"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="302.1738" x="54.6475" y="236.3477">epa_frs_facilities / epa_frs_organizations / epa_frs_naics</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="157.377" x="54.6475" y="251.4414">(one JSON row per CSV row)</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="319.4844" x="45.9922" y="284.0781"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="299.4844" x="55.9922" y="306.5352">dbt: one owner, parent company and primary NAICS per</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="216.1172" x="55.9922" y="321.6289">geocoded facility (int_epa_frs__facilities)</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="252.1133" x="79.6777" y="354.2656"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="232.1133" x="89.6777" y="376.7227">point-in-polygon against current dim_district</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="117.7031" x="89.6777" y="391.8164">-&gt; fct_district_facilities</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="389.4688" x="11" y="424.4531"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="334.7461" x="21" y="446.9102">non-government sites in each legislator's, U.S. representative's</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="369.4688" x="21" y="462.0039">or mayor's area, donor names matched -&gt; fct_jurisdiction_businesses</text><ellipse cx="205.7344" cy="505.6406" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="205.7344" cy="505.6406" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="205.7344" x2="205.7344" y1="68.6094" y2="88.6094"/><polygon fill="#181818" points="201.7344,78.6094,205.7344,88.6094,209.7344,78.6094,205.7344,82.6094" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="205.7344" x2="205.7344" y1="123.7031" y2="143.7031"/><polygon fill="#181818" points="201.7344,133.7031,205.7344,143.7031,209.7344,133.7031,205.7344,137.7031" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="205.7344" x2="205.7344" y1="193.8906" y2="213.8906"/><polygon fill="#181818" points="201.7344,203.8906,205.7344,213.8906,209.7344,203.8906,205.7344,207.8906" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="205.7344" x2="205.7344" y1="264.0781" y2="284.0781"/><polygon fill="#181818" points="201.7344,274.0781,205.7344,284.0781,209.7344,274.0781,205.7344,278.0781" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="205.7344" x2="205.7344" y1="334.2656" y2="354.2656"/><polygon fill="#181818" points="201.7344,344.2656,205.7344,354.2656,209.7344,344.2656,205.7344,348.2656" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="205.7344" x2="205.7344" y1="404.4531" y2="424.4531"/><polygon fill="#181818" points="201.7344,414.4531,205.7344,4