<!-- render_plantuml.py source-sha256=bce4184afb94b78acdf5025e566e000fc53fb85c6d514d260dafcc2e42412e51 plantuml=1.2024.7 layout=smetana -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="683px" preserveAspectRatio="none" style="width:618px;height:683px;background:#FFFFFF;" version="1.1" viewBox="0 0 618 683" width="618px" zoomAndPan="magnify"><title>epa_frs: EPA Facility Registry Service (Missouri state file)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="384.3643" x="115.6746" y="34.5332">epa_frs: EPA Facility Registry Service (Missouri state file)</text><ellipse cx="207.7705" cy="58.6094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="314.1758" x="50.6826" y="88.6094"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="294.1758" x="60.6826" y="111.0664">download state_combined_mo.zip once (30-day cache)</text><path d="M333.4893,147.4453 L333.4893,164.7969 L313.4893,168.7969 L333.4893,172.7969 L333.4893,190.1484 A0,0 0 0 0 333.4893,190.1484 L606.7134,190.1484 A0,0 0 0 0 606.7134,190.1484 L606.7134,157.4453 L596.7134,147.4453 L333.4893,147.4453 A0,0 0 0 0 333.4893,147.4453 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M596.7134,147.4453 L596.7134,157.4453 L606.7134,157.4453 L596.7134,147.4453 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.1016" x="339.4893" y="165.9404">Python csv module: fused rows kept</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.2241" x="339.4893" y="182.292">under _fields instead of dropping good rows</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="211.4375" x="102.0518" y="143.7031"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="191.4375" x="112.0518" y="166.1602">for each CSV (one shard unit each):</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="190.7402" x="112.0518" y="181.2539">facilities, organizations, NAICS, SIC</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="393.541" x="11" y="213.8906"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="373.541" x="21" y="236.3477">epa_frs_facilities / epa_frs_organizations / epa_frs_naics / epa_frs_sic</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="157.377" x="21" y="251.4414">(one JSON row per CSV row)</text><rect fill="#F1F1F1" height="65.2813" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="384.8281" x="15.3564" y="284.0781"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="299.4844" x="25.3564" y="306.5352">dbt: one owner, parent company and primary NAICS per</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="307.4883" x="25.3564" y="321.6289">geocoded facility (int_epa_frs__facilities); a facility with no</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="364.8281" x="25.3564" y="336.7227">NAICS code gets the sector of its SIC code (sic_naics_sectors seed)</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="252.1133" x="81.7139" y="369.3594"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="232.1133" x="91.7139" y="391.8164">point-in-polygon against current dim_district</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="117.7031" x="91.7139" y="406.9102">-&gt; fct_district_facilities</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="389.4688" x="13.0361" y="439.5469"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="334.7461" x="23.0361" y="462.0039">non-government sites in each legislator's, U.S. representative's</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="369.4688" x="23.0361" y="477.0977">or mayor's area, donor names matched -&gt; fct_jurisdiction_businesses</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="255.418" x="80.0615" y="509.7344"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="235.418" x="90.0615" y="532.1914">sites per NAICS sector (naics_sectors seed)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="181.752" x="90.0615" y="547.2852">-&gt; rpt_district_business_industries</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="350.2051" x="32.668" y="579.9219"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="330.2051" x="42.668" y="602.3789">frontend: donor sites grouped by donor, plus the sector counts</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="221.9531" x="42.668" y="617.4727">("Businesses in their area" profile section)</text><ellipse cx="207.7705" cy="661.1094" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="207.7705" cy="661.1094" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="207.7705" x2="207.7705" y1="68.6094" y2="88.6094"/><polygon fill="#181818" points="203.7705,78.6094,207.7705,88.6094,211.7705,78.6094,207.7705,82.6094" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="207.7705" x2="207.7705" y1="123.7031" y2="143.7031"/><polygon fill="#181818" points="203.7705,133.7031,207.7705,143.7031,211.7705,133.7031,207.7705,137.7031" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="207.7705" x2="207.7705" y1="193.8906" y2="213.8906"/><polygon fill="#181818" points="203.7705,203.8906,207.7705,213.8906,211.7705,203.8906,207.7705,207.8906" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="207.7705" x2="207.7705" y1="264.0781" y2="284.0781"/><polygon fill="#181818" points="203.7705,274.0781,207.7705,284.0781,211.7705,274.0781,207.7705,278.0781" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="207.7705" x2="207.7705" y1="349.3594" y2="369.3594"/><polygon fill="#181818" points="203.7705,359.3594,207.7705,369.3594,211.7705,359.3594,207.7705,363.3594" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="207.7705" x2="207.7705" y1="419.5469" y2="439.5469"/><polygon fill="#181818" points="203.7705,429.5469,207.7705,439.5469,211.7705,429.5469,207.7705,433.5469" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="207.7705" x2="207.7705" y1="489.7344" y2="509.7344"/><polygon fill="#181818" points="203.7705,499.7344,207.7705,509.7344,211.7705,499.7344,207.7705,503.7344" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="207.7705" x2="207.7705" y1="559.9219" y2="579.9219"/><polygon fill="#181818" points="203.7705,569.9219,207.7705,579.9219,211.7705,569.9219,207.7705,573.9219" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="207.7705" x2="207.7705" y1="630.1094" y2="650.1094"/><polygon fill="#181818" points="203.7705,640.109