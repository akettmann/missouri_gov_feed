<!-- render_plantuml.py source-sha256=bd3868a0c9e3d972cf7d1eebe50a0e79d81f96004b667c3af2d1f5215e3838c3 plantuml=1.2024.7 layout=smetana -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="753px" preserveAspectRatio="none" style="width:670px;height:753px;background:#FFFFFF;" version="1.1" viewBox="0 0 670 753" width="670px" zoomAndPan="magnify"><title>epa_frs: EPA Facility Registry Service (Missouri state file)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="384.3643" x="141.6799" y="34.5332">epa_frs: EPA Facility Registry Service (Missouri state file)</text><ellipse cx="209.4375" cy="58.6094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="314.1758" x="52.3496" y="88.6094"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="294.1758" x="62.3496" y="111.0664">download state_combined_mo.zip once (30-day cache)</text><path d="M385.5,147.4453 L385.5,164.7969 L365.5,168.7969 L385.5,172.7969 L385.5,190.1484 A0,0 0 0 0 385.5,190.1484 L658.7241,190.1484 A0,0 0 0 0 658.7241,190.1484 L658.7241,157.4453 L648.7241,147.4453 L385.5,147.4453 A0,0 0 0 0 385.5,147.4453 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M648.7241,147.4453 L648.7241,157.4453 L658.7241,157.4453 L648.7241,147.4453 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.1016" x="391.5" y="165.9404">Python csv module: fused rows kept</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.2241" x="391.5" y="182.292">under _fields instead of dropping good rows</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="312.125" x="53.375" y="143.7031"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="191.4375" x="63.375" y="166.1602">for each CSV (one shard unit each):</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="292.125" x="63.375" y="181.2539">facilities, organizations, NAICS, SIC, alternative names</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="396.875" x="11" y="213.8906"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="376.875" x="21" y="236.3477">epa_frs_facilities / epa_frs_organizations / epa_frs_naics / epa_frs_sic,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="262.7754" x="21" y="251.4414">epa_frs_alt_names (one JSON row per CSV row)</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="368.8438" x="25.0156" y="284.0781"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="311.1328" x="35.0156" y="306.5352">dbt staging: a facility or organization name with U+FFFD is</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="348.8438" x="35.0156" y="321.6289">repaired from the one matching alternative name (seed overrides)</text><rect fill="#F1F1F1" height="65.2813" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="384.8281" x="17.0234" y="354.2656"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="299.4844" x="27.0234" y="376.7227">dbt: one owner, parent company and primary NAICS per</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="307.4883" x="27.0234" y="391.8164">geocoded facility (int_epa_frs__facilities); a facility with no</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="364.8281" x="27.0234" y="406.9102">NAICS code gets the sector of its SIC code (sic_naics_sectors seed)</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="252.1133" x="83.3809" y="439.5469"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="232.1133" x="93.3809" y="462.0039">point-in-polygon against current dim_district</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="117.7031" x="93.3809" y="477.0977">-&gt; fct_district_facilities</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="389.4688" x="14.7031" y="509.7344"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="334.7461" x="24.7031" y="532.1914">non-government sites in each legislator's, U.S. representative's</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="369.4688" x="24.7031" y="547.2852">or mayor's area, donor names matched -&gt; fct_jurisdiction_businesses</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="255.418" x="81.7285" y="579.9219"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="235.418" x="91.7285" y="602.3789">sites per NAICS sector (naics_sectors seed)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="181.752" x="91.7285" y="617.4727">-&gt; rpt_district_business_industries</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="350.2051" x="34.335" y="650.1094"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="330.2051" x="44.335" y="672.5664">frontend: donor sites grouped by donor, plus the sector counts</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="221.9531" x="44.335" y="687.6602">("Businesses in their area" profile section)</text><ellipse cx="209.4375" cy="731.2969" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="209.4375" cy="731.2969" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="209.4375" x2="209.4375" y1="68.6094" y2="88.6094"/><polygon fill="#181818" points="205.4375,78.6094,209.4375,88.6094,213.4375,78.6094,209.4375,82.6094" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="209.4375" x2="209.4375" y1="123.7031" y2="143.7031"/><polygon fill="#181818" points="205.4375,133.7031,209.4375,143.7031,213.4375,133.7031,209.4375,137.7031" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="209.4375" x2="209.4375" y1="193.8906" y2="213.8906"/><polygon fill="#181818" points="205.4375,203.8906,209.4375,213.8906,213.4375,203.8906,209.4375,207.8906" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="209.4375" x2="209.4375" y1="264.0781" y2="284.0781"/><polygon fill="#181818" points="205.4375,274.0781,209.4375,284.0781,213.4375,274.0781,209.4375,278.0781" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="209.4375" x2="209.4375" y1="334.2656" y2="354.2656"/><polygon fill="#181818" points="205.4375,344.2656,209.4375,354.2656,213.4375,344.2656,209.4375,348.2656" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="209.4375" x2="209.4375" y1="419.5469" y2="439.5469"/><polygon fill="#181818" points="205.4375,429.5469,209.4375,439.5469,213.4375,429.5469,209.4375,433.5469" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="209.4375" x2="209.4375" y1="489.7344" y2="509.7344"/><polygon fill="#181818" points="205.4375,499.7344,209.4375,509.7344,213.4375,499.7344,209.4375,503.7344" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="209.4375" x2="209.4375" y1="559.9219" y2="579.9219"/><polygon fill="#181818" points="205.4375,569.9219,209.4375,579.9219,213.4375,569.9219,209.4375,573.9219" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="209.4375" x2="209.4375" y1="630.1094" y2="650.1094"/><polygon fill="#181818" points="205.4375,640.1094,209.4375,650.1094,213.4375,640.1094,209.4375,644.1094" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="209.4375" x2="209.4375" y1="700.2969" y2="720.2969"/><polygon fill="#181818" points="205.4375,710.2969,209.4375,720.2969,213.4375,710.2969,209.4375,714.2969" style="stroke:#181818;stroke-width:1.0;"/></g></svg>