<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="582px" preserveAspectRatio="none" style="width:642px;height:582px;background:#FFFFFF;" version="1.1" viewBox="0 0 642 582" width="642px" zoomAndPan="magnify"><title>mo_sos_elections: Missouri SoS official election returns (PDFs)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="425.5439" x="107.127" y="34.5332">mo_sos_elections: Missouri SoS official election returns (PDFs)</text><ellipse cx="175.7373" cy="58.6094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><path d="M346.0518,108.0742 L346.0518,117.25 L326.0518,121.25 L346.0518,125.25 L346.0518,134.4258 A0,0 0 0 0 346.0518,134.4258 L583.8369,134.4258 A0,0 0 0 0 583.8369,134.4258 L583.8369,118.0742 L573.8369,108.0742 L346.0518,108.0742 A0,0 0 0 0 346.0518,108.0742 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M573.8369,108.0742 L573.8369,118.0742 L583.8369,118.0742 L573.8369,108.0742 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.7852" x="352.0518" y="126.5693">one shard unit per election (one PDF)</text><rect fill="#F1F1F1" height="65.2813" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="300.6289" x="25.4229" y="88.6094"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="227.4434" x="35.4229" y="111.0664">Results page sos.mo.gov/elections/results:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="280.6289" x="35.4229" y="126.1602">every "Grand Totals" link under a General or Primary</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="168.123" x="35.4229" y="141.2539">Election heading (Aug 2012 on)</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="250.7773" x="50.3486" y="173.8906"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="230.7773" x="60.3486" y="196.3477">fetch one PDF at a time (2 s delay, cached)</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="231.7754" x="59.8496" y="228.9844"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="211.7754" x="69.8496" y="251.4414">pdfplumber words -&gt; lines (by top edge)</text><path d="M360.4746,303.543 L360.4746,312.7188 L340.4746,316.7188 L360.4746,320.7188 L360.4746,329.8945 A0,0 0 0 0 360.4746,329.8945 L630.7979,329.8945 A0,0 0 0 0 630.7979,329.8945 L630.7979,313.543 L620.7979,303.543 L360.4746,303.543 A0,0 0 0 0 360.4746,303.543 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M620.7979,303.543 L620.7979,313.543 L630.7979,313.543 L620.7979,303.543 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="249.3232" x="366.4746" y="322.0381">every line lands, with pdf_url, page and line</text><rect fill="#F1F1F1" height="65.2813" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="329.4746" x="11" y="284.0781"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="237.457" x="21" y="306.5352">structure only: contest header (contest_seq),</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="309.4746" x="21" y="321.6289">candidate row cells (name | party | votes | %) by column x,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="113.3906" x="21" y="336.7227">total / party total lines</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="142.0625" x="104.7061" y="369.3594"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="122.0625" x="114.7061" y="391.8164">mo_sos_election_rows</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="293.1465" x="29.1641" y="424.4531"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="273.1465" x="39.1641" y="446.9102">dbt staging: lines -&gt; contests, results, printed_totals</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="293.4629" x="29.0059" y="479.5469"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="273.4629" x="39.0059" y="502.0039">dbt marts: fct_election_races (margin, uncontested)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="178.7637" x="39.0059" y="517.0977">and fct_judicial_retention (Yes %)</text><ellipse cx="175.7373" cy="560.7344" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="175.7373" cy="560.7344" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="175.7373" x2="175.7373" y1="68.6094" y2="88.6094"/><polygon fill="#181818" points="171.7373,78.6094,175.7373,88.6094,179.7373,78.6094,175.7373,82.6094" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="175.7373" x2="175.7373" y1="153.8906" y2="173.8906"/><polygon fill="#181818" points="171.7373,163.8906,175.7373,173.8906,179.7373,163.8906,175.7373,167.8906" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="175.7373" x2="175.7373" y1="208.9844" y2="228.9844"/><polygon fill="#181818" points="171.7373,218.9844,175.7373,228.9844,179.7373,