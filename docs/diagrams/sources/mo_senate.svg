<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="547px" preserveAspectRatio="none" style="width:662px;height:547px;background:#FFFFFF;" version="1.1" viewBox="0 0 662 547" width="662px" zoomAndPan="magnify"><title>mo_senate: MO Senate daily journals</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="248.1855" x="205.4905" y="34.5332">mo_senate: MO Senate daily journals</text><ellipse cx="170.3438" cy="58.6094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="65.2813" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="301.8184" x="19.4346" y="88.6094"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="200.1094" x="29.4346" y="111.0664">for each year in the lookback window:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="281.8184" x="29.4346" y="126.1602">GET senate.mo.gov/journallist/?SelectedYear=YYYY</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="207.4102" x="29.4346" y="141.2539">(current year daily, past years monthly)</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="228.4355" x="56.126" y="173.8906"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="208.4355" x="66.126" y="196.3477">owned journal PDFs -&gt; pdfplumber text</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="227.9785" x="56.3545" y="228.9844"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="142.7637" x="66.3545" y="251.4414">strip running page headers</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="207.9785" x="66.3545" y="266.5352">("Journal of the Senate 118", day lines)</text><rect fill="#F1F1F1" height="65.2813" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="318.6875" x="11" y="299.1719"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="278.6719" x="21" y="321.6289">find each "YEAS&#226;&#8364;&#8221;Senators ... Vacancies&#226;&#8364;&#8221;" block</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="298.6875" x="21" y="336.7227">(bounded to 2,500 chars so a block missing "Vacancies"</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="190.3828" x="21" y="351.8164">can't swallow the rest of the journal)</text><path d="M330.7441,380.0195 L330.7441,405.5469 L310.7441,409.5469 L330.7441,413.5469 L330.7441,439.0742 A0,0 0 0 0 330.7441,439.0742 L650.1665,439.0742 A0,0 0 0 0 650.1665,439.0742 L650.1665,390.0195 L640.1665,380.0195 L330.7441,380.0195 A0,0 0 0 0 330.7441,380.0195 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M640.1665,380.0195 L640.1665,390.0195 L650.1665,390.0195 L640.1665,380.0195 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203.0107" x="336.7441" y="398.5146">Duplicate surnames carry a district:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="298.4224" x="336.7441" y="414.8662">"Brown (16)" (2025+) or "Brown (16th Dist.)" (older),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.9829" x="336.7441" y="431.2178">both normalised to "Brown (16)".</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="280.8008" x="29.9434" y="384.4531"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="260.8008" x="39.9434" y="406.9102">one row per (vote block, category, senator token)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="207.8145" x="39.9434" y="422.0039">+ the sentence that introduced the vote</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="229.4668" x="55.6104" y="459.0742"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="209.4668" x="65.6104" y="481.5313">mo_senate_journals, mo_senate_votes</text><ellipse cx="170.3438" cy="525.168" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="170.3438" cy="525.168" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="170.3438" x2="170.3438" y1="68.6094" y2="88.6094"/><polygon fill="#181818" points="166.3438,78.6094,170.3438,88.6094,174.3438,78.6094,170.3438,82.6094" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="170.3438" x2="170.3438" y1="153.8906" y2="173.8906"/><polygon fill="#181818" points="166.3438,163.8906,170.3438,173.8906,174.3438,163.8906,170.3438,167.8906" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="170.3438" x2="170.3438" y1="208.9844" y2="228.9844"/><polygon fill="#181818" points="166.3438,218.9844,170.3438,228.9844,174.3438,218.9844,170.3438,222.9844" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="170.3438" x2="170.3438" y1="279.1719" y2="299.1719"/><polygon fill="#181818" points="166.3438,289.1719,170.3438,299.1719,174.3438,289.1719,170.3438,293.1719" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="170.3438" x2="170.3438" y1="364.4531" y2="384.4531"/><polygon fill="#181818" points="166.3438,374.4531,170.3438,384.4531,174.3438,374.4531,170.3438,378.4531" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="170.3438" x2="170.3438" y1="434.6406" y2="459.0742"/><polygon fill="#181818" points="166.3438,449.0742,170.3438,459.0742,174.3438,449.0742,170.3438,453.0742" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="170.3438" x2="170.3438" y1="494.168" y2="514.168"/><polygon fill="#181818" points="166.3438,504.168,170.3438,514.168,174.3438,504.168,170.3438,508.168" style="stroke:#181818;stroke-width:1.0;"/></g></svg>