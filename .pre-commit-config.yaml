# Hooks run from the repo root via the project venv (`uv sync` first) so sqlfluff's dbt templater
# compiles models with the same dbt-core / dbt-duckdb the pipeline uses.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.svg$  # generated by plantuml-render; edits would fight the renderer
      - id: end-of-file-fixer
        exclude: \.svg$
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
      - id: sqlfluff-fix
        name: sqlfluff fix
        entry: uv run --frozen sqlfluff fix --force
        language: system
        files: ^dbt/(models|macros|tests)/.*\.sql$
        require_serial: true
      - id: sqlfluff-lint
        name: sqlfluff lint
        entry: uv run --frozen sqlfluff lint
        language: system
        files: ^dbt/(models|macros|tests)/.*\.sql$
        require_serial: true
      - id: plantuml-render
        name: render PlantUML diagrams (svg)
        # needs java on PATH (or $JAVA); downloads a pinned plantuml.jar to ~/.cache/plantuml once
        entry: uv run --frozen python scripts/render_plantuml.py
        language: system
        files: ^docs/diagrams/.*\.puml$
        require_serial: true
