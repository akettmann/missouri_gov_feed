# Hooks run from the repo root via the project venv (`uv sync` first) so sqlfluff's dbt templater
# compiles models with the same dbt-core / dbt-duckdb the pipeline uses.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.svg$  # generated by plantuml-render; edits would fight the renderer
      - id: end-of-file-fixer
        exclude: \.svg$
      - id: check-yaml
        exclude: ^frontend/pnpm-lock\.yaml$  # generated; pnpm writes it as multiple YAML documents
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi]
      # ruff comes from uv.lock via `uv run --frozen`, so this hook and a bare `uv run ruff` always agree on
      # version; bump it once with `uv lock --upgrade-package ruff`. ruff >= 0.17 also formats Python code
      # blocks in Markdown, so ruff-format must see markdown files or `ruff format --check .` disagrees with it.
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi, markdown]
      - id: sqlfluff-fix
        name: sqlfluff fix
        entry: uv run --frozen python scripts/sqlfluff_hook.py fix --force
        language: system
        files: ^dbt/(models|macros|tests)/.*\.sql$
        require_serial: true
      - id: sqlfluff-lint
        name: sqlfluff lint
        entry: uv run --frozen python scripts/sqlfluff_hook.py lint
        language: system
        files: ^dbt/(models|macros|tests)/.*\.sql$
        require_serial: true
      - id: model-docs-check
        name: dbt model docs are current (gen_model_docs.py --check)
        # fails when a model header comment or the generated _<layer>.yml changed without the other
        entry: uv run --frozen python scripts/gen_model_docs.py --check
        language: system
        files: ^(dbt/models/(staging|intermediate)/.*\.(sql|yml)|scripts/gen_model_docs\.py)$
        pass_filenames: false
      - id: plantuml-render
        name: render PlantUML diagrams (svg)
        # needs java on PATH (or $JAVA); downloads a pinned plantuml.jar to ~/.cache/plantuml once
        entry: uv run --frozen python scripts/render_plantuml.py
        language: system
        files: ^docs/diagrams/.*\.puml$
        require_serial: true
      # frontend/: needs Node 24 + pnpm (`cd frontend && pnpm install` first). Hooks get repo-root paths,
      # so scripts/frontend_hook.py strips the frontend/ prefix and runs inside frontend/.
      - id: prettier
        name: prettier (frontend)
        entry: uv run --frozen python scripts/frontend_hook.py prettier --write --ignore-unknown
        language: system
        files: ^frontend/
        exclude: ^frontend/pnpm-lock\.yaml$
      - id: eslint
        name: eslint (frontend)
        entry: uv run --frozen python scripts/frontend_hook.py eslint --fix --no-warn-ignored
        language: system
        files: ^frontend/.*\.(js|mjs|ts|astro)$
      - id: astro-check
        name: astro check (frontend)
        entry: pnpm --dir frontend check
        language: system
        files: ^frontend/
        pass_filenames: false
